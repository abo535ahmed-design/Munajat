["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الخميس","حزب الخميس (٧) — الصلاة على آدم وحواء والملائكة وأهل السموات والأرضين","اللَّهُمَّ صَلِّ عَلَى آلِ سَيِّدِنَا مُحَمَّدٍ، وَأَعْطِهِ الْوَسِيلَةَ وَالْفَضِيلَةَ وَالدَّرَجَةَ الرَّفِيعَةَ وَابْعَثْهُ الْمَقَامَ الْمَحْمُودَ الَّذِي وَعَدْتَهُ مَعَ إِخْوَانِهِ النَّبِيِّينَ، صَلَّى اللَّهُ عَلَى سَيِّدِنَا مُحَمَّدٍ نَبِيِّ الرَّحْمَةِ، وَسَيِّدِ الْأُمَّةِ، وَعَلَى أَبِينَا آدَمَ، وَأُمِّنَا حَوَّاءَ، وَمَنْ وَلَدَا مِنَ النَّبِيِّينَ وَالصِّدِّيقِينَ وَالشُّهَدَاءِ وَالصَّالِحِينَ، وَصَلِّ عَلَى مَلَائِكَتِكَ أَجْمَعِينَ، مِنْ أَهْلِ السَّمَوَاتِ وَالْأَرَضِينَ، وَعَلَيْنَا مَعَهُمْ يَا أَرْحَمَ الرَّاحِمِينَ.","من دلائل الخيرات للجزولي (ص ٤٣ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["دلائل الخيرات|حزب الخميس|مغفرة واستغفار","حزب الخميس (٨) — اغفر لي ولوالدي ولجميع المؤمنين","اللَّهُمَّ اغْفِرْ لِي ذُنُوبِي، وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا، وَلِجَمِيعِ الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ، وَالْمُسْلِمِينَ وَالْمُسْلِمَاتِ، الْأَحْيَاءِ مِنْهُمْ وَالْأَمْوَاتِ، وَتَابِعْ بَيْنَنَا وَبَيْنَهُمْ بِالْخَيْرَاتِ. رَبِّ اغْفِرْ وَارْحَمْ، وَأَنْتَ خَيْرُ الرَّاحِمِينَ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ.","من دلائل الخيرات للجزولي (ص ٤٣ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الخميس","حزب الخميس (٩) — نور الأنوار وسر الأسرار وعدد الأمطار والنبات","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ نُورِ الْأَنْوَارِ، وَسِرِّ الْأَسْرَارِ، وَسَيِّدِ الْأَبْرَارِ، وَزَيْنِ الْمُرْسَلِينَ الْأَخْيَارِ، وَأَكْرَمِ مَنْ أَظْلَمَ عَلَيْهِ اللَّيْلُ وَأَشْرَقَ عَلَيْهِ النَّهَارُ، وَعَدَدَ مَا نَزَلَ مِنْ أَوَّلِ الدُّنْيَا إِلَى آخِرِهَا مِنْ قَطْرِ الْأَمْطَارِ، وَعَدَدَ مَا نَبَتَ مِنْ أَوَّلِ الدُّنْيَا إِلَى آخِرِهَا مِنَ النَّبَاتِ وَالْأَشْجَارِ، صَلَاةً دَائِمَةً بِدَوَامِ مُلْكِ اللَّهِ الْوَاحِدِ الْقَهَّارِ.","من دلائل الخيرات للجزولي (ص ٤٣–٤٤ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],

["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الخميس","حزب الخميس (١٢) — أبهى شموس الهدى وأبهى من القمر التام","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ النَّبِيِّ الْأُمِّيِّ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ الَّذِي هُوَ أَبْهَى شُمُوسِ الْهُدَىٰ نُورًا وَأَبْهَرُهَا، وَأَسْيَرُ الْأَنْبِيَاءِ فَخْرًا وَأَشْهَرُهَا، وَنُورُهُ أَزْهَرُ أَنْوَارِ الْأَنْبِيَاءِ وَأَشْرَقُهَا وَأَوْضَحُهَا، وَأَزْكَى الْخَلِيقَةِ أَخْلَاقًا وَأَطْهَرُهَا، وَأَكْرَمُهَا خَلْقًا وَأَعْدَلُهَا. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ النَّبِيِّ الْأُمِّيِّ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ الَّذِي هُوَ أَبْهَى مِنَ الْقَمَرِ التَّامِّ، وَأَكْرَمُ مِنَ السَّحَابِ الْمُرْسَلَةِ وَالْبَحْرِ الْخِضَمِّ.","من دلائل الخيرات للجزولي (ص ٤٥ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الخميس","حزب الخميس (١٣) — الذي قرنت البركة بذاته وكما صليت وباركت وترحمت","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ النَّبِيِّ الْأُمِّيِّ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ الَّذِي قُرِنَتِ الْبَرَكَةُ بِذَاتِهِ وَمُحَيَّاهُ، وَتَعَطَّرَتِ الْعَوَالِمُ بِطِيبِ ذِكْرِهِ وَرَيَّاهُ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَسَلِّمْ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ، وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ، وَارْحَمْ سَيِّدَنَا مُحَمَّدًا وَآلَ سَيِّدِنَا مُحَمَّدٍ، كَمَا صَلَّيْتَ وَبَارَكْتَ وَتَرَحَّمْتَ عَلَى سَيِّدِنَا إِبْرَاهِيمَ، وَعَلَى آلِ سَيِّدِنَا إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ.","من دلائل الخيرات للجزولي (ص ٤٥ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["دعاء عام","تفريج الهموم وقضاء الحوائج","اللهم لا تدعْ لنا ذنبًا إلا غفرتَه، ولا همًّا إلا فرَّجتَه، ولا دَيْنًا إلا قضيتَه، ولا مريضًا إلا شفيتَه، ولا حاجةً من حوائج الدنيا والآخرة إلا قضيتَها برحمتك يا أرحم الراحمين.","اجتهادات","g"]
];
/* ===== المحرك ===== */
const $=s=>document.querySelector(s);let bab="",srcF="",S={fav:[],fs:1.35,n:0,tk:1,c:{},cd:""},cat="الكل",kw="";
try{S=Object.assign(S,JSON.parse(localStorage.getItem("mnj")||"{}"))}catch(e){}
if(S.cd!=new Date().toDateString()){S.c={};S.cd=new Date().toDateString()}
const save=()=>{try{localStorage.setItem("mnj",JSON.stringify(S))}catch(e){}};
const norm=s=>s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED﴿﴾۝]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي");
const toast=m=>{const t=$("#ts");t.textContent=m;t.classList.add("s");setTimeout(()=>t.classList.remove("s"),1400)};
const tk=s=>S.tk?s.replace(/([\u064B-\u065F\u0670\u06D6-\u06ED]+)/g,'<span class="k">$1</span>'):s;
const id=i=>D[i][1]+"|"+D[i][3];
const PR=/ثناء وتمجيد|الصلاة على النبي/;
const label=d=>d[4]=="q"?"قرآن كريم — "+d[3]:d[4]=="h"?"حديث شريف — "+d[3]:d[4]=="u"?(PR.test(d[0])?"مناجاة":"اجتهادات")+(d[3]&&d[3]!="اجتهاد"?" — "+d[3]:""):d[3];
function apply(){document.documentElement.style.setProperty("--fs",S.fs+"rem");document.body.className=(S.n?"n ":"")+(S.tk==2?"g2":"")}
const NEEDS=["رزق وبركة","فك الكرب والهم","شفاء وعافية","مغفرة واستغفار","هداية وثبات","قضاء الدين","الظلم والأعداء","ذرية وأهل","جوامع الدعاء"],PIN=["أذكار الصباح","أذكار المساء"];
function chips(){const all=[...new Set(D.flatMap(d=>d[0].split("|")))],nd=NEEDS.filter(x=>all.includes(x)),rest=all.filter(x=>!PIN.includes(x)&&!NEEDS.includes(x));
const nf=[["الكل","كل الحالات"],["★ المفضلة","★ المفضلة"],...PIN.map(x=>[x,x]),...nd.map(x=>[x,x])];
const so=[["","كل المصادر"],["q","القرآن الكريم"],["h","السنة النبوية"],["g","اجتهادات ومناجاة"]];
const op=(a,v)=>a.map(o=>`<option value="${o[0]}"${o[0]==v?" selected":""}>${o[1]}</option>`).join("");
$("#fl").innerHTML=`<select id="nf" aria-label="الحالات">${op(nf,cat)}</select><select id="sf" aria-label="المصدر">${op(so,srcF)}</select><select id="bf" aria-label="الأبواب"><option value="">كل الأبواب</option>${rest.map(c=>`<option${c==bab?" selected":""}>${c}</option>`).join("")}</select>`}
document.addEventListener("change",e=>{if(e.target.id=="sf")srcF=e.target.value;else if(e.target.id=="nf")cat=e.target.value;else if(e.target.id=="bf")bab=e.target.value;else return;chips();render()});
const ctr=(d,i)=>{const n=S.c[id(i)]||0,m=d[5]||0,ok=m&&n>=m;return `<div class="act"><button data-a="ct" data-i="${i}" class="${ok?"fv":""}" style="min-width:150px">${ok?"✓ تم":"سبّح"} ${n}${m?" / "+m:""}</button>${n?`<button data-a="rs" data-i="${i}" aria-label="تصفير العداد">↺</button>`:""}</div>`};
function card(d,i,hero){const f=S.fav.includes(id(i));
return `<div class="${hero?"hero":"card"} ${d[4]=="q"?"q":""}">${hero?"<small>دعاء اليوم</small>":""}<h2>${d[1]}</h2><div class="tx">${tk(d[2])}</div><span class="bd ${d[4]=="g"||d[4]=="u"?"g":""}">${label(d)}</span>${ctr(d,i)}<div class="act"><button data-a="cp" data-i="${i}">نسخ</button><button data-a="sh" data-i="${i}">مشاركة</button><button class="${f?"fv":""}" data-a="fv" data-i="${i}">${f?"★ في المفضلة":"☆ للمفضلة"}</button></div></div>`}
function render(){const k=norm(kw.trim());const ix=D.map((d,i)=>i).filter(i=>{const d=D[i];
if(cat=="★ المفضلة"&&!S.fav.includes(id(i)))return false;if(cat!="الكل"&&cat!="★ المفضلة"&&!d[0].split("|").includes(cat))return false;
if(bab&&!d[0].split("|").includes(bab))return false;
if(srcF&&!(srcF=="g"?(d[4]=="g"||d[4]=="u"):d[4]==srcF))return false;
return !k||norm(d[1]+" "+d[2]+" "+d[0]).includes(k)});
const t=Math.floor(Date.now()/864e5)%D.length;
$("#hero").innerHTML=(!k&&cat=="الكل"&&!bab&&!srcF)?card(D[t],t,1):"";
$("#list").innerHTML=ix.length?ix.map(i=>card(D[i],i)).join(""):`<div class="empty">${cat=="★ المفضلة"?"لم تضف أدعية للمفضلة بعد. اضغط ☆ تحت أي دعاء.":"لا نتائج. جرّب كلمة أخرى."}</div>`}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.c){cat=b.dataset.c;chips();render();return}
if(b.id=="fp"){S.fs=Math.min(2.4,S.fs+.15);apply();save()}
if(b.id=="fm"){S.fs=Math.max(1,S.fs-.15);apply();save()}
if(b.id=="tkb"){S.tk=(S.tk+1)%3;apply();save();render()}
if(b.id=="nm"){S.n=S.n?0:1;apply();save()}
const i=b.dataset.i,d=D[i];if(!d)return;
if(b.dataset.a=="ct"){const k=id(i);S.c[k]=(S.c[k]||0)+1;save();try{navigator.vibrate&&navigator.vibrate(d[5]&&S.c[k]==d[5]?[40,60,40]:12)}catch(x){}render();return}
if(b.dataset.a=="rs"){delete S.c[id(i)];save();render();return}const tx=d[1]+"\n\n"+d[2]+"\n\n("+label(d)+")\n\nمن تطبيق مناجاة";
if(b.dataset.a=="cp"){try{await navigator.clipboard.writeText(tx);toast("تم النسخ")}catch(x){toast("تعذّر النسخ")}}
if(b.dataset.a=="sh"){if(navigator.share){try{await navigator.share({text:tx})}catch(x){}}else{try{await navigator.clipboard.writeText(tx);toast("تم النسخ للمشاركة")}catch(x){}}}
if(b.dataset.a=="fv"){const k=id(i),p=S.fav.indexOf(k);p<0?S.fav.push(k):S.fav.splice(p,1);save();render()}});
$("#q").addEventListener("input",e=>{kw=e.target.value;render()});
apply();chips();render();
if("serviceWorker"in navigator&&location.protocol.indexOf("http")==0)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
