["الصلاة على النبي ﷺ|أذكار","الصلاة الإبراهيمية","اللهم صلِّ على محمدٍ وعلى آل محمد، كما صليتَ على إبراهيمَ وعلى آل إبراهيم، إنك حميدٌ مجيد. اللهم بارك على محمدٍ وعلى آل محمد، كما باركتَ على إبراهيمَ وعلى آل إبراهيم، إنك حميدٌ مجيد.","البخاري ومسلم","h"],

["الرقية الشرعية","الفاتحة — رقية","﴿بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ۝ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ۝ الرَّحْمَٰنِ الرَّحِيمِ ۝ مَالِكِ يَوْمِ الدِّينِ ۝ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ۝ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ۝ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ﴾","الفاتحة — رُقي بها اللديغ (البخاري ومسلم)","q"],
["الرقية الشرعية|أذكار الصباح|أذكار المساء","آية الكرسي","﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾","البقرة ٢٥٥","q",1],
["الرقية الشرعية|أذكار الصباح|أذكار المساء","الإخلاص والمعوذتان","﴿قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾\n\n﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ﴾\n\n﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ﴾","الإخلاص والفلق والناس — كان النبي ﷺ ينفث بها (البخاري)","q",3],
["الرقية الشرعية|شفاء وعافية","رقية جبريل للنبي ﷺ","بسمِ اللهِ أرقيك، من كلِّ شيءٍ يؤذيك، من شرِّ كلِّ نفسٍ أو عينِ حاسدٍ، اللهُ يشفيك، بسمِ اللهِ أرقيك.","مسلم","h"],

["الرقية الشرعية|أذكار المساء","التعوذ بكلمات الله التامات","أعوذُ بكلماتِ اللهِ التامَّاتِ من شرِّ ما خلق.","مسلم","h",3],
["الرقية الشرعية","رقية الأطفال","أُعيذُكما بكلماتِ اللهِ التامَّة، من كلِّ شيطانٍ وهامَّة، ومن كلِّ عينٍ لامَّة.","البخاري","h"],

["أذكار الصباح","أصبحنا وأصبح الملك لله","أصبحنا وأصبح الملكُ لله، والحمدُ لله، لا إله إلا اللهُ وحدَه لا شريكَ له، له الملكُ وله الحمدُ وهو على كل شيءٍ قدير. ربِّ أسألُك خيرَ ما في هذا اليوم وخيرَ ما بعدَه، وأعوذُ بك من شرِّ ما في هذا اليوم وشرِّ ما بعدَه، ربِّ أعوذُ بك من الكسلِ وسوءِ الكِبَر، ربِّ أعوذُ بك من عذابٍ في النارِ وعذابٍ في القبر.","مسلم","h",1],
["أذكار المساء","أمسينا وأمسى الملك لله","أمسينا وأمسى الملكُ لله، والحمدُ لله، لا إله إلا اللهُ وحدَه لا شريكَ له، له الملكُ وله الحمدُ وهو على كل شيءٍ قدير. ربِّ أسألُك خيرَ ما في هذه الليلة وخيرَ ما بعدَها، وأعوذُ بك من شرِّ ما في هذه الليلة وشرِّ ما بعدَها، ربِّ أعوذُ بك من الكسلِ وسوءِ الكِبَر، ربِّ أعوذُ بك من عذابٍ في النارِ وعذابٍ في القبر.","مسلم","h",1],

["أذكار المساء","اللهم بك أمسينا","اللهم بك أمسينا، وبك أصبحنا، وبك نحيا، وبك نموت، وإليك المصير.","أبو داود والترمذي","h",1],
["أذكار الصباح|أذكار المساء","العافية في البدن والسمع والبصر","اللهم عافِني في بدني، اللهم عافِني في سمعي، اللهم عافِني في بصري، لا إله إلا أنت. اللهم إني أعوذُ بك من الكفرِ والفقر، وأعوذُ بك من عذابِ القبر، لا إله إلا أنت.","أبو داود","h",3],

["أذكار الصباح|أذكار المساء","فاطر السماوات والأرض","اللهم عالمَ الغيبِ والشهادة، فاطرَ السماواتِ والأرض، ربَّ كلِّ شيءٍ ومليكَه، أشهدُ أن لا إله إلا أنت، أعوذُ بك من شرِّ نفسي، ومن شرِّ الشيطانِ وشِرْكِه، وأن أقترفَ على نفسي سوءًا أو أجرَّه إلى مسلم.","أبو داود والترمذي","h",1],
["الصلاة على النبي ﷺ","على آله وأزواجه وذريته","اللهم صلِّ على محمدٍ وعلى أزواجِه وذريتِه، كما صليتَ على آلِ إبراهيم، وبارِكْ على محمدٍ وعلى أزواجِه وذريتِه، كما باركتَ على آلِ إبراهيم، إنك حميدٌ مجيد.","البخاري ومسلم","h"],

["الصلاة على النبي ﷺ","صلاة بحر الأنوار","اللهم صلِّ على سيدنا محمدٍ بحرِ أنوارِك، ومعدنِ أسرارِك، ولسانِ حجَّتِك، وعروسِ مملكتِك، وإمامِ حضرتِك، وطرازِ ملكِك، وخزائنِ رحمتِك، وطريقِ شريعتِك، المتلذِّذِ بتوحيدِك، إنسانِ عينِ الوجود، والسببِ في كلِّ موجود، عينِ أعيانِ خلقِك، المتقدِّمِ من نورِ ضيائِك، صلاةً تدومُ بدوامِك، وتبقى ببقائِك، لا منتهى لها دونَ علمِك، صلاةً ترضيك وترضيه وترضى بها عنا يا ربَّ العالمين.","من دلائل الخيرات للجزولي (ص ٧٢) — صيغة اجتهادية، وللعلماء في عباراتها خلاف","g"],

["أسماء الله الحسنى","أسماء الله الحسنى (٩٩)","﴿وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا﴾\n\nالله، الرحمن، الرحيم، الملك\nالقدوس، السلام، المؤمن، المهيمن\nالعزيز، الجبار، المتكبر، الخالق\nالبارئ، المصور، الغفار، القهار\nالوهاب، الرزاق، الفتاح، العليم\nالقابض، الباسط، الخافض، الرافع\nالمعز، المذل، السميع، البصير\nالحكم، العدل، اللطيف، الخبير\nالحليم، العظيم، الغفور، الشكور\nالعلي، الكبير، الحفيظ، المقيت\nالحسيب، الجليل، الكريم، الرقيب\nالمجيب، الواسع، الحكيم، الودود\nالمجيد، الباعث، الشهيد، الحق\nالوكيل، القوي، المتين، الولي\nالحميد، المحصي، المبدئ، المعيد\nالمحيي، المميت، الحي، القيوم\nالواجد، الماجد، الواحد، الصمد\nالقادر، المقتدر، المقدم، المؤخر\nالأول، الآخر، الظاهر، الباطن\nالوالي، المتعالي، البر، التواب\nالمنتقم، العفو، الرؤوف، مالك الملك\nذو الجلال والإكرام، المقسط، الجامع، الغني\nالمغني، المانع، الضار، النافع\nالنور، الهادي، البديع، الباقي\nالوارث، الرشيد، الصبور","كما وردت في دلائل الخيرات (ص ٤–٦) للجزولي","g"],

["الصلاة والطهارة","التسبيح دبر الصلاة","سبحانَ الله (٣٣)، والحمدُ لله (٣٣)، واللهُ أكبر (٣٣)، ثم تمامُ المئة: لا إله إلا اللهُ وحدَه لا شريكَ له، له الملكُ وله الحمدُ وهو على كل شيءٍ قدير.","مسلم","h"],
["الصلاة والطهارة","دعاء القنوت","اللهم اهدِني فيمَن هديت، وعافِني فيمَن عافيت، وتولَّني فيمَن توليت، وبارِكْ لي فيما أعطيت، وقِني شرَّ ما قضيت، فإنك تقضي ولا يُقضى عليك، وإنه لا يَذِلُّ مَن واليت، تباركتَ ربَّنا وتعاليت.","أبو داود والترمذي والنسائي","h"],

["أدعية الأنبياء|رزق وبركة","عيسى عليه السلام — الرزق","﴿اللَّهُمَّ رَبَّنَا أَنزِلْ عَلَيْنَا مَائِدَةً مِّنَ السَّمَاءِ تَكُونُ لَنَا عِيدًا لِّأَوَّلِنَا وَآخِرِنَا وَآيَةً مِّنكَ ۖ وَارْزُقْنَا وَأَنتَ خَيْرُ الرَّازِقِينَ﴾","المائدة ١١٤","q"],

["قرآنية|مغفرة واستغفار","دعاء أولي الألباب","﴿رَبَّنَا مَا خَلَقْتَ هَٰذَا بَاطِلًا سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ ۝ رَبَّنَا إِنَّكَ مَن تُدْخِلِ النَّارَ فَقَدْ أَخْزَيْتَهُ ۖ وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ ۝ رَّبَّنَا إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِي لِلْإِيمَانِ أَنْ آمِنُوا بِرَبِّكُمْ فَآمَنَّا ۚ رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الْأَبْرَارِ ۝ رَبَّنَا وَآتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ الْقِيَامَةِ ۗ إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ﴾","آل عمران ١٩١–١٩٤","q"],

["قرآنية|الظلم والأعداء|فك الكرب والهم","عدم الفتنة والنجاة","﴿رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِّلْقَوْمِ الظَّالِمِينَ ۝ وَنَجِّنَا بِرَحْمَتِكَ مِنَ الْقَوْمِ الْكَافِرِينَ﴾","يونس ٨٥–٨٦","q"],

["أدعية الأنبياء|رزق وبركة|ذرية وأهل","إبراهيم عليه السلام — الرزق للذرية","﴿رَّبَّنَا إِنِّي أَسْكَنتُ مِن ذُرِّيَّتِي بِوَادٍ غَيْرِ ذِي زَرْعٍ عِندَ بَيْتِكَ الْمُحَرَّمِ رَبَّنَا لِيُقِيمُوا الصَّلَاةَ فَاجْعَلْ أَفْئِدَةً مِّنَ النَّاسِ تَهْوِي إِلَيْهِمْ وَارْزُقْهُم مِّنَ الثَّمَرَاتِ لَعَلَّهُمْ يَشْكُرُونَ﴾","إبراهيم ٣٧","q"],

["جوامع الدعاء|هداية وثبات","الثبات في الأمر والعزيمة على الرشد","اللهم إني أسألُك الثباتَ في الأمر، والعزيمةَ على الرشد، وأسألُك شكرَ نعمتِك وحسنَ عبادتِك، وأسألُك قلبًا سليمًا ولسانًا صادقًا، وأسألُك من خيرِ ما تعلم، وأعوذُ بك من شرِّ ما تعلم، وأستغفرُك لما تعلم.","النسائي وأحمد","h"],
["هداية وثبات","الاستعاذة من منكرات الأخلاق","اللهم إني أعوذُ بك من مُنكَراتِ الأخلاقِ والأعمالِ والأهواء.","الترمذي","h"],
["جوامع الدعاء|الظلم والأعداء|هداية وثبات","رب أعني ولا تعن علي","ربِّ أعنِّي ولا تُعِنْ عليَّ، وانصُرني ولا تنصُرْ عليَّ، وامكُرْ لي ولا تمكُرْ عليَّ، واهدِني ويسِّرِ الهدى لي، وانصُرني على من بغى عليَّ. ربِّ اجعلني لك شكَّارًا، لك ذكَّارًا، لك رهَّابًا، لك مِطواعًا، إليك مُخبِتًا، إليك أوَّاهًا مُنيبًا. ربِّ تقبَّلْ توبتي، واغسِلْ حَوبتي، وأجِبْ دعوتي، وثبِّتْ حُجَّتي، واهدِ قلبي، وسدِّدْ لساني، واسلُلْ سخيمةَ قلبي.","أبو داود والترمذي","h"],
["جوامع الدعاء|هداية وثبات","انفعني بما علمتني","اللهم انفعني بما علَّمتَني، وعلِّمني ما ينفعُني، وزِدني علمًا.","الترمذي وابن ماجه","h"],
["رزق وبركة|جوامع الدعاء","الاستعاذة من الفقر والذلة","اللهم إني أعوذُ بك من الفقرِ والقِلَّةِ والذِّلَّة، وأعوذُ بك من أن أَظلِمَ أو أُظلَم.","أبو داود والنسائي","h"],
["جوامع الدعاء|الظلم والأعداء|هداية وثبات","اقسم لنا من خشيتك","اللهم اقسِمْ لنا من خشيتِك ما تحولُ به بيننا وبين معاصيك، ومن طاعتِك ما تبلِّغُنا به جنَّتَك، ومن اليقينِ ما تهوِّنُ به علينا مصائبَ الدنيا، ومتِّعْنا بأسماعِنا وأبصارِنا وقوَّتِنا ما أحييتَنا، واجعلْه الوارثَ منا، واجعلْ ثأرَنا على من ظلمَنا، وانصُرْنا على من عادانا، ولا تجعلْ مصيبتَنا في ديننا، ولا تجعلِ الدنيا أكبرَ همِّنا ولا مبلغَ علمِنا، ولا تسلِّطْ علينا من لا يرحمُنا.","الترمذي","h"],
["جوامع الدعاء","الخير كله عاجله وآجله","اللهم إني أسألُك من الخيرِ كلِّه، عاجلِه وآجلِه، ما علمتُ منه وما لم أعلم، وأعوذُ بك من الشرِّ كلِّه، عاجلِه وآجلِه، ما علمتُ منه وما لم أعلم. اللهم إني أسألُك من خيرِ ما سألَك عبدُك ونبيُّك، وأعوذُ بك من شرِّ ما عاذَ منه عبدُك ونبيُّك. اللهم إني أسألُك الجنةَ وما قرَّبَ إليها من قولٍ أو عمل، وأعوذُ بك من النارِ وما قرَّبَ إليها من قولٍ أو عمل، وأسألُك أن تجعلَ كلَّ قضاءٍ قضيتَه لي خيرًا.","ابن ماجه","h"],
["جوامع الدعاء","الحياة والموت خير","اللهم أحيِني ما كانتِ الحياةُ خيرًا لي، وتوفَّني إذا كانتِ الوفاةُ خيرًا لي.","البخاري ومسلم","h"],
["البيت والطعام","لبس الثوب","الحمدُ للهِ الذي كساني هذا (الثوبَ) ورزقَنيه من غيرِ حولٍ مني ولا قوة. — وللثوب الجديد: اللهم لك الحمدُ أنت كسوتَنيه، أسألُك من خيرِه وخيرِ ما صُنعَ له، وأعوذُ بك من شرِّه وشرِّ ما صُنعَ له.","أبو داود والترمذي","h"],
["مناسبات وأخلاق","عند الغضب","أعوذُ باللهِ من الشيطانِ الرجيم.","البخاري ومسلم","h"],
["هداية وثبات|مغفرة واستغفار","الاستعاذة من الشرك","اللهم إني أعوذُ بك أن أُشرِكَ بك وأنا أعلم، وأستغفرُك لما لا أعلم.","أحمد","h"],
["الصلاة والطهارة","عند الوسوسة في الصلاة","تعوَّذْ باللهِ من الشيطانِ الرجيم، وانفُثْ عن يسارِك ثلاثًا.","مسلم","h"],
["مناسبات وأخلاق","عند رؤية المبتلى","الحمدُ للهِ الذي عافاني مما ابتلاكَ به، وفضَّلني على كثيرٍ ممن خلقَ تفضيلًا.","الترمذي","h"],
["السفر والطقس","توديع المسافر والمقيم","للمسافر: أستودِعُ اللهَ دينَك وأمانتَك وخواتيمَ عملِك. — وللمقيم: أستودِعُكم اللهَ الذي لا تضيعُ ودائعُه.","أبو داود والترمذي وابن ماجه","h"],
["الصلاة والطهارة|الرقية الشرعية","الاستعاذة قبل القراءة","أعوذُ باللهِ السميعِ العليمِ من الشيطانِ الرجيم، من همزِه ونفخِه ونفثِه.","أبو داود والترمذي","h"],
["أدعية الأنبياء|مغفرة واستغفار","موسى عليه السلام — التوبة","﴿سُبْحَانَكَ تُبْتُ إِلَيْكَ وَأَنَا۠ أَوَّلُ الْمُؤْمِنِينَ﴾","الأعراف ١٤٣","q"],
["قرآنية|أذكار","الصلاة والنسك لله","﴿قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ ۝ لَا شَرِيكَ لَهُ ۖ وَبِذَٰلِكَ أُمِرْتُ وَأَنَا أَوَّلُ الْمُسْلِمِينَ﴾","الأنعام ١٦٢–١٦٣","q"],
["قرآنية|مغفرة واستغفار|رزق وبركة","دعاء أصحاب الجنة — التوبة والرجاء","﴿سُبْحَانَ رَبِّنَا إِنَّا كُنَّا ظَالِمِينَ﴾\n\n﴿عَسَىٰ رَبُّنَا أَن يُبْدِلَنَا خَيْرًا مِّنْهَا إِنَّا إِلَىٰ رَبِّنَا رَاغِبُونَ﴾","القلم ٢٩ و٣٢","q"],
["أدعية الأنبياء|ذرية وأهل","زكريا عليه السلام — طلب الآية","﴿رَبِّ اجْعَل لِّي آيَةً﴾","آل عمران ٤١","q"],
["قرآنية","دعوى أهل الجنة","﴿سُبْحَانَكَ اللَّهُمَّ وَتَحِيَّتُهُمْ فِيهَا سَلَامٌ ۚ وَآخِرُ دَعْوَاهُمْ أَنِ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾","يونس ١٠","q"],
["يومي","عند الاستيقاظ ليلاً","لا إله إلا اللهُ وحدَه لا شريكَ له، له الملكُ وله الحمدُ وهو على كل شيءٍ قدير، الحمدُ للهِ وسبحانَ اللهِ ولا إله إلا اللهُ واللهُ أكبرُ ولا حولَ ولا قوةَ إلا بالله، ثم يقول: اللهم اغفرْ لي — أو يدعو — يُستجَبْ له.","البخاري","h"],
["الصلاة والطهارة|هداية وثبات","دعاء قيام الليل","اللهم لك الحمدُ أنت نورُ السماواتِ والأرضِ ومن فيهن، ولك الحمدُ أنت قيِّمُ السماواتِ والأرضِ ومن فيهن، ولك الحمدُ أنت ربُّ السماواتِ والأرضِ ومن فيهن، أنت الحق، ووعدُك الحق، ولقاؤك حق، وقولُك حق، والجنةُ حق، والنارُ حق، والنبيُّون حق، ومحمدٌ ﷺ حق، والساعةُ حق. اللهم لك أسلمتُ، وبك آمنتُ، وعليك توكلتُ، وإليك أنبتُ، وبك خاصمتُ، وإليك حاكمتُ، فاغفرْ لي ما قدمتُ وما أخرتُ، وما أسررتُ وما أعلنتُ، أنت إلهي لا إله إلا أنت.","البخاري ومسلم","h"],
["الصلاة والطهارة|مغفرة واستغفار","استفتاح: باعد بيني وبين خطاياي","اللهم باعِدْ بيني وبين خطاياي كما باعدتَ بين المشرقِ والمغرب، اللهم نقِّني من الخطايا كما يُنقَّى الثوبُ الأبيضُ من الدَّنَس، اللهم اغسِلْني من خطاياي بالثلجِ والماءِ والبَرَد.","البخاري ومسلم","h"],
["الصلاة والطهارة|هداية وثبات","استفتاح قيام الليل: رب جبريل","اللهم ربَّ جبريلَ وميكائيلَ وإسرافيل، فاطرَ السماواتِ والأرض، عالمَ الغيبِ والشهادة، أنت تحكمُ بين عبادِك فيما كانوا فيه يختلفون، اهدِني لما اختُلفَ فيه من الحقِّ بإذنِك، إنك تهدي من تشاءُ إلى صراطٍ مستقيم.","مسلم","h"],
["الصلاة والطهارة|مغفرة واستغفار","في الركوع والسجود: اللهم اغفر لي","سبحانَك اللهم ربَّنا وبحمدِك، اللهم اغفرْ لي.","البخاري ومسلم","h"],
["الصلاة والطهارة","سبوح قدوس","سُبُّوحٌ قدُّوسٌ ربُّ الملائكةِ والروح.","مسلم","h"],
["الصلاة والطهارة","دعاء الركوع: لك ركعت","اللهم لك ركعتُ، وبك آمنتُ، ولك أسلمتُ، خشعَ لك سمعي وبصري ومُخِّي وعظمي وعصبي.","مسلم","h"],
["الصلاة والطهارة","دعاء السجود: لك سجدت","اللهم لك سجدتُ، وبك آمنتُ، ولك أسلمتُ، سجدَ وجهي للذي خلقَه وصوَّرَه وشقَّ سمعَه وبصرَه، تباركَ اللهُ أحسنُ الخالقين.","مسلم","h"],
["الصلاة والطهارة","سجود التلاوة","سجدَ وجهي للذي خلقَه وشقَّ سمعَه وبصرَه بحولِه وقوتِه.","أبو داود والترمذي","h"],
["الصلاة والطهارة|أذكار","بعد الوتر","سبحانَ الملكِ القدوس. (ثلاثًا، ويرفعُ صوتَه بالثالثة)","النسائي وأبو داود","h"],
["الصلاة والطهارة|جوامع الدعاء","الاستعاذة برضا الله","اللهم إني أعوذُ برضاك من سخطِك، وبمعافاتِك من عقوبتِك، وأعوذُ بك منك، لا أُحصي ثناءً عليك، أنت كما أثنيتَ على نفسِك.","مسلم","h"],
["أذكار|الصلاة والطهارة","بعد الصلاة: قني عذابك","ربِّ قِني عذابَك يومَ تبعثُ عبادَك.","مسلم","h"],
["أذكار|أذكار الصباح|أذكار المساء","فطرة الإسلام","أصبحنا (وفي المساء: أمسينا) على فطرةِ الإسلام، وعلى كلمةِ الإخلاص، وعلى دينِ نبيِّنا محمدٍ ﷺ، وعلى ملةِ أبينا إبراهيمَ حنيفًا مسلمًا وما كان من المشركين.","أحمد","h"],
["يومي","عند النوم: قني عذابك","اللهم قِني عذابَك يومَ تبعثُ عبادَك. (ثلاثًا)","أبو داود والترمذي","h"],
["يومي|قضاء الدين|رزق وبركة","عند النوم: رب السماوات السبع","اللهم ربَّ السماواتِ السبعِ وربَّ العرشِ العظيم، ربَّنا وربَّ كلِّ شيء، فالقَ الحبِّ والنوى، ومنزِّلَ التوراةِ والإنجيلِ والفرقان، أعوذُ بك من شرِّ كلِّ شيءٍ أنت آخذٌ بناصيتِه، اللهم أنت الأولُ فليس قبلَك شيء، وأنت الآخرُ فليس بعدَك شيء، وأنت الظاهرُ فليس فوقَك شيء، وأنت الباطنُ فليس دونَك شيء، اقضِ عنا الدَّينَ وأغنِنا من الفقر.","مسلم","h"],
["يومي","عند النوم: باسمك ربي وضعت جنبي","باسمِك ربِّي وضعتُ جَنبي وبك أرفعُه، فإن أمسكتَ نفسي فارحمْها، وإن أرسلتَها فاحفظْها بما تحفظُ به عبادَك الصالحين.","البخاري ومسلم","h"],
["يومي|هداية وثبات","عند النوم: أسلمت نفسي إليك","اللهم أسلمتُ نفسي إليك، وفوَّضتُ أمري إليك، وألجأتُ ظهري إليك، رغبةً ورهبةً إليك، لا ملجأَ ولا منجا منك إلا إليك، آمنتُ بكتابِك الذي أنزلتَ، وبنبيِّك الذي أرسلتَ.","البخاري ومسلم","h"],
["يومي|أذكار","تسبيح النوم","سبحانَ الله (٣٣)، والحمدُ لله (٣٣)، واللهُ أكبر (٣٤).","البخاري ومسلم","h"],
["يومي","عند النوم: الحمد لله الذي أطعمنا","الحمدُ للهِ الذي أطعمَنا وسقانا وكفانا وآوانا، فكم ممن لا كافيَ له ولا مُؤوي.","مسلم","h"],
["السفر والطقس","عند نزول المطر: مطرنا بفضل الله","مُطِرْنا بفضلِ اللهِ ورحمتِه.","البخاري ومسلم","h"],
["مناسبات وأخلاق|السفر والطقس","عند الإعجاب بشيء: التبريك","اللهم بارِكْ عليه. (أو: بارَكَ اللهُ فيه)","أحمد وابن ماجه","h"],
["الحج والعمرة","التلبية","لبَّيكَ اللهم لبَّيك، لبَّيكَ لا شريكَ لك لبَّيك، إنَّ الحمدَ والنعمةَ لك والمُلك، لا شريكَ لك.","البخاري ومسلم","h"],
["المرضى والموتى","الصلاة على الميت: اللهم اغفر لحيّنا وميّتنا","اللهم اغفرْ لحيِّنا وميِّتِنا، وشاهدِنا وغائبِنا، وصغيرِنا وكبيرِنا، وذكرِنا وأنثانا. اللهم من أحييتَه منا فأحيِه على الإسلام، ومن توفَّيتَه منا فتوفَّه على الإيمان.","أبو داود والترمذي","h"],
["المرضى والموتى|هداية وثبات","عند الاحتضار: الرفيق الأعلى","اللهم اغفرْ لي وارحمْني وألحِقْني بالرفيقِ الأعلى.","البخاري ومسلم","h"],
["السفر والطقس","عند الرجوع من السفر","آيِبون، تائبون، عابدون، لربِّنا حامدون.","مسلم","h"],
["مغفرة واستغفار|جوامع الدعاء","اغفر لي خطيئتي وجهلي","اللهم اغفرْ لي خطيئتي وجهلي، وإسرافي في أمري، وما أنت أعلمُ به مني. اللهم اغفرْ لي جِدِّي وهزلي، وخطئي وعمدي، وكلُّ ذلك عندي. اللهم اغفرْ لي ما قدمتُ وما أخرتُ، وما أسررتُ وما أعلنتُ، وما أنت أعلمُ به مني، أنت المقدِّمُ وأنت المؤخِّر، وأنت على كل شيءٍ قدير.","البخاري ومسلم","h"],
["جوامع الدعاء|مغفرة واستغفار","الاستعاذة من شر ما عملتُ","اللهم إني أعوذُ بك من شرِّ ما عملتُ، ومن شرِّ ما لم أعمل.","مسلم","h"],
["هداية وثبات","مصرّف القلوب","اللهم مصرِّفَ القلوبِ صرِّفْ قلوبَنا على طاعتِك.","مسلم","h"],
["جوامع الدعاء","الحمد لله رب العالمين، حمداً يوازي…","الحمد لله رب العالمين، حمداً يوازي نعمه ويكافئ مزيده، والصلاة والسلام على خير خلقه أجمعين، سيدنا محمد وعلى آله وصحبه ومن تبعه بإحسان إلى يوم الدين. أما بعد:","اجتهاد","u"],
["ثناء وتمجيد","اللهم لك الحمد كما ينبغي لجلال…","اللهم لك الحمد كما ينبغي لجلال وجهك وعظيم سلطانك، حمداً لا ينقطع ولا ينفد، عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته. أنت الله لا إله إلا أنت، الأول فليس قبلك شيء، والآخر فليس بعدك شيء، والظاهر فليس فوقك شيء، والباطن فليس دونك شيء. لك الملكوت، وبيدك ملكوت كل شيء، تُجير ولا يُجار عليك، وتمنع ولا تُمْنَع، وتعطي ولا تُمنَع، وتفعل ما تشاء بحكمك، وتقضي ما تريد بعدلك.","اجتهاد","u"],
["ثناء وتمجيد","سبحانك لا نحصي ثناءً عليك، أنت…","سبحانك لا نحصي ثناءً عليك، أنت كما أثنيت على نفسك. سبحان من ملك فقهر، سبحان القوي المقتدر، سبحان ذي العزة والجبروت، سبحان ذي الملك والملكوت، سبحان الحيّ الذي لا يموت، سبحان الذي بيده الخير وهو على كل شيء قدير. لا إله إلا أنت سبحانك إني كنت من الظالمين.","اجتهاد","u"],
["ثناء وتمجيد","اللهم أنت ربي لا رب لي…","اللهم أنت ربي لا رب لي غيرك، وأنت مولاي لا مولى لي سواك، بيدك ناصيتي، وإليك مصيري، وأنت على كل شيء وكيل. أنت الذي لا تخيب من دعاك، ولا تُردّ من لجأ إليك، ولا تُهمل من توكل عليك. يا نور السماوات والأرض، يا من لا يعزب عنه مثقال ذرة في الأرض ولا في السماء، يا من يعلم خفايا الصدور، وتسمع زفرات القلوب، يا مقلب القلوب والأبصار، يا مدبر الليل والنهار، يا فعالاً لما يريد.","اجتهاد","u"],
["ثناء وتمجيد","اللهم يا عظيم السلطان، يا قديم…","اللهم يا عظيم السلطان، يا قديم الإحسان، يا دائم النعماء، يا باسط الرزق، يا كثير الخيرات، يا واسع العطاء، يا دافع البلاء، يا سامع الدعاء، يا حاضراً ليس بغائب، يا موجوداً عند الشدائد، يا خفي اللطف، يا حليماً لا يعجل، يا كريم الصفح، يا عظيم المنّ، يا مبتدئ النعم قبل استحقاقها، يا ربنا ورب كل شيء، فالق الحب والنوى، ومنزل التوراة والإنجيل والقرآن العظيم.","اجتهاد","u"],
["ثناء وتمجيد","لك الحمد حتى ترضى، ولك الحمد…","لك الحمد حتى ترضى، ولك الحمد إذا رضيت، ولك الحمد بعد الرضا. يا من لا تنفد خزائنه، ولا تنقطع عطاياه، ولا يخفى عليه شيء في الأرض ولا في السماء، يا أكرم من سُئل، وأجود من أعطى، وأرحم من استُرحم، يا من يعطي من سأله، ويعطي من لم يسأله، فكيف بمن سأله وتضرع إليه؟ يا من لا يخيب رجاءً رُفع إليه، ولا يردّ يداً مُدّت إليه.","اجتهاد","u"],
["ثناء وتمجيد","اللهم لك الحمد على ما أعطيت،…","اللهم لك الحمد على ما أعطيت، ولك الشكر على ما أنعمت، ولك الثناء على ما هديت، ولك الفضل على ما أوليت. يا مَنْ لا يزول ملكه، ولا ينقص خزائنه، ولا تفنى حكمته، ولا تنقطع رحمته، يا من لا يعجزه شيء في الأرض ولا في السماء.","اجتهاد","u"],
["مغفرة واستغفار","اللهم إن تعذبنا فكثيراً عصيناك، وإن…","اللهم إن تعذبنا فكثيراً عصيناك، وإن تغفر لنا ففقراء إلى رحمتك، وأنت الغني عن عذابنا، ونحن الفقراء إلى رحمتك. اللهم هذا مقامنا بين يديك، ذلّنا ظاهر، وحالنا لا يخفى عليك، أمرتنا فتركنا، ونهيتنا فارتكبنا، وأقبلنا عليك بما فينا من تقصير، لا نعتذر بعذر، ولا نلتمس حجة، بل نعترف ونقرّ ونستغفر.","اجتهاد","u"],
["مغفرة واستغفار","اللهم إنا أقررنا بذنوبنا فاغفر لنا،…","اللهم إنا أقررنا بذنوبنا فاغفر لنا، واعترفنا بتقصيرنا فاعف عنا، وانكسرنا بين يديك فاجبرنا، وتضرعنا إليك فارحمنا. اللهم إنا آتينا بذنوب كثيرة، وعمل قليل، وقلب ملوّث، وسِتر مكشوف بين يديك، ولا يسعنا إلا عفوك، ولا يعنينا إلا رحمتك، ولا يُنجينا إلا فضلك.","اجتهاد","u"],
["مغفرة واستغفار","اللهم إنا نعوذ بك من شرور…","اللهم إنا نعوذ بك من شرور أنفسنا، وسيئات أعمالنا، وفتن الشهوات، وتسلط الهوى، وضعف الإرادة، وقسوة القلب، وانطماس البصيرة، وطاعة الشيطان. اللهم طهرنا من دنس المخالفات، ونقّنا من خطايا الأقوال والأفعال، وطهّر سرائرنا قبل علانيتنا، وأنقِ ألسنتنا قبل أعمالنا، وأصلح قلوبنا قبل أبداننا.","اجتهاد","u"],
["مغفرة واستغفار","اللهم اغفر لنا ما قدّمنا وما…","اللهم اغفر لنا ما قدّمنا وما أخّرنا، وما أسررنا وما أعلنّا، وما أخطأنا وما جهلنا، وما تعمّدنا وما نسينا، وما أنت أعلم به منا. اغفر لنا ولوالدينا، وارحمنا وارحمهم، وارفع درجاتنا ودرجاتهم، واجعلنا وإياهم في مستقر رحمتك.","اجتهاد","u"],
["مغفرة واستغفار","اللهم لا تكلنا إلى أنفسنا طرفة…","اللهم لا تكلنا إلى أنفسنا طرفة عين، ولا أقلّ من ذلك، فإنك إن تكلنا إلى أنفسنا نميل إلى الشهوات، ونتبع الهوى، ونضعف عن الطاعة، ولا حول لنا ولا قوة إلا بك. اللهم يا مقلب القلوب والأبصار، يا مصرف القلوب والأبصار، صرّف قلوبنا إلى طاعتك، وثبّت أفئدتنا على دينك، واجعل ألسنتنا رطبة بذكرك، وقلوبنا منعمة بشكرك، وأبداننا هينة لينة بطاعتك.","اجتهاد","u"],
["مغفرة واستغفار","اللهم إنا نسألك توبة الصادقين، وإنابة…","اللهم إنا نسألك توبة الصادقين، وإنابة المخبتين، وإخلاص الموقنين، وعلم الخائفين، وشكر الصابرين، ورجاء الراجين، وخشية العالمين، وحب المتقين. اللهم اجعلنا نخشاك كأننا نراك، ونطيعك كأننا نراك، ونعبدك كأننا نراك، فإن لم نكن نراك فإنك ترانا.","اجتهاد","u"],
["مغفرة واستغفار","اللهم اغفر لنا وارحمنا واهدنا ونجنا…","اللهم اغفر لنا وارحمنا واهدنا ونجنا من عذابك، وبارك لنا في أسماعنا وأبصارنا وأجسادنا وأرواحنا وقلوبنا، واجعل أعمالنا خالصةً لوجهك الكريم، بعيدةً عن الرياء والسمعة، خاليةً من الغرض والهوى.","اجتهاد","u"],
["فك الكرب والهم","اللهم يا فارج الهم، ويا كاشف…","اللهم يا فارج الهم، ويا كاشف الغم، ويا مُجيب دعوة المضطرين، ويا رحمن الدنيا ورحيم الآخرة، ارحمنا برحمتك التي وسعت كل شيء. أنزل علينا سكينةً من لدنك، وطهر قلوبنا من الهموم والأحزان، واجعل لنا من كل ضيق مخرجاً، ومن كل هم فرجاً، ومن كل غمّ شفاءً، ومن كل بلاء عافيةً.","اجتهاد","u"],
["فك الكرب والهم","اللهم إن ناصيتنا بيدك، وأزمّتنا إليك،…","اللهم إن ناصيتنا بيدك، وأزمّتنا إليك، وأنت بنا عالم لا يخفى عليك شيء من أمرنا. اللهم لا تؤاخذنا بما فعلنا، ولا تكلنا إلى غيرك، ولا تحجبنا عن رحمتك، ولا تُخْلِنا من لطفك، ولا تُخْلِف لنا وعدك. اللهم إنا قد ضاقت بنا الأرض، وعندك المتسع، وأغلقت الأبواب، وإليك المفزع، وانقطعت الأسباب، وأنت حسبنا ونعم الوكيل.","اجتهاد","u"],
["فك الكرب والهم","اللهم يا من لا تُغلق دونه…","اللهم يا من لا تُغلق دونه الأبواب، ويا من لا يخيب من دعاه، ويا من لا يردّ من لجأ إليه، اجعل لنا من كل ضيق مخرجاً، ومن كل هم فرجاً، ومن كل غمّ شفاءً، ومن كل بلاء عافية. اللهم لا تُشمت بنا عدوّاً، ولا حاسداً، ولا شامتاً، ولا ظالماً، واجعل كيدهم في نحرهم، وتدبيرهم تدميراً عليهم، وردّ كيدهم في نحورهم، واجعل دائرة السوء عليهم.","اجتهاد","u"],
["فك الكرب والهم","اللهم يا من بيده أمرنا كله،…","اللهم يا من بيده أمرنا كله، يا من يجيب المضطر إذا دعاه، يا من يغيث الملهوف، وينجي المكروب، ويكشف الضر، ويرفع البلاء، ويسمع الشكوى، ويعلم ما في القلوب. اللهم إنا قد أثقلتنا الهموم، وأتعبتنا الأحزان، وأضعفنا القلق، وأرهقنا التفكير، وأحاطت بنا الغموم من كل جانب. اللهم أنزل علينا سكينة منك، وأيدنا بروح منك، واجعل لنا فرجاً قريباً، ولطفاً خفياً، ورحمةً واسعة، وجُبْراً كاملاً.","اجتهاد","u"],
["فك الكرب والهم","اللهم يا من كشف ضرّ أيوب،…","اللهم يا من كشف ضرّ أيوب، ونجّى يونس من بطن الحوت، وأنجى إبراهيم من النار، وأخرج يوسف من السجن، وأغرق فرعون وأنجى موسى، وشفى مريم، ورزق زكريا، ورحم يعقوب، وردّ سليمان إلى ملكه، ورفع عيسى إلى السماء، صلّ على محمد وآله، وافعل بنا ما أنت أهله، ولا تفعل بنا ما نحن أهله، واجعل لنا من كل همّ فرجاً، ومن كل ضيق مخرجاً، ومن كل بلاء عافية.","اجتهاد","u"],
["فك الكرب والهم","اللهم اجعل لنا في هذه الدنيا…","اللهم اجعل لنا في هذه الدنيا راحةً وطمأنينة، وفي الآخرة فوزاً ورحمة. اللهم لا تدع لنا هماً إلا فرجته، ولا غماً إلا أزلته، ولا ديناً إلا قضيته، ولا داءً إلا شفيته، ولا عيباً إلا سترته، ولا عسيراً إلا يسرته، ولا حاجةً من حوائج الدنيا والآخرة إلا قضيتها برحمتك يا أرحم الراحمين.","اجتهاد","u"],
["فك الكرب والهم|جوامع الدعاء","اللهم اجبر كسرنا، وارحم ضعفنا، وارفع…","اللهم اجبر كسرنا، وارحم ضعفنا، وارفع قدرنا، واشرح صدرنا، ويسّر أمرنا، واهدنا إلى سواء السبيل. اللهم طهر قلوبنا من النفاق، وأعمالنا من الرياء، وألسنتنا من الكذب، وأعيننا من الخيانة، فإنك تعلم خائنة الأعين وما تخفي الصدور.","اجتهاد","u"],
["فك الكرب والهم|جوامع الدعاء","اللهم يا مُغيّر الحال والأحوال، غيّر…","اللهم يا مُغيّر الحال والأحوال، غيّر حالنا إلى أحسن حال. يا مُبدّل الأحزان أبدل أحزاننا أفراحاً، وهمومنا فرجاً، وعسرنا يسراً، وضيقنا سعةً. يا من يُجيب المضطر إذا دعاه، يا من يكشف السوء، يا من يُجير الملهوف، يا من يُغيث المكروب، أغثنا، وأجرنا، وارحمنا، وارفعنا، واجبرنا، وعافنا، واعفُ عنا.","اجتهاد","u"],
["فك الكرب والهم|جوامع الدعاء","اللهم إنا نسألك باسمك العظيم، وباسمك…","اللهم إنا نسألك باسمك العظيم، وباسمك الأعظم، وباسمك الذي إذا دُعيت به أجبت، وإذا سُئلت به أعطيت، وإذا استُرحمت به رحمت، وإذا استُنصرت به نُصرت، أن تجعل لنا من كل همّ فرجاً، ومن كل ضيق مخرجاً، ومن كل بلاء عافية، ومن كل سقم شفاءً، ومن كل فقر غنىً، ومن كل ذلّ عزاً، ومن كل خوف أمناً، ومن كل وحدة أنساً.","اجتهاد","u"],
["فك الكرب والهم|جوامع الدعاء","اللهم يا حي يا قيوم، برحمتك…","اللهم يا حي يا قيوم، برحمتك نستغيث، أصلح لنا شأننا كله، ولا تكلنا إلى أنفسنا طرفة عين. اللهم أصلح ديننا الذي هو عصمة أمرنا، وأصلح دنيانا التي فيها معاشنا، وأصلح آخرتنا التي فيها معادنا، واجعل الحياة زيادةً لنا في كل خير، والموت راحةً لنا من كل شر.","اجتهاد","u"],
["فك الكرب والهم|جوامع الدعاء","اللهم يا من لا يخفى عليه…","اللهم يا من لا يخفى عليه شيء في الأرض ولا في السماء، يا من يعلم السر وأخفى، يا من يعلم ما في الأرحام، يا من يعلم خائنة الأعين وما تخفي الصدور، يا من يعلم ما كان وما يكون وما سيكون، يا من يعلم ما أسرّ العباد وما أعلنوا. اللهم إنا نسألك علم الخائفين، وإنابة المخبتين، وإخلاص الموقنين، وتوبة الصادقين، وشكر الصابرين، ورضا القانعين.","اجتهاد","u"],
["فك الكرب والهم|جوامع الدعاء","اللهم اجعل لنا في قلبنا نوراً،…","اللهم اجعل لنا في قلبنا نوراً، وفي سمعنا نوراً، وفي بصرنا نوراً، وفي لساننا نوراً، وفي جسدنا نوراً، وفي دمنا نوراً، وفي شعرنا نوراً، وفي بشرنا نوراً، وفي لحمنا نوراً، وفي عظمنا نوراً، وفي أرواحنا نوراً، وفي قلوبنا نوراً، واجعل لنا نوراً من بين أيدينا ومن خلفنا وعن يميننا وعن شمالنا وفوقنا وتحتنا.","اجتهاد","u"],
["فك الكرب والهم|جوامع الدعاء","اللهم يا مالك الملك، تؤتي الملك…","اللهم يا مالك الملك، تؤتي الملك من تشاء، وتنزع الملك ممن تشاء، وتعز من تشاء، وتذل من تشاء، بيدك الخير إنك على كل شيء قدير. يا من بيده خزائن السماوات والأرض، يا من يُعطي من يشاء بغير حساب، يا من يرزق من يشاء بغير حساب، ارزقنا رزقاً حلالاً طيباً مباركاً فيه، رزقاً لا يقطع، ونعمةً لا تزول، وعطاءً لا ينفد.","اجتهاد","u"],
["فك الكرب والهم|جوامع الدعاء","اللهم يا مجيب الدعاء، يا سامع…","اللهم يا مجيب الدعاء، يا سامع الصوت، يا عالم السر، يا كاشف الضر، يا دافع البلاء، يا رحمن الدنيا والآخرة ورحيمهما، اقضِ لنا حوائجنا، ويسّر لنا أمورنا، وافتح لنا أبواب رحمتك، وأنزل علينا من بركاتك، واجعل لنا من كل همّ فرجاً، ومن كل ضيق مخرجاً.","اجتهاد","u"],
["جوامع الدعاء","اللهم ربنا آتنا في الدنيا حسنة،…","اللهم ربنا آتنا في الدنيا حسنة، وفي الآخرة حسنة، وقنا عذاب النار. اللهم إنا نسألك من الخير كله عاجله وآجله، ما علمنا منه وما لم نعلم، ونعوذ بك من الشر كله عاجله وآجله، ما علمنا منه وما لم نعلم. اللهم إنا نسألك من خير ما سألك منه عبدك ونبيك محمد صلى الله عليه وسلم، ونعوذ بك من شر ما استعاذك منه عبدك ونبيك محمد صلى الله عليه وسلم.","اجتهاد","u"],
["جوامع الدعاء","اللهم إنا نسألك الهدى والتقى والعفاف…","اللهم إنا نسألك الهدى والتقى والعفاف والغنى. اللهم إنا نسألك الجنة وما قرّب إليها من قول وعمل، ونعوذ بك من النار وما قرّب إليها من قول وعمل. اللهم إنا نسألك موجبات رحمتك، وعزائم مغفرتك، والسلامة من كل إثم، والغنيمة من كل بر، والفوز بالجنة، والنجاة من النار.","اجتهاد","u"],
["جوامع الدعاء","اللهم إنا نسألك أن تجعل خير…","اللهم إنا نسألك أن تجعل خير أعمالنا خواتيمها، وخير أيامنا يوم نلقاك، وخير عمرنا آخره، وخير أيامنا يوم القيامة، وخير ليلنا ليلة القدر، وخير شهورنا شهر رمضان، وخير أعمالنا ما كان خالصاً لوجهك، وخير أعمارنا ما كان في طاعتك، وخير أيامنا يوم نلقاك وأنت راضٍ عنا.","اجتهاد","u"],
["جوامع الدعاء","اللهم إنا نسألك العفو والعافية في…","اللهم إنا نسألك العفو والعافية في الدنيا والآخرة، اللهم إنا نسألك العفو والعافية في ديننا ودنيانا وأهلينا وأموالنا. اللهم استر عوراتنا، وآمن روعاتنا، واحفظنا من بين أيدينا ومن خلفنا وعن أيماننا وعن شمائلنا ومن فوقنا، ونعوذ بعظمتك أن نُغتال من تحتنا.","اجتهاد","u"],
["جوامع الدعاء","اللهم إنا نسألك أن ترفع ذكرنا،…","اللهم إنا نسألك أن ترفع ذكرنا، وتضع وزرنا، وتصلح أمرنا، وتطهر قلوبنا، وتحصّن فروجنا، وتغفر ذنوبنا، وتبيض وجوهنا، وتثبت أقدامنا، وتنصرنا على القوم الظالمين.","اجتهاد","u"],
["جوامع الدعاء","اللهم يا مقلب القلوب، ثبّت قلوبنا…","اللهم يا مقلب القلوب، ثبّت قلوبنا على دينك. يا مصرف القلوب، اصرف قلوبنا إلى طاعتك. يا مُلين الحديد، ليّن قلوبنا لذكرك. يا مُذهب الأحزان، أذهب حزننا. يا مُفرّج الهموم، فرّج همنا. يا كاشف الغموم، اكشف غمنا. يا مُجيب الدعاء، أجب دعاءنا. يا سامع الصوت، اسمع صوتنا. يا عالم السر، اعلم سرّنا. يا غافر الذنب، اغفر ذنبنا. يا قابل التوب، اقبل توبتنا. يا شديد العقاب، اصرف عنا عقابك. يا ذا الطول، طُل علينا بفضلك. يا ذا الجلال والإكرام، أكرمنا بجلالك، وأكرمنا بكرامتك.","اجتهاد","u"],
["جوامع الدعاء","اللهم إنا نسألك من فضلك ورحمتك،…","اللهم إنا نسألك من فضلك ورحمتك، فإنه لا يملكها إلا أنت. اللهم إنا نسألك من خزائن رحمتك التي لا تنفد، ومن خزائن فضلك التي لا تنقطع، ومن خزائن رزقك التي لا تنقص. اللهم أغننا بحلالك عن حرامك، وبفضلك عمن سواك، وبطاعتك عن معصيتك.","اجتهاد","u"],
["جوامع الدعاء","اللهم اكفنا بحلالك عن حرامك، وأغننا…","اللهم اكفنا بحلالك عن حرامك، وأغننا بفضلك عمن سواك. اللهم إنا نسألك رزقاً حلالاً طيباً، رزقاً واسعاً، رزقاً مباركاً فيه، رزقاً لا يُتعبنا ولا يُلهينا عن طاعتك، رزقاً يُعيننا على طاعتك، ويُقرّبنا منك، ويُبعدنا عن معصيتك.","اجتهاد","u"],
["جوامع الدعاء","اللهم إنا نسألك علماً نافعاً، ورزقاً…","اللهم إنا نسألك علماً نافعاً، ورزقاً طيباً، وعملاً متقبلاً. اللهم إنا نسألك علم الخائفين، وخشية العالمين، ويقين الموقنين، وتوكل المتوكلين، وإنابة المخبتين، وإخلاص المخلصين، وشكر الشاكرين، وصبر الصابرين، ورضا الراضين، وحب المحبين، وشوق المشتاقين، وأنس المتقين.","اجتهاد","u"],
["جوامع الدعاء","اللهم اجعلنا من عبادك الشاكرين، ومن…","اللهم اجعلنا من عبادك الشاكرين، ومن الذاكرين لك، ومن أوليائك الصالحين، ومن جندك الغالبين، ومن حزبك المفلحين، ومن عبادك المخلصين، ومن عبادك المتقين، ومن عبادك الصالحين، ومن عبادك المخبتين، ومن عبادك المنيبين، ومن عبادك المطمئنين، ومن عبادك الراضين، ومن عبادك المرضيين.","اجتهاد","u"],
["جوامع الدعاء","اللهم اجعلنا من الذين يستمعون القول…","اللهم اجعلنا من الذين يستمعون القول فيتبعون أحسنه، ومن الذين يهديهم الله فيكونون من المهتدين، ومن الذين لا خوف عليهم ولا هم يحزنون، ومن الذين أنعمت عليهم من النبيين والصديقين والشهداء والصالحين وحسن أولئك رفيقاً.","اجتهاد","u"],
["هداية وثبات|الآخرة وحسن الخاتمة","اللهم إنا نسألك الثبات في الأمر،…","اللهم إنا نسألك الثبات في الأمر، والعزيمة على الرشد، والشكر على النعمة، والصبر على البلاء، والرضا بالقضاء، والتسليم لأمرك. اللهم اجعلنا من الذين إذا أُعطوا شكروا، وإذا ابتُلوا صبروا، وإذا أذنبوا استغفروا، وإذا ظُلموا غفروا.","اجتهاد","u"],
["هداية وثبات|الآخرة وحسن الخاتمة","اللهم يا مقلب القلوب والأبصار، ثبّت…","اللهم يا مقلب القلوب والأبصار، ثبّت قلوبنا على دينك، واجعل أفئدتنا معلقةً بمحبتك، وأرواحنا متعلقةً بطاعتك، وألسنتنا رطبةً بذكرك، وجوارحنا مشغولةً بخدمتك. اللهم لا تزغ قلوبنا بعد إذ هديتنا، وهب لنا من لدنك رحمة، إنك أنت الوهاب.","اجتهاد","u"],
["هداية وثبات|الآخرة وحسن الخاتمة","اللهم يا مصرف القلوب والأبصار، اصرف…","اللهم يا مصرف القلوب والأبصار، اصرف قلوبنا إلى طاعتك، واصرف أبصارنا عن محارمك، واصرف أسماعنا عن الحرام، واصرف ألسنتنا عن الكذب والغيبة والنميمة، واصرف أيدينا عن الحرام، واصرف أقدامنا عن معاصيك، واصرف أرواحنا عن كل ما يبعدنا عنك.","اجتهاد","u"],
["هداية وثبات|الآخرة وحسن الخاتمة","اللهم إنا نسألك حسن الخاتمة، والسعادة…","اللهم إنا نسألك حسن الخاتمة، والسعادة في البرزخ، والأمن في القيامة، والفوز بالجنة، والنجاة من النار، والشفاعة في المقام المحمود، والدرجات العلى في الجنان. اللهم اجعل خير أعمالنا خواتيمها، وخير أيامنا يوم نلقاك، وخير عمرنا آخره.","اجتهاد","u"],
["هداية وثبات|الآخرة وحسن الخاتمة","اللهم إنا نسألك أن تجعل قبورنا…","اللهم إنا نسألك أن تجعل قبورنا روضةً من رياض الجنة، لا حفرةً من حفر النار. اللهم آنس وحشتنا في القبور، وأزل ظلمتنا في القبور، واجعل قبورنا نوراً، واجعلها راحةً، واجعلها فرحاً، واجعلها بستاناً، واجعلها مستقراً، واجعلها مأوىً، واجعلها مرقداً، واجعلها مهداً، واجعلها مضجعاً، واجعلها كنزاً، واجعلها روضةً، واجعلها جنّة.","اجتهاد","u"],
["هداية وثبات|الآخرة وحسن الخاتمة","اللهم يا مُغيث الملهوفين، يا مُجيب…","اللهم يا مُغيث الملهوفين، يا مُجيب المضطرين، يا راحم المساكين، يا غياث المستغيثين، يا مالك يوم الدين، يا من لا يخيب راجيه، يا من لا يردّ داعيه، يا من لا تُغلق دونه الأبواب، يا من لا تُردّ له دعوة، يا من لا تُخلف له موعده. اللهم ارحمنا برحمتك، واغفر لنا بفضلك، واعفُ عنا بعفوك، وارزقنا من خيرك، واصرف عنا شرك، واجعل لنا من كل همّ فرجاً، ومن كل ضيق مخرجاً، ومن كل بلاء عافية، ومن كل سقم شفاءً.","اجتهاد","u"],
["الظلم والأعداء","اللهم عليك بمن ظلمنا، وبمن اعتدى…","اللهم عليك بمن ظلمنا، وبمن اعتدى علينا، وبمن حاسدنا، وبمن كاد لنا، وبمن شمت بنا، وبمن أذلّنا، وبمن استهان بحرمتنا. اللهم أظهر مكرهم، واكشف خيانتهم، واجعل كيدهم في نحرهم، وتدبيرهم تدميراً عليهم، ودائرة السوء عليهم. اللهم لا ترفع لهم راية، ولا تحقق لهم غاية، ولا تُمكّن لهم منا، واجعلهم عبرةً لمن يعتبر، وآيةً لمن يتأمل، وعظةً لمن يعقل.","اجتهاد","u"],
["الظلم والأعداء","اللهم إنا ندرأ بك في نحورهم،…","اللهم إنا ندرأ بك في نحورهم، ونعوذ بك من شرورهم، ونتوكل عليك في أمرهم. اللهم اكفناهم بما شئت، وأنزل عليهم بأسك الذي لا يُردّ عن القوم المجرمين. اللهم يا منزل الكتاب، يا مجري السحاب، يا هازم الأحزاب، يا قوي يا عزيز، يا غالباً على أمره، يا شديد المحال، يا ذا القوة المتين، يا شديد العقاب، يا سريع الحساب، يا فعالاً لما يريد، يا مغيثاً لكل ملهوف، يا مجيباً لكل دعاء، يا فارجاً لكل هم، يا كاشفاً لكل غم.","اجتهاد","u"],
["الظلم والأعداء","اللهم اجعل تدبيرهم تدميراً عليهم، واجعل…","اللهم اجعل تدبيرهم تدميراً عليهم، واجعل مكرهم في نحورهم، واجعل كيدهم في صدورهم، واجعل حفرهم التي يحفرونها يقعون فيها، واجعل السوء الذي يريدونه بنا راجعاً عليهم، واجعل الشر الذي يُخططون له نازلاً بهم. اللهم أرنا فيهم عجائب قدرتك، وأظهر لهم بأسك الذي لا يُردّ عن القوم المجرمين.","اجتهاد","u"],
["الظلم والأعداء","اللهم إنا نضعهم بين يديك، فأنت…","اللهم إنا نضعهم بين يديك، فأنت القوي العزيز، وأنت الحكيم العليم، وأنت القهار الجبار، وأنت المنتقم العادل. اللهم انتقم لنا منهم، فإنك أنت المنتقم، وخُذهم أخذ عزيز مقتدر، وخُذهم أخذةً رابية، وأرنا فيهم يومك الذي لا يُردّ ولا يُؤجّل.","اجتهاد","u"],
["الظلم والأعداء","حسبنا الله ونعم الوكيل، حسبنا الله…","حسبنا الله ونعم الوكيل، حسبنا الله وكفى، حسبنا الرب من العباد، حسبنا الخالق من المخلوق، حسبنا الرازق من المرزوق، حسبنا الذي بيده ملكوت كل شيء، حسبنا الذي هو حسبنا، هو يجير ولا يُجار عليه، حسبنا الله ونعم النصير. حسبنا الله ونعم المولى ونعم النصير، حسبنا الله ونعم الوكيل.","اجتهاد","u"],
["الظلم والأعداء","اللهم يا من لا يعجزه شيء…","اللهم يا من لا يعجزه شيء في الأرض ولا في السماء، يا من بيده ملكوت كل شيء، يا من يُدبّر الأمر، يا من يُنزل الغيث، يا من يُحيي ويميت، يا من يُعز من يشاء ويُذل من يشاء، بيدك الخير إنك على كل شيء قدير. اللهم اكفنا شر من يريد بنا سوءاً، واصرف عنا كيد الكائدين، وحسد الحاسدين، وشماتة الشامتين، وظلم الظالمين، وبغي الباغين، ومكر الماكرين، وكيد الكائدين، وحقد الحاقدين، وعدوان المعتدين.","اجتهاد","u"],
["الظلم والأعداء","اللهم يا من لا يُخفى عليه…","اللهم يا من لا يُخفى عليه شيء، يا من يعلم السر وأخفى، يا من يعلم ما في القلوب، يا من يعلم ما تخفي الصدور، يا من يعلم خائنة الأعين وما تخفي الصدور، اكشف لنا ما خفي عنا، وأرنا الحق حقاً وارزقنا اتباعه، والباطل باطلاً وارزقنا اجتنابه. اللهم أرنا في الظالمين عجائب قدرتك، وأرنا فيهم بأسك الذي لا يُردّ عن القوم المجرمين، واجعلهم عبرةً للمعتبرين، وآيةً للمتأملين، وعظةً للناظرين.","اجتهاد","u"],
["رزق وبركة","اللهم يا رازق من يشاء بغير…","اللهم يا رازق من يشاء بغير حساب، يا معطي من يشاء بغير عدد، يا غني من يشاء بغير حد، يا كافي من يشاء بغير مد، يا من بيده خزائن السماوات والأرض، يا من لا ينفد ما عنده، يا من لا تنقص خزائنه، يا من لا تنقطع عطاياه، ارزقنا رزقاً حلالاً طيباً مباركاً فيه، رزقاً واسعاً، رزقاً لا يقطع، ونعمةً لا تزول، وعطاءً لا ينفد.","اجتهاد","u"],
["رزق وبركة","اللهم أغننا بحلالك عن حرامك، وبفضلك…","اللهم أغننا بحلالك عن حرامك، وبفضلك عمن سواك، وبطاعتك عن معصيتك. اللهم اكفنا بحلالك عن حرامك، وأغننا بفضلك عمن سواك. اللهم إنا نسألك من فضلك ورحمتك، فإنه لا يملكها إلا أنت. اللهم إنا نسألك من خزائن رحمتك التي لا تنفد، ومن خزائن فضلك التي لا تنقطع، ومن خزائن رزقك التي لا تنقص.","اجتهاد","u"],
["رزق وبركة","اللهم إنا نسألك رزقاً واسعاً، وعيشاً…","اللهم إنا نسألك رزقاً واسعاً، وعيشاً هنيئاً، وقلباً طاهراً، ولساناً صادقاً، وعملاً متقبلاً، وتجارةً لن تبور، وديناً قيماً، وشفاءً من كل داء، وعافيةً في الحياة، وحسن الخاتمة عند الممات. اللهم إنا نسألك رزقاً حلالاً طيباً، رزقاً واسعاً، رزقاً مباركاً فيه، رزقاً يُعيننا على طاعتك، ويُقرّبنا منك، ويُبعدنا عن معصيتك.","اجتهاد","u"],
["رزق وبركة","اللهم يا من لا يُعجزه شيء،…","اللهم يا من لا يُعجزه شيء، يا من يُعطي من يشاء بغير حساب، يا من يرزق من يشاء بغير حساب، يا من يُغني من يشاء بغير حساب، يا من يُفقر من يشاء بغير حساب، أغننا من فضلك، وارزقنا من خيرك، واكفنا بحلالك، وأغننا بفضلك، وبارك لنا في ما رزقتنا، واجعلنا من الشاكرين.","اجتهاد","u"],
["رزق وبركة","اللهم ارزقنا رزقاً لا يُتعبنا، ولا…","اللهم ارزقنا رزقاً لا يُتعبنا، ولا يُلهينا عن طاعتك، ولا يُنسينا ذكرك، ولا يُبعدنا عنك، بل يُعيننا على طاعتك، ويُقرّبنا منك، ويُزيدنا في شكرك. اللهم ارزقنا من حيث لا نحتسب، وافتح لنا أبواب رحمتك، وأنزل علينا من بركاتك، واجعل لنا من كل همّ فرجاً، ومن كل ضيق مخرجاً.","اجتهاد","u"],
["رزق وبركة","اللهم إنا نسألك أن تجعل لنا…","اللهم إنا نسألك أن تجعل لنا في هذه الدنيا راحةً وطمأنينة، وفي الآخرة فوزاً ورحمة. اللهم إنا نسألك أن تجعل لنا في الدنيا خيراً، وفي الآخرة خيراً، وأن تجعل لنا في كل خير نصيباً، وأن تجعلنا من الشاكرين لنعمك، القائمين بحقك، الذاكرين لك، المخلصين في طاعتك.","اجتهاد","u"],
["رزق وبركة","اللهم إنا نسألك أن تبارك لنا…","اللهم إنا نسألك أن تبارك لنا في أموالنا، وأولادنا، وأزواجنا، وأهلنا، وأعمارنا، وأعمالنا، وأوقاتنا، وأعطنا من فضلك، واغننا من خيرك، واكفنا بحلالك، وأغننا بفضلك عمن سواك. اللهم إنا نسألك أن تجعل لنا في كل حركة بركة، وفي كل سكنة رحمة، وفي كل نظرة عبرة، وفي كل كلمة حكمة، وفي كل عمل إخلاصاً.","اجتهاد","u"],
["رزق وبركة","اللهم يا من بيده خزائن السماوات…","اللهم يا من بيده خزائن السماوات والأرض، يا من يُعطي من يشاء بغير حساب، يا من يرزق من يشاء بغير عدد، يا من يُغني من يشاء بغير حد، ارزقنا رزقاً حلالاً طيباً مباركاً فيه، رزقاً واسعاً، رزقاً لا يقطع، ونعمةً لا تزول، وعطاءً لا ينفد. اللهم أغننا من فضلك، وارزقنا من خيرك، واكفنا بحلالك، وأغننا بفضلك عمن سواك.","اجتهاد","u"],
["شفاء وعافية","اللهم يا شافي، يا كافي، يا…","اللهم يا شافي، يا كافي، يا معافي، يا من لا شافي إلا هو، يا من لا كافي إلا هو، يا من لا معافي إلا هو، اشفنا شفاءً لا يُغادر سقماً، وعافنا عافيةً لا يُغادرها ألم، واكفنا كفايةً لا يُغادرها فقر. اللهم اشف مرضانا ومرضى المسلمين، وارحم موتانا وموتى المسلمين، وعافنا في أبداننا، وفي أسماعنا، وفي أبصارنا، وفي أرواحنا، وفي قلوبنا.","اجتهاد","u"],
["شفاء وعافية","اللهم يا من بيده الشفاء، يا…","اللهم يا من بيده الشفاء، يا من يُذهب الداء، يا من يُعافي من المرض، يا من يُنعم بالصحة، يا من يُنعم بالعافية، يا من يُنعم بالقوة، يا من يُنعم بالنشاط، اشفنا من كل داء، وعافنا من كل سقم، واكفنا من كل بلاء، ونجنا من كل شر.","اجتهاد","u"],
["شفاء وعافية","اللهم يا من لا يُخفى عليه…","اللهم يا من لا يُخفى عليه داء، يا من لا يُعجزه شفاء، يا من لا يُستعصى عليه مرض، يا من لا يُستغلق عليه سقم، اشفنا من كل داء، وعافنا من كل سقم، واكفنا من كل بلاء، ونجنا من كل شر. اللهم اشف مرضانا، وارحم موتانا، وعاف مبتلانا، واجبر مكسورنا، وارحم ضعيفنا، وارفع منخفضنا.","اجتهاد","u"],
["شفاء وعافية","اللهم إنا نسألك الصحة والعافية، والقوة…","اللهم إنا نسألك الصحة والعافية، والقوة والنشاط، والطول والعرض، والغنى والسعة، والرزق والبركة. اللهم إنا نسألك أن تُعافينا في أبداننا، وأن تُعافينا في أسماعنا، وأن تُعافينا في أبصارنا، وأن تُعافينا في أرواحنا، وأن تُعافينا في قلوبنا، وأن تُعافينا في أدمغتنا، وأن تُعافينا في أعصابنا، وأن تُعافينا في عظامنا، وأن تُعافينا في لحمانا، وأن تُعافينا في دمائنا.","اجتهاد","u"],
["شفاء وعافية","اللهم يا من لا يُخفى عليه…","اللهم يا من لا يُخفى عليه شيء، يا من يعلم الداء والدواء، يا من يعلم المرض والشفاء، يا من يعلم السقم والعافية، اشفنا شفاءً لا يُغادر سقماً، وعافنا عافيةً لا يُغادرها ألم. اللهم اشف مرضانا، وارحم موتانا، وعاف مبتلانا، واجبر مكسورنا، وارحم ضعيفنا، وارفع منخفضنا، وأغن فقيرنا، وأعزّ ذليلنا.","اجتهاد","u"],
["ذرية وأهل","اللهم اغفر لنا ولوالدينا، وارحمنا وارحمهم،…","اللهم اغفر لنا ولوالدينا، وارحمنا وارحمهم، وارفع درجاتنا ودرجاتهم، واجعلنا وإياهم في مستقر رحمتك. اللهم اغفر لوالدينا، وارحمهما كما ربيانا صغاراً، واجزهما عنا خير الجزاء، واغفر لهما ما قدموا وما أخروا، وما أسرّوا وما أعلنوا، وما أخطأوا وما تعمدوا، وما نسوا وما ذكروا.","اجتهاد","u"],
["ذرية وأهل","اللهم ارحم والدينا، واغفر لهم، واعفُ…","اللهم ارحم والدينا، واغفر لهم، واعفُ عنهم، ووسّع قبورهم، وأنرها، واجعلها روضةً من رياض الجنة، واجعلهم من أهل الفردوس الأعلى، واجمعنا بهم في مستقر رحمتك، في مقعد صدق عند مليك مقتدر. اللهم ارحم آباءنا وأمهاتنا، وأجدادنا وجداتنا، وأهلنا وأقاربنا، وجميع المسلمين والمسلمات، الأحياء منهم والأموات.","اجتهاد","u"],
["ذرية وأهل","اللهم اجعل أولادنا من الصالحين، ومن…","اللهم اجعل أولادنا من الصالحين، ومن الحافظين لكتابك، ومن القائمين بدينك، ومن الداعين إلى سبيلك، ومن المجاهدين في سبيلك، ومن الشهداء والصديقين والصالحين. اللهم احفظهم من كل سوء، واصرف عنهم كل شر، واجعلهم من عبادك الصالحين، ومن أوليائك المتقين.","اجتهاد","u"],
["ذرية وأهل","اللهم أصلح لنا في أزواجنا، واجعلهم…","اللهم أصلح لنا في أزواجنا، واجعلهم قرة أعين لنا، واجعلهم من الصالحين، ومن الحافظين لكتابك، ومن القائمين بدينك، ومن الداعين إلى سبيلك. اللهم اجعل بيننا وبينهم مودةً ورحمة، واجعلهم عوناً لنا على طاعتك، واجعلنا عوناً لهم على طاعتك، واجعلنا وإياهم من عبادك الصالحين.","اجتهاد","u"],
["ذرية وأهل","اللهم أصلح لنا في أهلنا، وأولادنا،…","اللهم أصلح لنا في أهلنا، وأولادنا، وأزواجنا، وأقاربنا، وأصدقائنا، وجيراننا، وإخواننا، وأخواتنا، واجعلهم جميعاً من الصالحين، ومن الحافظين لكتابك، ومن القائمين بدينك، ومن الداعين إلى سبيلك. اللهم اجمعنا بهم في مستقر رحمتك، في مقعد صدق عند مليك مقتدر.","اجتهاد","u"],
["دعاء للأمة","اللهم فرّج عن المسلمين في كل…","اللهم فرّج عن المسلمين في كل مكان، وارحم ضعفهم، واجبر كسرهم، وارفع ذلهم، وأعزهم، وانصرهم، وأيدهم، وثبت أقدامهم، وانصرهم على القوم الظالمين. اللهم ارحم المسلمين المستضعفين في كل مكان، واجبر كسرهم، وارحم ضعفهم، وارفع ذلهم، وأعزهم، وانصرهم، وأيدهم، وثبت أقدامهم.","اجتهاد","u"],
["دعاء للأمة","اللهم أصلح أحوال المسلمين، واجمع كلمتهم،…","اللهم أصلح أحوال المسلمين، واجمع كلمتهم، ووحد صفوفهم، وأصلح قادتهم، واهدهم إلى الحق، واجعلهم من عبادك الصالحين، ومن أوليائك المتقين، ومن جندك الغالبين، ومن حزبك المفلحين. اللهم ارحم المسلمين، وارحم ضعفهم، واجبر كسرهم، وارفع ذلهم، وأعزهم، وانصرهم، وأيدهم، وثبت أقدامهم.","اجتهاد","u"],
["دعاء للأمة","اللهم أصلح أحوال المسلمين في كل…","اللهم أصلح أحوال المسلمين في كل مكان، وارحم ضعفهم، واجبر كسرهم، وارفع ذلهم، وأعزهم، وانصرهم، وأيدهم، وثبت أقدامهم، واجعلهم من عبادك الصالحين، ومن أوليائك المتقين، ومن جندك الغالبين، ومن حزبك المفلحين.","اجتهاد","u"],
["دعاء للأمة","اللهم ارحم المسلمين المستضعفين في كل…","اللهم ارحم المسلمين المستضعفين في كل مكان، واجبر كسرهم، وارحم ضعفهم، وارفع ذلهم، وأعزهم، وانصرهم، وأيدهم، وثبت أقدامهم، واجعلهم من عبادك الصالحين. اللهم أصلح أحوال المسلمين، واجمع كلمتهم، ووحد صفوفهم، وأصلح قادتهم، واهدهم إلى الحق.","اجتهاد","u"],
["الصلاة على النبي ﷺ","اللهم صل وسلم وبارك على سيدنا…","اللهم صل وسلم وبارك على سيدنا ونبينا وحبيبنا محمد، وعلى آله وصحبه أجمعين، صلاةً تفتح بها لنا أبواب الرحمة، وتغفر بها ذنوبنا، وتقضي بها حوائجنا، وتفرج بها همومنا، وتشرح بها صدورنا، وتبيض بها وجوهنا، وتثبت بها أقدامنا، وترفع بها درجاتنا، وتبلغنا بها أعلى المقامات، واجعلنا من أهل شفاعته، واسقنا من حوضه، وأدخلنا في زمرته، واحشرنا تحت لوائه، مع الذين أنعمت عليهم من النبيين والصديقين والشهداء والصالحين وحسن أولئك رفيقاً.","اجتهاد","u"],
["الصلاة على النبي ﷺ","اللهم صل على محمد وعلى آل…","اللهم صل على محمد وعلى آل محمد، كما صليت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد. اللهم بارك على محمد وعلى آل محمد، كما باركت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد. اللهم صل على محمد وعلى أزواجه وذريته، كما صليت على آل إبراهيم، وبارك على محمد وعلى أزواجه وذريته، كما باركت على آل إبراهيم، إنك حميد مجيد.","اجتهاد","u"],
["الصلاة على النبي ﷺ","اللهم صل على محمد وعلى آل…","اللهم صل على محمد وعلى آل محمد، عدد ما ذكره الذاكرون، وعدد ما غفل عن ذكره الغافلون. اللهم صل على محمد وعلى آل محمد، عدد ما أحصاه كتابك، وعدد ما أحصاه علمك، وعدد ما أحصاه حلمك، وعدد ما أحصاه كرمك، وعدد ما أحصاه جودك، وعدد ما أحصاه فضلك، وعدد ما أحصاه رحمتك.","اجتهاد","u"],
["الصلاة على النبي ﷺ","اللهم صل على محمد وعلى آل…","اللهم صل على محمد وعلى آل محمد، صلاةً تكون لك رضاً، ولنا أجراً، وللمسلمين جميعاً فرجاً، وللمستضعفين نصراً، وللمظلومين عدلاً، وللمهمومين فرجاً، وللمكروبين كشفاً، وللمرضى شفاءً، وللموتى رحمةً، وللأحياء هدايةً، ولنا جميعاً خيراً.","اجتهاد","u"],
["الصلاة على النبي ﷺ","اللهم صل على محمد وعلى آل…","اللهم صل على محمد وعلى آل محمد، صلاةً تفتح بها لنا أبواب الرحمة، وتغفر بها ذنوبنا، وتقضي بها حوائجنا، وتفرج بها همومنا، وتشرح بها صدورنا، وتبيض بها وجوهنا، وتثبت بها أقدامنا، وترفع بها درجاتنا، وتبلغنا بها أعلى المقامات.","اجتهاد","u"],
["الصلاة على النبي ﷺ","اللهم صل وسلم وبارك على سيدنا…","اللهم صل وسلم وبارك على سيدنا ونبينا وحبيبنا محمد، وعلى آله وصحبه ومن تبعهم بإحسان إلى يوم الدين، صلاةً دائمةً باقيةً، لا تنقطع ولا تنفد، عدد خلقك، ورضا نفسك، وزنة عرشك، ومداد كلماتك. اللهم صل وسلم وبارك على نبينا الكريم المبعوث رحمة للعالمين، وعلى آله وأصحابه أجمعين، وسلام على المرسلين، والحمد لله رب العالمين.","اجتهاد","u"],
["جوامع الدعاء","اللهم إنا قد دعونا فاستجب لنا،…","اللهم إنا قد دعونا فاستجب لنا، وسألنا فأعطنا، وتضرعنا فارحمنا، واعترفنا فاغفر لنا، وانكسرنا فاجبرنا، وضعفنا فقوّنا، وفقيرنا فأغننا، وذلنا فأعزنا، وخائفنا فآمنّا، وحزيننا فأسعدنا، ومهمومنا ففرّج عنا، ومكروبنا فكشف عنا، ومريضنا فاشفنا، ومبتلانا فعافنا، ومظلومنا فانصرنا، وضعيفنا فقوّنا.","اجتهاد","u"],
["جوامع الدعاء","اللهم إنا نسألك أن تجعل دعاءنا…","اللهم إنا نسألك أن تجعل دعاءنا هذا سبباً لفرجنا، وسبباً لشفائنا، وسبباً لغنانا، وسبباً لعزنا، وسبباً لسعادتنا، وسبباً لنجاتنا، وسبباً لدخولنا الجنة، وسبباً لبعدنا عن النار. اللهم تقبل منا، واغفر لنا، وارحمنا، واهدنا، وعافنا، واعفُ عنا، وثبتنا، وانصرنا، وأعزنا، وأغننا، وأسعدنا، وأدخلنا الجنة، ونجنا من النار.","اجتهاد","u"],
["جوامع الدعاء","اللهم اجعلنا من عبادك الصالحين، ومن…","اللهم اجعلنا من عبادك الصالحين، ومن أوليائك المتقين، ومن جندك الغالبين، ومن حزبك المفلحين، ومن عبادك المخلصين، ومن عبادك الشاكرين، ومن عبادك الذاكرين، ومن عبادك المخبتين، ومن عبادك المنيبين، ومن عبادك المطمئنين، ومن عبادك الراضين، ومن عبادك المرضيين، ومن عبادك الصديقين، ومن عبادك الشهداء، ومن عبادك الصالحين.","اجتهاد","u"],
["جوامع الدعاء","اللهم تقبل منا هذا الدعاء، واغفر…","اللهم تقبل منا هذا الدعاء، واغفر لنا ما فيه من تقصير، واجعله خالصاً لوجهك الكريم، واجعله في ميزان حسناتنا، واجعله سبباً لفرجنا في الدنيا والآخرة. اللهم لا تدع لنا ذنباً إلا غفرته، ولا هماً إلا فرجته، ولا غماً إلا أزلته، ولا ديناً إلا قضيته، ولا داءً إلا شفيته، ولا عيباً إلا سترته، ولا عسيراً إلا يسرته، ولا حاجةً من حوائج الدنيا والآخرة إلا قضيتها برحمتك يا أرحم الراحمين.","اجتهاد","u"],
["جوامع الدعاء","اللهم اجعلنا من أهل القرآن، ومن…","اللهم اجعلنا من أهل القرآن، ومن أهل الذكر، ومن أهل الشكر، ومن أهل الصبر، ومن أهل الرضا، ومن أهل التسليم، ومن أهل اليقين، ومن أهل الإخلاص، ومن أهل الصدق، ومن أهل الأمانة، ومن أهل الوفاء، ومن أهل التقوى، ومن أهل الهدى، ومن أهل النور، ومن أهل الجنة.","اجتهاد","u"],
["جوامع الدعاء","اللهم ارحمنا برحمتك، واغفر لنا بفضلك،…","اللهم ارحمنا برحمتك، واغفر لنا بفضلك، واعفُ عنا بعفوك، وارزقنا من خيرك، واصرف عنا شرك، واجعل لنا من كل همّ فرجاً، ومن كل ضيق مخرجاً، ومن كل بلاء عافية، ومن كل سقم شفاءً، ومن كل ذنب مغفرةً، ومن كل عيب ستراً، ومن كل عسير يسراً، ومن كل فقر غنىً، ومن كل ذل عزاً، ومن كل خوف أمناً، ومن كل وحدة أنساً، ومن كل حزن فرحاً، ومن كل ضلال هدايةً، ومن كل ظلمة نوراً، ومن كل نار جنةً.","اجتهاد","u"],
["جوامع الدعاء","نسأل الله أن يتقبل منا ومنكم،…","نسأل الله أن يتقبل منا ومنكم، وأن يجعله خالصاً لوجهه الكريم، وأن ينفع به من قرأه ودعا به، وأن يفرج به هم كل مهموم، ويكشف به غم كل مغموم، ويشفي به كل مريض، ويرحم به كل ميت، وينصر به كل مظلوم، ويغني به كل فقير، ويهدي به كل ضال، ويجبر به كل مكسور. إنه ولي ذلك والقادر عليه، وهو حسبنا ونعم الوكيل، نعم المولى ونعم النصير.","اجتهاد","u"],
["فك الكرب والهم","اللهم إنا نسألك بأنك أنت الله…","اللهم إنا نسألك بأنك أنت الله الذي لا إله إلا أنت، ونسألك باسمك الأعظم الذي إذا دُعيت به أجبت، وإذا سُئلت به أعطيت، وإذا استُرحمت به رحمت، وإذا استُنصرت به نصرت.","اجتهاد","u"],
["قرآنية|فك الكرب والهم","لا كاشف للضر إلا الله","﴿وَإِن يَمْسَسْكَ اللَّهُ بِضُرٍّ فَلَا كَاشِفَ لَهُ إِلَّا هُوَ ۖ وَإِن يَمْسَسْكَ بِخَيْرٍ فَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ﴾","الأنعام ١٧","q"],
["فك الكرب والهم","دعاء الكرب","لا إله إلا الله العظيم الحليم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم. لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير. لا إله إلا أنت سبحانك إني كنت من الظالمين. الله الله ربي لا أشرك به شيئاً.","اجتهاد","u"],
["فك الكرب والهم","دعاء الفرج والكرب","اللهم رحمتك أرجو فلا تكلني إلى نفسي طرفة عين، وأصلح لي شأني كله، لا إله إلا أنت. اللهم إني أعوذ بك من الهم والحزن، والعجز والكسل، والبخل والجبن، وضلع الدين وغلبة الرجال. اللهم إني أعوذ بك من جهد البلاء، ودرك الشقاء، وسوء القضاء، وشماتة الأعداء.","اجتهاد","u"],
["مغفرة واستغفار","دعاء المغفرة","اللهم اغفر لي ذنبي كله، دقه وجله، وأوله وآخره، وعلانيته وسره. اللهم اغفر لي ما قدمت وما أخرت، وما أسررت وما أعلنت، وما أسرفت وما أنت أعلم به مني. أنت المقدم وأنت المؤخر، وأنت على كل شيء قدير.","اجتهاد","u"],
["شفاء وعافية","دعاء العافية","اللهم إني أسألك العفو والعافية في الدنيا والآخرة، اللهم إني أسألك العفو والعافية في ديني ودنياي وأهلي ومالي، اللهم استر عوراتي، وآمن روعاتي، واحفظني من بين يدي ومن خلفي وعن يميني وعن شمالي ومن فوقي، وأعوذ بعظمتك أن أغتال من تحتي.","اجتهاد","u"],
["رزق وبركة","دعاء الرزق","اللهم اكفني بحلالك عن حرامك، وأغنني بفضلك عمن سواك. اللهم إني أسألك علماً نافعاً، ورزقاً طيباً، وعملاً متقبلاً. اللهم إني أسألك من فضلك ورحمتك، فإنه لا يملكها إلا أنت.","اجتهاد","u"],
["هداية وثبات","دعاء الثبات","يا مقلب القلوب ثبّت قلبي على دينك. يا مصرف القلوب والأبصار اصرف قلبي إلى طاعتك. اللهم إني أسألك الثبات في الأمر، والعزيمة على الرشد، وأسألك شكر نعمتك، وحسن عبادتك، وأسألك قلباً سليماً، ولساناً صادقاً، وأسألك من خير ما تعلم، وأعوذ بك من شر ما تعلم، وأستغفرك لما تعلم، إنك أنت علام الغيوب.","اجتهاد","u"],
["هداية وثبات","دعاء الهداية","اللهم إني أسألك الهدى والتقى والعفاف والغنى. اللهم اهدني فيمن هديت، وعافني فيمن عافيت، وتولني فيمن توليت، وبارك لي فيما أعطيت، وقني شر ما قضيت، إنك تقضي ولا يُقضى عليك، وإنه لا يذل من واليت، ولا يعز من عاديت، تباركت ربنا وتعاليت.","اجتهاد","u"],
["هداية وثبات","دعاء النور","اللهم اجعل لي في قلبي نوراً، وفي لساني نوراً، وفي سمعي نوراً، وفي بصري نوراً، وفي شعري نوراً، وفي بشري نوراً، وفي لحمي نوراً، وفي دمي نوراً، وفي عظمي نوراً، وفي عصبي نوراً، وفي أرواحنا نوراً، وفي قلوبنا نوراً، واجعل لي نوراً من بين يدي ومن خلفي وعن يميني وعن شمالي ومن فوقي ومن تحتي، واجعل لي نوراً في حياتي ونوراً في مماتي، ونوراً في قبري، ونوراً في حشري، ونوراً في نشري، ونوراً في محشري، ونوراً في موقفي، ونوراً في مسيري، ونوراً في كتابي، ونوراً في حسابي، ونوراً في ميزاني، ونوراً في صراطي، ونوراً في جنتي، ونوراً في كل شيء.","اجتهاد","u"],
["شفاء وعافية","دعاء الشفاء","اللهم رب الناس، أذهب البأس، اشفِ أنت الشافي، لا شافي إلا أنت، شفاءً لا يغادر سقماً. اللهم اشفِ مرضانا، وعافِ مبتلانا، وارحم موتانا، واجبر مكسورنا، وارحم ضعيفنا، وارفع منخفضنا، وأغنِ فقيرنا، وأعزّ ذليلنا. اللهم إني أسألك الشفاء من كل داء، والعافية من كل سقم، والكفاية من كل بلاء، والنجاة من كل شر.","اجتهاد","u"],
["جوامع الدعاء","دعاء القبول","اللهم تقبل منا صلاتنا، وصيامنا، وقيامنا، وركوعنا، وسجودنا، وقراءتنا، وذكرنا، ودعاءنا، وتضرعنا، وابتهالنا، وخشوعنا، وخضوعنا، واجعلها خالصة لوجهك الكريم، واجعله في ميزان حسناتنا. اللهم تقبل توبتنا، واغفر ذنوبنا، وارحم ضعفنا، واجبر كسرنا، واهدنا إلى سواء السبيل.","اجتهاد","u"],
["جوامع الدعاء","دعاء الخير كله","اللهم إني أسألك من الخير كله، عاجله وآجله، ما علمت منه وما لم أعلم، وأعوذ بك من الشر كله، عاجله وآجله، ما علمت منه وما لم أعلم. اللهم إني أسألك من خير ما سألك منه عبدك ونبيك محمد صلى الله عليه وسلم، وأعوذ بك من شر ما استعاذك منه عبدك ونبيك محمد صلى الله عليه وسلم.","اجتهاد","u"],
["الآخرة وحسن الخاتمة","دعاء الجنة","اللهم إني أسألك الجنة وما قرب إليها من قول أو عمل، وأعوذ بك من النار وما قرب إليها من قول أو عمل. اللهم إني أسألك موجبات رحمتك، وعزائم مغفرتك، والسلامة من كل إثم، والغنيمة من كل بر، والفوز بالجنة، والنجاة من النار.","اجتهاد","u"],
["الآخرة وحسن الخاتمة","دعاء القبر","اللهم آنس وحشتي في قبري، وأزل ظلمتي في قبري، واجعل قبري روضةً من رياض الجنة، ولا تجعله حفرةً من حفر النار. اللهم اجعل قبري نوراً، واجعل قبري راحةً، واجعل قبري فرحاً، واجعل قبري بستاناً، واجعل قبري مستقراً، واجعل قبري مأوىً، واجعل قبري مرقداً، واجعل قبري مهداً، واجعل قبري مضجعاً، واجعل قبري كنزاً، واجعل قبري روضةً، واجعل قبري جنّة.","اجتهاد","u"],
["الآخرة وحسن الخاتمة|الصلاة والطهارة","دعاء القيامة","اللهم هون علينا سكرات الموت، وخفف عنا أهوال القيامة، وثبتنا على الصراط، واجعل حسابنا يسيراً، وميزاننا راجحاً، وكتابنا باليمين، واجعلنا من الذين لا خوف عليهم ولا هم يحزنون. اللهم اجعلنا من الذين يُدْعَون إلى الجنة زمراً، ومن الذين يُقال لهم: ادخلوها بسلام آمنين.","اجتهاد","u"],
["الآخرة وحسن الخاتمة","دعاء الشفاعة","اللهم اجعلنا من أهل شفاعة نبيك محمد صلى الله عليه وسلم، واسقنا من حوضه شربةً لا نظمأ بعدها أبداً، وأدخلنا في زمرته، واحشرنا تحت لوائه، واجعلنا من الذين يُشفَّعون ويُشفَّع فيهم. اللهم اجعلنا من أهل شفاعته، ومن أهل حوضه، ومن أهل زمرته، ومن أهل لوائه، ومن أهل شفاعته.","اجتهاد","u"],
["هداية وثبات","دعاء الرضا","اللهم إني أسألك الرضا بعد القضاء، وبرد العيش بعد الموت، ولذة النظر إلى وجهك، والشوق إلى لقائك، وأعوذ بك من ضراء مضرة، ومن فتنة مضلة. اللهم اجعلنا راضين بقضائك، صابرين على بلائك، شاكرين لنعمائك، ذاكرين لآلائك، مطيعين لأوامرك، مجتنبين لنواهيك.","اجتهاد","u"],
["هداية وثبات","دعاء اليقين","اللهم ارزقنا يقيناً كيقين إبراهيم، وصبراً كصبر أيوب، وشكراً كشكر داود، وطاعةً كطاعة محمد صلى الله عليه وسلم، وحباً كحب أبي بكر، وصدقاً كصدق عمر، وحياءً كحياء عثمان، وشجاعةً كشجاعة علي، وزهداً كزهد الحسن، وورعاً كتورع ابن سيرين، وإخلاصاً كإخلاص سفيان، وعلماً كعلم الشافعي، وحكمةً كحكمة لقمان، وصبراً كصبر يعقوب، وتوبةً كتوبة آدم، ودعاءً كدعاء يونس، وتضرعاً كتضرع زكريا، ويقيناً كيقين موسى، وإخلاصاً كإخلاص عيسى، وحباً كحب محمد صلى الله عليه وسلم.","اجتهاد","u"],
["فك الكرب والهم","اللهم إني أسألك أن تجعلني من…","اللهم إني أسألك أن تجعلني من عبادك الشاكرين، ومن عبادك الصابرين، ومن عبادك الراضين، ومن عبادك المتقين، ومن عبادك المخبتين، ومن عبادك المنيبين، ومن عبادك المطمئنين.","اجتهاد","u"],
["فك الكرب والهم|هداية وثبات","اللهم إني أسألك الصبر على البلاء،…","اللهم إني أسألك الصبر على البلاء، والشكر على النعماء، والرضا بالقضاء، والتسليم لأمرك، والتوكل عليك، والإنابة إليك، والمحبة لك، والشوق إلى لقائك.","اجتهاد","u"],
["فك الكرب والهم|رزق وبركة","اللهم إني أسألك الأمن يوم الخوف،…","اللهم إني أسألك الأمن يوم الخوف، والغنى يوم الفقر، والعز يوم الذل، والنور يوم الظلمة، والهدى يوم الضلالة، واليقين يوم الشك، والرضا يوم السخط، والصبر يوم الجزع، والشكر يوم النعمة، والتوكل يوم الشدة.","اجتهاد","u"],
["فك الكرب والهم","اللهم إني أسألك أن تجعلني من…","اللهم إني أسألك أن تجعلني من عبادك الصالحين، ومن أوليائك المتقين، ومن جندك الغالبين، ومن حزبك المفلحين، ومن عبادك المخلصين، ومن عبادك المخبتين، ومن عبادك المنيبين.","اجتهاد","u"],
["فك الكرب والهم","اللهم إني أسألك أن تجعلني من…","اللهم إني أسألك أن تجعلني من عبادك الصالحين، ومن أوليائك المتقين، ومن جندك الغالبين، ومن حزبك المفلحين، ومن عبادك المخلصين، ومن عبادك الشاكرين، ومن عبادك الذاكرين، ومن عبادك المخبتين، ومن عبادك المنيبين، ومن عبادك المطمئنين، ومن عبادك الراضين، ومن عبادك المرضيين، ومن عبادك المحبين، ومن عبادك المشتاقين، ومن عبادك العارفين، ومن عبادك المقربين، ومن عبادك الصديقين.","اجتهاد","u"],
["الصلاة والطهارة","دعاء الاستفتاح","سبحانك اللهم وبحمدك، وتبارك اسمك، وتعالى جدك، ولا إله غيرك. وجهت وجهي للذي فطر السماوات والأرض حنيفاً مسلماً وما أنا من المشركين، إن صلاتي ونسكي ومحياي ومماتي لله رب العالمين، لا شريك له وبذلك أُمرت وأنا من المسلمين. اللهم أنت الملك لا إله إلا أنت، أنت ربي وأنا عبدك، ظلمت نفسي واعترفت بذنبي، فاغفر لي ذنوبي جميعاً، إنه لا يغفر الذنوب إلا أنت، واهدني لأحسن الأخلاق، لا يهدي لأحسنها إلا أنت، واصرف عني سيئها، لا يصرف عني سيئها إلا أنت.","اجتهاد","u"],
["الصلاة والطهارة","دعاء الركوع","سبحانك اللهم ربنا وبحمدك، اللهم اغفر لي. سبوح قدوس رب الملائكة والروح. اللهم لك ركعت، وبك آمنت، ولك أسلمت، خشع لك سمعي وبصري ومخي وعظمي وعصبي.","اجتهاد","u"],
["الصلاة والطهارة","دعاء السجود","سبحانك اللهم ربنا وبحمدك، اللهم اغفر لي. سبوح قدوس رب الملائكة والروح. اللهم لك سجدت، وبك آمنت، ولك أسلمت، سجد وجهي للذي خلقه وصوره وشق سمعه وبصره، تبارك الله أحسن الخالقين.","اجتهاد","u"],
["الصلاة والطهارة","دعاء التشهد","التحيات لله والصلوات والطيبات، السلام عليك أيها النبي ورحمة الله وبركاته، السلام علينا وعلى عباد الله الصالحين، أشهد أن لا إله إلا الله، وأشهد أن محمداً عبده ورسوله. اللهم صل على محمد وعلى آل محمد، كما صليت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد. اللهم بارك على محمد وعلى آل محمد، كما باركت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد.","اجتهاد","u"],
["الصلاة والطهارة","دعاء بعد التشهد","اللهم إني أعوذ بك من عذاب القبر، ومن عذاب جهنم، ومن فتنة المحيا والممات، ومن شر فتنة المسيح الدجال. اللهم إني ظلمت نفسي ظلماً كثيراً، ولا يغفر الذنوب إلا أنت، فاغفر لي مغفرةً من عندك، وارحمني إنك أنت الغفور الرحيم.","اجتهاد","u"],
["الصلاة والطهارة","دعاء الوتر","اللهم إني أسألك الهدى والتقى والعفاف والغنى. اللهم إني أسألك الجنة وأعوذ بك من النار. اللهم إني أسألك من الخير كله، عاجله وآجله، ما علمت منه وما لم أعلم، وأعوذ بك من الشر كله، عاجله وآجله، ما علمت منه وما لم أعلم.","اجتهاد","u"],
["السفر والطقس","دعاء السفر","اللهم إنا نسألك في سفرنا هذا البر والتقوى، ومن العمل ما ترضى، اللهم هون علينا سفرنا هذا واطو عنا بعده، اللهم أنت الصاحب في السفر، والخليفة في الأهل، اللهم إني أعوذ بك من وعثاء السفر، وكآبة المنظر، وسوء المنقلب في المال والأهل.","اجتهاد","u"],
["البيت والطعام","دعاء الطعام","اللهم بارك لنا فيه وأطعمنا خيراً منه. بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم. الحمد لله الذي أطعمنا وسقانا وجعلنا من المسلمين.","اجتهاد","u"],
["يومي","دعاء الاستيقاظ","الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور. الحمد لله الذي رد علي روحي وعافاني في جسدي وأذن لي بذكره.","اجتهاد","u"],
["الصلاة والطهارة|يومي","دعاء دخول المسجد","اللهم افتح لي أبواب رحمتك. اللهم إني أسألك من فضلك. اللهم صل على محمد وعلى آل محمد، وافتح لي أبواب رحمتك.","اجتهاد","u"],
["الصلاة والطهارة|يومي","دعاء الخروج من المسجد","اللهم إني أسألك من فضلك. اللهم اعصمني من الشيطان الرجيم. اللهم صل على محمد وعلى آل محمد، وافتح لي أبواب فضلك.","اجتهاد","u"],
["البيت والطعام|يومي","دعاء دخول المنزل","اللهم إني أسألك خير المولج وخير المخرج، باسم الله ولجنا، وباسم الله خرجنا، وعلى الله ربنا توكلنا. اللهم إني أسألك خير هذا المنزل وخير ما فيه، وأعوذ بك من شره وشر ما فيه.","اجتهاد","u"],
["البيت والطعام|يومي","دعاء الخروج من المنزل","بسم الله، توكلت على الله، ولا حول ولا قوة إلا بالله. اللهم إني أعوذ بك أن أضل أو أُضل، أو أزل أو أُزل، أو أظلم أو أُظلم، أو أجهل أو يُجهل علي.","اجتهاد","u"],
["البيت والطعام","دعاء لبس الثوب الجديد","اللهم لك الحمد أنت كسوتني هذا الثوب، أسألك من خيره وخير ما صُنع له، وأعوذ بك من شره وشر ما صُنع له.","اجتهاد","u"],
["مغفرة واستغفار","دعاء الاستغفار","أستغفر الله العظيم الذي لا إله إلا هو الحي القيوم وأتوب إليه. أستغفر الله العظيم لي ولوالديّ وللمؤمنين والمؤمنات والمسلمين والمسلمات الأحياء منهم والأموات. ربنا اغفر لنا ولوالدينا وللمؤمنين يوم يقوم الحساب. ربنا اغفر لنا ذنوبنا وإسرافنا في أمرنا وثبت أقدامنا وانصرنا على القوم الكافرين.","اجتهاد","u"],
["مغفرة واستغفار","دعاء التوبة","اللهم إني أتوب إليك من كل ذنب أذنبته، ومن كل خطيئة أخطأتها، ومن كل معصية عصيتك فيها، ومن كل تقصير قصرت فيه، ومن كل تفريط فرطت فيه، ومن كل ما يبعدني عنك، ومن كل ما يغضبك عليّ، ومن كل ما يخالف أمرك، ومن كل ما ينهى عنه نهيك، ومن كل ما يخالف شرعك، ومن كل ما يخالف دينك، ومن كل ما يخالف كتابك، ومن كل ما يخالف سنة نبيك محمد صلى الله عليه وسلم.","اجتهاد","u"],
["مواسم وأوقات","دعاء يوم عرفة","لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير. اللهم لك الحمد كالذي نقول وخيراً مما نقول، اللهم لك صلاتنا ونسكنا ومحبانا ومماتنا، ولك تراثنا وعاقبة أمرنا. اللهم إني أعوذ بك من عذاب القبر، ومن وسوسة الصدر، ومن شتات الأمر، ومن شر فتنة المسيح الدجال. اللهم إني أسألك من خير ما سألك منه عبدك ونبيك محمد صلى الله عليه وسلم، وأعوذ بك من شر ما استعاذك منه عبدك ونبيك محمد صلى الله عليه وسلم.","اجتهاد","u"],
["مواسم وأوقات","دعاء ليلة القدر","اللهم إنك عفو تحب العفو فاعف عني. اللهم إنك عفو كريم تحب العفو فاعف عنا. اللهم إنك عفو تحب العفو فاعف عنا ووالدينا وأهلنا وأحبابنا وجميع المسلمين.","اجتهاد","u"],
["مواسم وأوقات","دعاء يوم الجمعة","اللهم صل على محمد وعلى آل محمد، كما صليت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد. اللهم بارك على محمد وعلى آل محمد، كما باركت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد. اللهم إني أسألك من فضلك ورحمتك، فإنه لا يملكها إلا أنت. اللهم إني أسألك من الخير كله عاجله وآجله، ما علمت منه وما لم أعلم، وأعوذ بك من الشر كله عاجله وآجله، ما علمت منه وما لم أعلم.","اجتهاد","u"],
["مواسم وأوقات","دعاء ليلة النصف من شعبان","اللهم يا ذا المنّ ولا يُمنّ عليه، يا ذا الجلال والإكرام، يا ذا الطول والإنعام، لا إله إلا أنت، ظهر اللاجئين، وجار المستجيرين، وأمان الخائفين. اللهم إن كنت كتبتني عندك في أم الكتاب شقياً أو محروماً أو مطروداً أو مقتراً عليّ في الرزق، فامحُ اللهم بقدرتك شقاوتي وحرماني وطردي وإقتاري، وأثبتني عندك في أم الكتاب سعيداً مرزوقاً موفقاً للخيرات، فإنك قلت وقولك الحق: ﴿يَمْحُو اللَّهُ مَا يَشَاءُ وَيُثْبِتُ ۖ وَعِندَهُ أُمُّ الْكِتَابِ﴾","لا أصل له في السنة","u"],
["مواسم وأوقات","دعاء أول رجب","اللهم بارك لنا في رجب وشعبان، وبلغنا رمضان، وأعنا على الصيام والقيام، ووفقنا لصالح الأعمال، وتقبل منا، واغفر لنا، وارحمنا، واهدنا، وعافنا، واعفُ عنا.","أصله حديث ضعيف","u"],
["مواسم وأوقات","دعاء أول رمضان","اللهم أهله علينا بالأمن والإيمان، والسلامة والإسلام، والعافية المجللة، والرزق الواسع، ودفع الأسقام، والعون على الصلاة والصيام، وتلاوة القرآن. اللهم سلمنا لرمضان، وسلم رمضان لنا، وتسلمه منا متقبلاً، حتى ينقضي وقد غفرت لنا ووالدينا وجميع المسلمين.","اجتهاد","u"],
["مواسم وأوقات","دعاء ليلة العيد","اللهم إنك قلت وقولك الحق: ﴿ادْعُونِي أَسْتَجِبْ لَكُمْ﴾، وقد دعوناك فاستجب لنا كما وعدتنا، فإنك لا تخلف الميعاد. اللهم تقبل منا صيامنا وقيامنا، واغفر لنا ذنوبنا، وارحمنا برحمتك، وأدخلنا الجنة، ونجنا من النار.","اجتهاد","u"],
["مواسم وأوقات","دعاء يوم العيد","اللهم تقبل منا صلاتنا، وصيامنا، وقيامنا، وركوعنا، وسجودنا، وقراءتنا، وذكرنا، ودعاءنا، وتضرعنا، وابتهالنا، وخشوعنا، وخضوعنا، واجعلها خالصة لوجهك الكريم، واجعلها في ميزان حسناتنا. اللهم اجعلنا من عبادك الصالحين، ومن أوليائك المتقين، ومن جندك الغالبين، ومن حزبك المفلحين.","اجتهاد","u"],
["فك الكرب والهم","دعاء الخوف","اللهم إني أعوذ بك من شر ما أُخاف وأحذر، وأعوذ بك من شر كل شيء أنت آخذ بناصيته، اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين واغننا من الفقر.","اجتهاد","u"],
["الظلم والأعداء","دعاء الظلم","اللهم عليك بمن ظلمني، فإنك أنت المنتقم، اللهم انتقم لي ممن ظلمني، فإنك أنت العادل، اللهم خُذ حقّي ممن ظلمني، فإنك أنت القوي العزيز. اللهم أرني فيهم عجائب قدرتك، وأرني فيهم بأسك الذي لا يُردّ عن القوم المجرمين. اللهم اجعل تدبيرهم تدميراً عليهم، واجعل مكرهم في نحورهم، واجعل كيدهم في صدورهم.","اجتهاد","u"],
["الظلم والأعداء","دعاء الحسد","اللهم إني أعوذ بك من شر الحاسدين، ومن شر الناظرين، ومن شر الساحرين، ومن شر الكائدين، ومن شر الماكرين، ومن شر المفسدين، ومن شر الظالمين، ومن شر المعتدين، ومن شر المنافقين، ومن شر المشركين، ومن شر الكافرين، ومن شر الشياطين، ومن شر أنفسنا، ومن شر كل ذي شر، ومن شر كل شيء أنت آخذ بناصيته.","اجتهاد","u"],
["الظلم والأعداء","دعاء السحر","اللهم إني أعوذ بك من شر السحر والسحرة، ومن شر الكهانة والكهنة، ومن شر العرافة والعرافين، ومن شر التنجيم والمنجمين، ومن شر الطيرة والطيارين، ومن شر الشرك والمشركين، ومن شر الكفر والكافرين، ومن شر النفاق والمنافقين، ومن شر الفسوق والفاسقين، ومن شر العصيان والعاصين، ومن شر الظلم والظالمين، ومن شر العدوان والمعتدين، ومن شر البغي والباغين، ومن شر الحسد والحاسدين، ومن شر الغيبة والمغتابين، ومن شر النميمة والنمامين، ومن شر الكذب والكاذبين، ومن شر الغدر والغادرين، ومن شر الخيانة والخائنين، ومن شر المكر والماكرين، ومن شر الكيد والكائدين، ومن شر الحقد والحاقدين، ومن شر الشماتة والشماتين، ومن شر كل ذي شر، ومن شر كل شيء أنت آخذ بناصيته.","اجتهاد","u"],
["الظلم والأعداء","دعاء العين","اللهم إني أعوذ بك من شر العين، ومن شر الحاسد إذا حسد، ومن شر الناظر إذا نظر، ومن شر الناظرين، ومن شر الحاسدين، ومن شر المعجبين، ومن شر المعجبات، ومن شر كل ذي عين، ومن شر كل ذي نفس، ومن شر كل ذي حسد، ومن شر كل ذي نظر. اللهم اكفنيهم بما شئت، وأنزل عليهم بأسك الذي لا يُردّ عن القوم المجرمين.","اجتهاد","u"],
["شفاء وعافية","دعاء الشفاء","اللهم اشفِ مرضانا، وعافِ مبتلانا، وارحم موتانا، واجبر مكسورنا، وارحم ضعيفنا، وارفع منخفضنا، وأغنِ فقيرنا، وأعزّ ذليلنا. اللهم اشفِ من كل داء، وعافِ من كل سقم، واكفِ من كل بلاء، ونجِ من كل شر. اللهم يا شافي، يا كافي، يا معافي، اشفنا شفاءً لا يُغادر سقماً، وعافنا عافيةً لا يُغادرها ألم، واكفنا كفايةً لا يُغادرها فقر.","اجتهاد","u"],
["شفاء وعافية","دعاء المريض","اللهم إني أسألك الشفاء من كل داء، والعافية من كل سقم، والكفاية من كل بلاء، والنجاة من كل شر. اللهم إني أسألك الصحة والعافية، والقوة والنشاط، والطول والعرض، والغنى والسعة، والرزق والبركة. اللهم إني أسألك أن تُعافيني في أبداني، وأن تُعافيني في أسماعي، وأن تُعافيني في أبصاري، وأن تُعافيني في أرواحي، وأن تُعافيني في قلبي.","اجتهاد","u"],
["الصلاة والطهارة","دعاء الوضوء","بسم الله. اللهم إني أسألك أن تجعلني من التوابين، ومن المتطهرين، ومن عبادك الصالحين. أشهد أن لا إله إلا الله وحده لا شريك له، وأشهد أن محمداً عبده ورسوله. اللهم اجعلني من التوابين، واجعلني من المتطهرين، واجعلني من عبادك الصالحين.","اجتهاد","u"],
["الصلاة والطهارة","دعاء الأذان","اللهم رب هذه الدعوة التامة، والصلاة القائمة، آت محمداً الوسيلة والفضيلة، والدرجة الرفيعة، وابعثه مقاماً محموداً الذي وعدته، إنك لا تخلف الميعاد. اللهم رب هذه الدعوة التامة، والصلاة القائمة، آت محمداً الوسيلة والفضيلة، وابعثه مقاماً محموداً الذي وعدته، إنك لا تخلف الميعاد.","اجتهاد","u"],
["الصلاة والطهارة","دعاء الصلاة","اللهم تقبل مني صلاتي، واجعلها خالصةً لوجهك الكريم، واجعلها في ميزان حسناتي، واجعلها سبباً لفرجي، وسبباً لشفائي، وسبباً لغناي، وسبباً لعزي، وسبباً لسعادتي، وسبباً لنجاتي، وسبباً لدخولي الجنة، وسبباً لبعدي عن النار. اللهم اجعل صلاتي نوراً في قلبي، ونوراً في قبري، ونوراً في حشري، ونوراً في نشري، ونوراً في محشري، ونوراً في موقفي، ونوراً في مسيري، ونوراً في كتابي، ونوراً في حسابي، ونوراً في ميزاني، ونوراً في صراطي، ونوراً في جنتي، ونوراً في كل شيء.","اجتهاد","u"],
["الصلاة والطهارة","دعاء القرآن","اللهم اجعل القرآن ربيع قلبي، ونور صدري، وجلاء حزني، وذهاب همي. اللهم اجعل القرآن العظيم ربيع قلبي، ونور صدري، وجلاء حزني، وذهاب همي. اللهم اجعل القرآن نوراً في قلبي، ونوراً في قبري، ونوراً في حشري، ونوراً في نشري، ونوراً في محشري، ونوراً في موقفي، ونوراً في مسيري، ونوراً في كتابي، ونوراً في حسابي، ونوراً في ميزاني، ونوراً في صراطي، ونوراً في جنتي، ونوراً في كل شيء.","اجتهاد","u"],
["الصلاة والطهارة","دعاء الذكر","اللهم اجعل لساني رطباً بذكرك، وقلبي منعماً بشكرك، وبدني هيناً ليناً بطاعتك. اللهم اجعلني من الذاكرين لك، الشاكرين لك، الراضين بقضائك، الصابرين على بلائك، المطيعين لأوامرك، المجتنبين لنواهيك.","اجتهاد","u"],
["هداية وثبات","دعاء حسن الخلق","اللهم اهدني لأحسن الأخلاق، لا يهدي لأحسنها إلا أنت، واصرف عني سيئها، لا يصرف عني سيئها إلا أنت. اللهم اجعلني من عبادك الصالحين، ومن أوليائك المتقين، ومن جندك الغالبين، ومن حزبك المفلحين، ومن عبادك المخلصين، ومن عبادك الشاكرين، ومن عبادك الذاكرين، ومن عبادك المخبتين، ومن عبادك المنيبين، ومن عبادك المطمئنين، ومن عبادك الراضين، ومن عبادك المرضيين.","اجتهاد","u"],
["هداية وثبات","دعاء الصدق","اللهم اجعلني من الصادقين، ومن الصديقين، ومن الشهداء، ومن الصالحين، ومن المقربين، ومن المخلصين، ومن المخبتين، ومن المنيبين، ومن المطمئنين، ومن الراضين، ومن المرضيين. اللهم اجعل لساني صادقاً، وقلبي سليماً، وعملي خالصاً، ونيّتي حسنة، وسريرتي طاهرة، وعلانيتي صالحة.","اجتهاد","u"],
["هداية وثبات","دعاء الأمانة","اللهم اجعلني من الأمناء، ومن الأوفياء، ومن الصادقين، ومن الصديقين، ومن الشهداء، ومن الصالحين، ومن المقربين، ومن المخلصين، ومن المخبتين، ومن المنيبين، ومن المطمئنين، ومن الراضين، ومن المرضيين. اللهم اجعلني أؤدي الأمانات إلى أهلها، وأحكم بالعدل، وأقوم بالقسط، وأعطي كل ذي حق حقه.","اجتهاد","u"],
["هداية وثبات","دعاء العدل","اللهم اجعلني من العادلين، ومن القاسطين، ومن المقسطين، ومن الحاكمين بالحق، ومن القائمين بالعدل، ومن الآمرين بالمعروف، ومن الناهين عن المنكر، ومن الداعين إلى سبيلك بالحكمة والموعظة الحسنة، ومن المجادلين بالتي هي أحسن.","اجتهاد","u"],
["هداية وثبات","دعاء الرحمة","اللهم اجعلني من الراحمين، ومن المرحومين، ومن العاطفين، ومن المعطوف عليهم، ومن الرؤوفين، ومن المرؤوف بهم، ومن الحلماء، ومن الحكماء، ومن العقلاء، ومن العلماء، ومن العاملين، ومن المخلصين، ومن المخبتين، ومن المنيبين، ومن المطمئنين، ومن الراضين، ومن المرضيين.","اجتهاد","u"],
["هداية وثبات","دعاء الصبر","اللهم اجعلني من الصابرين، ومن الصادقين، ومن الشاكرين، ومن الذاكرين، ومن الراضين، ومن المتقين، ومن المخبتين، ومن المنيبين، ومن المطمئنين، ومن الراضين، ومن المرضيين، ومن المحبين، ومن المشتاقين، ومن العارفين، ومن المقربين، ومن الصديقين، ومن الشهداء، ومن الصالحين.","اجتهاد","u"],
["هداية وثبات","دعاء الرضا","اللهم اجعلني من الراضين بقضائك، الصابرين على بلائك، الشاكرين لنعمائك، الذاكرين لآلائك، المطيعين لأوامرك، المجتنبين لنواهيك، المستقيمين على دينك، الثابتين على طاعتك، القائمين بحقك، المؤدين لأمانتك، الحافظين لعهدك، الوافين بمواثيقك، المخلصين في عبادتك، الصادقين في معاملاتك، المخبتين في خشيتك، المنيبين في توبتك، المطمئنين في ذكرك، الراضين في قضائك، المرضيين في طاعتك.","اجتهاد","u"],
["هداية وثبات","دعاء السعادة","اللهم اجعلني من السعداء، ومن الأبرار، ومن الأخيار، ومن المقربين، ومن الصديقين، ومن الشهداء، ومن الصالحين، ومن المخلصين، ومن المخبتين، ومن المنيبين، ومن المطمئنين، ومن الراضين، ومن المرضيين، ومن المحبين، ومن المشتاقين، ومن العارفين، ومن المقربين، ومن الصديقين، ومن الشهداء، ومن الصالحين. اللهم اجعلني سعيداً في الدنيا والآخرة، سعيداً في السر والعلن، سعيداً في الليل والنهار، سعيداً في الصحة والمرض، سعيداً في الغنى والفقر، سعيداً في الحياة والممات، سعيداً في القبر والقيامة، سعيداً في الحشر والنشر، سعيداً في الحساب والميزان، سعيداً في الصراط والجنة.","اجتهاد","u"],
["هداية وثبات","دعاء الطمأنينة","اللهم اجعلني من المطمئنين، ومن الراضين، ومن المرضيين، ومن المخبتين، ومن المنيبين، ومن المحبين، ومن المشتاقين، ومن العارفين، ومن المقربين، ومن الصديقين، ومن الشهداء، ومن الصالحين. اللهم أنزل عليّ سكينةً من لدنك، وأيدني بروح منك، واجعل قلبي مطمئناً بذكرك، وروحي متعلقةً بطاعتك، ونفسي راضيةً بقضائك، وبدني هيناً ليناً بطاعتك.","اجتهاد","u"],
["هداية وثبات","دعاء الأنس","اللهم آنس وحدتي، وارحم غربتي، واجبر كسرتي، وارفع ذلتي، وأعز عزي، وأغن فقري، وأصح مرضى، وأسعد حزني، وأفرج همي، وأزل غمي، واكشف ضري، واشف سقمي، وعاف مبتلاي، وارحم ضعفي، وقوّ ضعفي، وأيد ضعفي، وانصر ضعفي، وأعز ضعفي، وأغن ضعفي، وأسعد ضعفي، وأفرج ضعفي، وأزل ضعفي، واكشف ضعفي، واشف ضعفي، وعاف ضعفي، وارحم ضعفي، وقوّ ضعفي، وأيد ضعفي، وانصر ضعفي.","اجتهاد","u"],
["هداية وثبات","دعاء الفرح","اللهم أبدل حزني فرحاً، وهمي فرجاً، وعسري يسراً، وضيقتي سعةً، وشدتي رخاءً، وذلي عزاً، وفقري غنىً، ومرضي شفاءً، وضعفي قوةً، وخوفي أمناً، ووحدتي أنساً، وظلمتي نوراً، وضلالتي هدايةً، ومعصيتي طاعةً، وغفلتي ذكراً، وقسوتي رحمةً، ويأسي رجاءً، وقنوطي طمعاً، وضعفي قوةً.","اجتهاد","u"],
["هداية وثبات","دعاء الرجاء","اللهم إني أرجوك، وأخافك، وأحبك، وأخشاك، وأتوكل عليك، وأنيب إليك، وأسلم لك، وأرضى بك، وأثق بك، وأعتصم بك، وألجأ إليك، وأستغيث بك، وأستجير بك، وأستنصرك، وأستعينك، وأستهديك، وأستشفيك، وأسترزقك، وأستغفرك، وأتوب إليك، وأؤمن بك، وأتقيك، وأطيعك، وأعبدك، وأوحّدك، وأسبّحك، وأحمدك، وأشكرك، وأذكرك، وأدعوك، وأسألك، وأتضرع إليك، وأبتهل إليك، وأخشع لك، وأخضع لك، وأذل لك، وأخبت لك، وأنيب إليك، وأسلم لك، وأرضى بك، وأثق بك، وأعتصم بك، وألجأ إليك، وأستغيث بك، وأستجير بك، وأستنصرك، وأستعينك، وأستهديك.","اجتهاد","u"],
["الظلم والأعداء","دعاء الفتن","اللهم إني أعوذ بك من مضلات الفتن، ما ظهر منها وما بطن، ومن شر فتنة المسيح الدجال، ومن شر فتنة المحيا والممات، ومن شر فتنة الغنى والفقر، ومن شر فتنة النساء، ومن شر فتنة الأولاد، ومن شر فتنة المال، ومن شر فتنة الجاه، ومن شر فتنة السلطان، ومن شر فتنة الشيطان، ومن شر فتنة النفس، ومن شر فتنة الهوى، ومن شر فتنة الشبهات، ومن شر فتنة الشهوات، ومن شر فتنة البدع، ومن شر فتنة الضلال، ومن شر فتنة الغفلة، ومن شر فتنة المعصية، ومن شر فتنة الكفر، ومن شر فتنة النفاق، ومن شر فتنة الشرك، ومن شر فتنة الرياء، ومن شر فتنة السمعة، ومن شر فتنة العجب، ومن شر فتنة الكبر، ومن شر فتنة الحسد، ومن شر فتنة الغيبة، ومن شر فتنة النميمة، ومن شر فتنة الكذب، ومن شر فتنة الغدر، ومن شر فتنة الخيانة، ومن شر فتنة المكر، ومن شر فتنة الكيد، ومن شر فتنة الحقد، ومن شر فتنة الشماتة، ومن شر فتنة الظلم، ومن شر فتنة العدوان، ومن شر فتنة البغي، ومن شر فتنة الفساد، ومن شر فتنة الإفساد، ومن شر فتنة كل ذي شر، ومن شر كل شيء أنت آخذ بناصيته.","اجتهاد","u"],
["فك الكرب والهم","دعاء الابتلاء","اللهم اجعلني من الصابرين على البلاء، الشاكرين على النعماء، الراضين بالقضاء، المتقين في السراء والضراء، المخبتين في الرخاء والشدة، المنيبين في الصحة والمرض، المطمئنين في الغنى والفقر، الراضين في الحياة والممات. اللهم اجعل لي في كل بلاء أجراً، وفي كل مصيبة عوضاً، وفي كل شدة فرجاً، وفي كل ضيق مخرجاً، وفي كل هم فرجاً، وفي كل غم شفاءً، وفي كل داء عافيةً، وفي كل فقر غنىً، وفي كل ذل عزاً، وفي كل خوف أمناً، وفي كل وحدة أنساً، وفي كل ظلمة نوراً، وفي كل ضلالة هدايةً.","اجتهاد","u"],
["فك الكرب والهم","دعاء المصيبة","إنا لله وإنا إليه راجعون، اللهم أجرني في مصيبتي، وأخلف لي خيراً منها. اللهم أجرني في مصيبتي، وأخلف لي خيراً منها. اللهم أجرني في مصيبتي، وأخلف لي خيراً منها. اللهم أعظم لي الأجر، وأحسن لي العزاء، وارحمني برحمتك، واجبرني بجبرك، وعوضني بعوضك، وأخلف عليّ بخير مما فات.","اجتهاد","u"],
["فك الكرب والهم","دعاء الشدة","اللهم إني أعوذ بك من جهد البلاء، ودرك الشقاء، وسوء القضاء، وشماتة الأعداء. اللهم إني أعوذ بك من زوال نعمتك، وتحول عافيتك، وفجاءة نقمتك، وجميع سخطك. اللهم إني أعوذ بك من شر ما أُخاف وأحذر، وأعوذ بك من شر كل شيء أنت آخذ بناصيته.","اجتهاد","u"],
["فك الكرب والهم","دعاء الكرب الشديد","لا إله إلا الله العظيم الحليم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم. يا حي يا قيوم، برحمتك أستغيث، أصلح لي شأني كله، ولا تكلني إلى نفسي طرفة عين. لا إله إلا أنت سبحانك إني كنت من الظالمين. حسبنا الله ونعم الوكيل. حسبي الله لا إله إلا هو عليه توكلت وهو رب العرش العظيم.","اجتهاد","u"],
["فك الكرب والهم","دعاء الأمن","اللهم إني أسألك الأمن في الدنيا والآخرة، اللهم إني أسألك الأمن في ديني ودنياي وأهلي ومالي، اللهم استر عوراتي، وآمن روعاتي، واحفظني من بين يدي ومن خلفي وعن يميني وعن شمالي ومن فوقي، وأعوذ بعظمتك أن أُغتال من تحتي. اللهم احفظني من كل سوء، واصرف عني كل شر، واكفني كل بلاء، ونجني من كل شدة، وعافني من كل سقم، واشفني من كل داء، وارحمني من كل ضعف، وقوني من كل مكروه، وأعذني من كل فتنة، ونجني من كل هلكة، واكفني كل شر.","اجتهاد","u"],
["فك الكرب والهم","دعاء السلامة","اللهم سلمني من كل سوء، وسلمني من كل شر، وسلمني من كل بلاء، وسلمني من كل شدة، وسلمني من كل مكروه، وسلمني من كل فتنة، وسلمني من كل هلكة، وسلمني من كل مصيبة، وسلمني من كل داء، وسلمني من كل سقم، وسلمني من كل ألم، وسلمني من كل مرض، وسلمني من كل عاهة، وسلمني من كل آفة، وسلمني من كل نقمة، وسلمني من كل عذاب، وسلمني من كل عقاب، وسلمني من كل غضب، وسلمني من كل سخط، وسلمني من كل مقت، وسلمني من كل لعنة، وسلمني من كل طرد، وسلمني من كل حرمان، وسلمني من كل خذلان، وسلمني من كل شقاء، وسلمني من كل بلاء، وسلمني من كل فتنة، وسلمني من كل محنة، وسلمني من كل مصيبة، وسلمني من كل كارثة، وسلمني من كل نكبة، وسلمني من كل رزية، وسلمني من كل هلكة، وسلمني من كل عطب، وسلمني من كل تلف، وسلمني من كل خسران، وسلمني من كل ندم، وسلمني من كل حسرة، وسلمني من كل غبن، وسلمني من كل ظلم، وسلمني من كل عدوان، وسلمني من كل بغي، وسلمني من كل فساد، وسلمني من كل إفساد، وسلمني من كل شر، ومن كل شيء أنت آخذ بناصيته.","اجتهاد","u"],
["فك الكرب والهم","دعاء الحفظ","اللهم احفظني من بين يدي ومن خلفي وعن يميني وعن شمالي ومن فوقي، وأعوذ بعظمتك أن أغتال من تحتي. اللهم احفظني من كل سوء، واصرف عني كل شر، واكفني كل بلاء، ونجني من كل شدة. اللهم احفظني في ديني، واحفظني في دنياي، واحفظني في أهلي، واحفظني في مالي، واحفظني في ولدي، واحفظني في صحتي، واحفظني في عقلي، واحفظني في قلبي، واحفظني في سمعي، واحفظني في بصري، واحفظني في لساني، واحفظني في يدي، واحفظني في قدمي، واحفظني في جسدي، واحفظني في روحي، واحفظني في كل شيء.","اجتهاد","u"],
["فك الكرب والهم","دعاء الكفاية","اللهم اكفني بحلالك عن حرامك، وأغنني بفضلك عمن سواك. اللهم اكفني كل شيء، واكفني كل سوء، واكفني كل شر، واكفني كل بلاء، واكفني كل شدة، واكفني كل مكروه، واكفني كل فتنة، واكفني كل هلكة، واكفني كل مصيبة، واكفني كل داء، واكفني كل سقم، واكفني كل ألم، واكفني كل مرض، واكفني كل عاهة، واكفني كل آفة، واكفني كل نقمة، واكفني كل عذاب، واكفني كل عقاب، واكفني كل غضب، واكفني كل سخط، واكفني كل مقت، واكفني كل لعنة، واكفني كل طرد، واكفني كل حرمان، واكفني كل خذلان، واكفني كل شقاء، واكفني كل بلاء، واكفني كل فتنة، واكفني كل محنة، واكفني كل مصيبة، واكفني كل كارثة، واكفني كل نكبة، واكفني كل رزية، واكفني كل هلكة، واكفني كل عطب، واكفني كل تلف، واكفني كل خسران، واكفني كل ندم، واكفني كل حسرة، واكفني كل غبن، واكفني كل ظلم، واكفني كل عدوان، واكفني كل بغي، واكفني كل فساد، واكفني كل إفساد، واكفني كل شر، ومن كل شيء أنت آخذ بناصيته.","اجتهاد","u"],
["هداية وثبات","دعاء الشكر","اللهم لك الحمد كما ينبغي لجلال وجهك وعظيم سلطانك، حمداً لا ينقطع ولا ينفد، عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته. اللهم لك الحمد على ما أعطيت، ولك الشكر على ما أنعمت، ولك الثناء على ما هديت، ولك الفضل على ما أوليت. اللهم اجعلني من الشاكرين لك، الذاكرين لك، الراضين بقضائك، الصابرين على بلائك، المطيعين لأوامرك، المجتنبين لنواهيك، المستقيمين على دينك، الثابتين على طاعتك، القائمين بحقك، المؤدين لأمانتك، الحافظين لعهدك، الوافين بمواثيقك، المخلصين في عبادتك، الصادقين في معاملاتك، المخبتين في خشيتك، المنيبين في توبتك، المطمئنين في ذكرك، الراضين في قضائك، المرضيين في طاعتك.","اجتهاد","u"],
["رزق وبركة","دعاء النعمة","اللهم أدم عليّ نعمتك، وزدني من فضلك، وبارك لي في ما أعطيتني، واجعلني من الشاكرين لنعمك، القائمين بحقك، الذاكرين لك، المخلصين في طاعتك. اللهم لا تزغ قلبي بعد إذ هديتني، وهب لي من لدنك رحمة، إنك أنت الوهاب. اللهم لا تحرمني من نعمتك، ولا تزغ قلبي بعد إذ هديتني، ولا تردني إلى أسفل سافلين، ولا تكلني إلى نفسي طرفة عين.","اجتهاد","u"],
["رزق وبركة","دعاء البركة","اللهم بارك لي في عمري، وبارك لي في أهلي، وبارك لي في مالي، وبارك لي في ولدي، وبارك لي في صحتي، وبارك لي في عقلي، وبارك لي في قلبي، وبارك لي في سمعي، وبارك لي في بصري، وبارك لي في لساني، وبارك لي في يدي، وبارك لي في قدمي، وبارك لي في جسدي، وبارك لي في روحي، وبارك لي في كل شيء. اللهم اجعلني مباركاً حيث كنت، مباركاً في حياتي، مباركاً في مماتي، مباركاً في قبري، مباركاً في حشري، مباركاً في نشري، مباركاً في محشري، مباركاً في موقفي، مباركاً في مسيري، مباركاً في كتابي، مباركاً في حسابي، مباركاً في ميزاني، مباركاً في صراطي، مباركاً في جنتي، مباركاً في كل شيء.","اجتهاد","u"],
["رزق وبركة","دعاء الغنى","اللهم أغنني بحلالك عن حرامك، وبفضلك عمن سواك، وبطاعتك عن معصيتك. اللهم أغنني من فضلك، وارزقني من خيرك، واكفني بحلالك، وأغنني بفضلك، وبارك لي في ما رزقتني، واجعلني من الشاكرين. اللهم أغنني غنىً لا يطغيني، وارزقني رزقاً لا يُلهيني، وبارك لي في ما أعطيتني، واجعلني من عبادك الصالحين.","اجتهاد","u"],
["رزق وبركة","دعاء السعة","اللهم وسّع عليّ في رزقي، وبارك لي في مالي، واجعلني من الموسرين، ومن المنفقين، ومن المتصدقين، ومن المحسنين، ومن المكرمين، ومن المعطين، ومن الباذلين، ومن المجودين، ومن الكرماء، ومن الأسخياء، ومن الجوادين، ومن المعطين، ومن الباذلين، ومن المنفقين، ومن المتصدقين، ومن المحسنين، ومن المكرمين.","اجتهاد","u"],
["رزق وبركة","دعاء القناعة","اللهم اجعلني من القانعين، ومن الراضين، ومن الشاكرين، ومن الذاكرين، ومن الصابرين، ومن المتقين، ومن المخبتين، ومن المنيبين، ومن المطمئنين، ومن الراضين، ومن المرضيين. اللهم ارزقني القناعة بما أعطيتني، والرضا بما قضيت عليّ، والصبر على ما ابتليتني، والشكر على ما أنعمت عليّ، والتوكل عليك في كل أموري، والإنابة إليك في كل أحوالي، والمحبة لك في كل حين، والشوق إلى لقائك في كل وقت.","اجتهاد","u"],
["هداية وثبات","دعاء العلم","﴿رَّبِّ زِدْنِي عِلْمًا﴾. اللهم إني أسألك علماً نافعاً، ورزقاً طيباً، وعملاً متقبلاً. اللهم انفعني بما علمتني، وعلمني ما ينفعني، وزدني علماً. اللهم اجعلني من العالمين العاملين، ومن العارفين المخلصين، ومن الحكماء العادلين، ومن العلماء الربانيين، ومن الفقهاء المتقين، ومن المفسرين المحققين، ومن المحدثين الحافظين، ومن القراء المتقنين، ومن الحفاظ المتقنين، ومن الدعاة المخلصين، ومن المعلمين المرشدين، ومن المتعلمين الصادقين، ومن الطلاب المجتهدين.","اجتهاد","u"],
["هداية وثبات","دعاء الحكمة","اللهم هب لي حكمةً وحكماً، وألحقني بالصالحين. اللهم اجعلني من الحكماء العادلين، ومن العقلاء الراشدين، ومن العلماء العاملين، ومن العارفين المخلصين، ومن الفقهاء المتقين، ومن المفسرين المحققين، ومن المحدثين الحافظين، ومن القراء المتقنين، ومن الحفاظ المتقنين، ومن الدعاة المخلصين، ومن المعلمين المرشدين، ومن المتعلمين الصادقين، ومن الطلاب المجتهدين.","اجتهاد","u"],
["فك الكرب والهم|هداية وثبات","دعاء الفهم","اللهم فهمني ما علمتني، وعلمني ما ينفعني، وزدني علماً. اللهم اجعلني من الفاهمين، ومن العالمين، ومن العاملين، ومن العارفين، ومن المخلصين، ومن المخبتين، ومن المنيبين، ومن المطمئنين، ومن الراضين، ومن المرضيين. اللهم اجعل لي فهماً في كتابك، وعقلاً في دينك، وقلباً في طاعتك، ولساناً في ذكرك، وبدناً في خدمتك، وروحاً في محبتك.","اجتهاد","u"],
["هداية وثبات","دعاء الفقه","اللهم فقهني في الدين، وعلمني التأويل، وارزقني الفهم عنك، والعلم بك، والمعرفة لك، والمحبة لك، والشوق إلى لقائك، والأنس بك، والطمأنينة بذكرك، والرضا بقضائك، والصبر على بلائك، والشكر على نعمائك، والتوكل عليك، والإنابة إليك، والإخلاص لك، والمحبة فيك، والشوق إليك، والأنس بك، والطمأنينة بذكرك.","اجتهاد","u"],
