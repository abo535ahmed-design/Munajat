["فك الكرب والهم|هداية وثبات","دعاء الفهم","اللهم فهمني ما علمتني، وعلمني ما ينفعني، وزدني علماً. اللهم اجعلني من الفاهمين، ومن العالمين، ومن العاملين، ومن العارفين، ومن المخلصين، ومن المخبتين، ومن المنيبين، ومن المطمئنين، ومن الراضين، ومن المرضيين. اللهم اجعل لي فهماً في كتابك، وعقلاً في دينك، وقلباً في طاعتك، ولساناً في ذكرك، وبدناً في خدمتك، وروحاً في محبتك.","اجتهاد","u"],
["هداية وثبات","دعاء الفقه","اللهم فقهني في الدين، وعلمني التأويل، وارزقني الفهم عنك، والعلم بك، والمعرفة لك، والمحبة لك، والشوق إلى لقائك، والأنس بك، والطمأنينة بذكرك، والرضا بقضائك، والصبر على بلائك، والشكر على نعمائك، والتوكل عليك، والإنابة إليك، والإخلاص لك، والمحبة فيك، والشوق إليك، والأنس بك، والطمأنينة بذكرك.","اجتهاد","u"],
["هداية وثبات","دعاء التدبر","اللهم اجعلني من المتدبرين لكتابك، ومن المتأملين في خلقك، ومن المتفكرين في آياتك، ومن المتذكرين لنعمك، ومن الشاكرين لآلائك، ومن الذاكرين لك، ومن العارفين بك، ومن المحبين لك، ومن المشتاقين إليك، ومن المقربين منك، ومن الصديقين، ومن الشهداء، ومن الصالحين.","اجتهاد","u"],
["الآخرة وحسن الخاتمة","دعاء حسن الخاتمة","اللهم اجعل خير أعمالنا خواتيمها، وخير أيامنا يوم نلقاك، وخير عمرنا آخره، وخير أيامنا يوم القيامة، وخير ليلنا ليلة القدر، وخير شهورنا شهر رمضان، وخير أعمالنا ما كان خالصاً لوجهك، وخير أعمارنا ما كان في طاعتك، وخير أيامنا يوم نلقاك وأنت راضٍ عنا. اللهم اجعل خير أعمالنا خواتيمها، وخير أيامنا يوم نلقاك، وخير عمرنا آخره. اللهم ارزقنا حسن الخاتمة، والسعادة في البرزخ، والأمن في القيامة، والفوز بالجنة، والنجاة من النار.","اجتهاد","u"],
["الآخرة وحسن الخاتمة","دعاء الموت","اللهم هون عليّ سكرات الموت، وخفف عني أهوال القيامة، وثبتني على الصراط، واجعل حسابي يسيراً، وميزاني راجحاً، وكتابي باليمين، واجعلني من الذين لا خوف عليهم ولا هم يحزنون. اللهم اجعلني من الذين يُدْعَون إلى الجنة زمراً، ومن الذين يُقال لهم: ادخلوها بسلام آمنين. اللهم توفني مسلماً، وألحقني بالصالحين. اللهم توفني وأنت راضٍ عني، اللهم لا تأخذني عصياً، وخذني تواباً نقياً أينما مت وكيفما مت.","اجتهاد","u"],
["هداية وثبات","دعاء التسليم","اللهم إني أسلمت نفسي إليك، وفوضت أمري إليك، وألجأت ظهري إليك، رغبةً ورهبةً إليك، لا ملجأ ولا منجا منك إلا إليك. اللهم إني أرضى بك رباً، وبالإسلام ديناً، وبمحمد صلى الله عليه وسلم نبياً ورسولاً. اللهم إني أرضى بك رباً، وبالإسلام ديناً، وبمحمد صلى الله عليه وسلم نبياً ورسولاً. اللهم إني أرضى بك رباً، وبالإسلام ديناً، وبمحمد صلى الله عليه وسلم نبياً ورسولاً.","اجتهاد","u"],
["هداية وثبات","دعاء التوكل","اللهم إني توكلت عليك، وفوضت أمري إليك، لا ملجأ ولا منجا منك إلا إليك. اللهم إني أضع أمري بين يديك، وأتوكل عليك في كل أموري، وأستعينك على كل أحوالي، وأستغيثك في كل شدائدي، وأستجيرك في كل مخاوفي، وأستنصرك في كل حاجاتي. اللهم إني توكلت عليك، وأنت حسبي ونعم الوكيل، نعم المولى ونعم النصير.","اجتهاد","u"],
["هداية وثبات","دعاء اليقين","اللهم ارزقني اليقين الذي لا يشوبه شك، والإخلاص الذي لا يشوبه رياء، والصدق الذي لا يشوبه كذب، والأمانة التي لا يشوبها خيانة، والوفاء الذي لا يشوبه غدر، والعدل الذي لا يشوبه ظلم، والرحمة التي لا يشوبها قسوة، والحلم الذي لا يشوبه طيش، والعلم الذي لا يشوبه جهل، والعمل الذي لا يشوبه كسل، والطاعة التي لا يشوبها معصية، والعبادة التي لا يشوبها رياء، والمحبة التي لا يشوبها بغض، والشوق الذي لا يشوبه فتور، والأنس الذي لا يشوبه وحشة، والطمأنينة التي لا يشوبها قلق، والرضا الذي لا يشوبه سخط، والصبر الذي لا يشوبه جزع، والشكر الذي لا يشوبه كفران، والذكر الذي لا يشوبه غفلة.","اجتهاد","u"],
["هداية وثبات","دعاء المحبة","اللهم ارزقني حبك، وحب من يحبك، وحب كل عمل يقربني إلى حبك. اللهم اجعل حبك أحب إليّ من نفسي، ومن أهلي، ومن مالي، ومن ولدي، ومن كل شيء. اللهم اجعل حبك أحب إليّ من الماء البارد على الظمأ، ومن النوم للوسنان، ومن الصحة للمريض، ومن الغنى للفقير، ومن الأمن للخائف، ومن الهدى للضال، ومن النور للظلمة، ومن الرحمة للمرحوم، ومن الجنة للمشتاق، ومن لقائك للمحب، ومن النظر إلى وجهك للعارف.","اجتهاد","u"],
["هداية وثبات","دعاء الشوق","اللهم إني أسألك الشوق إلى لقائك، والأنس بك، والطمأنينة بذكرك، والرضا بقضائك، والصبر على بلائك، والشكر على نعمائك، والتوكل عليك، والإنابة إليك، والإخلاص لك، والمحبة فيك، والشوق إليك، والأنس بك، والطمأنينة بذكرك. اللهم اجعلني من المشتاقين إليك، ومن المحبين لك، ومن العارفين بك، ومن المقربين منك، ومن الصديقين، ومن الشهداء، ومن الصالحين.","اجتهاد","u"],
["هداية وثبات","دعاء القرب","اللهم اجعلني من المقربين إليك، ومن المحبين لك، ومن العارفين بك، ومن المشتاقين إليك، ومن المنيبين إليك، ومن المخبتين لك، ومن المطمئنين بذكرك، ومن الراضين بقضائك، ومن الصابرين على بلائك، ومن الشاكرين لنعمائك، ومن الذاكرين لآلائك، ومن المطيعين لأوامرك، ومن المجتنبين لنواهيك، ومن المستقيمين على دينك، ومن الثابتين على طاعتك، ومن القائمين بحقك، ومن المؤدين لأمانتك، ومن الحافظين لعهدك، ومن الوافين بمواثيقك، ومن المخلصين في عبادتك، ومن الصادقين في معاملاتك، ومن المخبتين في خشيتك، ومن المنيبين في توبتك، ومن المطمئنين في ذكرك، ومن الراضين في قضائك، ومن المرضيين في طاعتك.","اجتهاد","u"],
["الآخرة وحسن الخاتمة","دعاء النار","اللهم أجرني من النار، اللهم أجرني من النار، اللهم أجرني من النار. اللهم أعتق رقبتي من النار، اللهم أعتق رقبتي من النار، اللهم أعتق رقبتي من النار. اللهم نجني من النار، اللهم نجني من النار، اللهم نجني من النار. اللهم باعد بيني وبين النار، اللهم باعد بيني وبين النار، اللهم باعد بيني وبين النار. اللهم أدخلني الجنة، اللهم أدخلني الجنة، اللهم أدخلني الجنة. اللهم اجعلني من أهل الجنة، اللهم اجعلني من أهل الجنة، اللهم اجعلني من أهل الجنة.","اجتهاد","u"],
["الآخرة وحسن الخاتمة","دعاء الحوض","اللهم اسقني من حوض نبيك محمد صلى الله عليه وسلم شربةً لا أظمأ بعدها أبداً، اللهم اسقني من حوض نبيك محمد صلى الله عليه وسلم شربةً لا أظمأ بعدها أبداً، اللهم اسقني من حوض نبيك محمد صلى الله عليه وسلم شربةً لا أظمأ بعدها أبداً. اللهم اجعلني من الذين يشربون من حوضه، ومن الذين لا يُطردون عنه، ومن الذين يُسقون منه، ومن الذين يروون منه، ومن الذين لا يظمأون بعده أبداً.","اجتهاد","u"],
["ذرية وأهل","دعاء الوالدين","اللهم اغفر لوالديّ، وارحمهما كما ربياني صغيراً، واجزهما عني خير الجزاء، واغفر لهما ما قدموا وما أخروا، وما أسرّوا وما أعلنوا، وما أخطأوا وما تعمدوا، وما نسوا وما ذكروا. اللهم ارحم والدينا، واغفر لهم، واعفُ عنهم، ووسّع قبورهم، وأنرها، واجعلها روضةً من رياض الجنة، واجعلهم من أهل الفردوس الأعلى، واجمعنا بهم في مستقر رحمتك، في مقعد صدق عند مليك مقتدر.","اجتهاد","u"],
["ذرية وأهل","دعاء الأهل","اللهم أصلح لنا في أزواجنا وذرياتنا، واجعلهم قرة أعين لنا، واجعلهم من الصالحين، ومن الحافظين لكتابك، ومن القائمين بدينك، ومن الداعين إلى سبيلك، ومن المجاهدين في سبيلك، ومن الشهداء والصديقين والصالحين وحسن أولئك رفيقاً. اللهم أصلح لنا في أزواجنا وذرياتنا، واجعلهم من عبادك الصالحين، ومن أوليائك المتقين، ومن جندك الغالبين، ومن حزبك المفلحين.","اجتهاد","u"],
["ذرية وأهل","دعاء الذرية","﴿رَبِّ هَبْ لِي مِن لَّدُنكَ ذُرِّيَّةً طَيِّبَةً ۖ إِنَّكَ سَمِيعُ الدُّعَاءِ﴾. اللهم ارزقني ذريةً طيبةً، اللهم ارزقني ذريةً صالحةً، اللهم ارزقني ذريةً مباركةً، اللهم ارزقني ذريةً حافظةً لكتابك، اللهم ارزقني ذريةً قائمةً بدينك، اللهم ارزقني ذريةً داعيةً إلى سبيلك، اللهم ارزقني ذريةً مجاهدةً في سبيلك، اللهم ارزقني ذريةً من الشهداء والصديقين والصالحين. اللهم اجعل ذريتي من الصالحين، ومن الحافظين لكتابك، ومن القائمين بدينك، ومن الداعين إلى سبيلك، ومن المجاهدين في سبيلك، ومن الشهداء والصديقين والصالحين.","اجتهاد","u"],
["ذرية وأهل","دعاء الزوج والزوجة","اللهم أصلح بيني وبين زوجي، واجعل بيننا مودةً ورحمة، واجعلنا عوناً لبعضنا على طاعتك، واجعلنا سبباً لسعادة بعضنا في الدنيا والآخرة، واجعلنا من عبادك الصالحين، ومن أوليائك المتقين، ومن جندك الغالبين، ومن حزبك المفلحين. اللهم اجعل زوجي قرة عين لي، واجعلني قرة عين له، واجعل بيننا من المودة والرحمة ما تجعل به بين عبادك الصالحين.","اجتهاد","u"],
["ذرية وأهل","دعاء الأولاد","اللهم احفظ أولادي من كل سوء، واصرف عنهم كل شر، واجعلهم من عبادك الصالحين، ومن أوليائك المتقين، ومن جندك الغالبين، ومن حزبك المفلحين، ومن الحافظين لكتابك، ومن القائمين بدينك، ومن الداعين إلى سبيلك، ومن المجاهدين في سبيلك، ومن الشهداء والصديقين والصالحين. اللهم اجعلهم من الصالحين، ومن الحافظين لكتابك، ومن القائمين بدينك، ومن الداعين إلى سبيلك.","اجتهاد","u"],
["دعاء للأمة","دعاء الأمة","اللهم أصلح أحوال المسلمين في كل مكان، وارحم ضعفهم، واجبر كسرهم، وارفع ذلهم، وأعزهم بالإسلام، وأعز الإسلام بهم. اللهم انصر المستضعفين من المسلمين في كل مكان، وارفع عنهم الظلم والعدوان، واجبر كسرهم، وارحم ضعفهم، وارفع ذلهم، وأعزهم بعزتك، وانصرهم بنصرك، وأيدهم بتأييدك. اللهم فرّج عن المسلمين في كل مكان، وارحم ضعفهم، واجبر كسرهم، وارفع ذلهم، وأعزهم، وانصرهم، وأيدهم، وثبت أقدامهم، وانصرهم على القوم الظالمين.","اجتهاد","u"],
["دعاء للأمة","دعاء الوحدة","اللهم اجمع كلمة المسلمين على الحق، ووحد صفوفهم على الهدى، وأصلح قادتهم، واهدهم إلى الحق، واجعلهم من عبادك الصالحين، ومن أوليائك المتقين، ومن جندك الغالبين، ومن حزبك المفلحين. اللهم أصلح أحوال المسلمين، واجمع كلمتهم، ووحد صفوفهم، وأصلح قادتهم، واهدهم إلى الحق.","اجتهاد","u"],
["دعاء للأمة","دعاء النصر","اللهم انصر الإسلام والمسلمين، اللهم انصر الإسلام والمسلمين، اللهم انصر الإسلام والمسلمين. اللهم أعز الإسلام والمسلمين، اللهم أعز الإسلام والمسلمين، اللهم أعز الإسلام والمسلمين. اللهم ارفع راية الإسلام والمسلمين، اللهم ارفع راية الإسلام والمسلمين، اللهم ارفع راية الإسلام والمسلمين. اللهم انصر المستضعفين من المسلمين، اللهم انصر المستضعفين من المسلمين، اللهم انصر المستضعفين من المسلمين.","اجتهاد","u"],
["دعاء للأمة","دعاء المستضعفين","اللهم ارحم المستضعفين من المسلمين في كل مكان، واجبر كسرهم، وارحم ضعفهم، وارفع ذلهم، وأعزهم، وانصرهم، وأيدهم، وثبت أقدامهم، وانصرهم على القوم الظالمين. اللهم كن لهم ناصراً ومعيناً، وحافظاً ونصيراً، ومؤيداً وظهيراً، وعضداً وسنداً، وملجأً ومعاذاً، وغياثاً ومغيثاً، وهادياً ومرشداً، وحكماً وقاضياً، وعادلاً ومنصفاً، وراحماً ورحيماً.","اجتهاد","u"],
["دعاء للأمة","دعاء الأقصى","اللهم فك أسرى المسلمين، واشف مرضاهم، وارحم موتاهم، واجبر كسرهم، وارحم ضعفهم، وارفع ذلهم، وأعزهم، وانصرهم، وأيدهم، وثبت أقدامهم، وانصرهم على القوم الظالمين. اللهم حرر المسجد الأقصى، اللهم حرر المسجد الأقصى، اللهم حرر المسجد الأقصى. اللهم رد المسجد الأقصى إلى المسلمين، اللهم رد المسجد الأقصى إلى المسلمين، اللهم رد المسجد الأقصى إلى المسلمين.","اجتهاد","u"],
["جوامع الدعاء","دعاء التوسل","اللهم إنا نسألك بأسمائك الحسنى، وصفاتك العليا، وباسمك الأعظم، وبكلماتك التامات، وبأركانك، وبوجهك الكريم، وبجلالك العظيم، وبعزتك التي لا تُرام، وبقدرتك التي لا تُغالب، وبملكك الذي لا يُزول، وبسلطانك الذي لا يُنازع، وبكبريائك التي لا تُوصف، وبعظمتك التي لا تُحدّ، وبجبروتك الذي لا يُقهر، وبقهرك الذي لا يُردّ، وبعدلك الذي لا يُجازى، وبفضلك الذي لا يُحدّ، وبكرمك الذي لا يُنفد، وبجودك الذي لا ينقطع، وبعطائك الذي لا ينقص، وبخزائنك التي لا تنفد، وبعلمك الذي لا يُحيط به أحد، وبحلمك الذي لا يُستفز، وبعفوك الذي لا يُحدّ، وبصفحك الذي لا يُمنع، وبسترك الذي لا يُكشف، وبحفظك الذي لا يُخترق، وبرحمتك التي وسعت كل شيء، وبشفائك الذي لا يُغادر سقماً، وبعافيتك التي لا يُغادرها ألم، أن تقضي لنا حوائجنا، وتيسر لنا أمورنا، وتفتح لنا أبواب رحمتك، وتنزل علينا من بركاتك، وتجعل لنا من كل همّ فرجاً، ومن كل ضيق مخرجاً، ومن كل بلاء عافية، ومن كل سقم شفاءً، ومن كل ذنب مغفرةً، ومن كل عيب ستراً، ومن كل عسير يسراً، ومن كل فقر غنىً، ومن كل ذل عزاً، ومن كل خوف أمناً، ومن كل وحدة أنساً، ومن كل حزن فرحاً، ومن كل ضلال هدايةً، ومن كل ظلمة نوراً، ومن كل نار جنةً.","اجتهاد","u"],
["جوامع الدعاء","دعاء الوداع","اللهم لا تجعل هذا آخر عهدنا بك، ولا آخر دعائنا لك، ولا آخر تضرعنا إليك، ولا آخر ابتهالنا لك، ولا آخر خشوعنا لك، ولا آخر خضوعنا لك، ولا آخر ذلنا لك، ولا آخر انكسارنا لك، ولا آخر توبتنا إليك، ولا آخر إنابتنا إليك، ولا آخر محبتنا لك، ولا آخر شوقنا إليك، ولا آخر أنسنا بك، ولا آخر طمأنينتنا بذكرك، ولا آخر رضانا بقضائك، ولا آخر صبرنا على بلائك، ولا آخر شكرنا لنعمائك، ولا آخر توكلنا عليك، ولا آخر إخلاصنا لك، ولا آخر طاعتنا لأوامرك، ولا آخر اجتنابنا لنواهيك، ولا آخر استقامتنا على دينك، ولا آخر ثباتنا على طاعتك، ولا آخر قيامنا بحقك، ولا آخر أدائنا لأمانتك، ولا آخر حفظنا لعهدك، ولا آخر وفائنا بمواثيقك.","اجتهاد","u"],
["جوامع الدعاء","دعاء الختام","اللهم آمين، وآخر دعوانا أن الحمد لله رب العالمين، والصلاة والسلام على أشرف المرسلين، سيدنا محمد وعلى آله وصحبه أجمعين. اللهم اجعلنا من عبادك الصالحين، ومن أوليائك المتقين، ومن جندك الغالبين، ومن حزبك المفلحين، ومن عبادك المخلصين، ومن عبادك الشاكرين، ومن عبادك الذاكرين، ومن عبادك المخبتين، ومن عبادك المنيبين، ومن عبادك المطمئنين، ومن عبادك الراضين، ومن عبادك المرضيين، ومن عبادك المحبين، ومن عبادك المشتاقين، ومن عبادك العارفين، ومن عبادك المقربين، ومن عبادك الصديقين، ومن عبادك الشهداء، ومن عبادك الصالحين.","اجتهاد","u"],
["جوامع الدعاء","سبحان ربك رب العزة عما يصفون،…","سبحان ربك رب العزة عما يصفون، وسلام على المرسلين، والحمد لله رب العالمين.","اجتهاد","u"],
["فك الكرب والهم","اللهم تقبل منا هذا الجمع، واغفر…","اللهم تقبل منا هذا الجمع، واغفر لنا ما فيه من تقصير، واجعله خالصاً لوجهك الكريم، وانفع به من قرأه ودعا به، واجعله في ميزان حسناتنا، إنك أنت السميع العليم، وتوب علينا إنك أنت التواب الرحيم.","اجتهاد","u"],
["هداية وثبات","وصلى الله على سيدنا محمد وعلى…","وصلى الله على سيدنا محمد وعلى آله وصحبه وسلم تسليماً كثيراً إلى يوم الدين، والحمد لله رب العالمين.","اجتهاد","u"],
["الصلاة والطهارة","بعد الأذان: الشهادتان والرضا","وأنا أشهدُ أن لا إله إلا اللهُ وحدَه لا شريكَ له، وأنَّ محمدًا عبدُه ورسولُه، رضيتُ باللهِ ربًّا، وبمحمدٍ رسولًا، وبالإسلامِ دينًا.","مسلم","h"],
["الصلاة والطهارة","ترديد الأذان","يقولُ مثلَ ما يقولُ المؤذنُ، إلا في «حيَّ على الصلاة» و«حيَّ على الفلاح» فيقول: لا حولَ ولا قوةَ إلا بالله.","البخاري ومسلم","h"],
["الصلاة والطهارة|أذكار","بعد السلام: لا مانع لما أعطيت","لا إله إلا اللهُ وحدَه لا شريكَ له، له الملكُ وله الحمدُ وهو على كل شيءٍ قدير. اللهم لا مانعَ لما أعطيتَ، ولا معطيَ لما منعتَ، ولا ينفعُ ذا الجَدِّ منك الجَدّ.","البخاري ومسلم","h"],
["الصلاة والطهارة|جوامع الدعاء","الاستعاذة من البخل والجبن","اللهم إني أعوذُ بك من البخل، وأعوذُ بك من الجبن، وأعوذُ بك أن أُرَدَّ إلى أرذلِ العمر، وأعوذُ بك من فتنةِ الدنيا وعذابِ القبر.","البخاري","h"],
["الصلاة والطهارة","تكبير الاستفتاح","اللهُ أكبرُ كبيرًا، والحمدُ للهِ كثيرًا، وسبحانَ اللهِ بكرةً وأصيلًا.","مسلم","h"],
["الحج والعمرة|الظلم والأعداء","على الصفا والمروة","لا إله إلا اللهُ وحدَه لا شريكَ له، له الملكُ وله الحمدُ وهو على كل شيءٍ قدير، لا إله إلا اللهُ وحدَه، أنجزَ وعدَه، ونصرَ عبدَه، وهزمَ الأحزابَ وحدَه.","مسلم","h"],
["الظلم والأعداء","عند لقاء العدو","اللهم أنت عَضُدي ونصيري، بك أجولُ وبك أصولُ وبك أقاتل.","أبو داود والترمذي","h"],
["الظلم والأعداء|فك الكرب والهم","عند الخوف من سلطان ظالم","اللهم ربَّ السماواتِ السبعِ وربَّ العرشِ العظيم، كنْ لي جارًا من فلانِ بنِ فلانٍ (يُسمّيه) وأحزابِه من خلائقِك، أن يفرُطَ عليَّ أحدٌ منهم أو يطغى، عزَّ جارُك، وجلَّ ثناؤُك، ولا إله غيرُك.","البخاري في الأدب المفرد","h"],
["يومي","عند الرؤيا","الرؤيا الحسنةُ من الله: فلْيحمدِ اللهَ عليها وليحدِّثْ بها. وإذا رأى ما يكره: فليتعوَّذْ باللهِ من شرِّها ومن شرِّ الشيطان، وليتفُلْ عن يسارِه ثلاثًا، ولا يحدِّثْ بها أحدًا.","البخاري ومسلم","h"],
["فك الكرب والهم","عند تعسّر الأمر","اللهم لا سهلَ إلا ما جعلتَه سهلًا، وأنت تجعلُ الحَزْنَ إذا شئتَ سهلًا.","ابن حبان","h"],
["يومي","عند سماع الديك والحمار","إذا سمعتم صياحَ الديكةِ فاسألوا اللهَ من فضلِه، فإنها رأتْ مَلَكًا. وإذا سمعتم نهيقَ الحمارِ فتعوَّذوا باللهِ من الشيطان، فإنه رأى شيطانًا.","البخاري ومسلم","h"],
["المرضى والموتى","عند إغماض الميت","اللهم اغفرْ لفلانٍ (يُسمّيه) وارفعْ درجتَه في المهديِّين، واخلُفْه في عَقِبِه في الغابرين، واغفرْ لنا وله يا ربَّ العالمين، وافسَحْ له في قبرِه ونوِّرْ له فيه.","مسلم","h"],
["المرضى والموتى","عند إدخال الميت القبر","بسمِ اللهِ وعلى سُنَّةِ رسولِ الله.","أبو داود والترمذي","h"],
["المرضى والموتى","بعد الدفن","استغفِروا لأخيكم، وسَلُوا له التثبيتَ، فإنه الآنَ يُسأل.","أبو داود","h"],
["ذرية وأهل|مناسبات وأخلاق","للمتزوج أو من اشترى دابة أو خادمًا","اللهم إني أسألُك خيرَها وخيرَ ما جَبَلْتَها عليه، وأعوذُ بك من شرِّها وشرِّ ما جَبَلْتَها عليه.","أبو داود وابن ماجه","h"],
["ذرية وأهل","قبل الجماع","بسمِ الله، اللهم جنِّبْنا الشيطانَ وجنِّبِ الشيطانَ ما رزقتَنا.","البخاري ومسلم","h"],
["رزق وبركة|البيت والطعام","عند أول الثمر","اللهم بارِكْ لنا في ثمرِنا، وبارِكْ لنا في مدينتِنا، وبارِكْ لنا في صاعِنا، وبارِكْ لنا في مُدِّنا.","مسلم","h"],
["البيت والطعام","بعد الطعام","الحمدُ للهِ الذي أطعمَني هذا ورزقَنيه من غيرِ حولٍ مني ولا قوة. — أو: الحمدُ للهِ حمدًا كثيرًا طيبًا مباركًا فيه، غيرَ مكفيٍّ ولا مُوَدَّعٍ ولا مستغنىً عنه ربَّنا.","أبو داود والترمذي والبخاري","h"],
["البيت والطعام","عند شرب اللبن","اللهم بارِكْ لنا فيه وزِدْنا منه.","أبو داود والترمذي","h"],
["رزق وبركة","الاستعاذة من الجوع والخيانة","اللهم إني أعوذُ بك من الجوع، فإنه بئسَ الضجيع، وأعوذُ بك من الخيانة، فإنها بئستِ البطانة.","أبو داود والنسائي","h"],
["هداية وثبات","الاستعاذة من الشقاق والنفاق","اللهم إني أعوذُ بك من الشقاقِ والنفاقِ وسوءِ الأخلاق.","أبو داود والنسائي","h"],
["هداية وثبات|جوامع الدعاء","اهدني وسددني","اللهم اهدِني وسدِّدْني.","مسلم","h"],
["مغفرة واستغفار","رب اغفر لي وتب علي","ربِّ اغفرْ لي وتُبْ عليَّ، إنك أنت التوابُ الرحيم.","أبو داود والترمذي","h"],
["أذكار الصباح|أذكار المساء|مجموعة حصن المسلم","أذكار الصباح والمساء (3)","أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لاَ إِلَهَ إلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ. [ وإذا أمسى قال: أمسينا وأمسى الملك للَّه] [وإذا أمسى قال: رب أسألك خير ما في هذه الليلة، وخير ما بعدها، وأعوذ بك من شر ما في هذه الليلة، وشر ما بعدها.]","حصن المسلم للقحطاني","h"],
["أذكار الصباح|أذكار المساء|مجموعة حصن المسلم","أذكار الصباح والمساء (4)","اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ. [وإذا أمسى قال: اللَّهم بك أمسينا، وبك أصبحنا، وبك نحيا، وبك نموت، وإليك المصير.]","حصن المسلم للقحطاني","h"],
["أذكار الصباح|أذكار المساء|مجموعة حصن المسلم","أذكار الصباح والمساء (6)","اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلاَئِكَتِكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلاَّ أَنْتَ وَحْدَكَ لاَ شَرِيكَ لَكَ، وَأَنَّ مُحَمَّداً عَبْدُكَ وَرَسُولُكَ (أربعَ مَرَّاتٍ).[ وإذا أمسى قال: اللَّهم إني أمسيت...]","حصن المسلم للقحطاني","h",4],
["أذكار الصباح|أذكار المساء|مجموعة حصن المسلم","أذكار الصباح والمساء (7)","اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لاَ شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ. [وإذا أمسى قال: اللَّهم ما أمسى بي...]","حصن المسلم للقحطاني","h"],
["أذكار الصباح|أذكار المساء|مجموعة حصن المسلم","أذكار الصباح والمساء (13)","رَضِيتُ بِاللَّهِ رَبَّاً، وَبِالْإِسْلاَمِ دِيناً، وَبِمُحَمَّدٍ صلى الله عليه وسلم نَبِيّاً (ثلاثَ مرَّاتٍ).","حصن المسلم للقحطاني","h",3],
["أذكار الصباح|أذكار المساء|مجموعة حصن المسلم","أذكار الصباح والمساء (15)","أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُـمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذَا الْيَوْمِ:فَتْحَهُ، وَنَصْرَهُ، وَنورَهُ، وَبَرَكَتَهُ، وَهُدَاهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهِ وَشَرِّ مَا بَعْدَهُ. [وإذا أمسى قال: أمسينا وأمسى الملك للَّه ربّ العالمين اللَّهم إني أسألك خير هذه الليلة: فتحها، ونصرها، ونورها، وبركتها، وهداها، وأعوذ بك من شر ما فيها، وشر ما بعدها.]","حصن المسلم للقحطاني","h"],
["أذكار الصباح|أذكار المساء|مجموعة حصن المسلم","أذكار الصباح والمساء (16)","أَصْبَحْنا عَلَى فِطْرَةِ الْإِسْلاَمِ، وَعَلَى كَلِمَةِ الْإِخْلاَصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صلى الله عليه وسلم، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ، حَنِيفاً مُسْلِماً وَمَا كَانَ مِنَ الْمُشرِكِينَ. [وإذا أمسى قال: أمسينا على فطرة الإسلام...]","حصن المسلم للقحطاني","h"],
["أذكار الصباح|أذكار المساء|مجموعة حصن المسلم","أذكار الصباح والمساء (17)","سُبْحَانَ اللَّهِ وَبِحَمْدِهِ (مائة مرَّةٍ).","حصن المسلم للقحطاني","h",100],
["أذكار الصباح|أذكار المساء|مجموعة حصن المسلم","أذكار الصباح والمساء (18)","لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ (عشرَ مرَّات)، أَوْ (مرَّةً واحدةً عندَ الكَسَلِ).","حصن المسلم للقحطاني","h",10],
["أذكار الصباح|أذكار المساء|مجموعة حصن المسلم","أذكار الصباح والمساء (20)","سُبْحَانَ اللَّهِ وَبِحَمْدِهِ: عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ (ثلاثَ مرَّاتٍ إذا أصبحَ).","حصن المسلم للقحطاني","h",3],
["أذكار الصباح|أذكار المساء|مجموعة حصن المسلم","أذكار الصباح والمساء (22)","أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ (مِائَةَ مَرَّةٍ فِي الْيَوْمِ).","حصن المسلم للقحطاني","h",100],
["أذكار الصباح|أذكار المساء|مجموعة حصن المسلم","أذكار الصباح والمساء (23)","أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ (ثلاثَ مرَّاتٍ إذا أمسى).","حصن المسلم للقحطاني","h",3],
["أذكار الصباح|أذكار المساء|مجموعة حصن المسلم","أذكار الصباح والمساء (24)","اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبَيِّنَا مُحَمَّدٍ (عشرَ مرَّاتٍ).","حصن المسلم للقحطاني","h",10],
["يومي|مجموعة حصن المسلم","أذكار النوم (1)","يَجْمَعُ كَفَّيْهِ ثُمَّ يَنْفُثُ فِيهِمَا فَيَقْرَأُ فِيهِمَا:بسم الله الرحمن الرحيم ﴿قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُواً أَحَدٌ﴾. بسم الله الرحمن الرحيم ﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ﴾. بسم الله الرحمن الرحيم ﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَ النَّاسِ﴾ ثُمَّ يَمْسَحُ بِهِمَا مَا اسْتَطَاعَ مِنْ جَسَدِهِ يَبْدَأُ بِهِمَا عَلَى رَأْسِهِ وَوَجْهِهِ وَمَا أَقبَلَ مِنْ جَسَدِهِ (يفعلُ ذلك ثلاثَ مرَّاتٍ).","حصن المسلم للقحطاني","h",3],
["يومي|مجموعة حصن المسلم","أذكار النوم (3)","﴿آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ كُلٌّ آمَنَ بِاللَّهِ وَمَلآئِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لاَ نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ وَقَالُواْ سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝ لاَ يُكَلِّفُ اللَّهُ نَفْساً إِلاَّ وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لاَ تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلاَ تَحْمِلْ عَلَيْنَا إِصْراً كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا رَبَّنَا وَلاَ تُحَمِّلْنَا مَا لاَ طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَآ أَنتَ مَوْلاَنَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ﴾.","حصن المسلم للقحطاني","h"],
["يومي|مجموعة حصن المسلم","أذكار النوم (5)","اللَّهُمَّ إِنَّكَ خَلَقْتَ نَفْسِي وَأَنْتَ تَوَفَّاهَا، لَكَ مَمَاتُهَا وَمَحْياهَا، إِنْ أَحْيَيْتَهَا فَاحْفَظْهَا، وَإِنْ أَمَتَّهَا فَاغْفِرْ لَهَا. اللَّهُمَّ إِنِّي أَسْأَلُكَ العَافِيَةَ.","حصن المسلم للقحطاني","h"],
["يومي|مجموعة حصن المسلم","أذكار النوم (8)","سُبْحَانَ اللَّهِ (ثلاثاً وثلاثين) وَالْحَمْدُ لِلَّهِ (ثلاثاً وثلاثين) وَاللَّهُ أَكْبَرُ (أربعاً وثلاثينَ).","حصن المسلم للقحطاني","h"],
["يومي|مجموعة حصن المسلم","أذكار النوم (12)","يَقْرَأُ ﴿الم﴾ تَنْزِيلَ السَّجْدَة ِ، وَتَبَارَكَ الَّذي بِيَدِهِ الْمُلْكُ.","حصن المسلم للقحطاني","h"],
["يومي|مجموعة حصن المسلم","أذكار الاستيقاظ من النوم (2)","( لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَريكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، سُبْحَانَ اللَّهِ، وَالْحَمْدُ للَّهِ، وَلاَ إِلَهَ إِلاَّ اللَّهُ، وَاللَّهُ أَكبَرُ، وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ الْعَلِيِّ الْعَظِيمِ، رَبِّ اغْفرْ لِي ).","حصن المسلم للقحطاني","h"],
["يومي|مجموعة حصن المسلم","أذكار الاستيقاظ من النوم (3)","( الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي فِي جَسَدِي، وَرَدَّ عَلَيَّ رُوحِي، وَأَذِنَ لي بِذِكْرِهِ )","حصن المسلم للقحطاني","h"],
["يومي|مجموعة حصن المسلم","أذكار الاستيقاظ من النوم (4)","﴿ إِنَّ فِي خَلْقِ السَّمَوَاتِ وَالأَرْضِ وَاخْتِلاَفِ اللَّيْلِ وَالنَّهَارِ لَآيَاتٍ لأُوْلِي الألْبَابِ ۝ الَّذِينَ يَذْكُرُونَ اللَّهَ قِيَاماً وَقُعُوداً وَعَلَىَ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِي خَلْقِ السَّمَوَاتِ وَالأَرْضِ رَبَّنَا مَا خَلَقْتَ هَذا بَاطِلاً سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ ۝ رَبَّنَا إِنَّكَ مَن تُدْخِلِ النَّارَ فَقَدْ أَخْزَيْتَهُ وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ ۝ رَّبَّنَا إِنَّنَا سَمِعْنَا مُنَادِياً يُنَادِي لِلإِيمَانِ أَنْ آمِنُواْ بِرَبِّكُمْ فَآمَنَّا رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الأبْرَارِ ۝ رَبَّنَا وَآتِنَا مَا وَعَدتَّنَا عَلَى رُسُلِكَ وَلاَ تُخْزِنَا يَوْمَ الْقِيَامَةِ إِنَّكَ لاَ تُخْلِفُ الْمِيعَادَ ۝ فَاسْتَجَابَ لَهُمْ رَبُّهُمْ أَنِّي لاَ أُضِيعُ عَمَلَ عَامِلٍ مِّنكُم مِّن ذَكَرٍ أَوْ أُنثَى بَعْضُكُم مِّن بَعْضٍ فَالَّذِينَ هَاجَرُواْ وَأُخْرِجُواْ مِن دِيَارِهِمْ وَأُوذُواْ فِي سَبِيلِي وَقَاتَلُواْ وَقُتِلُواْ لأُكَفِّرَنَّ عَنْهُمْ سَيِّئَاتِهِمْ وَلأُدْخِلَنَّهُمْ جَنَّاتٍ تَجْرِي مِن تَحْتِهَا الأَنْهَارُ ثَوَاباً مِّن عِندِ اللَّهِ وَاللَّهُ عِندَهُ حُسْنُ الثَّوَابِ ۝ لاَ يَغُرَّنَّكَ تَقَلُّبُ الَّذِينَ كَفَرُواْ فِي الْبِلاَدِ ۝ مَتَاعٌ قَلِيلٌ ثُمَّ مَأْوَاهُمْ جَهَنَّمُ وَبِئْسَ الْمِهَادُ ۝ لَكِنِ الَّذِينَ اتَّقَوْاْ رَبَّهُمْ لَهُمْ جَنَّاتٌ تَجْرِي مِنْ تَحْتِهَا الأَنْهَارُ خَالِدِينَ فِيهَا نُزُلاً مِّنْ عِندِ اللَّهِ وَمَا عِندَ اللَّهِ خَيْرٌ لِّلأَبْرَارِ ۝ وَإِنَّ مِنْ أَهْلِ الْكِتَابِ لَمَن يُؤْمِنُ بِاللَّهِ وَمَا أُنزِلَ إِلَيْكُمْ وَمَآ أُنزِلَ إِلَيْهِمْ خَاشِعِينَ لِلَّهِ لاَ يَشْتَرُونَ بِآيَاتِ اللَّهِ ثَمَناً قَلِيلاً أُوْلَئِكَ لَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ إِنَّ اللَّهَ سَرِيعُ الْحِسَابِ ۝ يَا أَيُّهَا الَّذِينَ آمَنُواْ اصْبِرُواْ وَصَابِرُواْ وَرَابِطُواْ وَاتَّقُواْ اللَّهَ لَعَلَّكُمْ تُفْلِحُونَ ﴾","حصن المسلم للقحطاني","h"],
["الصلاة والطهارة|مجموعة حصن المسلم","الذكر قبل الوضوء","(بِسْمِ اللَّهِ).","حصن المسلم للقحطاني","h"],
["الصلاة والطهارة|مجموعة حصن المسلم","دعاء الذهاب إلى المسجد","(اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُوراً، وَفِي لِسَانِي نُوراً، وَفِي سَمْعِي نُوراً، وَفِي بَصَرِي نُوراً، وَمِنْ فَوْقِي نُوراً، وَمِنْ تَحْتِي نُوراً، وَعَنْ يَمِينِي نُوراً، وَعَنْ شِمَالِي نُوراً، وَمِنْ أَمَامِي نُوراً، وَمِنْ خَلْفِي نُوراً، وَاجْعَلْ فِي نَفْسِي نُوراً، وَأَعْظِمْ لِي نُوراً، وَعَظِّم لِي نُوراً، وَاجْعَلْ لِي نُوراً، وَاجْعَلْنِي نُوراً، اللَّهُمَّ أَعْطِنِي نُوراً، وَاجْعَلْ فِي عَصَبِي نُوراً، وَفِي لَحْمِي نُوراً، وَفِي دَمِي نُوراً، وَفِي شَعْرِي نُوراً، وَفِي بَشَرِي نُوراً)([اللَّهُمَّ اجْعَلْ لِي نُوراً فِي قَبْرِي... وَنُوراً فِي عِظَامِي])[(وَزِدْنِي نُوراً، وَزِدْنِي نُوراً، وَزِدْنِي نُوراً)][(وَهَبْ لِي نُوراً عَلَى نُورٍ)]","حصن المسلم للقحطاني","h"],
["الصلاة والطهارة|مجموعة حصن المسلم","دعاء دخول المسجد","(يَبْدَأُ بِرِجْلِهِ الْيُمْنَى)، وَيَقُولُ: أَعُوذُ بِاللَّهِ العَظِيمِ، وَبِوَجْهِهِ الْكَرِيمِ، وَسُلْطَانِهِ الْقَدِيمِ، مِنَ الشَّيْطَانِ الرَّجِيمِ [بِسْمِ اللَّهِ، وَالصَّلَاةُ] [وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ] اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ.","حصن المسلم للقحطاني","h"],
["الصلاة والطهارة|مجموعة حصن المسلم","دعاء الخروج من المسجد","يَبْدَأُ بِرِجْلِهِ الْيُسْرَى وَيَقُولُ: بِسْمِ اللَّهِ وَالصّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِك، اللَّهُمَّ اعْصِمْنِي مِنَ الشَّيْطَانِ الرَّجِيمِ.","حصن المسلم للقحطاني","h"],

["الصلاة والطهارة|مجموعة حصن المسلم","دعاء الاستفتاح (3)","وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَوَاتِ وَالأَرْضَ حَنِيفَاً وَمَا أَنَا مِنَ الْمُشْرِكِينَ، إِنَّ صَلاَتِي، وَنُسُكِي، وَمَحْيَايَ، وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ، لاَ شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ. اللَّهُمَّ أَنْتَ المَلِكُ لاَ إِلَهَ إِلاَّ أَنْتَ، أَنْتَ رَبِّي وَأَنَا عَبْدُكَ، ظَلَمْتُ نَفْسِي وَاعْتَرَفْتُ بِذَنْبِي فَاغْفِرْ لِي ذُنُوبي جَمِيعَاً إِنَّهُ لاَ يَغْفِرُ الذُّنوبَ إِلاَّ أَنْتَ. وَاهْدِنِي لِأَحْسَنِ الأَخْلاقِ لاَ يَهْدِي لِأَحْسَنِها إِلاَّ أَنْتَ، وَاصْرِفْ عَنِّي سَيِّئَهَا، لاَ يَصْرِفُ عَنِّي سَيِّئَهَا إِلاَّ أَنْتَ، لَبَّيْكَ وَسَعْدَيْكَ، وَالخَيْرُ كُلُّهُ بِيَـــــــدَيْكَ، وَالشَّـــــرُّ لَيْسَ إِلَيْــــــكَ، أَنَا بِكَ وَإِلَيْكَ، تَبارَكْتَ وَتَعَالَيْتَ، أَسْتَغْفِرُكَ وَأَتوبُ إِلَيْكَ.","حصن المسلم للقحطاني","h"],
["الصلاة والطهارة|مجموعة حصن المسلم","دعاء الاستفتاح (5)","اللَّهُ أَكْبَرُ كَبِيرَاً، اللَّهُ أَكْبَرُ كَبِيراً، اللَّهُ أَكْبَرُ كَبِيراً، وَالْحَمْدُ لِلَّهِ كَثيراً، وَالْحَمْدُ لِلَّهِ كَثيراً، وَالْحَمْدُ لِلَّهِ كَثيراً، وَسُبْحَانَ اللَّهِ بُكْرَةً وَأَصِيلاً ثَلاثاً أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ: مِنْ نَفْخِهِ، وَنَفْثِهِ، وَهَمْزِهِ.","حصن المسلم للقحطاني","h"],
["الصلاة والطهارة|مجموعة حصن المسلم","دعاء الاستفتاح (6)","اللَّهُمَّ لَكَ الْحَمْدُ، أَنْتَ نُورُ السَّمَوَاتِ وَالأَرْضِ وَمَنْ فِيهِنَّ، وَلَكَ الْحَمْدُ أَنْتَ قَيِّمُ السَّمَوَاتِ وَالأَرْضِ وَمَنْ فِيهِنَّ، [وَلَكَ الْحَمْدُ أَنْتَ رَبُّ السَّمَواتِ وَالأَرْضِ وَمَنْ فِيهِنَّ] [وَلَكَ الْحَمْدُ لَكَ مُلْكُ السَّمَوَاتِ وَالأَرْضِ وَمَنْ فِيهِنَّ] [وَلَكَ الْحَمْدُ أَنْتَ مَلِكُ السَّمَوَاتِ وَالأَرْضِ] [وَلَكَ الْحَمْدُ] [أَنْتَ الْحَقُّ، وَوَعْدُكَ الْحَقُّ، وَقَوْلُكَ الْحَقُّ، وَلِقاؤُكَ الْحَقُّ، وَالْجَنَّةُ حَقٌّ، وَالنَّارُ حَقٌّ، وَالنَّبِيُّونَ حَقٌّ، وَمحَمَّدٌ صلى الله عليه وسلم حَقٌّ، وَالسّاعَةُ حَقٌّ] [اللَّهُمَّ لَكَ أَسْلَمتُ، وَعَلَيْكَ تَوَكَّلْتُ، وَبِكَ آمَنْتُ، وَإِلَيْكَ أَنَبْتُ، وَبِكَ خاصَمْتُ، وَإِلَيْكَ حاكَمْتُ. فَاغْفِرْ لِي مَا قَدَّمْتُ، وَمَا أَخَّرْتُ، وَمَا أَسْرَرْتُ، وَمَا أَعْلَنْتُ] [وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي] [أَنْتَ المُقَدِّمُ، وَأَنْتَ المُؤَخِّرُ لاَ إِلَهَ إِلاَّ أَنْتَ] [أَنْتَ إِلَهِي لاَ إِلَهَ إِلاَّ أَنْتَ] [وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ].","حصن المسلم للقحطاني","h"],
["الصلاة والطهارة|مجموعة حصن المسلم","دعاء الركوع (1)","سُبْحانَ رَبِّيَ الْعَظِيمِ. ثلاث مرَّاتٍ.","حصن المسلم للقحطاني","h",3],

["الصلاة والطهارة|مجموعة حصن المسلم","دعاء الرفع من الركوع (1)","سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ.","حصن المسلم للقحطاني","h"],
["الصلاة والطهارة|مجموعة حصن المسلم","دعاء الرفع من الركوع (3)","مِلْءَ السَّمَوَاتِ وَمِلْءَ الأَرْضِ، وَمَا بَيْنَهُمَا، وَمِلْءَ مَا شِئْتَ مِنْ شَيءٍ بَعْدُ. أَهلَ الثَّناءِ وَالْمَجْدِ، أَحَقُّ مَا قَالَ الْعَبْدُ، وَكُلُّنَا لَكَ عَبْدٌ. اللَّهُمَّ لاَ مَانِعَ لِمَا أَعْطَيْتَ، وَلاَ مُعْطِيَ لِمَا مَنَعْتَ، وَلاَ يَنْفَعُ ذَا الجَدِّ مِنْكَ الجَدُّ.","حصن المسلم للقحطاني","h"],

["جوامع الدعاء|مجموعة حصن المسلم","دعاء سجود التلاوة (1)","سَجَدَ وَجْهِيَ لِلَّذِي خَلَقَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ بِحَوْلِهِ وَقُوَّتِهِ، ﴿فَتَبارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ﴾.","حصن المسلم للقحطاني","h"],
["جوامع الدعاء|مجموعة حصن المسلم","دعاء سجود التلاوة (2)","اللَّهُمَّ اكْتُبْ لِي بِهَا عِنْدَكَ أَجْراً، وَضَعْ عَنِّي بِهَا وِزْراً، وَاجْعَلْهَا لِي عِنْدَكَ ذُخْراً، وَتَقَبَّلْهَا مِنِّي كَمَا تَقَبَّلْتَهَا مِنْ عَبْدِكَ دَاوُدَ.","حصن المسلم للقحطاني","h"],
["الصلاة والطهارة|مجموعة حصن المسلم","الدعاء بعد التشهد الأخير قبل السلام (2)","اللَّهُمَّ إِنِّي أَعوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، وَأَعوذُ بِكَ مِنْ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ، وَأَعوذُ بِكَ مِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ. اللَّهُمَّ إِنِّي أَعوذُ بِكَ مِنَ الْمَأْثَمِ وَالْمَغْرَمِ.","حصن المسلم للقحطاني","h"],
["الصلاة والطهارة|مجموعة حصن المسلم","الدعاء بعد التشهد الأخير قبل السلام (4)","اللَّهُمَّ اغْفِرْ لِي مَا قَدَّمْتُ، وَمَا أَخَّرْتُ، وَمَا أَسْرَرْتُ، وَمَا أَعْلَنْتُ، وَمَا أَسْرَفْتُ، وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي. أَنْتَ الْمُقَدِّمُ، وَأَنْتَ الْمُؤَخِّرُ لاَ إِلَهَ إِلاَّ أَنْتَ.","حصن المسلم للقحطاني","h"],
["الصلاة والطهارة|مجموعة حصن المسلم","الدعاء بعد التشهد الأخير قبل السلام (8)","اللَّهُمَّ بِعِلْمِكَ الغَيْبَ وَقُدْرَتِكَ عَلَى الْخَلقِ أَحْيِنِي مَا عَلِمْتَ الْحَيَاةَ خَيْراً لِي، وَتَوَفَّنِي إِذَا عَلِمْتَ الْوَفَاةَ خَيْراً لِي، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَشْيَتَكَ فِي الْغَيْبِ وَالشَّهَادَةِ، وَأَسْأَلُكَ كَلِمَةَ الْحَقِّ فِي الرِّضَا وَالْغَضَبِ، وَأَسْأَلُكَ الْقَصْدَ فِي الْغِنَى وَالْفَقْرِ، وَأَسْأَلُكَ نَعِيماً لاَ يَنْفَدُ، وَأَسْأَلُكَ قُرَّةَ عَيْنٍ لاَ تَنْقَطِعُ، وَأَسْأَلُكَ الرِّضَا بَعْدَ الْقَضَاءِ، وَأَسْــــأَلُكَ بَرْدَ الْعَيْشِ بَعْدَ الْمَوْتِ، وَأَسْأَلُكَ لَذَّةَ النَّظَرِ إِلَى وَجْهِكَ، وَالشَّوْقَ إِلَى لِقائِكَ فِي غَيرِ ضَرَّاءَ مُضِرَّةٍ، وَلاَ فِتْنَةٍ مُضِلَّةٍ، اللَّهُمَّ زَيِّنَا بِزِينَةِ الإِيمَانِ، وَاجْعَلْنَا هُدَاةً مُهْتَدِينَ.","حصن المسلم للقحطاني","h"],
["الصلاة والطهارة|مجموعة حصن المسلم","الدعاء بعد التشهد الأخير قبل السلام (9)","اللَّهُمَّ إِنِّي أَسْأَلُكَ يَا أَللَّهُ بِأَنَّكَ الْوَاحِدُ الْأَحَدُ الصَّمَدُ الَّذِي لَمْ يَلِدْ وَلَمْ يولَدْ، وَلَمْ يَكنْ لَهُ كُفُواً أَحَدٌ، أَنْ تَغْفِرَ لِي ذُنُوبِي إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِّيمُ.","حصن المسلم للقحطاني","h"],
["الصلاة والطهارة|مجموعة حصن المسلم","الدعاء بعد التشهد الأخير قبل السلام (10)","اللَّهُمَّ إِنِّي أَسْأَلُكَ بِأَنَّ لَكَ الْحَمْدَ لَا إِلَهَ إِلاَّ أَنْتَ وَحْدَكَ لاَ شَرِيكَ لَكَ، الْمَنَّانُ، يَا بَدِيعَ السَّمَوَاتِ وَالْأَرْضِ يَا ذَا الْجَلاَلِ وَالْإِكْرَامِ، يَا حَيُّ يَا قَيُّومُ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ.","حصن المسلم للقحطاني","h"],
["الصلاة والطهارة|مجموعة حصن المسلم","الدعاء بعد التشهد الأخير قبل السلام (11)","اللَّهُمَّ إِنِّي أَسْأَلُكَ بِأَنَّي أَشْهَدُ أَنَّكَ أَنْتَ اللَّهُ لاَ إِلَهَ إِلاَّ أَنْتَ الْأَحَدُ الصَّمَدُ الَّذِي لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُنْ لَهُ كُفُواً أَحَدٌ.","حصن المسلم للقحطاني","h"],
["الصلاة والطهارة|مجموعة حصن المسلم","الأذكار بعد السلام من الصلاة (3)","لَا إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الْحَمدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ، لاَ إِلَهَ إِلاَّ اللَّهُ، وَلاَ نَعْبُدُ إِلاَّ إِيَّاهُ, لَهُ النِّعْمَةُ وَلَهُ الْفَضْلُ وَلَهُ الثَّنَاءُ الْحَسَنُ، لَا إِلَهَ إِلاَّ اللَّهُ مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الكَافِرُونَ.","حصن المسلم للقحطاني","h"],

["هداية وثبات|الصلاة والطهارة|مجموعة حصن المسلم","دعاء صلاة الاستخارة","قَالَ جَابرُ بْنُ عَبْدِ اللَّهِ رَضِيَ اللَّهُ عَنْهُمَا: كَانَ رسُولُ اللَّهِ صلى الله عليه وسلم يُعَلِّمُنَا الْاسْتِخَارَةَ فِي الْأُمُورِ كُلِّهَا كَمَا يُعَلِّمُنَا السُّورَةَ مِنَ الْقُرْآنِ، يَقُولُ: إِذَا هَمَّ أَحَدُكُمْ بِالْأَمْرِ فَلْيَرْكَعْ رَكْعَتَيْنِ مِنْ غَيْرِ الْفَرِيضَةِ، ثُمَّ لْيَقُلْ: اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ العَظِيمِ؛ فَإِنَّكَ تَقْدِرُ وَلاَ أَقْدِرُ، وَتَعْلَمُ وَلاَ أَعْلَمُ، وَأَنْتَ عَلاَّمُ الغُيُوبِ، اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الأمْرَ - وَيُسَمِّي حَاجَتَهُ - خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي – أَوْ قَالَ: عَاجِلِهِ وَآجِلِهِ - فَاقْدُرْهُ لِي وَيَسِّرْهُ لِي ثمَّ بَارِكْ لِي فِيهِ، وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي – أَوْ قَالَ: عَاجِلِهِ وَآجِلِهِ – فَاصْرِفْهُ عَنِّي وَاصْرِفْنِي عَنْهُ وَاقْدُرْ لِيَ الْخَيْرَ حَيْثُ كَانَ، ثُمَّ أَرْضِنِي بِهِ.وَمَا نَدِمَ مَنِ اسْتَخَارَ الْخَالِقَ، وَشَاوَرَ الْمَخْلُوقِينَ الْمُؤْمِنِينَ وَتَثَبَّتَ فِي أَمْرِهِ، فَقَدْ قَالَ اللَّه تعالى: ﴿وَشاوِرْهُمْ فِي الْأَمْرِ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ﴾.","حصن المسلم للقحطاني","h"],

["الصلاة والطهارة|مجموعة حصن المسلم","دعاء قنوت الوتر (3)","اللَّهُمَّ إِيَّاكَ نعْبُدُ، وَلَكَ نُصَلِّي وَنَسْجُدُ، وَإِلَيْكَ نَسْعَى وَنَحْفِدُ، نَرْجُو رَحْمَتَكَ، وَنَخْشَى عَذَابَكَ، إِنَّ عَذَابَكَ بِالكَافِرِينَ مُلْحَقٌ. اللَّهُمَّ إِنَّا نَسْتَعينُكَ، وَنَسْتَغْفِرُكَ، وَنُثْنِي عَلَيْكَ الْخَيْرَ، وَلاَ نَكْفُرُكَ، وَنُؤْمِنُ بِكَ، وَنَخْضَعُ لَكَ، وَنَخْلَعُ مَنْ يَكْفرُكَ.","حصن المسلم للقحطاني","h"],

["الظلم والأعداء|مجموعة حصن المسلم","دعاء من خاف ظلم السلطان (2)","اللَّهُ أَكْبَرُ، اللَّهُ أَعَزُّ مِنْ خَلْقِهِ جَمِيعاً، اللَّهُ أَعَزُّ مِمَّا أَخَافُ وَأَحْذَرُ، أَعُوذُ بِاللَّهِ الَّذِي لاَ إِلَهَ إِلاَّ هُوَ، الْمُمْسِكِ السَّمَوَاتِ السَّبْعِ أَنْ يَقَعْنَ عَلَى الْأَرْضِ إِلاَّ بِإِذْنِهِ، مِنْ شَرِّ عَبْدِكَ فُلاَنٍ، وَجُنُودِهِ وَأَتْبَاعِهِ وَأَشْيَاعِهِ، مِنْ الْجِنِّ وَالإِنْسِ، اللَّهُمَّ كُنْ لِي جَاراً مِنْ شَرِّهِمْ، جَلَّ ثَنَاؤُكَ وَعَزَّ جَارُكَ، وَتَبَارَكَ اسْمُكَ، وَلاَ إِلَهَ غَيْرُكَ (ثلاثَ مرَّاتٍ).","حصن المسلم للقحطاني","h"],

["ذرية وأهل|مجموعة حصن المسلم","تهنئة المولود له وجوابه","بَارَكَ اللَّهُ لَكَ فِي الْمَوْهُوبِ لَكَ، وَشَكَرْتَ الْوَاهِبَ، وَبَلَغَ أَشُدَّهُ، وَرُزِقْتَ بِرَّهُ. وَيَرُدُّ عَلَيْهِ الْمُهَــــــنَّأُ فَيَقُولُ: بَارَكَ اللَّهُ لَكَ وَبَارَكَ عَلَيْكَ، وَجَزَاكَ اللَّهُ خَيْراً، وَرَزَقَكَ اللَّهُ مِثْلَهُ، وَأَجْزَلَ ثَوَابَكَ.","حصن المسلم للقحطاني","h"],

["المرضى والموتى|مجموعة حصن المسلم","فضل عيادة المريض","قَالَ النَّبِيُّ صلى الله عليه وسلم: إِذَا عَادَ الرَّجُلُ أَخَاهُ الْمُسْلِمَ مَشَى فِي خِرَافَةِ الْجَنَّةِ حَتَّى يَجْلِسَ، فَإِذَا جَلَسَ غَمَرَتْهُ الرَّحْمَةُ، فَإِنْ كَانَ غُدْوَةً صَلَّى عَلَيْهِ سَبْعُونَ أَلْفَ مَلَكٍ حَتَّى يُمْسِيَ، وَإِنْ كَانَ مَسَاءً صَلَّى عَلَيْهِ سَبْعُونَ أَلْفَ مَلَكٍ حَتَّى يُصْبِحَ.","حصن المسلم للقحطاني","h"],
["المرضى والموتى|مجموعة حصن المسلم","دعاء المريض الذي يئس من حياته (2)","جَعَلَ النَّبِيُّ صلى الله عليه وسلم عِنْدَ مَوْتِهِ يُدْخِلُ يَدَيْهِ فِي الْمَاءِ فَيَمْسَحُ بِهِمَا وَجْهَهُ، وَيَقُولُ: لاَ إِلَهَ إِلاَّ اللَّهُ إِنَّ لِلْمَوْتِ سَكَرَاتٍ.","حصن المسلم للقحطاني","h"],
["المرضى والموتى|مجموعة حصن المسلم","دعاء المريض الذي يئس من حياته (3)","لاَ إِلَهَ إِلاَّ اللَّهُ وَاللَّهُ أَكْبَرُ، لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ، لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لاَ إِلَهَ إِلاَّ اللَّهُ لَهُ المُلْكُ وَلَهُ الْحَمْدُ، لاَ إِلَهَ إِلاَّ اللَّهُ وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ.","حصن المسلم للقحطاني","h"],

["جوامع الدعاء|مجموعة حصن المسلم","الدعاء للميت في الصلاة عليه (1)","اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ، وَعَافِهِ، وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ، وَوَسِّعْ مُدْخَلَهُ، وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ، وَنَقِّهِ مِنَ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الأَبْيَضَ مِنَ الدَّنَسِ، وَأَبْدِلْهُ دَاراً خَيْراً مِنْ دَارِهِ، وَأَهْلاً خَيْراً مِنْ أَهْلِهِ، وَزَوْجَاً خَيْراً مِنْ زَوْجِهِ، وَأَدْخِلْهُ الْجَنَّةَ، وَأَعِذْهُ مِنْ عَذَابِ القَبْرِ [وَعَذَابِ النَّارِ].","حصن المسلم للقحطاني","h"],
["جوامع الدعاء|مجموعة حصن المسلم","الدعاء للميت في الصلاة عليه (3)","اللَّهُمَّ إِنَّ فُلاَنَ بْنَ فُلاَنٍ فِي ذِمَّتِكَ، وَحَبْلِ جِوَارِكَ، فَقِهِ مِنْ فِتْنَةِ الْقَبْرِ، وَعَذَابِ النَّارِ، وَأَنْتَ أَهْلُ الْوَفَاءِ وَالْحَقِّ، فَاغْفِرْ لَهُ وَارْحَمْهُ إِنَّكَ أَنْتَ الغَفُورُ الرَّحيمُ.","حصن المسلم للقحطاني","h"],
["جوامع الدعاء|مجموعة حصن المسلم","الدعاء للميت في الصلاة عليه (4)","اللَّهُمَّ عَبْدُكَ وَابْنُ أَمَتِكَ احْتَاجَ إِلَى رَحْمَتِكَ، وَأَنْتَ غَنِيٌّ عَنْ عَذَابِهِ، إِنْ كَانَ مُحْسِناً فَزِدْ فِي حَسَنَاتِهِ، وَإِنْ كَانَ مُسِيئاً فَتَجَاوَزْ عَنْهُ.","حصن المسلم للقحطاني","h"],

["أذكار|مجموعة حصن المسلم","فضل التسبيح و التحميد، و التهليل، و التكبير (2)","وَقَالَ صلى الله عليه وسلم: مَنْ قَالَ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ عَشْرَ مِرَارٍ، كَانَ كَمَنْ أَعْتَقَ أَرْبَعَةَ أَنْفُسٍ مِنْ وَلَدِ إِسْمَاعِيلَ.","حصن المسلم للقحطاني","h",10],
["أذكار|مجموعة حصن المسلم","فضل التسبيح و التحميد، و التهليل، و التكبير (3)","وَقَالَ صلى الله عليه وسلم: كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحانَ اللَّهِ الْعَظِيمِ.","حصن المسلم للقحطاني","h"],

["أذكار|مجموعة حصن المسلم","فضل التسبيح و التحميد، و التهليل، و التكبير (5)","وَقَالَ صلى الله عليه وسلم: أَيَعْجِزُ أَحَدُكُم أَنْ يَكْسِبَ كُلَّ يَوْمٍ أَلْفَ حَسَنَةٍ فَسَأَلَهُ سَائِلٌ مِنْ جُلَسَائِهِ كَيْفَ يَكْسِبُ أَحَدُنَا أَلْفَ حَسَنَةٍ؟ قَالَ: يُسَبِّحُ مِائَةَ تَسْبِيحَةٍ، فَيُكتَبُ لَهُ أَلْفُ حَسَنَةٍ أَوْ يُحَطُّ عَنْهُ أَلْفُ خَطِيئَةٍ.","حصن المسلم للقحطاني","h",100],

["أذكار|مجموعة حصن المسلم","فضل التسبيح و التحميد، و التهليل، و التكبير (7)","وَقَالَ صلى الله عليه وسلم: يَا عَبْدَ اللَّهِ بْنَ قَيْسٍ أَلاَ أَدُلُّكَ عَلَى كَنْزٍ مِنْ كُنُوزِ الْجَنَّةِ؟ فَقُلْتُ: بَلَى يَا رَسُولَ اللَّهِ، قَالَ: قُلْ لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ.","حصن المسلم للقحطاني","h"],
["أذكار|مجموعة حصن المسلم","فضل التسبيح و التحميد، و التهليل، و التكبير (8)","وَقَالَ صلى الله عليه وسلم: أَحَبُّ الْكَلاَمِ إِلَى اللَّهِ أَرْبَعٌ: سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلاَ إِلَهَ إِلاَّ اللَّهُ، وَاللَّهُ أَكْبَرُ، لاَ يَضُرُّكَ بِأَيِّهِنَّ بَدَأتَ.","حصن المسلم للقحطاني","h"],
["أذكار|مجموعة حصن المسلم","فضل التسبيح و التحميد، و التهليل، و التكبير (9)","جَاءَ أَعْرَابِيٌّ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَقَالَ: عَلِّمْنِي كَلاماً أَقُولُهُ: قَالَ: قُلْ: لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، اللَّهُ أَكْبَرُ كَبِيراً، وَالْحَمْدُ لِلَّهِ كَثِيراً، سُبْحَانَ اللَّهِ رَبِّ العَالَمِينَ، لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ الْعَزِيزِ الْحَكِيمِ قَالَ: فَهَؤُلاَءِ لِرَبِّي، فَمَا لِي؟ قَالَ: قُلْ: اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاهْدِنِي، وَارْزُقْنِي.","حصن المسلم للقحطاني","h"],
["أذكار|مجموعة حصن المسلم","فضل التسبيح و التحميد، و التهليل، و التكبير (10)","كَانَ الرَّجُلُ إِذَا أَسْلَمَ عَلَّمَهُ النَّبيُّ صلى الله عليه وسلم الصَّلاَةَ ثُمَّ أَمَرَهُ أَنْ يَدْعُوَ بِهَؤُلاَءِ الْكَلِمَاتِ: اللَّهُمَّ اغْفِرِ لِي، وَارْحَمْنِي، وَاهْدِنِي، وَعَافِنِي وَارْزُقْنِي.","حصن المسلم للقحطاني","h"],

["جوامع الدعاء|مجموعة حصن المسلم","كيف كان النبي يسبح؟","عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو رضي الله عنه قَالَ: رَأَيْتُ النَّبيَّ صلى الله عليه وسلم يَعْقِدُ التَّسْبِيحَ وفي زيادةٍ: بِيَمِينِهِ.","حصن المسلم للقحطاني","h"],
["مناسبات وأخلاق|مجموعة حصن المسلم","من أنواع الخير والآداب الجامعة","قَالَ النَّبِيُّ صلى الله عليه وسلم إِذَا كَانَ جُنْحُ اللَّيْلِ – أَوْ أَمْسَيْتُم – فَـكُفُّوا صِبْيانَـكُم، فَإِنَّ الشَّيَاطِينَ تَنْتَشِرُ حِينَئِذٍ، فَإِذَا ذَهَبَ سَاعَةٌ مِنَ اللَّيلِ فَخَلُّوهُمْ، وَأَغْلِقُوا الأَبْوَابَ وَاذْكُرُوا اسْمَ اللَّهِ؛ فَإِنَّ الشَّيطَانَ لاَ يَفْتَحُ بَاباً مُغلَقاً، وَأَوْكُوا قِرَبَكُمْ، وَاذْكُرُوا اسْمَ اللَّهِ، وَخَمِّرُوا آنِيَتَكُم، وَاذْكُرُوا اسْمَ اللَّهِ، وَلَوْ أَنْ تَعْرُضُوا عَلَيْهَا شَيْئاً، وَأَطْفِئُوا مَصَابِيحَكُمْ.","حصن المسلم للقحطاني","h"],
["دلائل الخيرات|هداية وثبات","افتتاح دلائل الخيرات — النية والدعاء (ص ٢–٣)","بسم الله الرحمن الرحيم. الحمد لله رب العالمين، حسبي الله ونعم الوكيل، ولا حول ولا قوة إلا بالله العلي العظيم. اللهم إني أبرأ من حولي ومن قوتي إلى حولك وقوتك. اللهم إني أتقرب إليك بالصلاة على سيدنا محمد عبدك ونبيك ورسولك سيد المرسلين صلى الله تعالى عليه وسلم وعليهم أجمعين، امتثالاً لأمرك، وتصديقاً له، ومحبةً فيه، وشوقاً إليه، وتعظيماً لقدره، ولكونه صلى الله عليه وسلم أهلاً لذلك، فتقبلها مني بفضلك، واجعلني من عبادك الصالحين، ووفقني لقراءتها على الدوام بجاهه عندك، وصلى الله على سيدنا محمد وآله وصحبه أجمعين.","من دلائل الخيرات للجزولي (ص ٢–٣) — صيغة اجتهادية؛ وفي التوسل «بجاهه» خلاف بين العلماء","g"],
["دلائل الخيرات","افتتاح دلائل الخيرات — ما يُقرأ بعد الدعاء (ص ٣–٤)","أستغفر الله العظيم (ثلاثاً). سبحان الله والحمد لله. حسبي الله ونعم الوكيل (ثلاثاً). ثم يقول التالي: أعوذ بالله من الشيطان الرجيم. بسم الله الرحمن الرحيم ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾ (ثلاثاً)، ثم المعوذتين مرة مرة بالبسملة، ثم الفاتحة وأول سورة البقرة ﴿الم ۝ ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ ۝ الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ ۝ وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنزِلَ إِلَيْكَ وَمَا أُنزِلَ مِن قَبْلِكَ وَبِالْآخِرَةِ هُمْ يُوقِنُونَ ۝ أُولَٰئِكَ عَلَىٰ هُدًى مِّن رَّبِّهِمْ ۖ وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ﴾ ثم يقرأ: ﴿وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا﴾ ثم أسماء الله الحسنى.","من دلائل الخيرات للجزولي (ص ٣–٤) — إرشاد القراءة","g"],
["دلائل الخيرات|ثناء وتمجيد|فك الكرب والهم","ثناء ودعاء ختم أسماء الله الحسنى (ص ٦–٩)","الذي تقدست عن الأشباه ذاته، وتنزهت عن مشابهة الأمثال صفاته، واحد لا من قلة، وموجود لا من علة، بالبر معروف، وبالإحسان موصوف، معروف بلا غاية، وموصوف بلا نهاية، أول بلا ابتداء وآخر بلا انتهاء، لا ينسب إليه البنون، ولا يفنيه تداول الأوقات، ولا توهنه السنون، كل المخلوقات قهر عظمته، وأمره بالكاف والنون، بذكره أنس المخلصون، وبرؤيته تقر العيون، وبتوحيده ابتهج الموحدون، هدى أهل طاعته إلى صراط مستقيم، وأباح أهل محبته جنات النعيم، وعلم عدد أنفاس مخلوقاته بعلمه القديم، ويرى حركات أرجل النمل في جنح الليل البهيم، يسبحه الطير في وكره، ويمجده الوحش في قفره، محيط بعمل العبد سره وجهره، وكيل للمؤمنين بتأييده ونصره، وتطمين القلوب الوجلة بذكره وكشف ضره، ومن آياته أن تقوم السماء والأرض بأمره، أحاط بكل شيء علماً، وغفر ذنوب المذنبين كرماً وحلماً، ليس كمثله شيء وهو السميع البصير. اللهم اكفنا السوء بما شئت وكيف شئت، إنك على ما تشاء قدير، يا نعم المولى ويا نعم النصير، غفرانك ربنا وإليك المصير، ولا حول ولا قوة إلا بالله العلي العظيم. سبحانك لا نحصي ثناء عليك أنت كما أثنيت على نفسك، جل وجهك وعز جاهك، يفعل الله ما يشاء بقدرته، ويحكم ما يريد بعزته، يا حي يا قيوم، يا بديع السماوات والأرض، يا ذا الجلال والإكرام، لا إله إلا أنت برحمتك نستغيث ومن عذابك نستجير، يا غياث المستغيثين، لا إله إلا أنت بجاه سيدنا محمد صلى الله عليه وسلم أغثنا وارحمنا ﴿رَحْمَتُ اللَّهِ وَبَرَكَاتُهُ عَلَيْكُمْ أَهْلَ الْبَيْتِ ۚ إِنَّهُ حَمِيدٌ مَّجِيدٌ﴾ ﴿إِنَّمَا يُرِيدُ اللَّهُ لِيُذْهِبَ عَنكُمُ الرِّجْسَ أَهْلَ الْبَيْتِ وَيُطَهِّرَكُمْ تَطْهِيرًا﴾ ﴿إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ ۚ يَا أَيُّهَا الَّذِينَ آمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا﴾","من دلائل الخيرات للجزولي (ص ٦–٩) — صيغة اجتهادية؛ وفي التوسل «بجاه» خلاف بين العلماء","g"],
["أذكار الصباح|أذكار المساء|مجموعة open-azkar","أذكار الصباح (2)","بسم الله الرحمن الرحيم ﴿قُل هُوَ اللهُ أَحَدٌ ۝ اللهُ الصَّمَدُ ۝ لم يلد ولم يولد ۝ ولم يَكُن لَهُ كُفُواً أَحَدٌ﴾ [الإخلاص: ١-٤].","من مجموعة open-azkar","u",3],
["أذكار الصباح|أذكار المساء|مجموعة open-azkar","أذكار الصباح (3)","بسم الله الرحمن الرحيم ﴿قُل أَعوذُ بربِّ الفَلَقِ ۝ مِن شر ما خَلَقَ ۝ ومِن شر غاسِقٍ إِذا وَقَبَ ۝ ومِن شر النَّفّاثاتِ فِي العُقَدِ ۝ ومِن شر حاسِدٍ إِذا حَسَدَ﴾ [الفلق: ١-٥].","من مجموعة open-azkar","u",3],
["أذكار الصباح|أذكار المساء|مجموعة open-azkar","أذكار الصباح (4)","بسم الله الرحمن الرحيم ﴿قُل أعوذُ بربِّ النّاسِ ۝ ملكِ النّاسِ ۝ إلهِ النّاسِ ۝ من شر الوَسواسِ الخَنّاسِ ۝ الذي يوسوِسُ في صدورِ النّاسِ ۝ منَ الجِنَّةِ والنّاسِ﴾ [الناس: ١-٦].","من مجموعة open-azkar","u",3],
["أذكار الصباح|أذكار المساء|مجموعة open-azkar","أذكار المساء (8)","اللَّهُمَّ إني أمسَيت أُشهِدُكَ، وأُشهِدُ حَمَلةَ عَرشِكَ، ومَلائِكَتَكَ، وجميعَ خَلقِكَ: أنكَ أنتَ اللهُ لا إلهَ إلا أنتَ وَحدَكَ لا شَرِيكَ لَكَ، وأن مُحمَّدًا عبدُكَ ورسولُكَ.","من مجموعة open-azkar","u",4],

["رزق وبركة|مجموعة open-azkar","دعاء من السنة — اللَّهُمَّ إني أعوذُ بكَ منَ…","اللَّهُمَّ إني أعوذُ بكَ منَ الكَسلِ والهرمِ والمأْثم والمَغرَمِ، ومنْ فتنَةِ القَبرِ وعذابِ القَبرِ، ومِنْ فتنَةِ النَّارِ وعذابِ النَّارِ، ومنْ شَرِّ فتنَةِ الغنَى، وأعوذُ بكَ منْ فتنَةِ الفقرِ، وأعوذُ بكَ مِنْ فتنَةِ المسِيح الدَّجالِ، اللَّهُمَّ اغسلْ عني خطايايَ بماءِ الثَّلج والبرَدِ، ونقِّ قلبي منَ الخطايَا كما نقيتَ الثَّوْبَ الأبيَضَ منَ الدَّنسِ، وباعِد بيني وبيْنَ خطايايَ كما باعدتَ بينَ المَشْرِقِ والمَغْربِ.","من مجموعة open-azkar","u"],
["جوامع الدعاء|مجموعة open-azkar","دعاء من السنة — اللَّهُمَّ إني أعوذُ بكَ منَ…","اللَّهُمَّ إني أعوذُ بكَ منَ العجزِ والكسلِ، والجُبْن والبخلِ، والهرَمِ وعذابِ القَبرِ، اللَّهُمَّ آتِ نَفسي تقواهَا وزكِّهَا أنتَ خَيرُ منْ زكَّاهَا، أنتَ وليُّهَا ومولاهَا، اللَّهُمَّ إني أعوذُ بكَ منْ علمٍ لا ينفَعُ، ومنْ قلبٍ لا يخشَعُ، ومنْ نفسٍ لا تشبَعُ، ومنْ دعوةٍ لَا يُستجَابُ لها.","من مجموعة open-azkar","u"],
["جوامع الدعاء|مجموعة open-azkar","دعاء من السنة — اللَّهُمَّ لكَ أسلَمْتُ وبكَ آمَنْتُ،…","اللَّهُمَّ لكَ أسلَمْتُ وبكَ آمَنْتُ، وعلَيكَ توكلتُ وإليكَ أَنَبْتُ وبكَ خاصمتُ، اللَّهُمَّ إني أعوذُ بعِزَّتكَ لَا إِلَهَ إِلَّا أنتَ أَنْ تُضلَّنيِ، أنتَ الحَيُّ الذي لَا يموتُ والجنُّ والإِنْسُ يَمُوتُونَ.","من مجموعة open-azkar","u"],
["جوامع الدعاء|مجموعة open-azkar","دعاء من السنة — اللَّهُمَّ اجعلْ لي في قلبي…","اللَّهُمَّ اجعلْ لي في قلبي نوراً، وفي لساني نوراً، وفي سمعي نوراً، وفي بصرِي نوراً، ومن فوقِي نوراً، ومنْ تحتي نوراً، وعن يمينِي نوراً، وعن شِمَالي نوراً، ومن بينِ يدَيَّ نوراً، ومن خلفِي نوراً، واجعَلْ في نَفْسِي نوراً، وأَعظِمْ لِي نوراً.","من مجموعة open-azkar","u"],
["جوامع الدعاء|مجموعة open-azkar","دعاء من السنة — اللَّهُمَّ لكَ الحَمدُ كلهُ، اللَّهُمَّ…","اللَّهُمَّ لكَ الحَمدُ كلهُ، اللَّهُمَّ لا قابضَ لما بسَطْتَ، ولَا باسطَ لما قبضتَ، ولا هادِيَ لما أضللت، ولا مضلَّ لمن هديتَ، ولا معطِيَ لما منعتَ، ولا مانعَ لما أعطَيتَ، ولا مُقَرِّبَ لما باعدتَ، ولا مُبَاعِدَ لما قَرَّبتَ، اللَّهُمَّ ابسط علينا من بركاتكَ ورحمَتِكَ وفضلِكَ ورزقكَ، اللَّهُمَّ إني أسألكَ النَّعيمَ المُقيمَ الذي لا يَحولُ ولا يَزولُ، اللَّهُمَّ إني أسألكَ النعيمَ يومَ العَيلَةِ، والأمنَ يومَ الخوفِ، اللَّهُمَّ إني عائذٌ بكَ من شر ما أعطَيتَنَا وشر ما منعتَنا، اللَّهُمَّ حَبِّبْ إليْنا الإيمَانَ وزيِّنهُ في قلوبنَا، وكرِّهْ إليْنَا الكُفرَ والفُسُوقَ والعِصيانَ، واجعَلنا من الرَّاشدينَ، اللَّهُمَّ توفَّنَا مُسلمينَ، وأحيِنَا مُسلمينَ، وألحقنَا بالصالِحينَ غيرَ خزايا ولا مفتونينَ، اللَّهُمَّ قاتلْ الكَفَرَةَ الذِينَ يُكَذِّبُونَ رُسُلكَ، ويَصُدُّونَ عن سَبيلكَ، واجعَل عَلَيهِم رجزَكَ وعَذَابكَ، اللَّهُمَّ قاتلْ الكَفَرَةَ الذِينَ أوتُوا الْكِتَابَ إلهَ الحَقِّ.","من مجموعة open-azkar","u"],

["جوامع الدعاء|مجموعة open-azkar","دعاء من السنة — اللَّهُمَّ إِني أسألُكَ عيشَةً نَقيَّةً،…","اللَّهُمَّ إِني أسألُكَ عيشَةً نَقيَّةً، وميْتَةً سويَّةً، ومَرَدّاً غير مُخْزٍ ولا فَاضِح.","من مجموعة open-azkar","u"],

["الصلاة على النبي ﷺ|دلائل الخيرات|هداية وثبات","دعاء بدء دلائل الخيرات (ص ٣٣–٣٤)","اللهم إني أتقرب بالصلاة على النبي صلى الله عليه وسلم امتثالاً لأمرك، وتصديقاً لنبيك محمد صلى الله عليه وسلم، ومحبةً فيه، وشوقاً إليه، وتعظيماً لقدره، ولكونه أهلاً لذلك، فتقبلها مني بفضلك وإحسانك، وأزل حجاب الغفلة عن قلبي، واجعلني من عبادك الصالحين. اللهم زده شرفاً على شرفه الذي أوليته، وعزاً على عزه الذي أعطيته، ونوراً على نوره الذي منه خلقته، وأعل مقامه في مقامات المرسلين، ودرجته في درجات النبيين، وأسألك رضاك ورضاه يا رب العالمين، مع العافية الدائمة، والموت على الكتاب والسنة والجماعة، وكلمتي الشهادة على تنفيذها من غير تبديل ولا تغيير، وأعمر لي ما أبقيتني بفضلك وجودك وكرمك يا أرحم الراحمين. وصلى الله على سيدنا محمد خاتم النبيين وإمام المرسلين وعلى آله وصحبه أجمعين، وسلام على المرسلين والحمد لله رب العالمين.","من دلائل الخيرات للجزولي (ص ٣٣–٣٤) — صيغة اجتهادية","g"],
["دلائل الخيرات|هداية وثبات|الآخرة وحسن الخاتمة","دعاء ختام أسماء النبي ﷺ (ص ٣٠)","اللهم يا رب بجاه نبيك المصطفى ورسولك المرتضى طهر قلوبنا من كل وصف يبعدنا عن مشاهدتك ومحبتك، وأمتنا على السنة والجماعة والشوق إلى لقائك يا ذا الجلال والإكرام، وصلى الله على سيدنا ومولانا محمد وعلى آله وصحبه وسلم تسليماً، والحمد لله رب العالمين.","من دلائل الخيرات للجزولي (ص ٣٠) — صيغة اجتهادية؛ وفي التوسل «بجاه» خلاف بين العلماء","g"],

["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الاثنين|حزب الاثنين","حزب الاثنين (٢٦) — الشفاعة الكبرى","اللهم وكما آمنت بسيدنا محمد ولم أره فلا تحرمني في الجنان رؤيته. اللهم تقبل شفاعة سيدنا محمد الكبرى، وارفع درجته العليا، وآته سؤله في الآخرة والأولى كما آتيت سيدنا إبراهيم وسيدنا موسى.","من دلائل الخيرات للجزولي (ص ٤٥–٤٦) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الاثنين|حزب الاثنين","حزب الاثنين (٢٧) — الصلاة والبركة على الآلين","اللهم صل على سيدنا محمد وعلى آل سيدنا محمد كما صليت على سيدنا إبراهيم وعلى آل سيدنا إبراهيم، وبارك على سيدنا محمد وعلى آل سيدنا محمد كما باركت على سيدنا إبراهيم وعلى آل سيدنا إبراهيم إنك حميد مجيد.","من دلائل الخيرات للجزولي (ص ٤٦) — على نسق الصلاة الإبراهيمية الواردة في السنة؛ لفظ «سيدنا» من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الاثنين|حزب الاثنين","حزب الاثنين (٢٨) — على النبيين والمرسلين والملائكة","اللهم صل وسلم وبارك على سيدنا محمد نبيك ورسولك، وسيدنا إبراهيم خليلك وصفيك، وسيدنا موسى كليمك ونجيك، وسيدنا عيسى روحك وكلمتك، وعلى جميع ملائكتك ورسلك وأنبيائك وخيرتك من خلقك، وأصفيائك وخاصتك وأوليائك من أهل أرضك وسمائك.","من دلائل الخيرات للجزولي (ص ٤٦–٤٧) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الاثنين|حزب الاثنين","حزب الاثنين (٢٩) — عدد خلقه ورضاء نفسه","وصلى الله على سيدنا محمد عدد خلقه، ورضاء نفسه، وزنة عرشه، ومداد كلماته، وكما هو أهله، وكلما ذكره الذاكرون وغفل عن ذكره الغافلون، وعلى أهل بيته وعترته الطاهرين وسلم تسليماً.","من دلائل الخيرات للجزولي (ص ٤٧) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الاثنين|حزب الاثنين","حزب الاثنين (٣٠) — عدد ما أمطرت السماء","اللهم صل على سيدنا محمد وعلى أزواجه وذريته وعلى جميع النبيين والمرسلين والملائكة المقربين وجميع عباد الله الصالحين عدد ما أمطرت السماء منذ بنيتها. وصل على سيدنا محمد عدد ما أنبتت الأرض منذ دحوتها. وصل على سيدنا محمد عدد النجوم في السماء فإنك أحصيتها. وصل على سيدنا محمد عدد ما تنفست الأرواح منذ خلقتها. وصل على سيدنا محمد عدد ما خلقت وما تخلق وما أحاط به علمك وأضعاف ذلك. اللهم صل عليهم عدد خلقك ورضاء نفسك وزنة عرشك ومداد كلماتك ومبلغ علمك وآياتك. اللهم صل عليهم صلاة تفوق وتفضل صلاة المصلين عليهم من الخلق أجمعين كفضلك على جميع خلقك. اللهم صل عليهم صلاة دائمة مستمرة الدوام على مر الليالي والأيام، متصلة الدوام لا انقضاء لها ولا انصرام، على مر الليالي والأيام عدد كل وابل وطل.","من دلائل الخيرات للجزولي (ص ٤٧–٤٩) — صيغة اجتهادية من الكتاب","g"],
["دلائل الخيرات|هداية وثبات|حزب الاثنين|حزب الاثنين","دعاء ختام حزب الاثنين (١) — لزوم ملة النبي ﷺ","(يُقال بعد الصلاة على النبي ﷺ) اللهم اجعلني ممن لزم ملة نبيك سيدنا محمد صلى الله عليه وسلم، وعظم حرمته، وأعز كلمته، وحفظ عهده وذمته، ونصر حزبه ودعوته، وكثر تابعيه ورفقته، ووافى زمرته، ولم يخالف سبيله وسنته. اللهم إني أسألك الاستمساك بسنته، وأعوذ بك من الانحراف عما جاء به.","من دلائل الخيرات للجزولي (ص ٥٠) — صيغة اجتهادية من الكتاب","g"],
["دلائل الخيرات|هداية وثبات|فك الكرب والهم|حزب الاثنين|حزب الاثنين","دعاء ختام حزب الاثنين (٢) — العصمة من الفتن","اللهم إني أسألك من خير ما سألك منه سيدنا محمد نبيك ورسولك صلى الله عليه وسلم، وأعوذ بك من شر ما استعاذك منه سيدنا محمد نبيك ورسولك صلى الله عليه وسلم. اللهم اعصمني من شر الفتن، وعافني من جميع المحن، وأصلح مني ما ظهر وما بطن، ونق قلبي من الحقد والحسد، ولا تجعل علي تباعة لأحد.","من دلائل الخيرات للجزولي (ص ٥٠–٥١) — صيغة اجتهادية من الكتاب","g"],
["دلائل الخيرات|رزق وبركة|هداية وثبات|حزب الاثنين|حزب الاثنين","دعاء ختام حزب الاثنين (٣) — الأخذ بأحسن ما تعلم","اللهم إني أسألك الأخذ بأحسن ما تعلم، والترك لسيئ ما تعلم، وأسألك التكفل بالرزق، والزهد في الكفاف، والمخرج بالبيان من كل شبهة، والفلج بالصواب في كل حجة، والعدل في الغضب والرضا، والتسليم لما يجري به القضاء، والاقتصاد في الفقر والغنى، والتواضع في القول والفعل، والصدق في الجد والهزل.","من دلائل الخيرات للجزولي (ص ٥١–٥٢) — صيغة اجتهادية من الكتاب","g"],
["دلائل الخيرات|مغفرة واستغفار|حزب الاثنين|حزب الاثنين","دعاء ختام حزب الاثنين (٤) — ذنوب بيني وبينك","اللهم إن لي ذنوباً فيما بيني وبينك، وذنوباً فيما بيني وبين خلقك. اللهم ما كان لك منها فاغفره لي، وما كان منها لخلقك فتحمله عني، وأغنني بفضلك، إنك واسع المغفرة.","من دلائل الخيرات للجزولي (ص ٥٢) — صيغة اجتهادية من الكتاب","g"],

["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الثلاثاء|حزب الثلاثاء","حزب الثلاثاء (٣) — كما تنبغي وكما تجب","اللهم صل على سيدنا محمد وعلى آل سيدنا محمد عدد من صلى عليه، وصل على سيدنا محمد وعلى آل سيدنا محمد عدد من لم يصل عليه، وصل على سيدنا محمد وعلى آل سيدنا محمد كما تنبغي الصلاة عليه، وصل على سيدنا محمد وعلى آل سيدنا محمد كما تجب الصلاة عليه، وصل على سيدنا محمد وعلى آل سيدنا محمد كما أمرت أن يصلى عليه.","من دلائل الخيرات للجزولي (ص ٥٣–٥٤) — صيغة اجتهادية من الكتاب","g"],

["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الثلاثاء|حزب الثلاثاء","حزب الثلاثاء (٦) — صلاة تدوم بدوامك","اللهم صل على سيدنا محمد وعلى آله بحر أنوارك، ومعدن أسرارك، ولسان حجتك، وعروس مملكتك، وإمام حضرتك، وخاتم أنبيائك، صلاة تدوم بدوامك وتبقى ببقائك، صلاة ترضيك وترضيه وترضى بها عنا يا رب العالمين.","من دلائل الخيرات للجزولي (ص ٥٤) — صيغة اجتهادية من الكتاب","g"],
["ثناء وتمجيد|مجموعة مناجاة","الحمد لله رب العالمين، خلق اللوح…","الحمد لله رب العالمين، خلق اللوح والقلم، وخلق الخلق من عدم، ودبر الأرزاق والآجال بالمقادير وحكم، وجمل الليل بالنجوم في الظُلَمّ.","من مجموعة «مناجاة»","u"],
["ثناء وتمجيد|مجموعة مناجاة","الحمد لله رب العالمين، الذي علا…","الحمد لله رب العالمين، الذي علا فقهر، ومَلَكَ فقدر، وعفا فغفر، وعلِمَ وستر، وهزَمَ ونصر، وخلق ونشر.","من مجموعة «مناجاة»","u"],
["ثناء وتمجيد|مجموعة مناجاة","الحمد لله رب العالمين، صاحب العظمة…","الحمد لله رب العالمين، صاحب العظمة والكبرياء، يعلم ما في البطن والأحشاء، فرق بين العروق والأمعاء، أجرى فيهما الطعام والماء، فسبحانك يا رب الأرض والسماء.","من مجموعة «مناجاة»","u"],
["ثناء وتمجيد|مجموعة مناجاة","الحمد لله رب العالمين، يُحب من…","الحمد لله رب العالمين، يُحب من دعاه خفيا، ويُجيب من ناداه نجيا، ويزيدُ من كان منه حيِيا، ويكرم من كان له وفيا، ويهدى من كان صادق الوعد رضيا.","من مجموعة «مناجاة»","u"],
["الصلاة على النبي ﷺ|مجموعة مناجاة","اللهم صل على نبينا محمد، خير…","اللهم صل على نبينا محمد، خير من صلى وصام، وخير من سجد وقام، وقلبه مُطهرُ من اللمم والآثام، أعطاه ربهُ فصل الخطِاب وجوامع الكلام.","من مجموعة «مناجاة»","u"],
["الصلاة على النبي ﷺ|مجموعة مناجاة","اللهم صل على نبينا محمد، صاحب…","اللهم صل على نبينا محمد، صاحب الكتاب الأبقى، والقلب الأتقى، والثوب الأنقى، خير من هلل ولبى، وأفضل من طاف وسعى، وأعظم من سبح ربهُ الأعلى.","من مجموعة «مناجاة»","u"],
["الصلاة على النبي ﷺ|مجموعة مناجاة","اللهم صل على نبينا محمد، جاع…","اللهم صل على نبينا محمد، جاع فصبر، وربط على بطنه الحجر، ثم أُعطي فشكر، وجاهد وانتصر.","من مجموعة «مناجاة»","u"],
["الصلاة على النبي ﷺ|مجموعة مناجاة","اللهم صل على نبينا محمد، كان…","اللهم صل على نبينا محمد، كان القرآن العظيم حُجته، والصلاة راحته، والصيام بهجته، والصيام سعادته، والصدق حرفته، والأمانة سرته، والخُلق العظيم سيرته.","من مجموعة «مناجاة»","u"],
["الصلاة على النبي ﷺ|مجموعة مناجاة","اللهم صل على نبينا محمد، فاضت…","اللهم صل على نبينا محمد، فاضت من الذكر دمعُ عينيه، وفاح عطر التسبيح من شفتيه، وسبح ربهُ حتى ورم الحصير قدميه، وسُمع تسبيح الحصى بين كفيه.","من مجموعة «مناجاة»","u"],
["الصلاة على النبي ﷺ|مجموعة مناجاة","اللهم صل على نبينا محمد، خير…","اللهم صل على نبينا محمد، خير من دعا واستغفر، وأكرم من تاب وتطهر، أوذي من قومه فصبر، ودعا لهم بالهُدى واصطبر، وفي فتح مكة عفا وغفر.","من مجموعة «مناجاة»","u"],
["الصلاة على النبي ﷺ|مجموعة مناجاة","اللهم صل على نبينا محمد، الذي…","اللهم صل على نبينا محمد، الذي سلم عليه الحجر، وحنَّ إليه الشجر، وانشق له القمر.","من مجموعة «مناجاة»","u"],
["هداية وثبات|مجموعة مناجاة","اللهم اهدنا فيمن هديت، وعافنا فيمن…","اللهم اهدنا فيمن هديت، وعافنا فيمن عافيت، وتولنا فيمن توليت، وبارك لنا فيما أعطيت، وقنا واصرف عنا شر ما قضيت، نستغفرك ونتوب إليك، ونؤمن بك ونتوكل عليك، ونثنى عليك الخير كلهُ أنت الغنى ونحن الفقراءُ إليك.","من مجموعة «مناجاة»","u"],
["مغفرة واستغفار|مجموعة مناجاة","اللهم لك نصلى ونسجُد، وإليك نسعى…","اللهم لك نصلى ونسجُد، وإليك نسعى ونحفد، نرجو رحمتك ونخشى عذابك، إن عذابك الجدّ بالكفارِ مُلحق. يا غفار الذنوب.","من مجموعة «مناجاة»","u"],
["الآخرة وحسن الخاتمة|مغفرة واستغفار|مجموعة مناجاة","اللهم إنا نستغفرك استغفارا يُطهر النفوس…","اللهم إنا نستغفرك استغفارا يُطهر النفوس من أوزارها، ونشهدُ لكَ شهادةً نُحشر تحت ظلالها، وارزقنا حمداً يملأُ الميزان، وشكراً يزيدُنا في الإحسان، وارزقنا تلاوة القرآن بأصدق منطق وأحسن بيان، واجعل قلوبنا له أوعية صفية نقية تقية، واجعل نفوسنا به راضية مرضية، نسألُك بوجهك الكريم، نسألك بوجهك الكريم الفردوس الأعلى، نسألُكَ إيماناً لا يرتد، ونعيمًا لا ينفد، وقرة عين لا تنقطع، ومرافقة نبيك محمد (صلى الله عليه وسلم) في أعلى جِنان الخُلد، يا مَن يُجير ولا يُجار عليه، أجرنا من النار، ومن خزى النار، ومن كل عمل يقربنا إلى النار، وأدخلنا الجنة مع الأبرار، نسألك رضاك والجنة، ونعوذ بك من سخطك والنار.","من مجموعة «مناجاة»","u"],
["دعاء للأمة|هداية وثبات|مجموعة مناجاة","اللهم اجعل القرآن العظيم زادنا وسندنا،…","اللهم اجعل القرآن العظيم زادنا وسندنا، والسُنة المطهرة حبنا ومددنا، واحفظنا من تفرُق كلمتنا، واعصمنا من شتات أمرنا، ولا تجعلنا فِرقًا وشيعا، ولا تجعلنا فرقا وشيعا نُخالف بعضنا، واجعل صلاتنا للبلاء واقية، وللأمراض شافية، واجعل تلاوتنا للقرآن مُنجية، ومن النار كافية، واجعل نفوسنا صافية، وفى الآخرة راضية. يا من لا تضيع عنده الودائع.","من مجموعة «مناجاة»","u"],
["هداية وثبات|مجموعة مناجاة","اللهم إنك وضعت في كل قلبِ…","اللهم إنك وضعت في كل قلبِ ما يشغله، فأودع في قلوبنا ما يشغلُنا بك، وأودع في أسماعنا ما يطمئنُنا بك، وأودع في جوارحنا ما يقربنا منك، وأودع في ألسنتنا ما يهدينا إليك، وأنزع الغِل والشِقاق والنفاق من بيننا، واجعلنا ورثة لخير سلفِنا.","من مجموعة «مناجاة»","u"],
["هداية وثبات|مجموعة مناجاة","يا ربنا، وخالقنا، ورازقنا، اجعلنا ممن…","يا ربنا، وخالقنا، ورازقنا، اجعلنا ممن يسبح بحمدك في كل وقت وحين، وممن يخرون لآياتك سُجداً وباكين، وممن سمع ندائك فكان من المُجيبين المُنيبين، وممن أسلم وجهه طوعًا لرب العالمين، واجعل هذا كلهُ نجاة لنا دُنيا ودين، برحمتك يا أرحم الراحمين.","من مجموعة «مناجاة»","u"],
["هداية وثبات|رزق وبركة|مجموعة مناجاة","يا مُجيب السائلين، نسألُك إخلاص نبيك…","يا مُجيب السائلين، نسألُك إخلاص نبيك إبراهيم الذي وفى، وصدق نبيك إسماعيل الذي بنفسه ضحى، وعفة نبيك يوسف، الذي استعصم واستحيا، وشُكر نبيك سُليمان، الذي حمد وأفنى، ونسألُك قوة في الطاعة، ونسألك قوة في الطاعة والحق مثل هارون وموسى، ونسألُك طهارة نبيك عيسى، الذي أبرأ الأبرص والأعمى، ونسألُك خُلق نبيك محمد (صلى الله عليه وسلم)، الذي دنا من سدرة المُنتهى، واجعلنا يا رب ممن تدبر آياتك، فكان من أولى النُهى، وارزقنا سعادة الدنيا، واجعل الآخرة خير لنا من الأولى، واجعلنا من أصحاب النعيم، والدرجات العُلى، برحمتك يا رب، يا رب.","من مجموعة «مناجاة»","u"],

["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الثلاثاء","حزب الثلاثاء (٢٣) — من بالصلاة عليه تحط الأوزار","اللهم صل على من فاضت من نوره جميع الأنوار. اللهم صل على من بالصلاة عليه تحط الأوزار. اللهم صل على من بالصلاة عليه تنال منازل الأبرار. اللهم صل على من بالصلاة عليه يرحم الكبار والصغار. اللهم صل على من بالصلاة عليه تنعم في هذه الدار وفي تلك الدار. اللهم صل على من بالصلاة عليه تنال رحمة العزيز الغفار. اللهم صل على المنصور المؤيد. اللهم صل على المختار الممجد. اللهم صل على سيدنا ومولانا محمد. اللهم صل على من كان إذا مشى في البر الأقفر تعلقت الوحوش بأذياله. اللهم صل عليه وعلى آله وصحبه وسلم تسليماً، والحمد لله رب العالمين.","من دلائل الخيرات للجزولي (ص ٦٧–٦٨) — صيغة اجتهادية من الكتاب","g"],

["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الثلاثاء","حزب الثلاثاء (٢٤) — واجزه عنا ما هو أهله (حبيبك)","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَسَلِّمْ عَلَيْهِ وَاجْزِهِ عَنَّا مَا هُوَ أَهْلُهُ حَبِيبَكَ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَسَلِّمْ عَلَيْهِ وَاجْزِهِ عَنَّا مَا هُوَ أَهْلُهُ حَبِيبُكَ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَسَلِّمْ عَلَيْهِ وَاجْزِهِ عَنَّا مَا هُوَ أَهْلُهُ حَبِيبِكَ.","من دلائل الخيرات للجزولي (ص ٣٠ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الثلاثاء","حزب الثلاثاء (٢٥) — واجزه عنا ما هو أهله (خليلك)","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا إِبْرَاهِيمَ وَسَلِّمْ عَلَيْهِ وَاجْزِهِ عَنَّا مَا هُوَ أَهْلُهُ خَلِيلَكَ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا إِبْرَاهِيمَ وَسَلِّمْ عَلَيْهِ وَاجْزِهِ عَنَّا مَا هُوَ أَهْلُهُ خَلِيلُكَ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا إِبْرَاهِيمَ وَسَلِّمْ عَلَيْهِ وَاجْزِهِ عَنَّا مَا هُوَ أَهْلُهُ خَلِيلِكَ.","من دلائل الخيرات للجزولي (ص ٣٠–٣١ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الثلاثاء","حزب الثلاثاء (٢٦) — عدد خلقك ورضاء نفسك وكما تحب وترضى له","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ كَمَا صَلَّيْتَ وَرَحِمْتَ وَبَارَكْتَ عَلَى سَيِّدِنَا إِبْرَاهِيمَ فِي الْعَالَمِينَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، عَدَدَ خَلْقِكَ وَرِضَاءَ نَفْسِكَ وَزِنَةَ عَرْشِكَ وَمِدَادَ كَلِمَاتِكَ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ عَدَدَ مَنْ صَلَّى عَلَيْهِ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ عَدَدَ مَنْ لَمْ يُصَلِّ عَلَيْهِ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ عَدَدَ مَا صُلِّيَ عَلَيْهِ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ أَضْعَافَ مَا صُلِّيَ عَلَيْهِ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ كَمَا هُوَ أَهْلُهُ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ كَمَا تُحِبُّ وَتَرْضَىٰ لَهُ.","من دلائل الخيرات للجزولي (ص ٣١ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء","حزب الأربعاء (١) — على روحه في الأرواح وجسده وقبره","اللَّهُمَّ صَلِّ عَلَى رُوحِ سَيِّدِنَا مُحَمَّدٍ فِي الْأَرْوَاحِ، وَعَلَى جَسَدِهِ فِي الْأَجْسَادِ، وَعَلَى قَبْرِهِ فِي الْقُبُورِ، وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ كُلَّمَا ذَكَرَهُ الذَّاكِرُونَ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ كُلَّمَا غَفَلَ عَنْ ذِكْرِهِ الْغَافِلُونَ.","من دلائل الخيرات للجزولي (ص ٣٢ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء","حزب الأربعاء (٢) — النبي الأمي وأزواجه وذريته وأهل بيته","اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ النَّبِيِّ الْأُمِّيِّ وَأَزْوَاجِهِ أُمَّهَاتِ الْمُؤْمِنِينَ وَذُرِّيَّتِهِ وَأَهْلِ بَيْتِهِ صَلَاةً وَسَلَامًا لَا يُحْصَىٰ عَدَدُهُمَا وَلَا يُقْطَعُ مَدَدُهُمَا.","من دلائل الخيرات للجزولي (ص ٣٢ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء","حزب الأربعاء (٣) — عدد ما أحاط به علمك والوسيلة والفضيلة","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ عَدَدَ مَا أَحَاطَ بِهِ عِلْمُكَ وَأَحْصَاهُ كِتَابُكَ، صَلَاةً تَكُونُ لَكَ رِضَاءً، وَلِحَقِّهِ أَدَاءً، وَأَعْطِهِ الْوَسِيلَةَ وَالْفَضِيلَةَ وَالدَّرَجَةَ الرَّفِيعَةَ، وَابْعَثْهُ اللَّهُمَّ الْمَقَامَ الْمَحْمُودَ الَّذِي وَعَدْتَهُ، وَاجْزِهِ عَنَّا مَا هُوَ أَهْلُهُ، وَعَلَى جَمِيعِ إِخْوَانِهِ مِنَ النَّبِيِّينَ وَالصِّدِّيقِينَ وَالشُّهَدَاءِ وَالصَّالِحِينَ.","من دلائل الخيرات للجزولي (ص ٣٢ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء","حزب الأربعاء (٤) — المنزل المقرب وتاج العز والكرامة","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَأَنْزِلْهُ الْمُنْزَلَ الْمُقَرَّبَ يَوْمَ الْقِيَامَةِ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ. اللَّهُمَّ تَوِّجْهُ بِتَاجِ الْعِزِّ وَالرِّضَا وَالْكَرَامَةِ. اللَّهُمَّ أَعْطِ لِسَيِّدِنَا مُحَمَّدٍ أَفْضَلَ مَا سَأَلَكَ لِنَفْسِهِ، وَأَعْطِ لِسَيِّدِنَا مُحَمَّدٍ أَفْضَلَ مَا سَأَلَكَ لَهُ أَحَدٌ مِنْ خَلْقِكَ، وَأَعْطِ لِسَيِّدِنَا مُحَمَّدٍ أَفْضَلَ مَا أَنْتَ مَسْؤُولٌ لَهُ إِلَى يَوْمِ الْقِيَامَةِ.","من دلائل الخيرات للجزولي (ص ٣٢–٣٣ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء","حزب الأربعاء (٥) — الصلاة على الأنبياء والمرسلين","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَآدَمَ وَنُوحٍ وَإِبْرَاهِيمَ وَمُوسَىٰ وَعِيسَىٰ وَمَا بَيْنَهُمْ مِنَ النَّبِيِّينَ وَالْمُرْسَلِينَ، صَلَوَاتُ اللهِ وَسَلَامُهُ عَلَيْهِمْ أَجْمَعِينَ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَآدَمَ وَنُوحٍ وَإِبْرَاهِيمَ وَمُوسَىٰ وَعِيسَىٰ وَمَا بَيْنَهُمْ مِنَ النَّبِيِّينَ وَالْمُرْسَلِينَ، صَلَوَاتُ اللهِ وَسَلَامُهُ عَلَيْهِمْ أَجْمَعِينَ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَآدَمَ وَنُوحٍ وَإِبْرَاهِيمَ وَمُوسَىٰ وَعِيسَىٰ وَمَا بَيْنَهُمْ مِنَ النَّبِيِّينَ وَالْمُرْسَلِينَ، صَلَوَاتُ اللهِ وَسَلَامُهُ عَلَيْهِمْ أَجْمَعِينَ.","من دلائل الخيرات للجزولي (ص ٣٣ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء","حزب الأربعاء (٦) — الصلاة على أبينا آدم وأمنا حواء","اللَّهُمَّ صَلِّ عَلَى أَبِينَا آدَمَ وَأُمِّنَا حَوَّاءَ صَلَاةَ مَلَائِكَتِكَ، وَأَعْطِهِمَا مِنَ الرِّضْوَانِ حَتَّى تُرْضِيَهُمَا، وَاجْزِهِمَا اللَّهُمَّ أَفْضَلَ مَا جَازَيْتَ بِهِ أَبًا وَأُمًّا عَنْ وَلَدَيْهِمَا.","من دلائل الخيرات للجزولي (ص ٣٣ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء","حزب الأربعاء (٧) — الصلاة على الملائكة المقربين وحملة العرش","اللَّهُمَّ صَلِّ عَلَى جِبْرِيلَ وَمِيكَائِيلَ وَإِسْرَافِيلَ وَعِزْرَائِيلَ، وَحَمَلَةِ الْعَرْشِ، وَعَلَى الْمَلَائِكَةِ وَالْمُقَرَّبِينَ وَعَلَى جَمِيعِ الْأَنْبِيَاءِ وَالْمُرْسَلِينَ صَلَوَاتُ اللهِ وَسَلَامُهُ عَلَيْهِمْ أَجْمَعِينَ. اللَّهُمَّ صَلِّ عَلَى جِبْرِيلَ وَمِيكَائِيلَ وَإِسْرَافِيلَ وَعِزْرَائِيلَ، وَحَمَلَةِ الْعَرْشِ، وَعَلَى الْمَلَائِكَةِ وَالْمُقَرَّبِينَ وَعَلَى جَمِيعِ الْأَنْبِيَاءِ وَالْمُرْسَلِينَ صَلَوَاتُ اللهِ وَسَلَامُهُ عَلَيْهِمْ أَجْمَعِينَ. اللَّهُمَّ صَلِّ عَلَى جِبْرِيلَ وَمِيكَائِيلَ وَإِسْرَافِيلَ وَعِزْرَائِيلَ، وَحَمَلَةِ الْعَرْشِ، وَعَلَى الْمَلَائِكَةِ وَالْمُقَرَّبِينَ وَعَلَى جَمِيعِ الْأَنْبِيَاءِ وَالْمُرْسَلِينَ صَلَوَاتُ اللهِ وَسَلَامُهُ عَلَيْهِمْ أَجْمَعِينَ.","من دلائل الخيرات للجزولي (ص ٣٣–٣٤ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء","حزب الأربعاء (٨) — عدد ما علمت وصلاة موصولة بالمزيد","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ عَدَدَ مَا عَلِمْتَ وَمِلْءَ مَا عَلِمْتَ وَزِنَةَ مَا عَلِمْتَ وَمِدَادَ كَلِمَاتِكَ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ صَلَاةً مَوْصُولَةً بِالْمَزِيدِ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ صَلَاةً لَا تَنْقَطِعُ أَبَدَ الْآبَادِ وَلَا تَبِيدُ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ صَلَاتَكَ الَّتِي صَلَّيْتَ عَلَيْهِ، وَسَلِّمْ عَلَى سَيِّدِنَا مُحَمَّدٍ سَلَامَكَ الَّذِي سَلَّمْتَ عَلَيْهِ، وَاجْزِهِ عَنَّا مَا هُوَ أَهْلُهُ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ صَلَاةً تُرْضِيكَ وَتُرْضِيهِ، وَتَرْضَىٰ بِهَا عَنَّا، وَاجْزِهِ عَنَّا مَا هُوَ أَهْلُهُ.","من دلائل الخيرات للجزولي (ص ٣٤ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء","حزب الأربعاء (٩) — عدد ما في علم الله وكما صليت على إبراهيم","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ عَدَدَ مَا فِي عِلْمِ اللَّهِ صَلَاةً دَائِمَةً بِدَوَامِ مُلْكِ اللَّهِ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى سَيِّدِنَا إِبْرَاهِيمَ، وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى سَيِّدِنَا إِبْرَاهِيمَ فِي الْعَالَمِينَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، عَدَدَ خَلْقِكَ، وَرِضَاءَ نَفْسِكَ، وَزِنَةَ عَرْشِكَ، وَمِدَادَ كَلِمَاتِكَ، وَعَدَدَ مَا ذَكَرَكَ بِهِ خَلْقُكَ فِيمَا مَضَىٰ، وَعَدَدَ مَا هُمْ ذَاكِرُونَكَ بِهِ فِيمَا بَقِيَ، فِي كُلِّ سَنَةٍ وَشَهْرٍ وَجُمْعَةٍ، وَيَوْمٍ وَلَيْلَةٍ وَسَاعَةٍ مِنَ السَّاعَاتِ، وَشَمٍّ وَنَفَسٍ، وَطَرْفَةٍ وَلَمْحَةٍ، مِنَ الْأَبَدِ إِلَى الْأَبَدِ، وَآبَادِ الدُّنْيَا، وَآبَادِ الْآخِرَةِ، وَأَكْثَرَ مِنْ ذَلِكَ، لَا يَنْقَطِعُ أَوَّلُهُ، وَلَا يَنْفَدُ آخِرُهُ.","من دلائل الخيرات للجزولي (ص ٣٤–٣٥ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء","حزب الأربعاء (١٠) — على قدر حبك فيه وعنايتك به","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ عَلَى قَدْرِ حُبِّكَ فِيهِ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ عَلَى قَدْرِ عِنَايَتِكَ بِهِ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ حَقَّ قَدْرِهِ وَمِقْدَارِهِ.","من دلائل الخيرات للجزولي (ص ٣٥ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء|فك الكرب والهم","حزب الأربعاء (١١) — صلاة تنجينا من الأهوال وتقضي الحاجات","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ، صَلَاةً تُنَجِّينَا بِهَا مِنْ جَمِيعِ الْأَهْوَالِ وَالْآفَاتِ، وَتَقْضِي لَنَا بِهَا جَمِيعَ الْحَاجَاتِ، وَتُطَهِّرُنَا بِهَا مِنْ جَمِيعِ السَّيِّئَاتِ، وَتَرْفَعُنَا بِهَا أَعْلَى الدَّرَجَاتِ، وَتُبَلِّغُنَا بِهَا أَقْصَى الْغَايَاتِ، مِنْ جَمِيعِ الْخَيْرَاتِ، فِي الْحَيَاةِ وَبَعْدَ الْمَمَاتِ.","من دلائل الخيرات للجزولي (ص ٣٥ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء","حزب الأربعاء (١٢) — صلاة الرضى والسابق للخلق نوره","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ، صَلَاةَ الرِّضَىٰ، وَارْضَ عَنْ أَصْحَابِهِ رِضَاءَ الرِّضَىٰ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ السَّابِقِ لِلْخَلْقِ نُورُهُ، وَرَحْمَةٌ لِلْعَالَمِينَ ظُهُورُهُ، عَدَدَ مَنْ مَضَىٰ مِنْ خَلْقِكَ وَمَنْ بَقِيَ، وَمَنْ سَعِدَ مِنْهُمْ وَمَنْ شَقِيَ، صَلَاةً تَسْتَغْرِقُ الْعَدَّ، وَتُحِيطُ بِالْحَدِّ، صَلَاةً لَا غَايَةَ لَهَا وَلَا مُنْتَهَىٰ وَلَا انْقِضَاءَ، صَلَاةً دَائِمَةً بِدَوَامِكَ، وَعَلَى آلِهِ وَصَحْبِهِ وَسَلَّمَ تَسْلِيمًا مِثْلَ ذَلِكَ.","من دلائل الخيرات للجزولي (ص ٣٥–٣٦ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء","حزب الأربعاء (١٣) — الذي ملأت قلبه من جلالك وعينه من جمالك","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ الَّذِي مَلَأْتَ قَلْبَهُ مِنْ جَلَالِكَ، وَعَيْنَهُ مِنْ جَمَالِكَ، فَأَصْبَحَ فَرِحًا مُؤَيَّدًا مَنْصُورًا، وَعَلَى آلِهِ وَصَحْبِهِ وَسَلَّمَ تَسْلِيمًا، وَالْحَمْدُ لِلَّهِ عَلَى ذَلِكَ.","من دلائل الخيرات للجزولي (ص ٣٦ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],

["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء|مغفرة واستغفار","حزب الأربعاء (١٥) — بركة الصلاة عليه والورود على حوضه","اللَّهُمَّ بِبَرَكَةِ الصَّلَاةِ عَلَيْهِ اجْعَلْنَا بِالصَّلَاةِ عَلَيْهِ مِنَ الْفَائِزِينَ، وَعَلَى حَوْضِهِ مِنَ الْوَارِدِينَ الشَّارِبِينَ، وَبِسُنَّتِهِ وَطَاعَتِهِ مِنَ الْعَامِلِينَ، وَلَا تَحُلْ بَيْنَنَا وَبَيْنَهُ يَوْمَ الْقِيَامَةِ يَا رَبَّ الْعَالَمِينَ، وَاغْفِرْ لَنَا وَلِوَالِدِينَا وَلِجَمِيعِ الْمُسْلِمِينَ، الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ.","من دلائل الخيرات للجزولي (ص ٣٦ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],

["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء","حزب الأربعاء (٢٠) — كما صليت على إبراهيم وكلما ذكره الذاكرون","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى سَيِّدِنَا إِبْرَاهِيمَ وَعَلَى آلِ سَيِّدِنَا إِبْرَاهِيمَ فِي الْعَالَمِينَ، إِنَّكَ حَمِيدٌ مَجِيدٌ. وَصَلِّ اللَّهُمَّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ كُلَّمَا ذَكَرَهُ الذَّاكِرُونَ، وَغَفَلَ عَنْ ذِكْرِهِ الْغَافِلُونَ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ، وَارْحَمْ سَيِّدَنَا مُحَمَّدًا وَآلَ سَيِّدِنَا مُحَمَّدٍ، وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ، كَمَا صَلَّيْتَ وَرَحِمْتَ وَبَارَكْتَ عَلَى سَيِّدِنَا إِبْرَاهِيمَ وَعَلَى آلِ سَيِّدِنَا إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ.","من دلائل الخيرات للجزولي (ص ٣٧–٣٨ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء","حزب الأربعاء (٢١) — النبي الأمي الطاهر المطهر ومن ختمت به الرسالة","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ النَّبِيِّ الْأُمِّيِّ الطَّاهِرِ الْمُطَهَّرِ وَعَلَى آلِهِ وَسَلِّمْ. اللَّهُمَّ صَلِّ عَلَى مَنْ خَتَمْتَ بِهِ الرِّسَالَةَ، وَأَيَّدْتَهُ بِالنَّصْرِ وَالْكَوْثَرِ وَالشَّفَاعَةِ.","من دلائل الخيرات للجزولي (ص ٣٨ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء","حزب الأربعاء (٢٢) — نبي الحكم والحكمة وأفضل صلوات الله","اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا وَمَوْلَانَا مُحَمَّدٍ نَبِيِّ الْحُكْمِ وَالْحِكْمَةِ السِّرَاجِ الْوَهَّاجِ، الْمَخْصُوصِ بِالْخُلُقِ الْعَظِيمِ وَخَتْمِ الرُّسُلِ ذِي الْمِعْرَاجِ، وَعَلَى آلِهِ وَأَصْحَابِهِ وَأَتْبَاعِهِ السَّالِكِينَ عَلَى مَنْهَجِهِ الْقَوِيمِ، فَأَعْظِمِ اللَّهُمَّ بِهِ مِنْهَاجَ نُجُومِ الْإِسْلَامِ وَمَصَابِيحِ الظَّلَامِ، الْمُهْتَدَىٰ بِهِمْ فِي ظُلْمَةِ لَيْلِ الشَّكِّ الدَّاجِ، صَلَاةً دَائِمَةً مُسْتَمِرَّةً مَا تَلَاطَمَتْ فِي الْأَبْحُرِ الْأَمْوَاجُ، وَطَافَ بِالْبَيْتِ الْعَتِيقِ مِنْ كُلِّ فَجٍّ عَمِيقٍ الْحُجَّاجُ، وَأَفْضَلُ الصَّلَاةِ وَالتَّسْلِيمِ عَلَى سَيِّدِنَا مُحَمَّدٍ رَسُولِهِ الْكَرِيمِ، وَصَفْوَتِهِ مِنَ الْعِبَادِ، وَشَفِيعِ الْخَلَائِقِ فِي الْمِيعَادِ، صَاحِبِ الْمَقَامِ الْمَحْمُودِ، وَالْحَوْضِ الْمَوْرُودِ، النَّاهِضِ بِأَعْبَاءِ الرِّسَالَةِ وَالتَّبْلِيغِ الْأَعَمِّ، وَالْمَخْصُوصِ بِشَرَفِ السِّعَايَةِ فِي الصَّلَاحِ الْأَعْظَمِ، صَلَّى اللَّهُ عَلَيْهِ وَعَلَى آلِهِ صَلَاةً دَائِمَةً مُسْتَمِرَّةَ الدَّوَامِ عَلَى مَرِّ اللَّيَالِي وَالْأَيَّامِ، فَهُوَ سَيِّدُ الْأَوَّلِينَ وَالْآخِرِينَ، وَأَفْضَلُ الْأَوَّلِينَ وَالْآخِرِينَ، عَلَيْهِ أَفْضَلُ صَلَاةِ الْمُصَلِّينَ، وَأَزْكَى سَلَامِ الْمُسَلِّمِينَ، وَأَطْيَبُ ذِكْرِ الذَّاكِرِينَ، وَأَفْضَلُ صَلَوَاتِ اللَّهِ وَأَحْسَنُ صَلَوَاتِ اللَّهِ، وَأَجَلُّ صَلَوَاتِ اللَّهِ، وَأَجْمَلُ صَلَوَاتِ اللَّهِ، وَأَكْمَلُ صَلَوَاتِ اللَّهِ، وَأَسْبَغُ صَلَوَاتِ اللَّهِ، وَأَتَمُّ صَلَوَاتِ اللَّهِ، وَأَظْهَرُ صَلَوَاتِ اللَّهِ، وَأَعْظَمُ صَلَوَاتِ اللَّهِ، وَأَذْكَى صَلَوَاتِ اللَّهِ، وَأَطْيَبُ صَلَوَاتِ اللَّهِ، وَأَبْرَكُ صَلَوَاتِ اللَّهِ، وَأَزْكَى صَلَوَاتِ اللَّهِ، وَأَنْمَى صَلَوَاتِ اللَّهِ، وَأَوْفَى صَلَوَاتِ اللَّهِ، وَأَسْنَى صَلَوَاتِ اللَّهِ، وَأَعْلَى صَلَوَاتِ اللَّهِ، وَأَكْثَرُ صَلَوَاتِ اللَّهِ، وَأَجْمَعُ صَلَوَاتِ اللَّهِ، وَأَعَمُّ صَلَوَاتِ اللَّهِ، وَأَدْوَمُ صَلَوَاتِ اللَّهِ، وَأَبْقَى صَلَوَاتِ اللَّهِ، وَأَعَزُّ صَلَوَاتِ اللَّهِ، وَأَرْفَعُ صَلَوَاتِ اللَّهِ، وَأَعْظَمُ صَلَوَاتِ اللَّهِ.","من دلائل الخيرات للجزولي (ص ٣٨–٣٩ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء","حزب الأربعاء (٢٣) — على أفضل خلق الله ورسول الله وحبيب الله","عَلَى أَفْضَلِ خَلْقِ اللَّهِ وَأَحْسَنِ خَلْقِ اللَّهِ وَأَجَلِّ خَلْقِ اللَّهِ وَأَكْرَمِ خَلْقِ اللَّهِ وَأَجْمَلِ خَلْقِ اللَّهِ وَأَكْمَلِ خَلْقِ اللَّهِ وَأَتَمِّ خَلْقِ اللَّهِ وَأَعْظَمِ خَلْقِ اللَّهِ عِنْدَ اللَّهِ، رَسُولِ اللَّهِ، وَنَبِيِّ اللَّهِ، وَحَبِيبِ اللَّهِ، وَصَفِيِّ اللَّهِ، وَنَجِيِّ اللَّهِ، وَخَلِيلِ اللَّهِ، وَوَلِيِّ اللَّهِ، وَأَمِينِ اللَّهِ، وَخِيرَةِ اللَّهِ مِنْ خَلْقِ اللَّهِ، وَنُخْبَةِ اللَّهِ مِنْ بَرِيَّةِ اللَّهِ، وَصَفْوَةِ اللَّهِ مِنْ أَنْبِيَاءِ اللَّهِ، وَعُرْوَةِ اللَّهِ، وَعِصْمَةِ اللَّهِ، وَنِعْمَةِ اللَّهِ، وَمِفْتَاحِ رَحْمَةِ اللَّهِ، الْمُخْتَارِ مِنْ رُسُلِ اللَّهِ، الْمُنْتَخَبِ مِنْ خَلْقِ اللَّهِ، الْفَائِزِ بِالْمَطْلَبِ فِي الْمَرْهَبِ وَالْمَرْغَبِ، الْمُخْلَصِ فِيمَا وُهِبَ، أَكْرَمِ مَبْعُوثٍ، أَصْدَقِ قَائِلٍ، أَنْجَحِ شَافِعٍ، أَفْضَلِ مُشَفَّعٍ، الْأَمِينِ فِيمَا اسْتُودِعَ، الصَّادِقِ فِيمَا بَلَّغَ، الصَّادِعِ بِأَمْرِ رَبِّهِ، الْمُضْطَلِعِ بِمَا حُمِّلَ، أَقْرَبِ رُسُلِ اللَّهِ إِلَى اللَّهِ وَسِيلَةً، وَأَعْظَمِهِمْ غَدًا عِنْدَ اللَّهِ مَنْزِلَةً وَفَضِيلَةً، وَأَكْرَمِ أَنْبِيَاءِ اللَّهِ الْكِرَامِ الصَّفْوَةِ عَلَى اللَّهِ، وَأَحَبِّهِمْ إِلَى اللَّهِ، وَأَقْرَبِهِمْ زُلْفَىٰ لَدَى اللَّهِ، وَأَكْرَمِ الْخَلْقِ عَلَى اللَّهِ، وَأَحْظَاهُمْ وَأَرْضَاهُمْ لَدَىٰ اللَّهِ، وَأَعْلَى النَّاسِ قَدْرًا، وَأَعْظَمِهِمْ مَحَلًّا، وَأَكْمَلِهِمْ مَحَاسِنًا وَفَضْلًا، وَأَفْضَلِ الْأَنْبِيَاءِ دَرَجَةً، وَأَكْمَلِهِمْ شَرِيعَةً، وَأَشْرَفِ الْأَنْبِيَاءِ نِصَابًا، وَأَبْيَنِهِمْ بَيَانًا وَخِطَابًا، وَأَفْضَلِهِمْ مَوْلِدًا وَمُهَاجَرًا وَعِتْرَةً وَأَصْحَابًا، وَأَكْرَمِ النَّاسِ أُرُومَةً، وَأَشْرَفِهِمْ جُرْثُومَةً، وَخَيْرِهِمْ نَفْسًا، وَأَطْهَرِهِمْ قَلْبًا، وَأَصْدَقِهِمْ قَوْلًا، وَأَزْكَاهُمْ فِعْلًا، وَأَثْبَتِهِمْ أَصْلًا، وَأَوْفَاهُمْ عَهْدًا، وَأَمْكَنِهِمْ مَجْدًا، وَأَكْرَمِهِمْ طَبْعًا، وَأَحْسَنِهِمْ صُنْعًا، وَأَطْيَبِهِمْ فَرْعًا، وَأَكْثَرِهِمْ طَاعَةً وَسَمْعًا، وَأَعْلَاهُمْ مَقَامًا، وَأَحْلَاهُمْ كَلَامًا، وَأَزْكَاهُمْ سَلَامًا، وَأَجَلِّهِمْ قَدْرًا، وَأَعْظَمِهِمْ فَخْرًا، وَأَسْنَاهُمْ فَخْرًا، وَأَرْفَعِهِمْ فِي الْمَلَإِ الْأَعْلَى ذِكْرًا، وَأَوْفَاهُمْ عَهْدًا، وَأَصْدَقِهِمْ وَعْدًا، وَأَكْثَرِهِمْ شُكْرًا، وَأَعْلَاهُمْ أَمْرًا، وَأَجْمَلِهِمْ صَبْرًا، وَأَحْسَنِهِمْ خَيْرًا، وَأَقْرَبِهِمْ يُسْرًا، وَأَبْعَدِهِمْ مَكَانًا، وَأَعْظَمِهِمْ شَأْنًا، وَأَثْبَتِهِمْ بُرْهَانًا، وَأَرْجَحِهِمْ مِيزَانًا، وَأَوَّلِهِمْ إِيمَانًا، وَأَوْضَحِهِمْ بَيَانًا، وَأَفْصَحِهِمْ لِسَانًا، وَأَظْهَرِهِمْ سُلْطَانًا.","من دلائل الخيرات للجزولي (ص ٣٩–٤١ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],

["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الخميس","حزب الخميس (٢) — صلاة تكون لك رضاء وله جزاء","اللَّهُمَّ صَلِّ عَلَى آلِ سَيِّدِنَا مُحَمَّدٍ وَعَلَى سَيِّدِنَا مُحَمَّدٍ صَلَاةً تَكُونُ لَكَ رِضَاءً، وَلَهُ جَزَاءً، وَلِحَقِّهِ أَدَاءً، وَأَعْطِهِ الْوَسِيلَةَ وَالْفَضِيلَةَ وَالْمَقَامَ الْمَحْمُودَ الَّذِي وَعَدْتَهُ، وَاجْزِهِ عَنَّا مَا هُوَ أَهْلُهُ، وَاجْزِهِ أَفْضَلَ مَا جَازَيْتَ نَبِيًّا عَنْ قَوْمِهِ، وَرَسُولًا عَنْ أُمَّتِهِ، وَصَلِّ عَلَى جَمِيعِ إِخْوَانِهِ مِنَ النَّبِيِّينَ وَالصَّالِحِينَ يَا أَرْحَمَ الرَّاحِمِينَ.","من دلائل الخيرات للجزولي (ص ٤٢ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],

["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الخميس","حزب الخميس (٤) — ابعثه مقامًا محمودًا وأعطه الفضل والفضيلة","اللَّهُمَّ ابْعَثْهُ مَقَامًا مَحْمُودًا تُزْلِفُ بِهِ قُرْبَهُ، وَتُقِرُّ بِهِ عَيْنَهُ، يَغْبِطُهُ بِهِ الْأَوَّلُونَ وَالْآخِرُونَ. اللَّهُمَّ أَعْطِهِ الْفَضْلَ وَالْفَضِيلَةَ، وَالشَّرَفَ وَالْوَسِيلَةَ، وَالدَّرَجَةَ الرَّفِيعَةَ، وَالْمَنْزِلَةَ الشَّامِخَةَ.","من دلائل الخيرات للجزولي (ص ٤٢ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب","g"],
