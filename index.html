["الرقية الشرعية","الفاتحة — رقية","﴿بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ۝ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ۝ الرَّحْمَٰنِ الرَّحِيمِ ۝ مَالِكِ يَوْمِ الدِّينِ ۝ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ۝ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ۝ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ﴾","الفاتحة — رُقي بها اللديغ (البخاري ومسلم)","q"],
["الرقية الشرعية","آية الكرسي","﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾","البقرة ٢٥٥","q"],

["الرقية الشرعية","التعوذ بكلمات الله التامات","أعوذُ بكلماتِ اللهِ التامَّاتِ من شرِّ ما خلق.","مسلم","h"],
["الرقية الشرعية","رقية الأطفال","أُعيذُكما بكلماتِ اللهِ التامَّة، من كلِّ شيطانٍ وهامَّة، ومن كلِّ عينٍ لامَّة.","البخاري","h"],
["الرقية الشرعية","الحفظ من كل ضرر","بسمِ اللهِ الذي لا يضرُّ مع اسمِه شيءٌ في الأرضِ ولا في السماءِ وهو السميعُ العليم. (ثلاث مرات صباحًا ومساءً)","أبو داود والترمذي","h"],
["دعاء عام","تفريج الهموم وقضاء الحوائج","اللهم لا تدعْ لنا ذنبًا إلا غفرتَه، ولا همًّا إلا فرَّجتَه، ولا دَيْنًا إلا قضيتَه، ولا مريضًا إلا شفيتَه، ولا حاجةً من حوائج الدنيا والآخرة إلا قضيتَها برحمتك يا أرحم الراحمين.","صياغة اجتهادية — غير منسوبة لأحد","g"]
];
/* ===== المحرك ===== */
const $=s=>document.querySelector(s);let S={fav:[],fs:1.35,n:0,tk:1},cat="الكل",kw="";
try{S=Object.assign(S,JSON.parse(localStorage.getItem("mnj")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("mnj",JSON.stringify(S))}catch(e){}};
const norm=s=>s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED﴿﴾۝]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي");
const toast=m=>{const t=$("#ts");t.textContent=m;t.classList.add("s");setTimeout(()=>t.classList.remove("s"),1400)};
const tk=s=>S.tk?s.replace(/([\u064B-\u065F\u0670\u06D6-\u06ED]+)/g,'<span class="k">$1</span>'):s;
const id=i=>D[i][1]+"|"+D[i][3];
const label=d=>d[4]=="q"?"قرآن كريم — "+d[3]:d[4]=="h"?"حديث شريف — "+d[3]:d[4]=="u"?"غير معروف المصدر"+(d[3]?" — "+d[3]:""):d[3];
function apply(){document.documentElement.style.setProperty("--fs",S.fs+"rem");document.body.className=(S.n?"n ":"")+(S.tk==2?"g2":"")}
function chips(){const cs=["الكل","★ المفضلة",...new Set(D.flatMap(d=>d[0].split("|")))];$("#ch").innerHTML=cs.map(c=>`<button class="${c==cat?"on":""}" data-c="${c}">${c}</button>`).join("")}
function card(d,i,hero){const f=S.fav.includes(id(i));
return `<div class="${hero?"hero":"card"} ${d[4]=="q"?"q":""}">${hero?"<small>دعاء اليوم</small>":""}<h2>${d[1]}</h2><div class="tx">${tk(d[2])}</div><span class="bd ${d[4]=="g"||d[4]=="u"?"g":""}">${label(d)}</span><div class="act"><button data-a="cp" data-i="${i}">نسخ</button><button data-a="sh" data-i="${i}">مشاركة</button><button class="${f?"fv":""}" data-a="fv" data-i="${i}">${f?"★ في المفضلة":"☆ للمفضلة"}</button></div></div>`}
function render(){const k=norm(kw.trim());const ix=D.map((d,i)=>i).filter(i=>{const d=D[i];
if(cat=="★ المفضلة"&&!S.fav.includes(id(i)))return false;if(cat!="الكل"&&cat!="★ المفضلة"&&!d[0].split("|").includes(cat))return false;
return !k||norm(d[1]+" "+d[2]+" "+d[0]).includes(k)});
const t=Math.floor(Date.now()/864e5)%D.length;
$("#hero").innerHTML=(!k&&cat=="الكل")?card(D[t],t,1):"";
$("#list").innerHTML=ix.length?ix.map(i=>card(D[i],i)).join(""):`<div class="empty">${cat=="★ المفضلة"?"لم تضف أدعية للمفضلة بعد. اضغط ☆ تحت أي دعاء.":"لا نتائج. جرّب كلمة أخرى."}</div>`}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.c){cat=b.dataset.c;chips();render();return}
if(b.id=="fp"){S.fs=Math.min(2.4,S.fs+.15);apply();save()}
if(b.id=="fm"){S.fs=Math.max(1,S.fs-.15);apply();save()}
if(b.id=="tkb"){S.tk=(S.tk+1)%3;apply();save();render()}
if(b.id=="nm"){S.n=S.n?0:1;apply();save()}
const i=b.dataset.i,d=D[i];if(!d)return;const tx=d[1]+"\n\n"+d[2]+"\n\n("+label(d)+")\n\nمن تطبيق مناجاة";
if(b.dataset.a=="cp"){try{await navigator.clipboard.writeText(tx);toast("تم النسخ")}catch(x){toast("تعذّر النسخ")}}
if(b.dataset.a=="sh"){if(navigator.share){try{await navigator.share({text:tx})}catch(x){}}else{try{await navigator.clipboard.writeText(tx);toast("تم النسخ للمشاركة")}catch(x){}}}
if(b.dataset.a=="fv"){const k=id(i),p=S.fav.indexOf(k);p<0?S.fav.push(k):S.fav.splice(p,1);save();render()}});
$("#q").addEventListener("input",e=>{kw=e.target.value;render()});
apply();chips();render();
if("serviceWorker"in navigator&&location.protocol.indexOf("http")==0)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
