["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (٢١) — اللهم إنك ولي حميد. جواد وفي", "اللهم إنك ولي حميد. جواد وفي مجيد. كاشف الكربات. وباسط الخيرات. ومجيب الدعوات. ورب الأرضين والسموات. قولك الحق. ووعدك الصدق. وقد وعدت بالنجاة عبادك المؤمنين. لا إله إلا أنت سبحانك إني كنت من الظالمين. وعدك وعدك يا رب العالمين. يا فالق الحب والنوى لا أضل وبك أهتدي. ولا أغوى وبسلطانك أقتدي. يا حي قبل كل حي. ويا حي بعد كل حي. ويا حي حين لا حي في ديمومية ملكه وبقائه يا مالك يوم الدين. إياك نعبد وإياك نستعين.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (٢٢) — يا إلهنا وإله كل شيء إلها", "يا إلهنا وإله كل شيء إلها واحدا لا إله إلا أنت تعالى قدس ذاتك. فامتلأ الكون بأنوارك وأسرارك وهباتك. يا من هو الأول الآخر الباطن الظاهر المقدم المؤخر المقدر والمدبر المحيط العالم الرب الشهيد الفعال الخلاق الخالق البارئ المصور يا ودود. يا ذا العرش المجيد. يا مبدئ يا معيد. يا فعالا لما يريد. أسألك بنور وجهك الذي ملأ أركان عرشك وأسألك بقدرتك التي قدرت بها على جميع خلقك وبرحمتك التي وسعت كل شيء لا إله إلا أنت يا مغيث أغثني.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (٢٣) — يا الله يا رحمن يا رحيم", "يا الله يا رحمن يا رحيم. يا حي يا قيوم. يا علي يا عظيم. يا ذا الجلال والإكرام. يا صانع كل مصنوع. ويا جابر كل كسير. ويا مؤنس كل وحيد. ويا صاحب كل غريب. ويا قريبا غير بعيد. ويا حاضرا غير غائب. ويا غالبا غير مغلوب. ويا شاهد كل نجوى. ويا منتهى كل شكوى. نسألك أن تجعل لنا من أمرنا فرجا ومخرجا وأن ترزقنا من حيث لا نحتسب برحمتك يا أرحم الراحمين. يا سابق الفوت. ويا سامع الصوت. ويا كاسي العظام لحما بعد الموت.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["هداية وثبات|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (٢٤) — أنت ربي ورب الأرباب. ومسير السحاب", "أنت ربي ورب الأرباب. ومسير السحاب. ومعتق الرقاب. إن كنت كتبتني شقيا في أم الكتاب فامحني واكتبني سعيدا فإنك تمحو ما تشاء وتثبت يمحو الله ما يشاء ويثبت وعنده أم الكتاب. اللهم إنك الحق القوي القاهر. القديم الأول الآخر. القيوم القدير الباطن الظاهر. السبوح القدوس العليم بما تكن السرائر. المهيمن اللطيف المحيط بمكنونات الضمائر. يا مفرج الكرب. ومبلغ الأرب. ورافع السماء وباسط الأرض. ومالك الطول والعرض.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (٢٥) — أنت النور البديع الأحد الصمد الفرد", "أنت النور البديع الأحد الصمد الفرد الرفيع لا يذل جارك. ولا يضيع جوارك. لك العزة الذاتية. والعظمة الوترية. جاهك قوي. وسبيلك سوي. والولي من واليت. والشقي من عاديت. لك الملك الثابت الباقي. والعز الدائم الواقي. وغوثك الذي أغثت به يونس في باطن الحوت. وعلمك الذي أحاط بما فوق التخوم وما تحت التخوم وما وراء البهموت. اضرب سرادق حمايتك. وأسدل ستر حنانك وعنايتك. حول عبدك الذي لا ملجأ له منك إلا إليك. ولا تعويل له في شيء من الأشياء إلا عليك. واشدد وطأتك على أعدائي في كل مقام. واكفني شر جملة حسادي بجلال وجهك يا ذا الجلال والإكرام.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (٢٦) — اللهم بنورك اهتديت. وبفضلك استغنيت. وبنعمتك", "اللهم بنورك اهتديت. وبفضلك استغنيت. وبنعمتك أصبحت وأمسيت. لا يصدأ قلب ونورك جلاؤه. ولا تدركه أسقام الأغيار وشهودك دواؤه. يا من ظهر فبهر. وكشف وستر. وعلا وأمر. أشهدك وكفى بك شهيدا يا إله العالمين. وأشهد ملائكتك ورسلك وحملة عرشك وسكان سمواتك والأرضين. من كل ما ذرأت من الخلائق أجمعين. أني أشهد أنك أنت الله وحدك لا شريك لك تجبر الكسير. وتغني الفقير. وترحم الضعيف. وتغيث اللهيف. وتضع وترفع. وتصل وتقطع. وتجير ولا يجار عليك. وتعز من تدلل بين يديك. وأن سيدنا محمدا عبدك ورسولك وحبيبك وخليلك.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (٢٧) — اللهم فصل وسلم عليه وعلى آله", "اللهم فصل وسلم عليه وعلى آله الكرام. وصحبه العظام. وورثته الفخام. سبحان ربك رب العزة عما يصفون. وسلام على المرسلين. والحمد لله رب العالمين. أشكرك وأثني عليك الخير كله إذا أوجدتني ورضيتني عبدا غمرته آلاؤك ونعماؤك. كل جزء مني منك ابتداؤه. وإليك انتهاؤه. ولطفك افتقاره. ولرحمتك اضطراره. لا قيام لشيء من مخلوقاتك. ولا وجود لموجود من مصنوعاتك إلا بقيوميتك ووجودك. السعيد كل السعيد من وفقته لاستجلاء عرائس تجلياتك وأنوار شهودك. سبق قضاؤك وقدرك لقوم بالسعادة ولآخرين بالشقا. فإن كنت كتبتني من السعداء فحققني بك في مراتب السعادة إلى أعلى مرتقى. وإن كانت الأخرى والعياذ بك من ذلك ثم العياذ بك من ذلك ثم العياذ بك من ذلك فامح هذا الوصف وأثبتني في ديوان أهل السعادة والتقى. إن أطرد عن بابك. فإلى أي باب أذهب. وكل باب أنت مالكه وسلطانه. وإن أبعد عن جنابك. فإلى أي جناب أتطلب.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (٢٨) — وأنت الله الذي عز ثناؤه وجل", "وأنت الله الذي عز ثناؤه وجل شأنه. تلاطمت أمواج بحار رحمتك ونقمتك على سفينة وجودي وما وجودي إلا مصنوع قدرتك. فيا من لا يشغله سمع عن سمع ويا من لا تغلطه المسائل ويا من لا يتبرم بإلحاح الملحين. أذقني برد عفوك وحلاوة رحمتك في كل حين. واجعلني وأحبابي فيك بك من حزبك المفلحين. يا الله يا رحمن يا رحيم. يا حي يا قيوم يا بديع السموات والأرض يا ذا الجلال والإكرام. اللهم بحقك أنت لا إله إلا أنت وباسمك الأسمى. الذي ما دعيت به إلا أجبت. وكل نبي له استنبأت. ورسول له أرسلت. وكل وحي من علمك القديم على رسلك أنزلت.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (٢٩) — يا من وسع كل شيء رحمة", "يا من وسع كل شيء رحمة وعلما. أنت الحليم الستار. العفو الكريم الغفار. أجرني من خزي الدنيا وعذاب النار. يا من لا يضيع جاره. ويا من لا يهتك جواره. أنا مضطر لرحمتك فارحمني. أنا مضطر لجبرك فاجبرني. أنا مضطر لنصرك فانصرني. أنا مفتقر لجودك فأسعفني. غوثاه غوثاه ربناه ربناه. لا تخزني يوم يبعثون. يوم لا ينفع مال ولا بنون. إلا من أتى الله بقلب سليم. سلام قولا من رب رحيم. يا الله يا رحمن يا رحيم.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (٣٠) — يا حي يا قيوم يا بديع", "يا حي يا قيوم يا بديع السموات والأرض يا ذا الجلال والإكرام. اللهم إن سرت فإليك. وإن توكلت فعليك. وإن سألت فأنت مسئولي. وإن رجوت فمنك رجائي وفيك مأمولي. أنت أعلم بما تسعد به عبادك. وأنت أخبر بما ترشد به وإليه عبادك. فاجعلني اللهم من عبادك الذين أسعدتهم. وعبادك الذين اخترتهم. يا حيرة من لم تقدر له هدايته. ويا ضيعة من لم تشمله منك نظرة رحمة وعنايته. يا إله السموات. ومدبر الكائنات. أغنني بلطفك ونصرك وجبرك في سائر الحالات. إني أنا عبدك الذي كونته من ماء وطين. وصورته من ماء مهين. لي الهناء والفوز والسعد بذلك. حيث أهلتني ورضيتني مظهرا لما أبديته من سرك هنالك. وحقك لم نتجاسر على سؤالك. إلا بعدما أمرتنا بأن نسألك من فضلك في كتابك. وإلا فمن نحن وما نحن وما مسألتنا بالنسبة إلى عزة سلطانك. وعلو شأنك. ورفعة جنابك. قد أرشدتنا إلى كرمك بقولك ادعوني. فدعوناك. وأطمعتنا في نعمك بقولك استجب لكم. وها نحن نرجو وفاءك وولاءك. وعدك وعدك يا صادق الوعد. أدركنا بلطفك الذي من أدركته بشيء منه تحقق بكل مجد وسعد. إنك الملك الحق المبين. الواحد الأحد الفرد الصمد القوي المتين. اللطيف الودود. الشكور المعبود. غفار الذنوب. وستار العيوب. ومفرج الكروب. ومقشع الغماء. وكاشف الظلماء. ونور الأنوار. وبحر الأسرار. القائم على كل نفس بما كسبت.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],

["قرآنية|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "فلله الحمد رب السماوات ورب الأرض (الورد السابع)", "﴿فَلِلَّهِ الْحَمْدُ رَبِّ السَّمَاوَاتِ وَرَبِّ الْأَرْضِ رَبِّ الْعَالَمِينَ ۞ وَلَهُ الْكِبْرِيَاءُ فِي السَّمَاوَاتِ وَالْأَرْضِ ۖ وَهُوَ الْعَزِيزُ الْحَكِيمُ﴾", "الجاثية ٣٦-٣٧", "q"],

["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٢) — اللهم ربنا ورب كل شيء أنا", "اللهم ربنا ورب كل شيء أنا شهيد أن العباد كلهم إخوة. اللهم بك آمنت ولك أسلمت، خشع لك سمعي وبصري وعصبي، وآمن بك فؤادي، أبوء بنعمتك علي، هذه يداي وما جنيت على نفسي.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٣) — سبحانك إني ظلمت نفسي فاغفر لي", "سبحانك إني ظلمت نفسي فاغفر لي إنه لا يغفر الذنوب إلا أنت. لا إله إلا أنت سبحانك وبحمدك رب عملت سوءًا وظلمت نفسي فاغفر لي إنك أنت خير الغافرين. لا إله إلا أنت سبحانك وبحمدك رب عملت سوءًا وظلمت نفسي فارحمني إنك أنت أرحم الراحمين. لا إله إلا أنت سبحانك وبحمدك رب عملت سوءًا وظلمت نفسي فتب علي إنك أنت التواب الرحيم. أستغفر الله الذي لا إله إلا هو الحي القيوم وأتوب إليه.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٤) — الحمد لله الذي سوى خلقي وأحسن", "الحمد لله الذي سوى خلقي وأحسن صورتي وزان مني ما شان من غيري. والحمد لله الذي سوى خلقي فعدله وصور صورة وجهي فأحسنها وجعلني من المسلمين، فتبارك الله أحسن الخالقين.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["هداية وثبات|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٥) — اللهم بديع السماوات والأرض ذا الجلال", "اللهم بديع السماوات والأرض ذا الجلال والإكرام والعزة التي لا ترام، أسألك يا الله يا رحمن بجلالك ونور وجهك أن تنور بكتابك بصري، وأن تطلق به لساني، وأن تفرج به عن قلبي، وأن تشرح به صدري، وأن تغسل به ذنبي، فإنه لا يعينني على الحق غيرك ولا يؤتيه إلا أنت، ولا حول ولا قوة إلا بالله العلي العظيم.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٦) — اللهم إني أسألك بنعمتك السابغة علي،", "اللهم إني أسألك بنعمتك السابغة علي، وبلائك الحسن الذي ابتليتني به، وفضلك الذي أفضلت علي، أن تدخلني الجنة بمنك وفضلك ورحمتك.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٧) — اللهم مالك الملك تؤتي الملك من", "اللهم مالك الملك تؤتي الملك من تشاء وتنزع الملك ممن تشاء، وتعز من تشاء وتذل من تشاء، بيدك الخير إنك على كل شيء قدير، رحمن الدنيا والآخرة تعطيهما من تشاء وتمنع من تشاء، ارحمني رحمة تغنيني بها عن رحمة من سواك.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],

["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٩) — إلهي تلاشت الكائنات في بقائك، وعاشت", "إلهي تلاشت الكائنات في بقائك، وعاشت الأرواح كلها بلقائك، وتغاشت العيون دون أنوار تجليك في علائك، إلا أن تدركها بلطفك فتكحلها بإثمد القدس والطهارة، وتجلو وجوهها بماء النضارة، حتى ترى وجهك الكريم، وتلقى من تلقاء لقائك البر العميم. يا لطيف يا خبير.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],

["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (١١) — إلهي قرط أسماعنا بحلي كلامك، ولذذ", "إلهي قرط أسماعنا بحلي كلامك، ولذذ قلوبنا بحلاوة رضائك، وعطر أفواهنا بطيب ثنائك، واجعل جوارحنا وقلوبنا مستعدة للقائك، يا سميع يا قريب. إلهي نسألك أن تنقش على ألواح أرواحنا العلوم النافعة، وأن تهيئ لأركان أشباحنا الأعمال الرافعة، وأن تزين صفحات أيامنا بأنوار العبادة، وأن تختمها بفضلك على النجح والسعادة، يا حنان يا منان.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],

["هداية وثبات|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (١٣) — إلهي أنت الذي أسمعت الذرات من", "إلهي أنت الذي أسمعت الذرات من ظهر آدم خطابك، وأنت الذي لقنتهم بالصواب جوابك، فالسعيد من عرفك هنا بما لقنته هناك، والشقي من حجب في هذا الوجود عن ذاك. فنرجو من لطفك الخفي وبرك الحفي أن تثبتنا بالقول الثابت عند سكرة الحين وسؤال الملكين، وأن تعيننا على حفظ ميثاقنا حتى نلاقيك بما لاقاك به جميع أوليائك، وأن تحفظ كتاب ميثاقنا من النقص والغض، يا إله السماوات والأرض، يا حفيظ يا جواد.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],

["هداية وثبات|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٣٢) — رب خذ بيدي، وارحم قلة صبري", "رب خذ بيدي، وارحم قلة صبري وضعف تجلدي، رب إني أشكو إليك بثي وحزني وكمدي، يا من هو عوني وملجئي ومولاي وسندي. رب فأطلقني من سجن الحجاب، وامنن علي بما مننت به على الأولياء الأحباب، وطهر قلبي من الشك والشرك والارتياب، وثبتني في الحياة الدنيا وعند الممات على السنة والكتاب. وصلى الله على سيدنا محمد وآله وصحبه وسلم تسليمًا أبدًا إلى يوم الدين، ورضي الله عن أصحاب رسول الله أجمعين، والحمد لله رب العالمين.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],

["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٣٤) — اللهم إني أحمدك وأنت المحمود، وأنت", "اللهم إني أحمدك وأنت المحمود، وأنت للحمد أهل، وأشكرك وأنت المشكور، وأنت للشكر أهل، على ما خصصتني به من مواهب الرغائب، وأوصلت إلي من فضائل الصنائع، وأوليتني من إحسانك، وبوأتني من مظنة الصدق عندك، وأنلتني من منتك الواصلة إلي، وأحسنت به إلي كل وقت من دفع البلية عني، والتوفيق لي، والإجابة لدعائي حين أناديك داعيًا وأناجيك راغبًا، لم أعدم عونك وبرك وخيرك وعزك وإحسانك طرفة عين منذ أنزلتني دار الاختبار والفكر والاعتبار، لتنظر ما أقدم لدار الخلود والقرار، والمقامة مع الأخيار. فأنا عبدك فاجعلني يا رب عتيقك من النار.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["الظلم والأعداء|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٣٥) — إلهي لا أذكر منك إلا الجميل،", "إلهي لا أذكر منك إلا الجميل، ولم أر منك إلا التفضيل، خيرك لي شامل، وصنعك لي كامل، ولطفك لي كافل، وبرك لي غامر، وفضلك علي دائم متواتر، ونعمك عندي متصلة، لم تخفر لي جواري، وآمنت خوفي، وصدقت رجائي، وحققت آمالي، وصاحبتني في أسفاري، وأكرمتني في إحضاري، وعافيت أمراضي، وشفيت أوصابي، وأحسنت منقلبي ومثواي، ولم تشمت بي أعدائي وحسادي، ورميت من رماني بسوء، وكفيتني شر من عاداني. فأنا أسألك يا الله الآن أن تدفع عني كيد الحاسدين وظلم الظالمين وشر المعاندين.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٣٦) — إلهي لم تعن في قدرتك، ولم", "إلهي لم تعن في قدرتك، ولم تشارك في ألوهيتك، ولم تعلم لك ماهية، ولا خرقت الأوهام حجب الغيوب إليك فتعتقد منك محدودًا في مجد عظمتك، لا يبلغك بعد الهمم، ولا ينالك غوص الفطن، ولا ينتهي إليك بصر ناظر في مجد جبروتك، ارتفعت عن صفات المخلوقين صفات قدرتك، وعلا عن ذكر الذاكرين كبرياء عظمتك، فلا ينقص ما أردت أن يزداد، ولا يزداد ما أردت أن ينقص، لا أحد شهدك حين فطرت الخلق، ولا ند ولا ضد حضرك حين برأت النفوس، كلت الألسن عن تفسير صفتك، وانحسرت العقول عن كنه معرفتك.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٣٧) — وكيف يوصف كنه صفتك يا رب", "وكيف يوصف كنه صفتك يا رب وأنت الله الملك الجبار القدوس الأزلي الذي لم يزل ولا يزال أزليًا باقيًا أبديًا سرمديًا دائمًا في الغيوب وحدك لا شريك لك، ليس فيها أحد غيرك، ولم يكن إله سواك، حارت في بحار بهاء ملكوتك عميقات مذاهب التفكر، وتواضعت الملوك لهيبتك، وعنت الوجوه بذلة الاستكانة لعزتك، وانقاد كل شيء لعظمتك، واستسلم كل شيء لقدرتك، وخضعت لك الرقاب، وكل دون ذلك تعبير اللغات، وضل هنالك التدبير في تصاريف الصفات، فمن تفكر في إنشائك البديع وثنائك الرفيع وتعمق في ذلك رجع طرفه إليه خاسئًا حسيرًا، وعقله مبهوتًا وتفكره متحيرًا أسيرًا.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["رزق وبركة|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٣٨) — اللهم لك الحمد حمدًا كثيرًا دائمًا", "اللهم لك الحمد حمدًا كثيرًا دائمًا متواليًا متواترًا متضاعفًا متسعًا متسقًا، يدوم ويتضاعف ولا يبيد، غير مفقود في الملكوت، ولا مطموس في المعالم، ولا منتقص في العرفان، فلك الحمد على مكارمك التي لا تحصى، ونعمك التي لا تستقصى، في الليل إذا أدبر، والصبح إذا أسفر، وفي البر والبحار، والغدو والآصال، والعشي والأبكار، والظهيرة والأسحار، وفي كل جزء من أجزاء الليل والنهار.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٣٩) — اللهم لك الحمد بتوفيقك قد أحضرتني", "اللهم لك الحمد بتوفيقك قد أحضرتني النجاة، وجعلتني منك في ولاية العصمة، فلم أبرح في سبوغ نعمائك وتتابع آلائك، محروسًا بك في الرد والامتناع، ومحفوظًا بك في المنعة والدفاع. اللهم إني أحمدك إذ لم تكلفني فوق طاقتي، ولم ترض مني إلا طاعتي، ورضيت مني من طاعتك وعبادتك دون استطاعتي، وأقل من وسعي ومقدرتي، فإنك أنت الله الملك الحق الذي لا إله إلا أنت، ولن تخفى عليك خافية، ولن تضل عنك في ظلم الخفيات ضالة، إنما أمرك إذا أردت شيئًا أن تقول له كن فيكون.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٤٠) — اللهم لك الحمد حمدًا كثيرًا دائمًا", "اللهم لك الحمد حمدًا كثيرًا دائمًا مثلما حمدت به نفسك، وأضعاف ما حمدك به الحامدون، وسبحك به المسبحون، ومجدك به الممجدون، وكبرك به المكبرون، وهللك به المهللون، وقدسك به المقدسون، ووحدك به الموحدون، وعظمك به المعظمون، واستغفرك به المستغفرون، حتى يكون لك مني وحدي في كل طرفة عين وأقل من ذلك مثل حمد جميع الحامدين، وتوحيد أصناف الموحدين والمخلصين، وتقديس أجناس العارفين، وثناء جميع المهللين والمصلين والمسبحين، ومثل ما أنت به عالم وأنت محمود ومحبوب ومحجوب عن جميع خلقك كلهم.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["رزق وبركة|شفاء وعافية|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٤١) — إلهي أسألك بمسائلك وأرغب إليك بك", "إلهي أسألك بمسائلك وأرغب إليك بك في بركات ما أنطقتني به من حمدك ووفقتني له من شكرك وتمجيدي لك، فما أيسر ما كلفتني به من حقك، وأعظم ما وعدتني به من نعمائك ومزيد الخير على شكرك. ابتدأتني بالنعم فضلًا وطولًا، وأمرتني بالشكر حقًا وعدلًا، ووعدتني أضعافًا ومزيدًا، وأعطيتني من رزقك واسعًا كثيرًا اختيارًا ورضا، وسألتني عنه شكرًا يسيرًا. ولك الحمد اللهم إذ نجيتني وعافيتني برحمتك من جهد البلاء ودرك الشقاء، ولم تسلمني لسوء قضائك وبلائك، وجعلت ملبسي العافية، وأوليتني البسط والرخاء، وشرعت لي أيسر القصد، وضاعفت لي أشرف الفضل مع ما عبدتني به من محجة الشريعة، وبشرتني به من الدرجة العالية الرفيعة، واصطفيتني بأعظم النبيين دعوة وأفضلهم شفاعة وأرفعهم درجة وأقربهم منزلة وأوضحهم حجة، سيدنا محمد صلى الله عليه وسلم.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٤٢) — اللهم صل عليه وعلى آله، واغفر", "اللهم صل عليه وعلى آله، واغفر لي ولأهلي ولإخواني كلهم ما لا يسعه إلا مغفرتك، وبلغني الكرامة من عندك، وأوزعني شكر ما أنعمت به علي، فإنك أنت الله الذي لا إله إلا أنت الواحد الأحد الرفيع البديع المبدئ المعيد السميع العليم، ليس لأمرك مدفع، ولا عن قضائك ممتنع. وأشهد أنك ربي ورب كل شيء فاطر السماوات والأرض عالم الغيب والشهادة العلي الكبير المتعالي، فلك الحمد على ما لا أستطيع إحصاءه ولا تعديده من عوائد فضلك وعوارف رزقك وألوان ما أوليتني به من إرفادك وكرمك، فإنك أنت الله الذي لا إله إلا أنت الفاشي في الخلق حمدك، الباسط بالجود يدك، لا تضاد في حكمك، ولا تنازع في أمرك وسلطانك وملكك، ولا تشارك في ربوبيتك، ولا تزاحم في خليقتك، تملك من الأنام ما تشاء، ولا يملكون منك إلا ما تريد.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٤٣) — اللهم أنت المنعم المتفضل القادر المقتدر", "اللهم أنت المنعم المتفضل القادر المقتدر القاهر المقدس بالمجد في نور القدس، تردّيت بالمجد والبهاء، وتعظمت بالعزة والعلاء، وتأزرت بالعظمة والكبرياء، وتغشيت بالنور والضياء، وتجللت بالمهابة والبهاء، لك المن القديم، والسلطان السابغ، والملك الباذخ، والجود الواسع، والقدرة الكاملة، والحكمة البالغة، والعزة الشاملة.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["رزق وبركة|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٤٤) — فلك الحمد على ما جعلتني من", "فلك الحمد على ما جعلتني من أمة محمد صلى الله عليه وسلم، وخلقتني سميعًا بصيرًا صحيحًا سويًا سالمًا معافى، لم تشغلني بنقصان في بدني عن طاعتك، ولا بآفة في جوارحي، ولا عاهة في نفسي ولا في عقلي، ولم تمنعني كرامتك إياي وحسن صنيعك عندي وفضل منائحك لدي ونعمائك علي. أنت الذي أوسعت علي في الدنيا رزقًا، وفضلتني على كثير من أهلها تفضيلًا، فجعلت لي سمعًا يسمع آياتك، وعقلًا يفهم إيمانك، وبصرًا يرى قدرتك، وفؤادًا يعرف عظمتك، وقلبًا يعتقد توحيدك، فأنا لفضلك علي شاهد حامد شاكر. وأشهد أنك حي قبل كل حي، وحي بعد كل حي، وحي بعد كل ميت، وحي لم ترث الحياة من حي، ولم تقطع خيرك عني في كل وقت، ولم تقطع رجائي، ولم تنزل بي عقوبات النقم، ولم تغير علي وثائق النعم، ولم تمنع عني دقائق العصم.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٤٥) — فلو لم أذكر من إحسانك وإنعامك", "فلو لم أذكر من إحسانك وإنعامك علي إلا عفوك عني والتوفيق لي والاستجابة لدعائي حين رفعت صوتي بدعائك وتحميدك وتوحيدك وتمجيدك، وإلا في تقديرك خلقي حين صورتني فأحسنت صورتي، وإلا في قسمة الأرزاق حين قدرتها لي، لكان في ذلك ما يشغل فكري عن جهدي، فكيف إذا فكرت في النعم العظام التي أتقلب فيها، ولا أبلغ شكر شيء منها. فلك الحمد عدد ما حفظه علمك، وجرى به قلمك، ونفذ به حكمك في خلقك، وعدد ما وسعته رحمتك من جميع خلقك، وعدد ما أحاطت به قدرتك، وأضعاف ما تستوجبه من جميع خلقك.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٤٦) — اللهم إني مقر بنعمتك علي، فتمم", "اللهم إني مقر بنعمتك علي، فتمم إحسانك إلي فيما بقي من عمري أعظم وأتم وأكمل وأحسن مما أحسنت إلي فيما مضى منه، برحمتك يا أرحم الراحمين. اللهم إني أسألك وأتوسل إليك بتوحيدك وتمجيدك وتحميدك وتهليلك وتكبيرك وتسبيحك وتعظيمك وتقديسك ونورك ورأفتك ورحمتك وعلمك وحكمك وعلوك ووقارك وفضلك وجلالك وكمالك وكبريائك وسلطانك وقدرتك وتدبيرك وإحسانك وامتنانك وجمالك وبهائك وبرهانك وغفرانك، ونبيك ووليك وعترته الطاهرين، أن تصلي على سيدنا محمد وعلى سائر إخوانه الأنبياء والمرسلين.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية؛ وفي بعض عبارات التوسل خلاف بين العلماء", "u"],
["رزق وبركة|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السابع (٤٧) — وألا تحرمني رفدك وفضلك وفوائد كرامتك،", "وألا تحرمني رفدك وفضلك وفوائد كرامتك، فإنك لا يعتريك لكثرة ما قد نشرت من العطايا عوائق البخل، ولا ينقص جودك التقصير في شكر نعمتك، ولا تنفد خزائنك ومواهبك المتسعة، ولا يؤثر في جودك العظيم منحك الفائقة الجليلة الجميلة الأصيلة، ولا تخاف ضيم إملاق فتكدي، ولا يلحقك خوف عدم فينقص من جودك فيض فضلك، إنك على كل ما تشاء قدير وبالإجابة جدير. اللهم أنت أمرتنا بدعائك ووعدتنا بإجابتك، وقد دعوناك كما أمرتنا فأجبنا كما وعدتنا، يا ذا الجلال والإكرام، إنك لا تخلف الميعاد، وحسبنا الله ونعم الوكيل، والحمد لله رب العالمين.", "جامع الثناء على الله تعالى للنبهاني — الورد السابع (الأحد)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"]
];
/* ===== المحرك ===== */
const $=s=>document.querySelector(s);let bab="",srcF="",S={fav:[],fs:1.35,n:0,tk:1,c:{},cd:""},cat="الكل",kw="";
try{S=Object.assign(S,JSON.parse(localStorage.getItem("mnj")||"{}"))}catch(e){}
if(S.cd!=new Date().toDateString()){S.c={};S.cd=new Date().toDateString()}
const save=()=>{try{localStorage.setItem("mnj",JSON.stringify(S))}catch(e){}};
const norm=s=>s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED﴿﴾۝]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي");
const toast=m=>{const t=$("#ts");t.textContent=m;t.classList.add("s");setTimeout(()=>t.classList.remove("s"),1400)};
const tk=s=>S.tk?s.replace(/([\u064B-\u065F\u0670\u06D6-\u06ED]+)/g,'<span class="k">$1</span>'):s;
const id=i=>D[i][1]+"|"+D[i][3];
const PR=/ثناء وتمجيد|الصلاة على النبي/;
const TSB=/^\s*[(\[«]?\s*سبحان/;
const extra=d=>{const x=(d[3]||"").replace(/\s*—\s*صيغة اجتهادية من الكتاب/,"").trim();return x&&x!="اجتهاد"?" — "+x:""};
const label=d=>{if(d[4]=="q")return "قرآن كريم — "+d[3];if(d[4]=="h")return "حديث شريف — "+d[3];
if(d[4]=="u"||d[4]=="g"){const t=d[0],pn=/الصلاة على النبي|دلائل الخيرات/.test(t);
if(pn)return "اجتهاد"+extra(d);
if(d[4]=="u"){if(/ثناء وتمجيد/.test(t))return (TSB.test(norm(d[2]))||TSB.test(norm(d[1]).replace(/^الورد.*?—\s*/,""))?"تسبيح":"مناجاة")+extra(d);return "اجتهادات"+extra(d)}}
return d[3]};
function apply(){document.documentElement.style.setProperty("--fs",S.fs+"rem");document.body.className=(S.n?"n ":"")+(S.tk==2?"g2":"")}
const NEEDS=["رزق وبركة","فك الكرب والهم","شفاء وعافية","مغفرة واستغفار","هداية وثبات","قضاء الدين","الظلم والأعداء","ذرية وأهل","جوامع الدعاء"],PIN=["أذكار الصباح","أذكار المساء"];
const GK="@احوال",GN="أدعية الأحوال والمناسبات",GS=["يومي","أذكار","الصلاة والطهارة","البيت والطعام","السفر والطقس","مناسبات وأخلاق","المرضى والموتى","الحج والعمرة","مواسم وأوقات"];let sub="";
const inG=d=>d[0].split("|").some(x=>GS.includes(x));
function chips(){const all=[...new Set(D.flatMap(d=>d[0].split("|")))],nd=NEEDS.filter(x=>all.includes(x)),rest=all.filter(x=>!PIN.includes(x)&&!NEEDS.includes(x)&&!GS.includes(x));
const nf=[["الكل","كل الحالات"],["★ المفضلة","★ المفضلة"],...PIN.map(x=>[x,x]),...nd.map(x=>[x,x])];
const so=[["","كل المصادر"],["q","القرآن الكريم"],["h","السنة النبوية"],["g","اجتهادات ومناجاة"],["w","⚠ ضعيف السند"]];
const op=(a,v)=>a.map(o=>`<option value="${o[0]}"${o[0]==v?" selected":""}>${o[1]}</option>`).join("");
const gc=D.filter(inG).length,bo=[["","كل الأبواب"],[GK,GN+" ("+gc+")"],...rest.map(c=>[c,c])];
$("#fl").innerHTML=`<select id="nf" aria-label="الحالات">${op(nf,cat)}</select><select id="sf" aria-label="المصدر">${op(so,srcF)}</select><select id="bf" aria-label="الأبواب">${op(bo,bab)}</select>`;
if(bab==GK){const cnt=x=>D.filter(d=>d[0].split("|").includes(x)).length;$("#fl2").innerHTML=`<select id="sb" aria-label="الموضوع داخل الباب">${op([["","كل مواضيع "+GN],...GS.map(x=>[x,x+" ("+cnt(x)+")"])],sub)}</select>`}else $("#fl2").innerHTML=""}
document.addEventListener("change",e=>{if(e.target.id=="sf")srcF=e.target.value;else if(e.target.id=="nf")cat=e.target.value;else if(e.target.id=="bf"){bab=e.target.value;sub=""}else if(e.target.id=="sb")sub=e.target.value;else return;chips();render()});
const ctr=(d,i)=>{const n=S.c[id(i)]||0,m=d[5]||0,ok=m&&n>=m;return `<div class="act"><button data-a="ct" data-i="${i}" class="${ok?"fv":""}" style="min-width:150px">${ok?"✓ تم":"سبّح"} ${n}${m?" / "+m:""}</button>${n?`<button data-a="rs" data-i="${i}" aria-label="تصفير العداد">↺</button>`:""}</div>`};
function card(d,i,hero){const f=S.fav.includes(id(i));
return `<div data-ci="${i}" class="${hero?"hero":"card"} ${d[4]=="q"?"q":""}${d[6]?" w":""}">${hero?"<small>دعاء اليوم</small>":""}<h2>${d[1]}</h2><div class="tx">${tk(d[2])}${d[6]?` <span class="sn">(${d[6]})</span>`:""}</div>${d[0].split("|").filter(x=>GS.includes(x)).map(x=>`<span class="bd t">${x}</span>`).join("")}<span class="bd ${d[4]=="g"||d[4]=="u"?"g":""}">${label(d)}</span>${ctr(d,i)}<div class="act"><button data-a="cp" data-i="${i}">نسخ</button><button data-a="sh" data-i="${i}">مشاركة</button><button class="${f?"fv":""}" data-a="fv" data-i="${i}">${f?"★ في المفضلة":"☆ للمفضلة"}</button></div></div>`}
let NS=null;const nsx=i=>(NS||(NS=D.map(d=>norm(d[1]+" "+d[2]+" "+d[0]))))[i];
const PG=20;let cur=[],shown=0,io=null;
function moreBtn(){const r=cur.length-shown;return r>0?`<button class="more" id="mr">عرض المزيد (${r} متبقي)</button>`:""}
function more(){const m=$("#mr");if(m)m.remove();const to=Math.min(cur.length,shown+PG);$("#list").insertAdjacentHTML("beforeend",cur.slice(shown,to).map(i=>card(D[i],i)).join(""));shown=to;$("#list").insertAdjacentHTML("beforeend",moreBtn());watch()}
function watch(){if(io)io.disconnect();const m=$("#mr");if(m&&"IntersectionObserver"in window){io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))more()},{rootMargin:"600px"});io.observe(m)}}
function upd(i){document.querySelectorAll(`[data-ci="${i}"]`).forEach(el=>{const h=el.classList.contains("hero"),t=document.createElement("div");t.innerHTML=card(D[i],i,h?1:0);el.replaceWith(t.firstElementChild)})}
function render(){const k=norm(kw.trim());const ix=D.map((d,i)=>i).filter(i=>{const d=D[i];
if(cat=="★ المفضلة"&&!S.fav.includes(id(i)))return false;if(cat!="الكل"&&cat!="★ المفضلة"&&!d[0].split("|").includes(cat))return false;
if(bab==GK){const tg=d[0].split("|");if(sub?!tg.includes(sub):!tg.some(x=>GS.includes(x)))return false}else if(bab&&!d[0].split("|").includes(bab))return false;
if(srcF&&!(srcF=="w"?!!d[6]:srcF=="g"?(d[4]=="g"||d[4]=="u"):d[4]==srcF))return false;
return !k||nsx(i).includes(k)});
let t=Math.floor(Date.now()/864e5)%D.length;for(let z=0;z<D.length&&D[t][6];z++)t=(t+1)%D.length;
$("#hero").innerHTML=(!k&&cat=="الكل"&&!bab&&!srcF)?card(D[t],t,1):"";
cur=ix;shown=Math.min(ix.length,PG);
$("#list").innerHTML=ix.length?ix.slice(0,shown).map(i=>card(D[i],i)).join("")+moreBtn():`<div class="empty">${cat=="★ المفضلة"?"لم تضف أدعية للمفضلة بعد. اضغط ☆ تحت أي دعاء.":"لا نتائج. جرّب كلمة أخرى."}</div>`;watch()}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
if(b.id=="mr"){more();return}
if(b.dataset.c){cat=b.dataset.c;chips();render();return}
if(b.id=="fp"){S.fs=Math.min(2.4,S.fs+.15);apply();save()}
if(b.id=="fm"){S.fs=Math.max(1,S.fs-.15);apply();save()}
if(b.id=="tkb"){S.tk=(S.tk+1)%3;apply();save();render()}
if(b.id=="nm"){S.n=S.n?0:1;apply();save()}
const i=b.dataset.i,d=D[i];if(!d)return;
if(b.dataset.a=="ct"){const k=id(i);S.c[k]=(S.c[k]||0)+1;save();try{navigator.vibrate&&navigator.vibrate(d[5]&&S.c[k]==d[5]?[40,60,40]:12)}catch(x){}upd(i);return}
if(b.dataset.a=="rs"){delete S.c[id(i)];save();upd(i);return}const tx=d[1]+"\n\n"+d[2]+"\n\n("+label(d)+(d[6]?" — "+d[6]:"")+")\n\nمن تطبيق مناجاة";
if(b.dataset.a=="cp"){try{await navigator.clipboard.writeText(tx);toast("تم النسخ")}catch(x){toast("تعذّر النسخ")}}
if(b.dataset.a=="sh"){if(navigator.share){try{await navigator.share({text:tx})}catch(x){}}else{try{await navigator.clipboard.writeText(tx);toast("تم النسخ للمشاركة")}catch(x){}}}
if(b.dataset.a=="fv"){const k=id(i),p=S.fav.indexOf(k);p<0?S.fav.push(k):S.fav.splice(p,1);save();cat=="★ المفضلة"?render():upd(i)}});
let qt;$("#q").addEventListener("input",e=>{kw=e.target.value;clearTimeout(qt);qt=setTimeout(render,220)});
apply();chips();render();
if("serviceWorker"in navigator&&location.protocol.indexOf("http")==0)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
