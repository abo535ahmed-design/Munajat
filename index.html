["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (١٨) — اللهم يا من يغضب على من", "اللهم يا من يغضب على من لا يسأله لا تمنع من قد سألك. اللهم كيف نتجاسر على السؤال مع الخطايا والزلات. أم كيف نستغني عن السؤال مع الفقر والفاقات. واطلقت الألسنة بالسؤال لديك، وأكرمت الوفود إذا ارتحلوا إليك يا حبيب القلوب أين أحبابك يا أنيس المنفردين أين طلابك. من ذا الذي عاملك فلم يربح. فبطلت الحيل. وجرت اقدارك فلا يتغير العمل. وتقدمت محبتك لأقوام قبل خلقهم في الأزل. وغضبت على قوم فلم ينتفع عاملهم بما فعل. فلا قوة على طاعتك إلا بإعانتك. ولا حول عن معصيتك إلا بمشيتتك. ولا ملجا منك إلا إليك. ولا خير يرجى إلا من يديك.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (١٩) — يا من بيده إصلاح القلوب. أصلح", "يا من بيده إصلاح القلوب. أصلح قلوبنا. يا من تتصاغر في عفوه الذنوب اغفر ذنوبنا، اللهم إنا قد أتيناك طالبين فلا تردنا خائبين. لم نزل إلى باب جودك مائلين. فأصلح كل قلب قسا فلا يلين. واسلك بنا مناهج المتقين. والبسنا خلع الإيمان واليقين، بدروع الصدق فإنهن يقين، ولا تجعلنا ممن يعاهد على التوبة ويمين. واجعلنا من فضلك من أهل اليمين برحمة منك يا أرحم الراحمين. وصلى الله على سيدنا محمد حاتم النبيين وإمام المرسلين إلهي لولا أنك بالفضل تجود ما كان عبدك إلى الذنب يعود. ولولا محبتك للغفران ما أمهلت من يبارزك بالعصيان. وأسبلت سترك على من أسبل ذيل النسيان. وقابلت إساءتنا منك بالإحسان.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٢٠) — إلهي ما أمرتنا بالاستغفار إلا وأنت", "إلهي ما أمرتنا بالاستغفار إلا وأنت تريد المغفرة. ولولا كرمك ما الهمتنا المعذرة أنت المبتدئ بالنوال. قبل السؤال والمعطي من الأفضال. فوق الأمال. إنا لا نرجو إلا غفرانك، ولا نطلب إلا إحسانك أدعوك بلسان أملي لما كل لسان عملي إن أطعتك رجوت إحسانك، وإن عصيتك رجعت إليك طالبا غفرانك. اللهم إنا نسألك برحمتك التي بدأت بها الطائعين. حتى قاموا بطاعتهم. أن تمن بها على العاصين. بعد معصيتهم. فإنك المحسن بادئا وعائدا يا كريم إلهي أنت المحسن وأنا المسيء، ومن شان المحسن إتمام إحسانه. ومن شان المسيء الاعتراف بعدوانه.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["هداية وثبات|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٢١) — يا من أمهل، وما أهمل وستر", "يا من أمهل، وما أهمل وستر حتى كأنه قد غفر أنت الغني وأنا الفقير. وأنت العزيز وأنا الحقير. اللهم انظر إلينا نظر الرضا والطف بنا في القدر والقضا ونجنا من ديوان أهل الجفاء واثبتنا في ديوان أهل الصفاء وارزقنا على ما عاهدنا حسن الوفاء. واغفر لنا ولوالدينا ولجميع المسلمين، وصلى الله على سيدنا محمد وعلى آله وصحبه وسلم آمين. إلهي لك بهاء الجلال في انفراد وحدانيتك، ولك سلطان العز في دوام ربوبيتك. بعدت عن قربك أوهام الباحثين عن بلوغ صفتك، وتحيرت ألباب العارفين في جلالك وعظمتك إلهي من أطمعنا في عفوك وجودك وكرمك. والهمنا شكر نعمك. وأتى بنا إلى بابك ورغبنا فيما أعددته لأحبابك. هل ذلك كله إلا منك دلتنا عليك وجئت بنا إليك، إلهي الصبر جميل إلا عنك، والأسف قبيح إلا منك إلهي عودتني كريم نوالك عند سؤالك. وأطمعتني في كثرة إفضالك بنيل إقبالك. سألتك فاعطيتني فوق مناى وكم رجوتك فحققت رجاى إلهي أسكرتني الآمال، حتى أنستني هجوم الآجال إلهي أنت أعلم بي مني فبكمال جودك تجاوز عني إلهي من لم تجبر كسره ما أطول فقره من لم تنعشه من كربته مات بشقوته. واخيبة من طردته عن بابك واحسرة من أبعدته عن طريق احبابك.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٢٢) — إلهي إن كانت رحمتك للمحسنين. فإلى", "إلهي إن كانت رحمتك للمحسنين. فإلى أين تذهب آمال المذنبين اللهم جللنا بسترك واعف عنا بكرمك وعاملنا بلطفك واغفر لنا ولوالدينا ولجميع المسلمين وصلى الله على سيدنا محمد وعلى آله وصحبه وسلم. إلهي إن كنا مقصرين في حفظ حدك والوفاء بعهدك. فأنت تعلم صدقنا في رجاء رفدك.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٢٣) — يا ظاهر بما أبدع من أفعاله", "يا ظاهر بما أبدع من أفعاله. يا باطن فالعقول عاجزة عن وصف كماله. يا قدوس فلا شبيه له يا واحد لا شريك له، خلقتنا مسلمين. فسلمنا من عذابك. وجعلتنا مؤمنين فأمنا من عقابك أعطيتنا الإيمان قبل السؤال. وهو أفضل ما تعطيه من النوال. والكريم لا يرجع في هبته. والغني لا يعود في عطيته. اللهم اجعل الإيمان هادما للسيئات كما جعلت الكفر هادما للحسنات. اللهم إن عصيناك فنحن نحبك. وإن أطعنا إبليس فنحن نبغضه. فاغفر لنا معصيتنا لك بحبنا فيك. وتجاوز عن طاعتنا له ببعضنا فيه إلهي ببابك أنخنا. ولمعروفك تعرضنا. وبكرمك تعلقنا. وبتقصيرنا اعترفنا وأنت أكرم مسئول. وأعظم مأمول.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٢٤) — اللهم ارحم عبادا غرهم طول إمهالك", "اللهم ارحم عبادا غرهم طول إمهالك. واطمعهم دوام إفضالك. ومدوا أيديهم إلى كرم نوالك وتيقنوا أن لا غنى لهم عن سؤالك. اللهم يا حبيب التائبين ويا سرور العابدين. ويا قرة أعين العارفين ويا أنيس المنفردين. ويا حرز اللاجئين. ويا ظهير المنقطعين ويا من حنت إليه قلوب الصديقين اجعلنا من أوليائك المتقين. وحزبك المفلحين. اللهم وإن كانت ذنوبنا فظيعة فإنا لم نرد بها القطيعة اللهم إنا لا نبرح عن بابك. فلا تعذبنا بأليم حجابك. نحن إن لم نكن كما أمرتنا. فأنت ذو عن وغنى ونحن المساكين إن لم تكن لنا إلى من نلتجئ إن صرفتنا إلى أين نذهب إن طردتنا بمن نتوكل إن حجبتنا. من يقبل علينا إن أعرضت عنا.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٢٥) — اللهم إنا نعبدك طوعا. ونعصيك كرها", "اللهم إنا نعبدك طوعا. ونعصيك كرها. ونخافك لأنك عظيم. ونرجوك لأنك إله. ونخافك لأنا عبيد فبك حبينا. ولك خوفنا وارحمنا لكرم الربوبية. ولضعف العبودية. إلهي كيف تردنا الذنوب عن سؤالك. ونحن الفقراء إلى نوالك ما نحن قد أنخنا ببابك. فتعطف علينا مع أحبابك. كفانا عارا أن نكون لك عبيدا. وكفانا شرفا أن تكون لنا ربا. إلهي أنت لنا كما نحب فاجعلنا لك كما تحب إلهي كل فرح بغيرك زائل. وكل شغل بسواك باطل والسرور بك هو السرور السرور بغيرك هو الغرور إلهي حجتي حاجتي، ووسيلتي فاقتي اللهم إنك قبلت ألوفا من السحرة حين ذكروك مرة وسجدوا لك سجدة وإنا لم نزل مقرين بربوبيتك. معترفين بوحدانيتك ما سجدنا قط إلا بين يديك. ولا رفعنا حوائجنا إلا إليك إلهي جد علينا بفضلك، وتغمدنا برحمتك وداركنا بلطفك. وعاملنا برأفتك. ووفقنا لخدمتك، واغفر لنا ولوالدينا ولجميع المسلمين إنك أرحم الراحمين، وصلى الله على سيدنا محمد وعلى آله وصحبه وسلم إلهي أين يذهب عنك من لا يجد بدا منك. وكيف لا يعتمد عليك.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٢٦) — من كل أموره في يديك إلهي", "من كل أموره في يديك إلهي ذنوبنا لها غاية وكرمك لا غاية له إلهي إن كنا لا نقدر على التوبة فأنت تقدر على المغفرة، إلهي قد أطعناك في أكبر الطاعات. الإيمان بك والافتقار إليك وتركنا أكبر السيئات الشرك بك والافتراء عليك. فاغفر لنا ما بينهما ولا تخجلنا بين يديك إلهي إن ذنوبنا صغيرة في جنب عفوك، وإن كانت كبيرة في جنب نهيك إلهي لو أردت إمانتنا لم تهدنا. ولو أردت فضيحتنا لم تسترنا، فتهم اللهم ما به بداتنا. ولا تسلينا ما به أكرمتنا إلهي أتحرق وجها بالنار كان لك ساجدا ولسانا كان لك ذاكرا. وقلبا كان بك عارفا إلهي كيف لا ينقطع إلى خدمتك. من وجد كمال سروره في نعيم حضرتك، العجب ممن يتدلل للعبيد. وهو يجد من مولاه ما يريد، والمغبون من خضع للخلق في طلب حاجاته ولو رجع إلى مولاه لكفاه مهماته إلهي أنت ملاذنا إن ضاقت الحيل. وملجونا إذا انقطع الأمل. بذكرك نتنعم ونفتخر. وإلى جودك نلتجى ونفتقر. فبك فخرنا وإليك فقرنا اللهم دلنا بك عليك وارحم ذلنا بين يديك. واجعل رغبتنا فيما لديك. ولا تحرمنا بذنوبنا ولا تطردنا بعيوبنا واغفر لنا ولوالدينا ولجميع المسلمين، وصلى الله على سيدنا محمد وعلى آله وصحبه وسلم.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٢٧) — إلهي أنت الملك الحق المبين النور", "إلهي أنت الملك الحق المبين النور الهادي القوي المتين عرفتنا بربوبيتك. وأغرقتنا في بحار نعمتك، ونعمتنا بذكرك وأنسك. ودعوتنا إلى دار قدسك إلهي كيف يصبر عن قربك. من وجد طعم حبك إلهي إن نظرنا إلى فضلك. فالعجب ممن هلك كيف هلك. وإن نظرنا إلى عدلك. فالعجب ممن نجا كيف نجا. إلهي إن حاسبتنا بفضلك نلنا رضوانك. وإن حاسبتنا بعدلك. لم ننل غفرانك إلهي كيف أرجوك وأنا أنا. وكيف لا أرجوك وأنت أنت إلهي إن كنا لا نقدر على ترك ذنب كتبته علينا فأنت تقدر على مغفرته لنا إلهي إن كنا قد عصيناك بجهل. فقد دعوناك بعقل. حيث علمنا أن لنا ربا يغفر الذنوب ولا يبالي.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٢٨) — إلهي أنت تعلم بالحال من قبل", "إلهي أنت تعلم بالحال من قبل الشكوى. وأنت قادر على تحقيق الأمال، وكشف البلوى اللهم يا من سر الزلات. وغفر السيئات. وأبدلها حسنات. أجرنا من مكرك. وزينا بذكرك. واستعملنا بأمرك. ووفقنا لشكرك. واغفر لنا ولوالدينا ولجميع المسلمين.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (١) — ربنا الله الذي في السماء تقدس", "ربنا الله الذي في السماء تقدس اسمك أمرك في السماء والأرض كما رحمتك في السماء فاجعل رحمتك في الأرض واغفر لنا حوبنا وخطايانا أنت رب الطيبين. أسألك من فضلك ورحمتك فإنهما بيدك لا يملكهما أحد سواك. اللهم أنت عضدي ونصيري بك أحول وبك أصول وبك أقاتل ولا حول ولا قوة إلا بك. اللهم أنت أحق من ذكر وأحق من عبد وأنصر من ابتغي وأرأف من ملك وأجود من سئل وأوسع من أعطى أنت الملك لا شريك لك والفرد لا ند لك كل شيء هالك إلا وجهك لن تطاع إلا بإذنك ولن تعصى إلا بعلمك تطاع فتشكر وتعصى فتغفر أقرب شهيد وأدنى حفيظ حلت دون النفوس وأخذت بالنواصي وكتبت الآثار ونسخت الآجال القلوب لك مفضية والسر عندك علانية الحلال ما حللت والحرام ما حرمت والدين ما شرعت والأمر ما قضيت والخلق خلقك والعبد عبدك وأنت الله الرءوف أسألك بنور وجهك الذي أشرقت له السموات والأرض وبكل حق هو لك وبحق السائلين عليك أن تقيلنى في هذه الغداة وأن تجيرني من النار بقدرتك.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٢) — اللهم إنك تعلم أني بالجهالة معروف", "اللهم إنك تعلم أني بالجهالة معروف. وأنت بالعلم موضوف. وقد وسعت كل شيء من جهالتي بعلمك. وقدسنا بها عن كل وصف يوجب نقصا مما استأثرت به في علمك عمن سواك يا الله يا عظيم يا على يا كبير نالك الفقر مما سواك. والغنى بك حتى لا تشهد إلا إياك. والطف بنا لطفا علمته يصلح لمن والآك. واكسنا جلابيب العصمة في الأنفاس واللحظات. واجعلنا عبيدا لك في جميع الحالات. وعلمنا من لدنك علما نصير به كاملين في المحيا والممات اللهم أنت الحميد الرب المجيد الفعال لما تريد تعلم فرحنا. بماذا ولماذا وعلى ماذا وتعلم حزننا كذلك وقد أوجبت كون ما أردته فينا ومنا ولا تسألك دفع ما تريد. ولكن نسألك التأييد بروح من عندك فيما تريد. كما أيدت أنبياءك ورسلك وخاصة الصديقين من خلقك إنك على كل شيء قدير.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٣) — اللهم فاطر السموات والأرض عالم الغيب", "اللهم فاطر السموات والأرض عالم الغيب والشهادة أنت تحكم بين عبادك فهنيئا لمن عرفك فرضي بقضائك والويل لمن لم يعرفك بل الويل ثم الويل لمن أقر بوحدانيتك ولم يرض بأحكامك. اللهم إن القوم قد حكمت عليهم بالذل حتى عزوا وحكمت عليهم بالفقد حتى وجدوا فكل عز يمنع دونك فنسألك بدله ذلا تصحبه لطائف رحمتك. وكل وجد يحجب عنك فنسألك عوضه فقدا تصحبه أنوار محبتك. فإنه قد ظهرت السعادة على من احببته وظهرت الشقاوة على من غيرك ملكه فهب لنا من مواهب السعداء. واعصمنا من موارد الاشقياء اللهم إنا قد عجزنا عن دفع الضر عن أنفسنا من حيث نعلم بما نعلم فكيف لا نعجز عن ذلك من حيث لا نعلم بما لا نعلم. وقد أمرتنا ونهيتنا. والمدح والذم ألزمتنا. فأخو الصلاح من أصلحته، وأخو الفساد من أضللته والسعيد حقا من أغنيته عن السؤال منك فلا تحرمنا من رحمتك كثرة سؤالنا لك. وأغفر لنا إنك على كل شيء قدير.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٤) — يا شديد البطش يا جبار يا", "يا شديد البطش يا جبار يا قهار يا حكيم نعوذ بك من شر ما خلقت ونعوذ بك من شر الحساد على ما أنعمت. ونسألك عز الدنيا والآخرة كما سأله نبيك سيدنا محمد صلى الله عليه وسلم عن الدنيا بالإيمان والمعرفة وعز الآخرة باللقاء والمشاهدة إنك سميع قريب. مجيب أقسمت عليك به يبسط يديك وكرم وجهك ونور عينيك وكمال أعينك أن تعطينا خير ما نفدت : مشيئتك. وتعلقت به قدرتك.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|رزق وبركة|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٥) — فضلك إنك على كله شيء قدير", "فضلك إنك على كله شيء قدير يا الله يا على يا عظيم يا حليم يا حكيم يا سميع يا قريب يا مجيب يا ودود حل بيننا وبين فتنة الدنيا والنساء والغفلة والشهوة وظلم العباد وسوء الخلق واغفر لنا ذنوبنا واقض عنا تبعاتنا واكشف عنا السوء ونجنا من الغم واجعل لنا منه فرجا ومخرجا إنك على كل شيء قدير يا الله يا الله يا الله يا لطيف يا رزاق يا قوي يا عزيز لك مقاليد السموات والأرض تبسط الرزق لمن تشاء وتقدر فابسط لنا من الرزق ما توصلنا به إلى رحمتك ومن رحمتك ما تحول به بيننا وبين نقمك ومن حلمك ما يسعنا به عفوك واختم لنا بالسعادة التي ختمت بها لأوليائك واجعل لنا برزخا بيننا وبين أعدائك واجعل خير أيامنا وأسعدها يوم لقائك وزحزحنا في الدنيا عن نار الشهوة وادخلنا بفضلك في ميادين الرحمة واكسنا من نورك جلابيب العصمة واجعل لنا ظهيرا من عقولنا ومهيمنا من أرواحنا ومسخرا من أنفسنا كى نسبحك كثيرا وتذكرك كثيرا إنك كنت بنا بصيرا. وهب لنا مشاهدة تصحبها مكالمة وافتح أسماعنا وأبصارنا واذكرنا إذا غفلنا عنك بأحسن ما تذكرنا به إذا ذكرناك. وارحمنا إذا عصينا بأتم مما ترحمنا به إذا أطعناك.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٦) — واغفر لنا ذنوبنا ما تقدم منها", "واغفر لنا ذنوبنا ما تقدم منها وما تأخر والطف بنا لطفا يحجبنا عن غيرك ولا يحجبنا عنك فإنك بكل شيء عليم. اللهم إنا نسألك لسانا رطبا بذكرك. وقلبا منعما بشكرك. وبدنا هينا لينا بطاعتك وأعطنا مع ذلك ما لا عين رات ولا أذن سمعت ولا خطر على قلب بشر كما أخبر به رسولك صلى الله عليه وسلم حسبما علمته بعلمك واغننا بلا سبب واجعلنا سبب الغنى لأوليائك وبرزخا بينهم وبين أعدائك إنك على كل شيء قدير، وأفض علينا من بحر كرمك وفضلك وجودك وعفوك حتى نخرج من الدنيا على السلامة من وبالها واجعلنا عند الموت ناطقين بالشهادة عالمين بها. واراف بنا رأفة الحبيب بحبيبه عند الشدائد ونزولها. وأرحنا من هموم الدنيا وعمومها بالروح والريحان إلى الجنة ونعيمها. واجعل سيئاتنا سيئات من أحبيت. ولا تجعل حسناتنا حسنات من أبغضت فالإحسان لا ينفع مع البعض منك. والإساءة لا تضر مع الحب منك، وقد أبهمت الأمر علينا لنرجو ونخاف فأمن خوفنا ولا تخيب رجاءنا وأعطنا سؤلنا فقد أعطيتنا الإيمان من قبل أن نسألك وكتبت وحبيت ورينت وكرهت. واطلقت الألسن بما به ترجمت فنعم الرب أنت.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٧) — فلك الحمد على ما أنعمت فاغفر", "فلك الحمد على ما أنعمت فاغفر لنا ولا تعاقبنا بالسلب بعد العطاء ولا بكفران النعم وحرمان الرضا. اللهم رضنا بقضائك وصبرنا على طاعتك وعن معصيتك وعن الشهوات الموجبات للنقص أو البعد عنك وهب لنا حقيقة الإيمان بك والنوكل عليك حتى لا نخاف غيرك ولا نرجو غيرك ولا نحب غيرك ولا نعبد شيئا سواك وأوزعنا شكر نعمائك وغطنا برداء عافيتك وانصرنا باليقين والتوكل عليك وأسفر وجوهنا بنور صفاتك وأضحكنا وبشرنا يوم القيامة بين أوليائك واجعل يدك مبسوطة علينا وعلى أهلينا وأولادنا ومن معنا برحمتك ولا تكلنا إلى أنفسنا طرفة عين ولا أقل من ذلك يا نعم المجيب.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٨) — يا من هو هو هو في", "يا من هو هو هو في علوه قريب يا ذا الجلال والإكرام. يا محيطا بالليالي والأيام. أشكو إليك من غم الحجاب. وسوء الحساب. وشدة العذاب وإن ذلك لواقع ما له من دافع إن لم ترحمني لا إله إلا أنت سبحانك إني كنت من الظالمين. ولقد شكا إليك يعقوب فخلصته من حزنه ورددت عليه ما ذهب من بصره وجمعت بينه وبين ولده. ولقد ناداك نوح من قبل فنجيته من كربه. ولقد ناداك أيوب من بعد فكشفت ما به من ضره ولقد ناداك يونس فنجيته من عمه، ولقد ناداك زكريا فوهبت له ولدا من صلبه بعد يأس أهله وكبر سنه، ولقد علمت ما نزل بإبراهيم فأنقذته من نار عدوه وانجيت لوطا وأهله من العذاب النازل بقومه، فها أنا ذا عبدك إن تعذبني بجميع ما علمت فأنا حقيق وإن ترحمني كما رحمتهم مع عظم إجرامي فانت أولى بذلك واحق من أكرم به. فليس كرمك مخصوصا بمن أطاعك وأقبل عليك، بل هو مبدول بال سبق لمن شئت من خلقك وإن عصاك وأعرض عنك.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٩) — ربنا ظلمنا أنفسنا وإن لم تغفر", "ربنا ظلمنا أنفسنا وإن لم تغفر لنا وترحمنا لنكونن من الخاسرين. يا الله يا الله يا الله يا رحمن يا رحيم يا حي يا قيوم يا من هو هو هو يا هو إن لم نكن لرحمتك أهلا أن ننالها فرحمتك أهل أن تنالنا. يا رباه يا مولاه يا مغيث من عصاه.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (١٠) — يا من هو هو با هو", "يا من هو هو با هو أسألك بعظمتك التي ملأت اركان عرشك، وبقدرتك التي قدرت بها على جميع خلقك وبرحمتك التي وسعت كل شيء وبعلمك المحيط بكل شيء وبارادتك التي لا ينارعها شيء وبسمعك وبصرك القريبين من كل شيء يا من هو أقرب إلى من كل شيء آمنت بك وبأسمائك وصفاتك ولك فمن ذا الذي يرحمنى غيرك ومن ذا الذي يسعدني سواك فارحمني وأرني سبيل الرشد واهدني إليه سبيلا وأرني سبيل الغى وجنبني إياه سبيلا وأصحبني منك الحق والنور والحكم والعقل والبيان واحرسني بنورك يا الله يا نور يا حق يا مبين يا فتاح افتح قلبي بنورك وعلمني من علمك وفهمني عنك وأسمعني منك وبصرني بك وقدر عني بنور قدرتك وأحيني بنور حياتك واجعل مشيتني مشيتتك إنك على كل شيء قدير.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (١١) — يا الله يا فتاح يا غفار", "يا الله يا فتاح يا غفار يا منعم يا هادي يا ناصر يا عزيز لا إله غيرك أنت الحق المبين. يا عالم الر وأخفى. يا ذا الكرم والوفا. يا قوي يا عزيز يا من بيده ملكوت كل شيء وهو يجير ولا يجار عليه يا عليم يا عظيم يا حليم يا عليم الحمد لله رب العالمين حمدا كثيرا طيبا مباركا دائما جزيلا جميلا كما يحب ربنا ويرضى اللهم إني أشكو إليك ضعف قوتي وقلة حيلتي وهواني على المخلوقين وأنت رب العالمين ورب المستضعفين مثلى إلى من تكلني إلى عدو بعيد يتجهمني. أو إلى صديق قريب قد ملكته أمري إن لم يكن لك غضب على فلا أبالي ولكن عافيتك أوسع لي أعوذ بنور وجهك الذي ملا أركان عرشك وأشرقت به الظلمات وصلح عليه أمر الدنيا والآخرة من أن ينزل بي غضبك أو يحل على سخطك ولك العتبى حتى ترضى ولا قوة إلا بك.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (١٢) — رب أشكو إليك تلون أحوالي. وتوقف", "رب أشكو إليك تلون أحوالي. وتوقف سؤالي وضعف قوتي وحيلتي وحالي يا من تعلقت بلطيف كرمه عوائد آمالي يا من لا يخفى عليه خفي حالي يا من يعلم عاقبة أمري ومالي ويعلم نطقى قبل سؤالي رب إن ناصيتي بيدك وأمورى كلها راجعة إليك. وأحوالى جميعها لا تخفي عليك. وآلامي وأحزاني وهمومي وعمومي وكروبى وشدائدى معلومة لديك يا من إليه مرجعي وماني. يا من يعلم خفي سري وعلانية خطابي ويعلم ما علة المي وحقيقة ما بي.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (١٣) — أنت ملجني ووسيلتي. وذخرى وعمدتي إليك", "أنت ملجني ووسيلتي. وذخرى وعمدتي إليك ارفع بنى وحزني وشكايتي، وأرجوك لبرء علتي ورفع غمي وبليتى يا من يعلم سري وعلانيتي. إلهي بابك مفتوح للعائل. وفضلك مبذول للنائل. وإليك منتهى الشكوى وغاية الوسائل يا من إليه ترفع الشكوى يا عالم السر والنجوى يا من يسمع ويرى وهو بالمنظر الأعلى. يا رب الأرض والسماء يا من له الأسماء الحسنى يا من له الدوام والبقاء يا من قدر السعادة والشقاء عبدك قد ضاقت به الأسباب وخلقت دونه الأبواب وأنت المرجو لكشف هذا المصاب. وإزالة كل حجاب.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (١٤) — يا من إذا دعي أجاب يا", "يا من إذا دعي أجاب يا سريع الحساب. يا رب الأرباب يا مسبب الأسباب يا مسخر السحاب. يا رفيع الجناب رب لا تحجب دعوني. ولا تكلني إلى حولي وقوني. فقد ضاق صدري، وتحيرت في أمري وأنت العالم بسرى وجهرى المالك لنفعى وضرى القادر على انشراح صدري. وتيسير عسري وتسهيل أمري. وفكاك أسرى. وتفريج كربى وضرى رب ارحم من عظم مرضه وعز شفاؤه. وأنت ملجؤه ورجاؤه، وغوثه وشفاؤه يا من غمر العباد فضله وعطاؤه. ووسع البرية جوده ونعماؤه ها أنا ذا عبدك محتاج إلى ما عندك فقير إلى رحمتك. منتظر إلى رفدك وجودك وكرمك. وإحسانك ونعمك. وعفوك ومغفرتك. فأنا مذنب أسأل منك الغفران. وجان خالف أطلب منك الصفح والأمان. فعسى توبة منك تجلو بأنوارها ظلمات الإساءة والعصيان. وعسى مغفرة منك وعفو يفك أسري يا رحمن سائل باسط يد الفاقة الكلية يسأل منك الجود والعطية يا رب يا رب يا رب ارحم من ضاقت عليه الأكوان، ولم تؤنسه الثقلان.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (١٥) — يا من لا يسكن قلب المحب", "يا من لا يسكن قلب المحب إلا بقربه. ولا يحيا لب المشوق إلا بوده وحبه، يا من انس عباده الأبرار واحبابه المصطفين الأخيار. وأولياءه المقربين الأطهار بمناجاته وأسراره. وإمداده وأنواره يا من أمات وأحيا. وأقصى وأدنى واسعد واشقى. وأفقر واغنى وأضل وهدى وعافى وابلى. وقدر وقضى وأضاء وجلا. كل ذلك بعظيم تدبيره. وخفى لطفه وسابق تقديره. رب أي باب يفتح غير بابك. وأي مولى يقصد غير جنابك. وأي رحاب فسيح يطلب غير رحابك أنت العليم العظيم. الرءوف الحليم الجواد الكريم الذي لا حول ولا قوة إلا بك يا عظيم.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (١٦) — رب لمن أقصد وأنت المقصود. وإلى", "رب لمن أقصد وأنت المقصود. وإلى من أتوجه وأنت الموجود. ومن ذا الذي يعطي وأنت صاحب الكرم والجود. ومن ذا الذي أسأل وأنت الرب المعبود. وهل في الوجود رب سواك فيدعى أم هل في الملك إله غيرك فيرجى وإليه يسعى أم هل كريم غيرك فيطلب منه العطاء أم هل جواد سواك فيسأل منه الرضا. أم هل حليم غيرك فينال منه الفضل والنعمى أم هل رحيم غيرك في الأرض والسماء أم هل حاكم سواك فترفع إليه الشكوى. أم هل طبيب غيرك فيكشف الضر والبلوى أم هل رءوف غيرك للعبد الفقير يعتمد عليه. أم هل مليك سواك تبسط الأكف بالدعاء إليه. فليس إلا كرمك وجودك لقضاء الحاجات، وليس إلا فضلك ونعمك لإجابة الدعوات.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (١٧) — يا من لا ملجأ ولا منجى", "يا من لا ملجأ ولا منجى منه إلا إليه. يا من يجير ولا يجار عليه. ألهمتنا فعرفنا. وفهمتنا ففهمنا. وعلمتنا فعلمنا أغيرك إلهنا رب فيرجى أم جواد ثم فيسأل منه العطاء وإليه يلجا. قد جفانى القريب. وملنى الطبيب. واشتد بي الكرب والنحيب. وأنت الودود القريب الرءوف المجيب. المجيد الحبيب المعافي الطبيب. رب إلى من أشتكي وأنت العليم القادر. أم إلى من التجي وأنت الكريم الساتر. أم بمن استنصر وأنت الولي الناصر. أم بمن استغيث وأنت القوي القاهر أم من ذا الذي كسري وأنت للقلوب جابر. أم من ذا الذي يغفر ذنبي وأنت الرحيم الغافر.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (١٨) — أنت العليم بما في السرائر الخبير", "أنت العليم بما في السرائر الخبير بما تخفيه الضمائر المطلع على ما تحويه الخواطر. يا من هو فوق عباده قاهر يا من هو مطلع عليهم وناظر. يا من هو قريب وحاضر يا من هو الأول والآخر. والباطن والظاهر. يا إله العباد. يا كريم يا جواد يا صاحب الجود والكرم والإحسان. يا ذا الفضل والنعم والغفران. يا مسقمي وأنت حبيبي، فلمن يا رب أشتكي ضعف حالتي. وانت عليم يا إلهي بعلتى. حقيق على ألا أشتكي إلا إليك. ولا عزم لي غير التوكل عليك يا من عليه يتوكل المتوكلون يا من إليه يلجأ الخائفون يا من بكرمه وجميل عوائده يتعلق الراجون يا من بسلطان قهره وعظيم قدرته يستغيث المضطرون.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (١٩) — يا من بوسع عطائه وسعة رحمته", "يا من بوسع عطائه وسعة رحمته. وجزيل فضله وجميل منه. تبسط الأيدي ويسأل السائلون أعطني من فضلك العظيم. وجد على برفدك العميم. وامنحنى من كرمك الجسيم. فأنت يا رب بحالي عليم. فارحم بجودك عبدا ما له سواك. ولا علم ولا عمل له ولا مقصد إلا إياك يا من به ثقني ورجانى يا من يسمع تضرعي ونداني يا من ترفع إليه شكايتى ودعائي يا مفرج الكربات وغافر الخطيئات. وقاضي الحاجات، ومستجيب الدعوات ومجلى المهمات. ورافع الملمات. وكاشف الظلمات. ودافع البليات. وسائر العورات. ورفيع الدرجات. وإله الأرض والسموات رب ارحم من ضاقت به الحيل. ولا علم ولا عمل يا من عليه المتكل يا من إذا شاء فعل. ولا يسأل عما يفعل يا من لا يبرمه سؤال من سال رب أنت الذي بقدرتك خلقتني. وبرحمتك هديتني. وبنعمتك ربيتني. وبلطفك غذيتني. وبجميل سترك سترتني. وعلى فضلك العميم وكلتني. وفي احسن صورة ما شئت ركبتني. وفي عوالم إبداعك أبديتني. وفي خير أمة أخرجت للناس أخرجتني. فأتمم على نعمتك التي لا تحصى. وكمل لدى أياديك التي لا تنسى. واجعلني ممن هدى واهتدى ومن سبقت له منك الحسنى ربنا وسعت كل شيء رحمة وعلما، وقد علمت ما كان وما يكون منا وتقدس علمك الأعلى.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٢٠) — وجرى القلم بما شئت من القضا", "وجرى القلم بما شئت من القضا فليس لنا إلا ما إليه وفقتنا. ولا مقر لنا عما أردته منا فداركنا بخفي لطفك ووسيع رحمتك. وفسيح أمانك وجميل مغفرتك وحفنا بعفوك ورضاك. وبلغنا كل ما سألناك. وصل وسلم على الذات المصطفوية والقبضة الأصلية والفيضة الرحمانية سيدنا محمد وعلى آله وصحبه أجمعين سبحان ربك رب العزة عما يصفون وسلام على المرسلين، والحمد لله رب العالمين اللهم بسطوة جبروت قهرك، وبسرعة إغاثة نصرك. وبغيرتك لانتهاك حرماتك، وبحمايتك لمن احتمى بآياتك، نسألك يا الله يا قريب يا سميع يا مجيب يا سريع يا جبار يا منتقم يا قهار.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["الظلم والأعداء|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٢١) — يا شديد البطش يا من لا", "يا شديد البطش يا من لا يعجزه قهر الجبابرة. ولا يعظم عليه هلاك المتمردة من الملوك الأكاسرة أن تجعل كيد من كادني في نحره، ومكر من مكر بي عائدا إليه. يا من أجاب نوحا في قومه يا من نصر إبراهيم على أعدائه. يا من رد يوسف على يعقوب يا من كشف الضر عن أيوب يا من أجاب دعوة زكريا. يا من قبل تسبيح يونس بن متى. نسألك بأسرار أصحاب هذه الدعوات المستجابات أن تتقبل ما به دعوناك وأن تعطينا ما سألناك. وأنجز لنا وعدك الذي وعدته لعبادك المؤمنين. لا إله إلا أنت سبحانك إني كنت من الظالمين. وحسبنا الله ونعم الوكيل. ولا حول ولا قوة إلا بالله العلي العظيم.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٢٢) — اللهم يا من لطفه بخلقه شامل", "اللهم يا من لطفه بخلقه شامل وخيره لعبده واصل. وستره على عباده سابل لا تخرجنا عن دائرة الألطاف وآمنا من كل ما نخاف وكن لنا بلطفك الخفى الظاهر يا باطن يا ظاهر يا لطيف نسألك وقاية اللطف في القضا. والتسليم مع السلامة عند نزوله والرضا. اللهم إنك أنت العليم بما سبق في الأزل. فحفنا بلطفك فيما نزل يا لطيف لم تزل. واجعلنا في حرز من التحصن بك يا أول يا من إليه الالتجاء وعليه المعول اللهم يا من ألقى خلقه في بحر قضائه. وحكم عليهم بحكم قهره وابتلائه اجعلنا ممن حمل في سفينة النجاة. ووقي من جميع الآفات طول الحياة إلهنا إنه من رعته عين عنايتك كان ملطوفا به التقدير. محفوظا ملحوظا برعايتك يا قدير يا سميع يا بصير يا قريب يا مجيب الدعا. فلما شهدوا سر هذا اللطف الواقى. لا ترده همة عارف ولا مريد. لكن فتحت لنا أبواب الألطاف الخفية. المانعة حصونها من كل بلية. فادخلنا بلطفك تلك الحصون.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٢٣) — يا من يقول للشيء كن فيكون", "يا من يقول للشيء كن فيكون إلهنا أنت اللطيف بعبادك. لا سيما بأهل محبتك وودادك. فبأهل المحبة والوداد حصنا بلطائف اللطف يا جواد إلهنا اللطف صفتك. والألطاف خلقك. وتنفيذ حكمك في خلقك حقك. ورأفة لطفك بالمخلوقين تمنع استقصاء حقك في العالمين، إلهنا لطفت بنا قبل كوننا ونحن للطف إذ ذاك غير محتاجين. أفتمنعنا منه مع الحاجة له وأنت أرحم الراحمين. حاشا لطفك الكافي. ولطفك الوافي. يمنع عنا وأنت الشافي.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٢٤) — إلهنا لطفك هو حفظك إذا رعيت", "إلهنا لطفك هو حفظك إذا رعيت وحفظك هو لطفك إذا وقيت فادخلنا سرادقات لطفك واضرب علينا أستار حفظك يا لطيف نسألك اللطف أبدا يا حفيظ قنا السوء وشر العدا يا لطيف من لعبدك العاجز الخائف الضعيف. اللهم كما لطفت بي قبل سؤالي وكوني. كن لي لا علي يا أمين يا مغني فأنت حولي وقوني وعوني. الله لطيف بعباده يرزق من يشاء وهو القوي العزيز آنسني بلطفك يا لطيف، أنس الخائف في حال المخيف. تأنست بلطفك يا لطيف. وقيت بلطفك الردى في المخيف. واحتجبت بلطفك من العدا يا لطيف. والله من ورائهم محيط بل هو قرآن مجيد في لوح محفوظ نجوت من كل خطب جسيم. بقول ربي ولا يئوده حفظهما وهو العلي العظيم. سلمت من كل شيطان وحاسد بقول ربي وحفظا من كل شيطان مارد كفيت كل هم في كل سبيل. بقولى حسبي الله ونعم الوكيل اللهم أنت القيوم الدائم بتدبير ما أوجدت من العوالم.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٢٥) — أنت المحيط بنا وبكل شيء هو", "أنت المحيط بنا وبكل شيء هو دونك فبعزتك يا عزيز ويتدللى لك وخصوعي بين يديك اصرف عني وعمن تحيط. شفقة قلبي ضر الأضرار، ومكر الفجار. وشر الأسرار في الليل والنهار يا عزيز يا غفار يا وهاب يا ستار يا حفي يا بار يا جبار. يا شديد البطش يا قهار يا عزيز أعزني بعزتك يا غفار اغفر لي ما علمته مما ظلمت به نفسي فأنت المنعم المتفضل على بالكرم. يا وهاب هب لي نفسي ومالي وولدى وديني وغطني بسترك يا ستار.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["الظلم والأعداء|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٢٦) — يا حفي كن بي حفيا. يا", "يا حفي كن بي حفيا. يا بار اجعلني في عفوك واكتبني من الأبرار. يا شديد البطش حل بيني وبين من يؤذيني يا قهار اقهر من كادني بسوء واغلل يده الباطشة فلا تمد إلي يا حفي الألطاف نجني مما أخاف اللهم إني أتوسل إليك. اللهم إني أقسم بك عليك. اللهم كما كنت دليلى عليك، فكن اللهم شفيعي إليك. اللهم إن حسناتي من عطائك. وسيئاتي من قضائك. فجد اللهم بما أعطيت على ما قضيت. حتى تمحو ذلك بذلك كما قلت في كتابك المبين إن الحسنات يذهبن السيئات ذلك ذكري للذاكرين. لا لمن أطاعك له الشكر. ولا لمن عصاك فيما عصاك له العذر لأنك قلت وقولك الحق في كتابك المكنون لا يسأل عما يفعل وهم يسألون.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية؛ وفي بعض عبارات التوسل خلاف بين العلماء", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٢٧) — اللهم لولا عطاؤك لكنت من الهالكين", "اللهم لولا عطاؤك لكنت من الهالكين، ولولا قضاؤك لكنت من الفائزين. وأنت أجل واعظم وأعز وأكرم من أن تطاع إلا بإذنك ورضاك، أو أن تعصى إلا بحكمك وقضاك إلهي ما أطعتك حتى رضيت، وما عصيتك حتى قضيت. أطعتك. بإرادتك والمنة لك على وعصيتك بتقديرك والحجة لك على فبوجوب حجتك وانقطاع حجتي إلا ما رحمتني وعفوت عني وبفقرى إليك وغناك عني إلا ما كفيتني. لا تؤاخذني وسامحني بفضلك وجودك وكرمك يا أرحم الراحمين.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٢٨) — اللهم إني لم آت الذنوب جراءة", "اللهم إني لم آت الذنوب جراءة مني عليك ولا استخفافا بحقك ولكن جرى بذلك قلمك ونفذ به حكمك وأحاط به علمك واحصاه كتابك ولا حول ولا قوة إلا بك والعذر إليك والاعتماد عليك وأنت أرحم الراحمين، وأكرم الأكرمين. تعفو عن كثير. وبيدك الخير وإليك المصير. وأنت على كل شيء قدير، وبعبادك لطيف خبير. اللهم إن سمعي وبصري ولساني وعقلى وقلبي وفكرى وخاطرى وسرى كل ذلك بيدك وجار تحت إرادتك وقدرتك ومشيتك لم تملكنى من ذلك شيئا فإذا قضيت على بشيء فكن أنت ولي فيه واهدني إلى أقوم طريق وأوضح سبيل يا خير من سئل وأكرم من أعطى وأنت الرب الجليل فارحمني برحمتك يا أرحم الراحمين يا رحمن الدنيا والآخرة ارحم عبدا ضعيفا لا يملك لنفسه نفعا ولا ضرا ولا دنيا ولا أخرى. إنك على كل شيء قدير.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٢٩) — يا الله يا حنان يا كريم", "يا الله يا حنان يا كريم يا منان يا ذا الفضل والإحسان. والجود والكرم والامتنان والقدرة والمغفرة والرضوان والسماح والعفو والغفران. من لهذا العبد العاصى غيرك يغفر الذنوب. فقد عجز عن القيام والنهوض إلى مرضاتك يا علام الغيوب. وقطعته الشهوات عن الدخول في طاعتك يا رب كل مربوب. ولم يبق له حبل يتمسك به سوى توحيدك يا غالبا غير معلوب. وكيف يجترئ على السؤال من هو معرض عنك. أم كيف لا يسأل من هو محتاج إليك. وقد متنت على الآن بالسؤال منك وجعلت حسبي الرجاء فيك والاستعانة بك والاعتماد والتوكل عليك والرضا منك والتقرب إليك. والاستعطاء مما لديك، فلا تردني خائبا من فضلك مقنطا من رحمتك يا كريم يا بر يا رحيم وقد جعلت لأسمائك حرمة فمن دعاك بها لا يشرك بك شيئا أجبته، وكل ما سألك من بركتها أعطيته.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["الظلم والأعداء|فك الكرب والهم|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٣٠) — فبحرمة اسمائك عليك، وشرفها بك وتعظيمها", "فبحرمة اسمائك عليك، وشرفها بك وتعظيمها لديك يا الله يا رحمن يا رحيم يا ملك يا قدوس يا سلام يا مؤمن يا مهيمن يا عزيز يا جبار يا متكبر يا خالق يا باري يا مصور يا غفار يا قهار يا رزاق يا فتاح يا عليم قني من الهم والغم والحزن والعجز والكسل والجبن والبخل والشك والضنك والكرب والسوء والارتياب والغلبة والقهر والمكر والغدر وشماتة الأعداء والحساد. والبغي والعناد. والمقام الرفيع الأسمى يا الله يا حميد يا مجيد يا مبدئ يا معيد.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثالث (٣١) — يا غفور يا ودود. يا ذا", "يا غفور يا ودود. يا ذا العرش المجيد يا فعالا لما يريد يا جواد يا كريم يا بر يا رحيم يا سميع يا عليم. يا عزيز يا حكيم يا قوي يا متين يا حق يا مبين. يا وكيل يا أمين. يا تواب يا معين هب لي من رحمتك ما أحمدك به وأكون من المؤمنين. وامنحني شكرا جليلا على حسن نعماتك لأكون من الشاكرين والهمني حمدا جزيلا على الرضا بقضائك لأكون من الصابرين. وامنحنى شكرا جليلا على حسن نعمائك لأكون من الشاكرين والهمني حمدا جزيلا على الرضا بقضائك لأكون من الحامدين اللهم إني أسألك يا لطيف أن تلطف : لطفا جميلا لا يدركه وهم الواهمين إلهي قد وجدتك رحيما فكيف لا أرجوك. ووجدتك ناصرا معينا فكيف لا أدعوك. من لي إذا قطعتني ومن ذا الذي يضرني إذا نفعتني. ومن الذي يعذبني إذا رحمتني. ومن ذا الذي يقربني بسوء إذا نجيتني. ومن ذا الذي يمرضني إذا عافيتني. فصلني بمواهبك ورفدك من حيث تعلم بما لا أعلم إنك أنت الأعز الأكرم وصلى الله على سيدنا محمد النبي الأمي وعلى آله وصحبه وسلم.", "جامع الثناء على الله تعالى للنبهاني — الورد الثالث (الأربعاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (١) — اللهم ربنا ورب كل شيء اجعلني", "اللهم ربنا ورب كل شيء اجعلني مخلصا لك وأهلي في كل ساعة في الدنيا والآخرة ذا الجلال والإكرام اسمع واستجب الله أكبر الأكبر حسبي الله ونعم الوكيل الله أكبر الأكبر إنا لله وإنا إليه راجعون الحمد لله حمدا كثيرا طيبا مباركا فيه مباركا عليه كما يحب ربنا ويرضى وكما يحب ربنا أن يحمد وكما ينبغي له الحمد لله الذي بعزته وجلاله تتم الصالحات الحمد لله رب العالمين على كل حال. اللهم لك الحمد حمدا كثيرا خالدا مع خلودك. ولك الحمد حمدا دائما لا منتهى له دون علمك. ولك الحمد حمدا لا منتهى له دون مشيئتك. ولك الحمد حمدا لا أجر لقائله إلا رضاك، ولك الحمد حمدا مليا عند كل طرقة عين وتنفس نفس اللهم لك الحمد وإليك المشتكى وأنت المستعان ولا حول ولا قوة إلا بالله العلي العظيم.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (٢) — اللهم أنت الأول فليس شيء قبلك", "اللهم أنت الأول فليس شيء قبلك وأنت الآخر فلا شيء بعدك أعوذ بك من كل دابة ناصيتها بيدك. إنك سميع عليم إنك غفور رحيم إنك رب العرش العظيم. إنك البر الجواد الكريم اغفر لي وارحمني وعافني وارزقني واسترني وأجرني وارفعني ولا تضلني وأدخلني الجنة برحمتك يا أرحم الراحمين. اللهم إنك عفو كريم تحب العفو فاعف عني. اللهم إن قلوبنا وجوارحنا بيدك لم تملكنا منها شيئا فإذا فعلت ذلك بنا فكن أنت ولينا.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["فك الكرب والهم|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (٣) — يا نور السموات والأرض يا زين", "يا نور السموات والأرض يا زين السموات والأرض يا جبار السموات والأرض يا عماد السموات والأرض يا بديع السموات والأرض يا قيام السموات والأرض يا ذا الجلال والإكرام يا صريخ المستصرخين. يا غياث المستغيثين، يا كاشف السوء ومنتهى رغبة العابدين. المفرج عن المكروبين المروح عن المعمومين. ومجيب دعاء المضطرين. وكاشف الكرب يا إله العالمين ويا أرحم الراحمين.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (٤) — يا حي يا قيوم برحمتك أستغيث", "يا حي يا قيوم برحمتك أستغيث أصلح لي شأني كله ولا تكلني إلى نفسي طرفة عين يا من أظهر الجميل وستر القبيح يا من لا يؤاخذ بالجريرة ولا يهتك الستر يا عظيم العفو يا حسن التجاوز يا واسع المغفرة، يا باسط اليدين بالرحمة. يا صاحب كل نجوى يا منتهى كل شكوى يا كريم الصفح يا عظيم المن يا مبتدئ النعم قبل استحقاقها يا ربنا ويا سيدنا ويا مولانا ويا غاية رغبتنا أسألك يا الله ألا تشوي خلقي بالنار.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (٥) — يا من لا تراه العيون. ولا", "يا من لا تراه العيون. ولا تخالطه الظنون، ولا يصفه الواصفون ولا تغيره الحوادث ولا يخشى الدوائر يعلم مناقيل الجبال ومكابيل البحار وعدد قطر الأمطار. وعدد ورق الأشجار. وعدد ما أظلم عليه الليل وأشرق عليه النهار. ولا توارى منه سماء سماء ولا أرض أرضا ولا بحر ما في قعره، ولا جبل ما في وعره اجعل خير عمري آخره واجعل خير عملي خواتمه واجعل خير أيامي يوما ألقاك فيه.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (٦) — اللهم إنا نسألك الخوف منك والرجاء", "اللهم إنا نسألك الخوف منك والرجاء فيك والمحبة لك والشوق إليك والأنس بك والرضا عنك والطاعة لأمرك على بساط مشاهدتك ناظرين منك إليك وناطقين بك عنك لا إله إلا أنت سبحانك ربنا ظلمنا أنفسنا وقد تبنا إليك قولا وعقدا فتب علينا جودا وعطفا واستعملنا بعمل ترضاه يا غفور يا ودود يا بر يا رحيم، واجعل لنا من لدنك سلطانا نصيرا يا علي يا عظيم يا حليم يا عليم يا سميع يا بصير يا مؤيد يا قدير يا حي يا قيوم يا رحمن يا رحيم يا من هو هو ويا هو أسألك بعظمتك التي ملأت أركان عرشك وبقدرتك التي قدرت بها على جميع خلقك وبرحمتك التي وسعت كل شيء وبعلمك المحيط بكل شيء وبإرادتك التي لا ينازعها شيء وبسمعك وبصرك القريبين من كل شيء يا من هو أقرب من كل شيء آمنت بك وبأسمائك وصفاتك وبمحمد رسولك صلى الله عليه وسلم فمن ذا الذي يرحمني غيرك ومن ذا الذي يسعدني بسواك فارحمني وأرني سبيل الرشد واهدني إليه سبيلا وارني سبيل الغي وجنبني إياه سبيلا يا الله يا نور يا حق يا مبين يا فتاح افتح قلبي بنورك وعلمني من علمك وفهمني عنك واسمعني منك وبصرني بك وقدرني بنور قدرتك وأحيني بنور حياتك واجعل مشيئتي مشيئتك إنك على كل شيء قدير.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (٧) — واجعلني حسنة من حسناتك ورحمة بين", "واجعلني حسنة من حسناتك ورحمة بين عبادك تهدي بها من تشاء إلى صراط مستقيم. صراط الله الذي له ما في السموات وما في الأرض ألا إلى الله تصير الأمور. اللهم اهدني بنورك واعطني من فضلك وامنعني من كل عدو لك ومن كل شيء يشغلني عنك وهب لي لسانا لا يفتر عن ذكرك وقلبا يسمع بالحق منك وروحا يكرم بالنظر إلى وجهك الكريم. وسرا ممتعا بحقائق قربك وعقلا حامدا لجلال عظمتك وزين ما ظهر وما بطن مني بأنواع طاعتك يا الله يا سميع يا عليم يا عزيز يا حكيم أنت الذي أيدت من شئت بما شئت كيف شئت على ما شئت فأيدنا بنصرك لخدمة أوليائك ووسع صدورنا بمعرفتك عند ملاقاة أعدائك إنك على كل شيء قدير يا الله يا عظيم يا سميع يا عليم يا بر يا رحيم عبدك قد أحاطت به خطيئته وأنت الرحيم العظيم كيف يكون ذنبي عظيما مع عظمتك.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (٨) — فلم تدع لي خوفا وإن قلت", "فلم تدع لي خوفا وإن قلت بالطاعة قابلتني بعدلك فلم تدع لي رجاء فليت شعري كيف أرى إحساني مع إحسانك. والسر سرك. عدمي وجودي ووجودي عدمي فالحق حقك، والجعل جعلك، ولا إله غيرك الحق المبين يا عالم السر وأخفى يا ذا الكرم والوفا يا ذا الجلال والإكرام.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (٩) — إلهي أنا الفقير في غناي فكيف", "إلهي أنا الفقير في غناي فكيف لا أكون فقيرا في فقري إلهي أنا الجاهل في علمي فكيف لا أكون جهولا في جهلي. إلهي إن اختلاف تدبيرك. وسرعة حلول مقاديرك. منعا عبادك العارفين بك عن السكون إلى عطاء واليأس منك في بلاء. إلهي مني ما يليق بلؤمي ومنك ما يليق بكرمك. إلهي وصفت نفسك باللطف والرأفة بي قبل وجود ضعفي أفتمنعني منهما بعد وجود ضعفي إلهي إن ظهرت المحاسن مني فبفضلك ولك المنة على وإن ظهرت المساوي مني فبعدلك ولك الحجة على إلهي كيف تكلني إلى نفسي وقد توكلت لي. ها أنا أتوسل إليك بفقرى إليك. وكيف أتوسل إليك بما هو محال أن يصل إليك. أم كيف أشكو إليك حالي وهو لا يخفى عليك. أم كيف أترجم لك بمقالي. أم كيف تخيب أمالي. وهي قد وفدت إليك. أم كيف لا تحسن أحوالي، وبك قامت وإليك.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية؛ وفي بعض عبارات التوسل خلاف بين العلماء", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (١٠) — إلهي ما ألطفك بي مع عظيم", "إلهي ما ألطفك بي مع عظيم جهلي وما أرحمك بي مع قبيح فعلي. إلهي ما أقربك مني وما أبعدني عنك إلهي ما أرأفك بي. فما الذي يحجبني عنك إلهي قد علمت باختلاف الآثار وتنقلات الأطوار أن مرادك مني أن تتعرف إلى في كل شيء حتى لا أجهلك في شيء إلهي كلما أخرسني لومي أنطقني كرمك. فكيف لا تكون دعاويه دعاوى.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (١١) — إلهي حكمك النافذ ومشيئتك القاهرة لم", "إلهي حكمك النافذ ومشيئتك القاهرة لم يتركا لذي مقال مقالا. ولا لذى حال حالا إلهي كم من طاعة بنيتها وحالة شيدتها هدم اعتمادى عليها عدلك. بل أقالني منها فضلك. إلهي أنت تعلم وإن لم تدم الطاعة مني فعلا جزما، فقد دامت محبة وعزما، إلهي كيف أعزم وأنت القاهر، وكيف لا أعزم وأنت الآمر إلهي ترددى في الآثار. يوجب بعد المزار، فاجمعني عليك بخدمة توصلني إليك إلهي كيف يستدل عليك بما هو في وجوده مفتقر إليك. أيكون لغيرك من الظهور ما ليس لك.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["هداية وثبات|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (١٢) — إلهي أمرت بالرجوع إلى الآثار. فارجعني", "إلهي أمرت بالرجوع إلى الآثار. فارجعني إليها بكسوة الأنوار وهداية الاستبصار. حتى أرجع إليك منها كما دخلت إليك منها مصون السر عن النظر إليها. ومرفوع الهمة عن الاعتماد عليها. إنك على كل شيء قدير. إلهي هذا ذلي ظاهر بين يديك. وهذا حالي لا يخفى عليك منك أطلب الوصول إليك، وبك أستدل عليك، فاهدني بنورك إليك. وأقمني بصدق العبودية بين يديك. إلهي علمني من علمك المخزون. وصني بسر اسمك المصون إلهي حققني بحقائق أهل القرب. واسلك بي مسالك أهل الجذب إلهي أغنني بتدبيرك عن تدبيرى. وباختيارك لي عن اختيارى. وأوقفني على مراكز اضطراري إلهي أخرجني من ذل نفسي وطهرني من شكى وشركي قبل حلول رمسي بك أستنصر فانصرني. وعليك أتوكل فلا تكلني. وإياك أسأل فلا تخيبني. وفي فضلك أرغب فلا تحرمني. ولجنابك أنتسب فلا تبعدني.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (١٣) — إلهي إن القضاء والقدر غلبني. وإن", "إلهي إن القضاء والقدر غلبني. وإن الهوى بوثائق الشهوة أسرني. فكن أنت النصير لي حتى تنصرني وتنصر بي. وأغنني بفضلك حتى أستغني بك عن طلبي أنت الذي أشرقت الأنوار في قلوب أوليائك وأنت الذي أزلت الأغيار من قلوب أحبائك. انت المؤنس لهم حيث أوحشتهم العوالم. وأنت الذي هديتهم حتى استبانت لهم المعالم. ماذا وجد من فقدك، وما الذي فقد من وجدك. لقد خاب من رضي دونك بدلا. ولقد خسر من بغى عنك متحولا إلهي كيف يرجى سواك وأنت ما قطعت الإحسان.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (١٤) — يا من أذاق أحباءه حلاوة موانسته", "يا من أذاق أحباءه حلاوة موانسته فقاموا بين يديه متملقين ويا من ألبس أولياءه ملابس هيبته فقاموا بعزته مستعزين أنت الذاكر من قبل الذاكرين. وأنت البادئ بالإحسان من قبل توجه العابدين. وأنت الجواد بالعطاء من قبل طلب الطالبين. وأنت الوهاب ثم أنت لما وهبتنا من المستقرضين إلهي اطلبني برحمتك حتى أصل إليك، واجذبني بمشيئتك حتى أقبل عليك إلهي إن رجائي لا ينقطع عنك وإن عصيتك. كما أن خوفي لا يزايلني وإن أطعتك إلهي قد دفعتني العوالم إليك وأوقفني علمي بكرمك عليك.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (١٥) — إلهي كيف أخيب وأنت أملي. أم", "إلهي كيف أخيب وأنت أملي. أم كيف أهان وعليك متكلي إلهي كيف أستعز وأنت في الذلة أركزتني. أم كيف لا أستعز وإليك نسبتني. أم كيف لا أفتقر وأنت الذي في الفقر أقمتني. أم كيف أفتقر وأنت الذي بجودك أغنيتني. أنت الذي لا إله غيرك تعرفت لكل شيء فما جهلك شيء، وأنت الذي تعرفت إلى في كل شيء فرأيتك ظاهرا في كل شيء فأنت الظاهر لكل شيء يا من استوى برحمانيته على عرشه فصار العرش غيبا في رحمانيته كما صارت العوالم غيبا في عرشه محقت الآثار بالآثار. ومحوت الأغيار بمحيطات أفلاك الأنوار يا من احتجب في سرادقات عزه عن أن تدركه الأبصار.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (١٦) — يا من تجلى بكمال بهائه فتحققت", "يا من تجلى بكمال بهائه فتحققت عظمته الأسرار كيف تخفي وأنت الظاهر أم كيف تغيب وأنت الرقيب الحاضر اللهم إنا نسألك أن تصلي على محمد وعلى آل محمد كما صليت على إبراهيم وعلى آل إبراهيم في العالمين إنك حميد مجيد اللهم اجعلنا من المستسلمين إليك. ومن الدائمين بين يديك. وأخرجنا من التدبير معك أو عليك. واجعلنا من المفوضين إليك. اللهم إنك قد كنت لنا من قبل أن نكون لأنفسنا فكن لنا بعد وجودنا كما كنت قبل وجودنا والبسنا ملابس لطفك، وأقبل علينا بحنانيتك وعطفك. وأخرج ظلمات التدبير من قلوبنا، وأشرق نور التفويض في أسرارنا. وأشهدنا حسن اختيارك لنا حتى يكون ما تقتضيه لنا فينا وتختاره لنا أحب إلينا من مختارنا لأنفسنا اللهم لا تشغلنا بما مننت لنا عما أمرتنا. ولا بشيء أنت طالبنا به عن شيء أنت طالبه منا، اللهم إنك دعوتنا إلى الانقياد إليك والدوام بين يديك. وإنا عن ذلك عاجزون إلا أن تقدرنا. وضعفاء إلا أن تقوينا. ومن أين لنا أن نكون في شيء إلا إن كونتنا. وكيف لنا أن نصل لشيء إلا إن وصلتنا. وأنى لنا أن نقوى على شيء إلا إن أعنتنا، فوفقنا لما به أمرتنا. وأعنا على الانكفاف عما عنه زجرتنا.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (١٧) — اللهم أدخلنا رياض التفويض وجنات التسليم", "اللهم أدخلنا رياض التفويض وجنات التسليم ونعمنا بها وفيها واجعل أسرارنا معك لا مع نعيمها ولذتها، وبك لا بزينتها وبهجتها. اللهم أشرق علينا من نور الإستسلام إليك، والإقبال عليك ما تبتهج به اسرارنا وتتكمل به أنوارنا اللهم إنك قد دبرت كل شيء قبل وجود كل شيء وقد علمنا أنه لن يكون إلا ما تريد وليس هذا العلم نافعا لنا إلا أن تريد فأردنا بخيرك وشئنا بفضلك، واقصدنا بعنايتك، وحفنا برعايتك. واكسنا من ملابس أهل ولايتك.. وأدخلنا في وجود حمايتك إنك على كل شيء قدير.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["رزق وبركة|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الرابع (١٨) — اللهم إنا قد علمنا أن حكمك", "اللهم إنا قد علمنا أن حكمك لا يعاند. وقضاءك لا يضاده. وقد عجزنا عن رد ما قضيت ودفع ما أمضيت. واجعلنا في ذلك ممن رعيت يا رب العالمين. اللهم إنك قسمت لنا قسمة أنت موصلها لنا. فوصلها إلينا بالهناء. والسلامة من العنا مصانين فيها من الحجبة. محفوفين فيها بأنوار الوصلة. نشهدها منك فتكون لك من الشاكرين ونضيفها لك ولا نضيفها لأحد من العالمين اللهم إن الرزق بيدك رزق الدنيا ورزق الآخرة فارزقنا منهما ما علمت فيه المصلحة لنا والعود بالجدوى علينا اللهم اجعلنا من المختارين لك ولا تجعلنا من المختارين عليك ومن المقرضين لك لا من المعترضين عليك اللهم إنا إليك محتاجون فاعطنا، وعن الطاعة عاجزون فاقدرنا، وهب لنا قدرة على طاعتك، وعجزا عن معصيتك. واستسلاما لربوبيتك. وصبرا على أحكام إلهيتك وعزا بالانتساب إليك. وراحة في قلوبنا بالتوكل عليك. واجعلنا ممن دخل في ميادين الرضا وكرع من تسنيم التسليم. وجنى من ثمار المعارف. دائمين على خدمتك. محققين بمعرفتك متبعين لرسولك وارثين عنه وآخذين منه ومحققين به وقائمين بالنيابة عنه واختم لنا منك بخير يا رب العالمين. وحسبنا الله ونعم الوكيل. والحمد لله رب العالمين، وصلى الله على سيدنا محمد خاتم النبيين وآله وصحبه أجمعين.", "جامع الثناء على الله تعالى للنبهاني — الورد الرابع (الخميس)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (١) — اللهم إني أعوذ بعزتك لا إله", "اللهم إني أعوذ بعزتك لا إله إلا أنت أن تضلني أنت الحي لا تموت والجن والإنس يموتون. باسم الله وبالله خير الأسماء. أشهد أن لا إله إلا الله وحده لا شريك له وأشهد أن محمدا عبده ورسوله أرسله بالحق بشيرا ونذيرا وأن الساعة آتية لا ريب فيها. الله الله ربي لا أشرك به شيئا. اللهم فاطر السموات والأرض عالم الغيب والشهادة رب كل شيء ومليكه أشهد أن لا إله إلا أنت. لا إله إلا أنت لا شريك لك سبحانك اللهم أستغفرك وأتوب إليك.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (٢) — اللهم إني أستغفرك لذنبي وأسألك رحمتك", "اللهم إني أستغفرك لذنبي وأسألك رحمتك اللهم زدني علما ولا تزغ قلبي بعد إذ هديتني وهب لي من لدنك رحمة إنك أنت الوهاب. لا إله إلا الله والله أكبر. لا إله إلا الله وحده لا شريك له. لا إله إلا الله له الملك وله الحمد. لا إله إلا الله ولا حول ولا قوة إلا بالله. لا إله إلا الله الواحد القهار. رب السموات والأرض وما بينهما العزيز الغفار. سبحان الله عدد خلقه سبحان الله رضا نفسه. سبحان الله زنة عرشه سبحان الله مداد كلماته. والحمد لله كذلك. حسبي الله لديني. حسبي الله لما أهمني. حسبي الله لمن بغى علي. حسبي الله لمن حسدني. حسبي الله لمن كادني بسوء. حسبي الله عند الموت، حسبي الله عند المسألة في القبر، حسبي الله عند الميزان، حسبي الله عند الصراط. حسبي الله لا إله إلا هو عليه توكلت وإليه أنيب.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (٣) — الحمد لله رب العالمين. الحمد لله", "الحمد لله رب العالمين. الحمد لله الذي كفاني وآواني. وأطعمني وسقاني. والذي من علي فأفضل. والذي أعطاني فأجزل. الحمد لله الذي يحيي الموتى وهو على كل شيء قدير. اللهم ربنا لك الحمد. ملء السموات وملء الأرض وملء ما بينهما وملء ما شئت من شيء بعد. أهل الثناء والمجد أحق ما قال العبد. وكلنا لك عبد. لا مانع لما أعطيت ولا معطي لما منعت ولا ينفع ذا الجد منك الجد. اللهم لك الحمد أنت قيم السموات والأرض ومن فيهن. ولك الحمد أنت ملك السموات والأرض ومن فيهن. ولك الحمد أنت نور السموات والأرض ومن فيهن. ولك الحمد أنت الحق ووعدك حق ولقاؤك حق وقولك حق والجنة حق والنار حق والنبيون حق ومحمد صلى الله عليه وسلم حق والساعة حق.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (٤) — اللهم لك الحمد كله ولك الملك", "اللهم لك الحمد كله ولك الملك كله بيدك الخير كله علانيته وسره فأهل أن تحمد إنك على كل شيء قدير. يا مقلب القلوب ثبت قلبي على دينك. اللهم رب السموات السبع ورب العرش العظيم اكفني كل مهم من حيث شئت وكيف شئت وأنى شئت ومن أين شئت. اللهم طهر قلبي من النفاق وعملي من الرياء ولساني من الكذب وعيني من الخيانة فإنك تعلم خائنة الأعين وما تخفي الصدور. يا من وعد فوفى. وأوعد فعفا. اغفر لمن ظلم وأسا.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (٥) — يا من تسره طاعتي. ولا تضره", "يا من تسره طاعتي. ولا تضره معصيتي. هب لي ما يسرك. واغفر لي ما لا يضرك. يا أول الأولين. ويا آخر الآخرين. ويا ذا القوة المتين. ويا راحم المساكين. ويا أرحم الراحمين. كنت وتكون وأنت حي لا تموت تنام العيون وتتكور النجوم. وأنت حي قيوم. لا تأخذك سنة ولا نوم يا حي يا قيوم. اللهم أنت السلام ومنك السلام تباركت وتعاليت يا ذا الجلال والإكرام. اللهم أنت ربي لا إله إلا أنت خلقتني وأنا عبدك وأنا على عهدك ووعدك ما استطعت أعوذ بك من شر ما صنعت أبوء لك بنعمتك علي وأبوء بذنبي فاغفر لي فإنه لا يغفر الذنوب إلا أنت.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (٦) — اللهم إني أؤمن بك وبملائكتك وكتبك", "اللهم إني أؤمن بك وبملائكتك وكتبك ورسلك وباليوم الآخر وبالقدر خيره وشره وأقر بوحدانيتك. واستعينك وأتوكل عليك. واستغفرك وأتوب إليك. وأخشى سطوتك وأرجو رحمتك يا مؤمن يا باعث يا وارث يا واحد يا معين يا كافي يا غفار يا تواب يا قهار يا رحمن يا رحيم لا إله إلا أنت سبحانك إني كنت من الظالمين. اللهم إنه ليس لي عليك حق فأطلبه منك ولك علي حق فلم أستطع كمال تأديته إليك ولكني أقف بوصف الذل والفقر والمسكنة على باب عزك وغناك وكرمك وأمد كف الفقر والفاقة لوسيع عطائك يا عزيز يا غني يا كريم يا واسع يا معطي.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (٧) — اللهم هب لنا الخلوة معك والعزلة", "اللهم هب لنا الخلوة معك والعزلة عما سواك وأملأ أسماعنا بلذيذ خطابك. وصمت ألسنتنا عن مشاهدة غيرك. واقصر أرجلنا عن السعي في غير طاعتك واجعل ألسنتنا مطيعة لأمرك. وقلوبنا مطمئنة بذكرك. وعقولنا مسترشدة بعلمك. وأبداننا هينة لينة لطاعتك. وهب لنا المداومة على ذلك على بساط العلم والمراقبة والتوسط بين الخوف والرجاء وأيدنا في استغراق رؤية ذلك بنور المعرفة والمشاهدة. اللهم استغرق أنفسنا وعقولنا وقلوبنا وأرواحنا وأسرارنا في أنوار جمالك وجلالك. وألبسنا خلع الكمال وأفننا في نور التوحيد وأبقنا بك وأسمعنا منك وفهمنا عنك وبصرنا في آلائك وأحينا بروح القرب وانفحنا بروح الشوق واحجب أبصارنا بأنوار جمالك عن مشاهدة الأغيار وضيق علينا بقربك حتى نشهدك أقرب إلينا من كل شيء وتجل علينا بعظمتك حتى لا نخاف أحدا غيرك. وأشهدنا عظيم رحمتك حتى لا نرجو أحدا سواك.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (٨) — اللهم خذنا من كل شيء إليك", "اللهم خذنا من كل شيء إليك. واجمعنا بك عليك. اللهم افتق رتقنا بنور معرفتك. وعمر أطوارنا بأرواح حظيرة قدسك. واسقنا من شراب محبتك. وفهمنا عنك. وعلمنا من علمك. وحققنا بنور توحيدك. وأيدنا بروح منك. وزين ألسنتنا بالصدق والعلم والحكمة وجوامع الكلم. وأسماعنا بالتصديق والوعي. وأنفسنا بالطمأنينة والعبودية. وقلوبنا بالسكينة والإيمان. وأرواحنا بالقرب والمشاهدة. وأسرارنا بالتحقيق والسيادة. وامنح صفاتنا بأنوار صفاتك. وكن لنا سمعا وبصرا ويدا ومؤيدا يا سميع يا بصير يا صادق يا قريب يا قوي يا عليم يا واحد يا الله.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (٩) — اللهم اجمعنا على أهل العلم والمعرفة", "اللهم اجمعنا على أهل العلم والمعرفة والولاية والخصوصية والاصطفائية بحسن الأدب والإخلاص في القصد والتوفيق في المطالب وأسلك بنا طريق السنة وجنبنا طريق البدعة ووفقنا في الفهم عنك وحسن الاعتقاد في الإيمان بأسمائك وصفاتك وهب لنا فرقانا نفرق به بين الحق والباطل. وأرنا الحق حقا فنتبعه. وأرنا الباطل باطلا فنجتنبه. وعلمنا من علم اليقين. وأشهدنا بعين اليقين. وحققنا بحق اليقين. يا مولاي يا واحد يا مولاي يا دائم يا علي يا حكيم.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (١٠) — إلهي من أقوى مني حولا وأنت", "إلهي من أقوى مني حولا وأنت حولي. ومن أولى مني بوجد آماله وأنت مأمولي. ومن أعظم مني قوة وأنت قوتي. ومن أحق مني بالأمان وأنت عصمتي. أمري وأمر كل شيء بيدك. يا الله يا رحمن يا رحيم يا واحد يا معبود يا من دينه التوحيد. مولاي أنت بكل شيء عليم فكفاني علمك وأنت على كل شيء قدير فحسبي قدرتك أنت ربي ورب الذين أردت أن تمن عليهم وتجعلهم أئمة وتجعلهم الوارثين وتمكن لهم في الأرض وترى فرعون وهامان وجنودهما منهم ما كانوا يحذرون. لك العظمة التي لا تضاهى. ولك النعمة التي لا تتناهى. وسلامك على عبادك الذين اصطفيت. سبحانك من حيث أنت. والحمد لله رب العالمين.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (١١) — يا من توحد بالأحدية في الأزلية", "يا من توحد بالأحدية في الأزلية. وتفرد بالوحدانية في الأبدية. لك سبحانك عز الفردانية. وملك الربوبية. وعظمة الألوهية. والصفات القدسية. أنت سبحانك الواجب الوجود. وخالق الموجود. والواهب الودود. والرب المعبود. أنت أهل الثناء والخير والحمد. والكبرياء والعظمة والتمجيد والمجد. ما حواك مكان. ولا أحاط بك زمان. وأنت كل يوم في شأن. تضع وترفع. وتعطي وتمنع. قدرتك قاهرة. وأحكامك باهرة. وأنوارك ظاهرة. وصفاتك ظاهرة.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (١٢) — وأنت مالك الدنيا والآخرة. ما عليك", "وأنت مالك الدنيا والآخرة. ما عليك حجر وحكمك عدل. وإحسانك فضل. لا إله إلا أنت ما أجل وصفك. وأبدع فعلك. وأشرف ذاتك. تعاليت عن الشبيه والنظير. والمشير والوزير. سبحانك يا كبير. سبحانك يا قدير. سبحانك سبحانك. سبحانك ما أعظم شأنك. سبحانك من حيث أنت بما أنت على ما أنت. وسبحانك من حيث سبحك المسبحون. وقدسك المقدسون. وسبحانك من حيث لا عبارة تدل عليك. ولا إشارة تصل إليك. أنت الذي سبحانك عجز عن إدراك كنه حقيقته العالمون والعارفون. سبحان ربك رب العزة عما يصفون. ما قدر قدرك غيرك. ما علمك سواك. ولا مجدك حقيقة إلا أنت. لا إله إلا أنت بما أنت على ما أنت. لا يكيفك فكر ولا يعلمك علم. ولا يلحقك وهم. وليس لك كم ولا كيف ولا ظرف ولا أين ولا جهة تسامتها الجهات ولا جسم ولا حس ولا قبل ولا بعد باينت كل الخلق بوصفك القديم أنت الواجب وسواك الجائز استحال عليك النقص وثبت لك الكمال والجلال والجمال والبهاء والعظمة والتقديس والتنزيه والأحدية والواحدية. والفردانية والصمدانية والديمومية. والجبروت والرحموت. والرغبوت والرهبوت والملك والملكوت. استويت على العرش سبحانك استواء يليق بكمال التنزيه. بلا قرار ولا مماسة ولا تشبيه.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (١٣) — وتنزلت بلا حركة ولا انتقال. تعاليت", "وتنزلت بلا حركة ولا انتقال. تعاليت عن ذلك كله يا متعال. سبحانك اختفيت وأنت الظاهر وظهرت وأنت الباطن قبل كل شيء وبعد كل شيء وفي كل شيء ومع كل شيء. أحاطت أسماؤك بكل حقائق الوجود من جواهر وأعراض وأحوال وعقول وأرواح ووسائط ومركبات وبسائط. غيبت علم ذلك عن علم كل عالم كان أو يكون. وتجليت بصفاتك فعلمتنا تنزيه سرك المصون. وأبدعت بدائع الحكم بأفعالك المنزهة عن الشريك في كل الشئون. سبحانك ما أسمى أسماءك. وما أجل وأعظم مسماك. حجبت سبحانك الذات بالصفات. وسترت الصفات بالأفعال. وأتقنت بدائع الصنع فأنت الفعال. حكمتك بالغة لا تدركها العقول كل ذرة منها تغني المستدل بها عليك. وتوصله إليك. هذا إذا تجليت سبحانك في حجاب المظاهر. أما إذا تجليت سبحانك بكنه الذات اضمحلت الأغيار. واظلمت الأنوار. وانقلبت المعرفة نكرا والعلم جهلا والفصاحة لكنة والوجود عدما. كان الله ولا شيء معه وهو الآن على ما عليه كان. قل هو الله أحد الله الصمد لم يلد ولم يولد ولم يكن له كفوا أحد. قل الله ثم ذرهم في خوضهم يلعبون. هو الأول والآخر والظاهر والباطن وهو بكل شيء عليم والله من ورائهم محيط بل هو قرآن مجيد في لوح محفوظ.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (١٤) — هو الله الذي لا إله إلا", "هو الله الذي لا إله إلا هو الملك القدوس السلام المؤمن المهيمن العزيز الجبار المتكبر سبحان الله عما يشركون. هو الله الخالق البارئ المصور له الأسماء الحسنى يسبح له ما في السموات والأرض وهو العزيز الحكيم. إلهنا سبحانك تجليت بوصف الألوهية فتولهت العقول وانفطرت القلوب وهامت الأرواح وحارت الأسرار وذلت النفوس. كل عزيز لسلطان عزك ذليل. وكل جبار متكبر لعظمتك حقير. من ناديته إليك أقبل عليك ومن حجبته عنك حرمته منك. ومن فتحت له باب الوصال لبس خلعة الكمال. ومن لم تسبق له منك المحبة لا ينال من وصلك حبه. فترى سيدي نحن ممن حكمت له السابقة بسعادة العناية في الأزل. وأغنيته بك عن كل علم وعمل. وكم والت نعمة إفضالك من جود وامتنان.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (١٥) — أنت الممد بالمدد. في الأزل والأبد", "أنت الممد بالمدد. في الأزل والأبد. بإمداد لا تحصى. ولا يحصرها العد فتستقصى. فتحت أبواب الوجود. في كل نواحي الوجود. برحمة عامة لكل موجود. هكذا يكون الكرم والجود. يا مولاي يا واحد يا مولاي يا دائم يا علي يا حكيم. إلهنا سبحانك في سابق علمك القديم تعينت ذرات العوالم وبإرادتك خصصتها. وبقدرتك أبرزتها. وبحكمتك رتبتها. وبإمدادك أمددتها. ولولا ذلك تلاشت. وما دام لها الوجود وعاشت. تجلى فيض إفضالك مدهش. وإسباغ أنواء نوالك منعش. سعد من واجهه فضلك يا كريم. ورحمته رحمتك يا رحيم.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (١٦) — إلهنا سبحانك في أم الكتاب كتبت", "إلهنا سبحانك في أم الكتاب كتبت أمر مشيئتك التي لا تتبدل. وحكمت به حكمك الذي لا يحول ولا يتحول. ثم لطفت في التقدير. فنعم المولى أنت ونعم النصير. سبحانك عدلت في الحكم ونفذت المشيئة على وفق العلم القديم من غير شريك لك. لا إله إلا أنت سبحانك إني كنت من الظالمين. إلهنا سبحانك نور جمال حضرتك القدسية. هيم أهل محبتك في البرية. وجلال سطوة عظمتك الكبير. خضع له كل كبير وصغير. وشأن ربوبيتك عطل الشئون. وإحاطة علمك أحاطت بما كان وبما يكون. ما خرج شيء عن دائرة إرادتك المحيطة بالكليات والجزئيات. لا إله إلا أنت رب الأرضين والسموات.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],

["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (١٨) — أنت وحدك المليك. ما معك غير", "أنت وحدك المليك. ما معك غير ولا شريك. إلهنا سبحانك إرادتك سابقة بما شئت من التقدير على العباد من خير وشر وسعادة وشقاوة وهداية وضلالة وإيمان وكفران. وطاعة وعصيان. وإذا كانت المشيئة بحكم الإرادة سابقة فما الحيلة في التقدير. لكن أنت البصير والنصير. يا من لا حجر عليه في الكون. كن لنا أبدا في العون. بحنانك يا رءوف. بعطفك يا عطوف. يا ربنا يا مولانا يا سيدنا يا سندنا يا ملاذنا يا عياذنا يا ملجأنا يا منجانا يا غوثنا يا عزنا يا كنزنا.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (١٩) — يا فوزنا يا حرزنا. لا إله", "يا فوزنا يا حرزنا. لا إله إلا أنت ما لنا سواك. ببابك وقفنا. وبك لك توسلنا. وعلى بساط غناك بسطنا أيدي الفقر والاضطرار. وجئنا بحالة الذلة والانكسار. وأنت الكريم وجابر القلوب. وأنت معطي كل خير ومرغوب. إلهنا نسألك يا من أعطى قبل السؤال. يا من ليس له شبيه ولا مثال. يا من خلق الخلق ليربحوا عليه. يا من دعا أهل ولايته إليه. يا كاشف الكروب. يا علام الغيوب. يا حميد يا مجيد. يا قدير يا مريد.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],

["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (٢٦) — إلهي لا قريب إلا من أدنته", "إلهي لا قريب إلا من أدنته العناية ولا مهدي إلا من هدته الهداية. ولا معصوم إلا من أمن من غين الغواية. ولا محفوظ إلا من وقي بقاف الوقاية. يا مولاي يا واحد يا مولاي يا دائم يا علي يا حكيم. إلهي اجمعني بك عليك من أودية الشتات. ونجني من حظوظ الأنفس والشهوات واكفني كل هم يبعد ويدني ومكر في الأمور يهدم ويبني ووسواس موسوس بضيق الأرزاق. ويسيء الظن بالرزاق الخلاق. وشيطان يجلب الخوف من المخلوقين. وينسي الاعتماد على رب العالمين.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],

["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (٢٨) — يا مولاي يا واحد يا مولاي", "يا مولاي يا واحد يا مولاي يا دائم يا علي يا حكيم. إلهي ذلي نادى بعزك وضعفي نادى بقوتك وفقري نادى بغناك وعجزي نادى بحولك وطلبي نادى بطولك فأجب المضطر إلى هذه المطالب وأنله ما سأل من المآرب يا مجيب يا مجيب يا مجيب. يا قريب يا قريب يا قريب. يا الله يا الله يا الله يا مولاي يا واحد يا مولاي يا دائم يا علي يا حكيم. إلهي أطلقت سوابق الأرواح في ميادين الأزل وجعلت منها الفاضل والمفضول والمخفوض والمرفوع. والتابع والمتبوع. وناديتها إلى حضرات الوصال. ومشاهدات الجمال. فأجابتك بأنواع الكمال. ملبية خاضعة. متواضعة خاشعة.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (٢٩) — يا مولاي يا واحد يا مولاي", "يا مولاي يا واحد يا مولاي يا دائم يا علي يا حكيم. إلهي أحي روحي بك حياة أبدية. ومتع سري بسرك في الحضرات الشهودية. واملأ قلبي بالمعارف الربانية. وأطلق لساني بالعلوم اللدنية. واجعلني فتاحا لأقفال المشكلات. مستأنسا بك في أندية المخاطبات. سابحا في بحار الذات. واقفا على ساحل النجاة. آخذا بيد الغريق. ممكنا بك في كل فريق. ماسكا لأزمة التحقيق. جامعا لأشتات الطريق. ظاهرا بالجمال. متظاهرا بالجلال. متحققا بالكمال. مكملا للأتباع. مخلصا لهم من ظلمة الطباع. وغطاء الحجاب. وشرك الأسباب.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (٣٠) — يا نور كل شيء وهداه. ووليه", "يا نور كل شيء وهداه. ووليه ومولاه. يا وليي يا مولاي. في آخرتي ودنياي. لا إله إلا أنت سبحانك تعالى جدك وعز جارك وتباركت أسماؤك يا قدوس يا سلام يا مؤمن يا مهيمن يا عزيز يا جبار لا إله إلا أنت سبحانك إني كنت من الظالمين. وحسبنا الله ونعم الوكيل. ولا حول ولا قوة إلا بالله العلي العظيم. اللهم إنك تنزهت عن الكيف والمقدار. وتقدس اسم ذاتك على العرش سبحانك عن التمكن والقرار. تعاليت سبحانك عن الحلول في مكان. وتمجدت أن تحيط بك دائرة الزمان. كنت قبل خلق العوالم غنيا عن الأكوان.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["هداية وثبات|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (٣١) — وأنت الآن على ما كنت يا", "وأنت الآن على ما كنت يا ديان. ليس لك شبيه ولا نظير. ولا معين ولا وزير. ولا كفؤ ولا ند. ولا قبل ولا بعد. ولا غاية ولا حد. ولا والد ولا ولد. قل هو الله أحد. الله الصمد. لم يلد ولم يولد. ولم يكن له كفوا أحد. اللهم يا مالك يا حميد. يا قدوس يا مجيد. نسألك الثبات على التوحيد. والعناية والتأييد. يا ربنا هب لنا قلبا سليما. وسلوكا قويما. ومعرفة وذوقا. ومحبة وشوقا. وهداية ونورا. وصفة وسرورا. وتوبة ماحية سواد الذنوب. وأوبة تمنعنا من كل العيوب.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (٣٢) — اللهم من علينا بصفة قدسك. وآنسنا", "اللهم من علينا بصفة قدسك. وآنسنا بأنسك. وأذقنا حلاوة المناجاة. في عزلة الخلوات. وهب لنا كمال التخلي. وحلنا بحلية التجلي. لنتملى بشهودك في حضرات التملي. اللهم يا سميع يا بصير. ويا نعم المولى ويا نعم النصير. نسألك كما منحتنا قبل السؤال. أن تفتح عن قلوبنا الأقفال. يا منور الظلمات. ويا معطي أهل الأرضين والسموات. نورنا بنورك يا نور الأنوار. واجمعنا على سرك الجامع لكل الأسرار. ربنا عنك لا تبعدنا.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (٣٣) — ربنا بقربك شرفنا. ربنا عن بابك", "ربنا بقربك شرفنا. ربنا عن بابك لا تطردنا. ربنا بفضلك اغمرنا. ربنا من جودك لا تحرمنا. ربنا لغيرك لا تسلمنا. ومن كل بلاء سلمنا. وببهجة جمال حضرتك متعنا. وبكل كمال كملنا. وعن كل نقص قدسنا. لك لا لغيرك سؤالنا. أنت ملاذنا وعياذنا. حاشاك أن نرجع منك بالخيبة وأنت الكريم ولك الكرم المطلق. ونحن الفقراء وأنت الغني وبك الغنى المحقق. رب أنت مبدع الموجودات. ونورك الساطع فلق الظلمات. وقدرتك القاهرة الباهرة رفعت السموات. وفيض إفضال جودك غمر المخلوقات. وحكمتك المحكمة زينت الكائنات. وإرادتك القديمة خصصت المصنوعات. وسرك منعش للأرواح بالنفحات. وبارق جمال حضرتك يلوح منه للعقول لمحات. وطيب نسمات رحمتك يفوح منه على القلوب رحمات. فبحق الجود والعطف والإحسان. والرحمة والرأفة والامتنان. والوصف الطاهر الأقدس. والنعت المنزه المقدس.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الخامس (٣٤) — أسألك نظرة الحنان والعطف يا عطوف", "أسألك نظرة الحنان والعطف يا عطوف. ونفحة الفضل رحمة منك يا رحيم يا رءوف. يا من لا ينال فضله إلا بفضله. ولا تعطى رحمته إلا برحمته. ها نحن نتوسل بفضلك إلى فضلك. ونسألك المزيد من فضلك. ونسألك ما يليق بفضلك يا ذا الفضل العظيم. رب أغن فاقة افتقاري، وقرب دار بعد مزاري. يا جابر انكساري. ويا كفيل اضطراري. دفعت بقوتك في نحور أعدائي. واشتفيت بشفائك من عظيم دائي. يا عيادي يا ملاذي يا شفائي.", "جامع الثناء على الله تعالى للنبهاني — الورد الخامس (الجمعة)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],

["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (٦) — لا مقتدر إلا الله لا مقدم", "لا مقتدر إلا الله لا مقدم إلا الله لا مؤخر إلا الله لا أول إلا الله لا آخر إلا الله لا ظاهر إلا الله لا باطن إلا الله لا والي إلا الله لا متعالي إلا الله لا بر إلا الله لا تواب إلا الله لا منتقم إلا الله لا عفو إلا الله لا رءوف إلا الله لا مالك الملك إلا الله لا ذا الجلال والإكرام إلا الله لا مقسط إلا الله لا جامع إلا الله لا غني إلا الله لا مغني إلا الله لا مانع إلا الله لا ضار إلا الله لا نافع إلا الله لا نور إلا الله لا هادي إلا الله لا بديع إلا الله لا باقي إلا الله لا وارث إلا الله لا رشيد إلا الله لا صبور إلا الله.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (٧) — إلهي كلت العبارات عن وصفك وعظم", "إلهي كلت العبارات عن وصفك وعظم كرمك وعم فلم يختص بمسئول ولا مرغوب فيه فنسألك خيراتك السنية. ومعارفك البهية. وإشراقاتك العلية. خصنا بلطفك وأدم شهود عزك بقلوبنا وحواسنا. ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار. إلهي كل صفة مجد تحققت لك وانفردت بها وكل كمال هو لك فأسألك بتوحيدك أن توحدني لك وبتفريدك أن تفردني لك. وألا تبقي في ذرة ولا أصغر إلا وهي لك. يا جامع الكمالات.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (٨) — يا من أحاط بإفراد الملك والملكوت", "يا من أحاط بإفراد الملك والملكوت والغيب والشهادات. يا إلهي وسيدي ومولاي. يا الله يا رحمن يا رحيم. يا كامل الصفات. يا منزها عن الاختلافات. أنت الواحد الأحد. الفرد الصمد. المنزه عن الصاحبة والولد. الذي لم يلد ولم يولد. ولم يكن له كفوا أحد. أنى تساويه الأغيار. وهو مبديها. أو تلحقه الآثار. وهو منشيها. أو تشبهه الحوادث وهو مفنيها. يأبى ذلك جلاله. ويدفعه كماله. فهو كما هو لا إله إلا هو رب العرش العظيم. خلقتني ونسبت إليك. وعلمتني وعولت عليك. وأظهرتني وظهرت لدي وأحوجتني لك في كل شيء. فمن أنا لولاك هل ثم إلا نورك. وهل سطع إلا ظهورك.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (٩) — سبحانك عن سواك. وسبحانك عن شهود", "سبحانك عن سواك. وسبحانك عن شهود علاك. وسبحانك تقدست أسماؤك وسبحانك عن إدراك تنزيهك وإدراك ذاتك لا إله إلا أنت يا نور يا حق يا مبين. ولك الحمد منك وأنت الظاهر والباطن والأول والآخر وأنت على كل شيء قدير. فسبحانك إلهنا وإله كل شيء ومولانا ومولاه أنت العلي الكبير. إلهي من أنا وما علمي وما عملي. وما سؤلي وما أملي. وما جودي وما بخلي. أنت المبدئ المعيد. الولي الحميد. الكريم المجيد. ذو الآلاء الظاهرة. والنعم المتوافرة. نورت الأكوان بمعاليك القديمة. فأوجدت كلها في خدمتك مستديمة. آياتك العلية. وصفاتك السنية. وطوالع مجدك البهية. أمرت ونهيت. وحكمت وقضيت. فلك الحمد فيهما مهما قضيت فتسليم وسلام. ومهما أمرت فلك فيه أحكام. ومهما نهيت ففيه مشهد التمام.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (١٠) — أنت الواحد ورغم أنف اللاحي. يا", "أنت الواحد ورغم أنف اللاحي. يا مكون الأكوان. يا رب كل زمان. يا واحد يا أحد يا ديان. دان لك من أدنيت. وبعيد عنك من أقصيت. لا إله إلا أنت سبحانك رب العالمين. أنت الحامد قبل حمد الحامدين. الموجود قبل وبعد الأولين والآخرين. يا حنان يا منان يا إله العالمين. أنت القيوم القائم. وأنا الفقير الحائم. ببابك جاث ملازم. كيف يحجب من أذنت له في الدخول. أم كيف يسأل سواك من زف إليه الوصول. حاشا علاك. أن يخرج لسؤال مما سواك. تعاليت يا ذا الجلال. في كل مقام ومقال. وحال وقال.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (١١) — أنت الحق الوكيل. والمولى الجليل. يا", "أنت الحق الوكيل. والمولى الجليل. يا مظهر الجميل بالجميل. أنت حسبي ونعم الوكيل. لا شيء إلا وهو موكول إليك. مفتقر بك إليك. مستدل بك عليك. يا نور البصائر. لشهود المآثر. ويا كاشف الضر عمن دعاه. وصارف السوء عمن ناجاه. ذلك فضل الله يؤتيه من يشاء والله ذو الفضل العظيم.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (١٢) — إلهي تعالى قدس ذاتك. وتبارك سر", "إلهي تعالى قدس ذاتك. وتبارك سر أسمائك وصفاتك. وامتلأ الكون بأنوارك. وأشرق الوجود بلوامع سواطع أسرارك. وتنزل غيداق رزقك من سماء إمدادك. وخصصت بسر أحديتك الصفوة الخيرة من عبادك. ونظرت باسمك الباطن لبواطن أوليائك فغابوا فيك عما سواك وظهروا متسربلين من اسمك الظاهر بسرابيل قدسك. لك الهوية المطلقة. والأحدية الجامعة المحققة. والعظمة التي تخر عندها جهات السموات وجبال الأرض هدا. والجلالة التي جعلت بين أصفيائك وأعدائك من سلطان قاهريتك وبرهان قيوميتك حجابا وسدا.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["رزق وبركة|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (١٣) — يا باسط يا ودود. يا مالك", "يا باسط يا ودود. يا مالك يا معبود. يا مقصود يا موجود. يا عزيز أنت الله يا عزيز أنت الله. يا رحمن يا رحيم. يا حي يا قيوم. يا علي يا عظيم. يا ذا الجلال والإكرام. لبيك لبيك. مولاي مولاي. دلنا بابك عليك. وارزقنا من المثبتات ما نكون به متأدبين بين يديك. واجعلنا من أهل خصوصيتك. الداخلين جناب رحمتك. المتمتعين بقربك ورؤيتك. وقدسنا من العيوب والآفات. وطهرنا من الذنوب والسيئات. وسلمنا من كل وصف ذميم. واجعلنا ممن أتى الله بقلب سليم. وأمنا يوم الفزع الأكبر. وارزقنا منك وبك مزيد الحظ الأوفر. وحققنا بالذلة لك والعزة بك في كل شان. حتى نعتز بعزتك بين أهل التوحيد والعرفان. ولا تذلنا باتباع شهوات الأنفس وخطرات الشيطان. لا يذل من أنت وكيله. ولا يضيع من أنت كفيله. ولا يخيب من أنت ناصره. ولا ينسى من أنت بلطفك ذاكره.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (١٤) — يا من أظهر محاسن من شاء", "يا من أظهر محاسن من شاء من عباده فضلا وإحسانا. وستر العورات والمساوئ جودا وعفوا وغفرانا. إن عصتك النفس الأمارة بالسوء فبقاهريتك طوعا لتقديرك. وإن أطاعتك المرضية المطمئنة فبإرادتك وحكمتك وتدبيرك. توسلت إليك بفقري. ووصول الفقر إليك محال. وشكوت إليك ضعفي وضري. وما يخفى عليك حال. وما أقربك منا وما أبعدنا عن بابك. ولكن ظلمة بعدنا عنك يكشفها نور اقترابك. دلت الآثار والأطوار أنك تعرفت لعبادك في كل شيء فيا فوز من عرف. وما جهلك شيء حيث كنت أنت الذي لذاته بذاته دل ووصف. كثرة حلمك أطمعتنا في مزيد فضلك. وقوة نقمتك خوفتنا من سطوة عدلك. عزمنا على طاعتك من حيث إنك آمر. وعجزنا عن أداء حقها لأنك القوي القاهر. فإن قصرت همتنا عن قدرتك فعلا وجزما. فما قصرت بفضلك واقتدارك محبة وعزما.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (١٥) — يا ذل من ليس له من", "يا ذل من ليس له من حبك نصيب. ويا عز من أنت له محب وحبيب. وحقك ذلنا إليك ظاهر. وما على أقوالنا وأفعالنا وكل أحوالنا عنك شيء ساتر. استوى عندك السر والعلن. وأحاط علمك بما ظهر في الكون وما بطن. وما هو الكون وما هو الظهور والبطون. لا إله غيرك ولا رب سواك ولا معبود إلا أنت في سائر الشئون. فحققنا اللهم بحقائق أهل القرب. وأقمنا بصدق العبودية إليك في مشاهد أهل الاصطفاء والحب. وأغننا بتدبيرك لنا عن تدبيرنا. واختيارك عن اختيارنا. واجعل في مرادك مرادنا. وقو فيك رجاءنا. وإليك التجاءنا. وعليك اعتمادنا.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (١٦) — يا الله يا رحمن يا رحيم", "يا الله يا رحمن يا رحيم. يا حي يا قيوم يا علي يا عظيم. يا ذا الجلال والإكرام. اللهم لك أسأل. وبك أتوسل. وعليك أتوكل. وبعزتك أستنصر فانصرني. وعليك أتكل فإلى من سواك تكلني. فنعم النصير والوكيل أنت. لا إله إلا أنت. لا أخيب وفي فضلك مرغوبي. ولا أحرم وأنت مأمولي ومطلوبي. رفعت حاجتي إليك. فوجدتك جوادا كريما. وعرضت أمري عليك. ولم تزل محيطا عليما. فكنت بي برا رءوفا رحيما. ها أنا عبدك وها أنت ربي. ها أنا مستنصرك وها أنت حسبي. لا يحجبنا عنك سماء ولا أرض. ولا يحول بيننا وبينك وبين علمك طول ولا عرض. أنا منسوبك قبل نشأتي. فلا تبعدني بعد ذلك. ومحسوب عليك قبل فطرتي. فلا تطردني عن أشرف المسالك. كل جزء مني مضطر إليك وأنت غني عني. غلب قضاؤك كل شيء. لا توحش العوالم قلبا أنت نوره وأنسه. ولا تلج الظلمة فؤادا أشرقت من نور سماء حكمتك شمسه. خاب من رضي سواك بدلا. وخسر من ظن عنك متحولا. لا حول ولا قوة إلا بك. ولا نصرة إلا بجنابك. كم لك من ولي أذقته حلاوة مؤانستك. فقام بين يديك متملقا. وكم لك من صفي ألبسته من ملابس الهيبة والجلال والقبول والإقبال والتقى.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية؛ وفي بعض عبارات التوسل خلاف بين العلماء", "u"],
["الظلم والأعداء|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (١٧) — يا من احتجب في سرادق عز", "يا من احتجب في سرادق عز ذاته. فلا تدركه الأبصار وهو يدرك الأبصار. وتجلى بسر أسمائه وصفاته. فأمد ما شاء من الآثار. ومحق بنور جماله وجلاله حجب الأكدار والأغيار. لا تخفى وأنت الظاهر. ولا تغيب وأنت الرقيب الحاضر. يا منفس كربة كل مكروب. ويا كاشف الضر والبلوى عن أيوب. ويا من أقر بيوسف عين صفيه ونبيه يعقوب. ونجى نوحا من الغرق. وإبراهيم من الحرق. ويونس من الظلمات. وسلم موسى من شر الجبابرة العتاة. وأعاذ محمدا صلى الله عليه وسلم من شياطين الإنس والجنة. وحفظ الأرواح قبل الأشباح وبعد ما صارت في البطون أجنة. وصورها بحكمته. وأبداها إلى هذا الوجود بقدرته. وقدر لها رزقا وأجلا. إلى أن أعادها إلى ما كانت عليه أولا. ثم إن عليه النشأة الأخرى.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (١٨) — يا من جعل لكل شيء مبدأ", "يا من جعل لكل شيء مبدأ وغاية وقدرا. إلى سلطانك العظيم التجي. ولعفوك الواسع وإحسانك العميم أرتجي. ها أنا أشكو إليك ما لا يخفى عليك. فاكشف بنور ألوهيتك عني سحاب ضري وبثي وحزني. طمع المذنبون في سعة رحمتك. وفاز الطالبون بجزيل نعمتك. وازدحم المؤملون على أبواب كرمك. حتى تسابق العصاة إلى رحاب حلمك ونعمتك. يا قوي خذ بيدي. يا قدير عليك معتمدي. يا قهار اقهر جنود أعدائي في كل وقت وحين. يا مقتدر اشدد وطأتك على حسادي باسمك القاهر المتين. واجعلني بولايتك يا ولي يا حميد وليا محمودا. واملأ باطني وظاهري يا باعث يا شهيد يقينا وشهودا. وارحمني رحمة تجمع بها شتات قلبي. وتحقق بها غفران ذنبي. وتفريج كربي. فنعم الرب أنت ربي. ونعم الحسب أنت حسبي.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["رزق وبركة|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد السادس (١٩) — يا الله يا رحمن يا رحيم", "يا الله يا رحمن يا رحيم. يا حي يا قيوم يا علي يا عظيم. يا ذا الجلال والإكرام. أنت الله الرحمن الرحيم. المحيط السريع الظاهر الناصر الكريم. سبحانك فيك المرغوب. ومنك المطلوب والمرهوب. أدعوك دعوة نبيك وصفيك أيوب. أنت الحق الذي لا حق سواه. ولا معه غيره ولا شيء لولاه. لك العظمة والسلطان. والملك والقدرة ورفعة الشأن. خلقت الخلق رحمة منك من غير حاجة لك في خلقهم ورزقهم. ومددتهم بما شئت وتكفلت بأجلهم ورزقهم. لك الحمد وسعت كل شيء رحمة وعلما. وغفرت الذنوب وسترت العيوب حنانا منك ورأفة وحلما.", "جامع الثناء على الله تعالى للنبهاني — الورد السادس (السبت)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
