["مناسبات وأخلاق|مجموعة حصن المسلم", "من أنواع الخير والآداب الجامعة", "قَالَ النَّبِيُّ صلى الله عليه وسلم إِذَا كَانَ جُنْحُ اللَّيْلِ – أَوْ أَمْسَيْتُم – فَـكُفُّوا صِبْيانَـكُم، فَإِنَّ الشَّيَاطِينَ تَنْتَشِرُ حِينَئِذٍ، فَإِذَا ذَهَبَ سَاعَةٌ مِنَ اللَّيلِ فَخَلُّوهُمْ، وَأَغْلِقُوا الأَبْوَابَ وَاذْكُرُوا اسْمَ اللَّهِ؛ فَإِنَّ الشَّيطَانَ لاَ يَفْتَحُ بَاباً مُغلَقاً، وَأَوْكُوا قِرَبَكُمْ، وَاذْكُرُوا اسْمَ اللَّهِ، وَخَمِّرُوا آنِيَتَكُم، وَاذْكُرُوا اسْمَ اللَّهِ، وَلَوْ أَنْ تَعْرُضُوا عَلَيْهَا شَيْئاً، وَأَطْفِئُوا مَصَابِيحَكُمْ.", "حصن المسلم للقحطاني", "h"],
["دلائل الخيرات|هداية وثبات", "افتتاح دلائل الخيرات — النية والدعاء (ص ٢–٣)", "بسم الله الرحمن الرحيم. الحمد لله رب العالمين، حسبي الله ونعم الوكيل، ولا حول ولا قوة إلا بالله العلي العظيم. اللهم إني أبرأ من حولي ومن قوتي إلى حولك وقوتك. اللهم إني أتقرب إليك بالصلاة على سيدنا محمد عبدك ونبيك ورسولك سيد المرسلين صلى الله تعالى عليه وسلم وعليهم أجمعين، امتثالاً لأمرك، وتصديقاً له، ومحبةً فيه، وشوقاً إليه، وتعظيماً لقدره، ولكونه صلى الله عليه وسلم أهلاً لذلك، فتقبلها مني بفضلك، واجعلني من عبادك الصالحين، ووفقني لقراءتها على الدوام بجاهه عندك، وصلى الله على سيدنا محمد وآله وصحبه أجمعين.", "من دلائل الخيرات للجزولي (ص ٢–٣) — صيغة اجتهادية؛ وفي التوسل «بجاهه» خلاف بين العلماء", "g"],
["دلائل الخيرات", "افتتاح دلائل الخيرات — ما يُقرأ بعد الدعاء (ص ٣–٤)", "أستغفر الله العظيم (ثلاثاً). سبحان الله والحمد لله. حسبي الله ونعم الوكيل (ثلاثاً). ثم يقول التالي: أعوذ بالله من الشيطان الرجيم. بسم الله الرحمن الرحيم ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾ (ثلاثاً)، ثم المعوذتين مرة مرة بالبسملة، ثم الفاتحة وأول سورة البقرة ﴿الم ۝ ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ ۝ الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ ۝ وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنزِلَ إِلَيْكَ وَمَا أُنزِلَ مِن قَبْلِكَ وَبِالْآخِرَةِ هُمْ يُوقِنُونَ ۝ أُولَٰئِكَ عَلَىٰ هُدًى مِّن رَّبِّهِمْ ۖ وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ﴾ ثم يقرأ: ﴿وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا﴾ ثم أسماء الله الحسنى.", "من دلائل الخيرات للجزولي (ص ٣–٤) — إرشاد القراءة", "g"],
["دلائل الخيرات|ثناء وتمجيد|فك الكرب والهم", "ثناء ودعاء ختم أسماء الله الحسنى (ص ٦–٩)", "الذي تقدست عن الأشباه ذاته، وتنزهت عن مشابهة الأمثال صفاته، واحد لا من قلة، وموجود لا من علة، بالبر معروف، وبالإحسان موصوف، معروف بلا غاية، وموصوف بلا نهاية، أول بلا ابتداء وآخر بلا انتهاء، لا ينسب إليه البنون، ولا يفنيه تداول الأوقات، ولا توهنه السنون، كل المخلوقات قهر عظمته، وأمره بالكاف والنون، بذكره أنس المخلصون، وبرؤيته تقر العيون، وبتوحيده ابتهج الموحدون، هدى أهل طاعته إلى صراط مستقيم، وأباح أهل محبته جنات النعيم، وعلم عدد أنفاس مخلوقاته بعلمه القديم، ويرى حركات أرجل النمل في جنح الليل البهيم، يسبحه الطير في وكره، ويمجده الوحش في قفره، محيط بعمل العبد سره وجهره، وكيل للمؤمنين بتأييده ونصره، وتطمين القلوب الوجلة بذكره وكشف ضره، ومن آياته أن تقوم السماء والأرض بأمره، أحاط بكل شيء علماً، وغفر ذنوب المذنبين كرماً وحلماً، ليس كمثله شيء وهو السميع البصير. اللهم اكفنا السوء بما شئت وكيف شئت، إنك على ما تشاء قدير، يا نعم المولى ويا نعم النصير، غفرانك ربنا وإليك المصير، ولا حول ولا قوة إلا بالله العلي العظيم. سبحانك لا نحصي ثناء عليك أنت كما أثنيت على نفسك، جل وجهك وعز جاهك، يفعل الله ما يشاء بقدرته، ويحكم ما يريد بعزته، يا حي يا قيوم، يا بديع السماوات والأرض، يا ذا الجلال والإكرام، لا إله إلا أنت برحمتك نستغيث ومن عذابك نستجير، يا غياث المستغيثين، لا إله إلا أنت بجاه سيدنا محمد صلى الله عليه وسلم أغثنا وارحمنا ﴿رَحْمَتُ اللَّهِ وَبَرَكَاتُهُ عَلَيْكُمْ أَهْلَ الْبَيْتِ ۚ إِنَّهُ حَمِيدٌ مَّجِيدٌ﴾ ﴿إِنَّمَا يُرِيدُ اللَّهُ لِيُذْهِبَ عَنكُمُ الرِّجْسَ أَهْلَ الْبَيْتِ وَيُطَهِّرَكُمْ تَطْهِيرًا﴾ ﴿إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ ۚ يَا أَيُّهَا الَّذِينَ آمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا﴾", "من دلائل الخيرات للجزولي (ص ٦–٩) — صيغة اجتهادية؛ وفي التوسل «بجاه» خلاف بين العلماء", "g"],

["الآخرة وحسن الخاتمة|مغفرة واستغفار|مجموعة مناجاة", "اللهم إنا نستغفرك استغفارا يُطهر النفوس…", "اللهم إنا نستغفرك استغفارا يُطهر النفوس من أوزارها، ونشهدُ لكَ شهادةً نُحشر تحت ظلالها، وارزقنا حمداً يملأُ الميزان، وشكراً يزيدُنا في الإحسان، وارزقنا تلاوة القرآن بأصدق منطق وأحسن بيان، واجعل قلوبنا له أوعية صفية نقية تقية، واجعل نفوسنا به راضية مرضية، نسألُك بوجهك الكريم، نسألك بوجهك الكريم الفردوس الأعلى، نسألُكَ إيماناً لا يرتد، ونعيمًا لا ينفد، وقرة عين لا تنقطع، ومرافقة نبيك محمد (صلى الله عليه وسلم) في أعلى جِنان الخُلد، يا مَن يُجير ولا يُجار عليه، أجرنا من النار، ومن خزى النار، ومن كل عمل يقربنا إلى النار، وأدخلنا الجنة مع الأبرار، نسألك رضاك والجنة، ونعوذ بك من سخطك والنار.", "من مجموعة «مناجاة»", "u"],
["دعاء للأمة|هداية وثبات|مجموعة مناجاة", "اللهم اجعل القرآن العظيم زادنا وسندنا،…", "اللهم اجعل القرآن العظيم زادنا وسندنا، والسُنة المطهرة حبنا ومددنا، واحفظنا من تفرُق كلمتنا، واعصمنا من شتات أمرنا، ولا تجعلنا فِرقًا وشيعا، ولا تجعلنا فرقا وشيعا نُخالف بعضنا، واجعل صلاتنا للبلاء واقية، وللأمراض شافية، واجعل تلاوتنا للقرآن مُنجية، ومن النار كافية، واجعل نفوسنا صافية، وفى الآخرة راضية. يا من لا تضيع عنده الودائع.", "من مجموعة «مناجاة»", "u"],

["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء", "حزب الأربعاء (٢٠) — كما صليت على إبراهيم وكلما ذكره الذاكرون", "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى سَيِّدِنَا إِبْرَاهِيمَ وَعَلَى آلِ سَيِّدِنَا إِبْرَاهِيمَ فِي الْعَالَمِينَ، إِنَّكَ حَمِيدٌ مَجِيدٌ. وَصَلِّ اللَّهُمَّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ كُلَّمَا ذَكَرَهُ الذَّاكِرُونَ، وَغَفَلَ عَنْ ذِكْرِهِ الْغَافِلُونَ. اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ، وَارْحَمْ سَيِّدَنَا مُحَمَّدًا وَآلَ سَيِّدِنَا مُحَمَّدٍ، وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ، كَمَا صَلَّيْتَ وَرَحِمْتَ وَبَارَكْتَ عَلَى سَيِّدِنَا إِبْرَاهِيمَ وَعَلَى آلِ سَيِّدِنَا إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ.", "من دلائل الخيرات للجزولي (ص ٣٧–٣٨ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب", "g"],

["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء", "حزب الأربعاء (٢٢) — نبي الحكم والحكمة وأفضل صلوات الله", "اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا وَمَوْلَانَا مُحَمَّدٍ نَبِيِّ الْحُكْمِ وَالْحِكْمَةِ السِّرَاجِ الْوَهَّاجِ، الْمَخْصُوصِ بِالْخُلُقِ الْعَظِيمِ وَخَتْمِ الرُّسُلِ ذِي الْمِعْرَاجِ، وَعَلَى آلِهِ وَأَصْحَابِهِ وَأَتْبَاعِهِ السَّالِكِينَ عَلَى مَنْهَجِهِ الْقَوِيمِ، فَأَعْظِمِ اللَّهُمَّ بِهِ مِنْهَاجَ نُجُومِ الْإِسْلَامِ وَمَصَابِيحِ الظَّلَامِ، الْمُهْتَدَىٰ بِهِمْ فِي ظُلْمَةِ لَيْلِ الشَّكِّ الدَّاجِ، صَلَاةً دَائِمَةً مُسْتَمِرَّةً مَا تَلَاطَمَتْ فِي الْأَبْحُرِ الْأَمْوَاجُ، وَطَافَ بِالْبَيْتِ الْعَتِيقِ مِنْ كُلِّ فَجٍّ عَمِيقٍ الْحُجَّاجُ، وَأَفْضَلُ الصَّلَاةِ وَالتَّسْلِيمِ عَلَى سَيِّدِنَا مُحَمَّدٍ رَسُولِهِ الْكَرِيمِ، وَصَفْوَتِهِ مِنَ الْعِبَادِ، وَشَفِيعِ الْخَلَائِقِ فِي الْمِيعَادِ، صَاحِبِ الْمَقَامِ الْمَحْمُودِ، وَالْحَوْضِ الْمَوْرُودِ، النَّاهِضِ بِأَعْبَاءِ الرِّسَالَةِ وَالتَّبْلِيغِ الْأَعَمِّ، وَالْمَخْصُوصِ بِشَرَفِ السِّعَايَةِ فِي الصَّلَاحِ الْأَعْظَمِ، صَلَّى اللَّهُ عَلَيْهِ وَعَلَى آلِهِ صَلَاةً دَائِمَةً مُسْتَمِرَّةَ الدَّوَامِ عَلَى مَرِّ اللَّيَالِي وَالْأَيَّامِ، فَهُوَ سَيِّدُ الْأَوَّلِينَ وَالْآخِرِينَ، وَأَفْضَلُ الْأَوَّلِينَ وَالْآخِرِينَ، عَلَيْهِ أَفْضَلُ صَلَاةِ الْمُصَلِّينَ، وَأَزْكَى سَلَامِ الْمُسَلِّمِينَ، وَأَطْيَبُ ذِكْرِ الذَّاكِرِينَ، وَأَفْضَلُ صَلَوَاتِ اللَّهِ وَأَحْسَنُ صَلَوَاتِ اللَّهِ، وَأَجَلُّ صَلَوَاتِ اللَّهِ، وَأَجْمَلُ صَلَوَاتِ اللَّهِ، وَأَكْمَلُ صَلَوَاتِ اللَّهِ، وَأَسْبَغُ صَلَوَاتِ اللَّهِ، وَأَتَمُّ صَلَوَاتِ اللَّهِ، وَأَظْهَرُ صَلَوَاتِ اللَّهِ، وَأَعْظَمُ صَلَوَاتِ اللَّهِ، وَأَذْكَى صَلَوَاتِ اللَّهِ، وَأَطْيَبُ صَلَوَاتِ اللَّهِ، وَأَبْرَكُ صَلَوَاتِ اللَّهِ، وَأَزْكَى صَلَوَاتِ اللَّهِ، وَأَنْمَى صَلَوَاتِ اللَّهِ، وَأَوْفَى صَلَوَاتِ اللَّهِ، وَأَسْنَى صَلَوَاتِ اللَّهِ، وَأَعْلَى صَلَوَاتِ اللَّهِ، وَأَكْثَرُ صَلَوَاتِ اللَّهِ، وَأَجْمَعُ صَلَوَاتِ اللَّهِ، وَأَعَمُّ صَلَوَاتِ اللَّهِ، وَأَدْوَمُ صَلَوَاتِ اللَّهِ، وَأَبْقَى صَلَوَاتِ اللَّهِ، وَأَعَزُّ صَلَوَاتِ اللَّهِ، وَأَرْفَعُ صَلَوَاتِ اللَّهِ، وَأَعْظَمُ صَلَوَاتِ اللَّهِ.", "من دلائل الخيرات للجزولي (ص ٣٨–٣٩ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأربعاء", "حزب الأربعاء (٢٣) — على أفضل خلق الله ورسول الله وحبيب الله", "عَلَى أَفْضَلِ خَلْقِ اللَّهِ وَأَحْسَنِ خَلْقِ اللَّهِ وَأَجَلِّ خَلْقِ اللَّهِ وَأَكْرَمِ خَلْقِ اللَّهِ وَأَجْمَلِ خَلْقِ اللَّهِ وَأَكْمَلِ خَلْقِ اللَّهِ وَأَتَمِّ خَلْقِ اللَّهِ وَأَعْظَمِ خَلْقِ اللَّهِ عِنْدَ اللَّهِ، رَسُولِ اللَّهِ، وَنَبِيِّ اللَّهِ، وَحَبِيبِ اللَّهِ، وَصَفِيِّ اللَّهِ، وَنَجِيِّ اللَّهِ، وَخَلِيلِ اللَّهِ، وَوَلِيِّ اللَّهِ، وَأَمِينِ اللَّهِ، وَخِيرَةِ اللَّهِ مِنْ خَلْقِ اللَّهِ، وَنُخْبَةِ اللَّهِ مِنْ بَرِيَّةِ اللَّهِ، وَصَفْوَةِ اللَّهِ مِنْ أَنْبِيَاءِ اللَّهِ، وَعُرْوَةِ اللَّهِ، وَعِصْمَةِ اللَّهِ، وَنِعْمَةِ اللَّهِ، وَمِفْتَاحِ رَحْمَةِ اللَّهِ، الْمُخْتَارِ مِنْ رُسُلِ اللَّهِ، الْمُنْتَخَبِ مِنْ خَلْقِ اللَّهِ، الْفَائِزِ بِالْمَطْلَبِ فِي الْمَرْهَبِ وَالْمَرْغَبِ، الْمُخْلَصِ فِيمَا وُهِبَ، أَكْرَمِ مَبْعُوثٍ، أَصْدَقِ قَائِلٍ، أَنْجَحِ شَافِعٍ، أَفْضَلِ مُشَفَّعٍ، الْأَمِينِ فِيمَا اسْتُودِعَ، الصَّادِقِ فِيمَا بَلَّغَ، الصَّادِعِ بِأَمْرِ رَبِّهِ، الْمُضْطَلِعِ بِمَا حُمِّلَ، أَقْرَبِ رُسُلِ اللَّهِ إِلَى اللَّهِ وَسِيلَةً، وَأَعْظَمِهِمْ غَدًا عِنْدَ اللَّهِ مَنْزِلَةً وَفَضِيلَةً، وَأَكْرَمِ أَنْبِيَاءِ اللَّهِ الْكِرَامِ الصَّفْوَةِ عَلَى اللَّهِ، وَأَحَبِّهِمْ إِلَى اللَّهِ، وَأَقْرَبِهِمْ زُلْفَىٰ لَدَى اللَّهِ، وَأَكْرَمِ الْخَلْقِ عَلَى اللَّهِ، وَأَحْظَاهُمْ وَأَرْضَاهُمْ لَدَىٰ اللَّهِ، وَأَعْلَى النَّاسِ قَدْرًا، وَأَعْظَمِهِمْ مَحَلًّا، وَأَكْمَلِهِمْ مَحَاسِنًا وَفَضْلًا، وَأَفْضَلِ الْأَنْبِيَاءِ دَرَجَةً، وَأَكْمَلِهِمْ شَرِيعَةً، وَأَشْرَفِ الْأَنْبِيَاءِ نِصَابًا، وَأَبْيَنِهِمْ بَيَانًا وَخِطَابًا، وَأَفْضَلِهِمْ مَوْلِدًا وَمُهَاجَرًا وَعِتْرَةً وَأَصْحَابًا، وَأَكْرَمِ النَّاسِ أُرُومَةً، وَأَشْرَفِهِمْ جُرْثُومَةً، وَخَيْرِهِمْ نَفْسًا، وَأَطْهَرِهِمْ قَلْبًا، وَأَصْدَقِهِمْ قَوْلًا، وَأَزْكَاهُمْ فِعْلًا، وَأَثْبَتِهِمْ أَصْلًا، وَأَوْفَاهُمْ عَهْدًا، وَأَمْكَنِهِمْ مَجْدًا، وَأَكْرَمِهِمْ طَبْعًا، وَأَحْسَنِهِمْ صُنْعًا، وَأَطْيَبِهِمْ فَرْعًا، وَأَكْثَرِهِمْ طَاعَةً وَسَمْعًا، وَأَعْلَاهُمْ مَقَامًا، وَأَحْلَاهُمْ كَلَامًا، وَأَزْكَاهُمْ سَلَامًا، وَأَجَلِّهِمْ قَدْرًا، وَأَعْظَمِهِمْ فَخْرًا، وَأَسْنَاهُمْ فَخْرًا، وَأَرْفَعِهِمْ فِي الْمَلَإِ الْأَعْلَى ذِكْرًا، وَأَوْفَاهُمْ عَهْدًا، وَأَصْدَقِهِمْ وَعْدًا، وَأَكْثَرِهِمْ شُكْرًا، وَأَعْلَاهُمْ أَمْرًا، وَأَجْمَلِهِمْ صَبْرًا، وَأَحْسَنِهِمْ خَيْرًا، وَأَقْرَبِهِمْ يُسْرًا، وَأَبْعَدِهِمْ مَكَانًا، وَأَعْظَمِهِمْ شَأْنًا، وَأَثْبَتِهِمْ بُرْهَانًا، وَأَرْجَحِهِمْ مِيزَانًا، وَأَوَّلِهِمْ إِيمَانًا، وَأَوْضَحِهِمْ بَيَانًا، وَأَفْصَحِهِمْ لِسَانًا، وَأَظْهَرِهِمْ سُلْطَانًا.", "من دلائل الخيرات للجزولي (ص ٣٩–٤١ — طبعة الخط الحديث) — صيغة اجتهادية من الكتاب", "g"],

["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الخميس", "حزب الخميس (١٩) — اجعل نبينا لنا فرطا واجعل حوضه", "اللهمَّ اجعل نَبِيَّنا لنا فرطاً، واجعل حوضَهُ لنا موعداً لأوَّلِنَا وآخِرِنا، اللهمَّ احشُرْنا في زُمْرَتِهِ، واستعمِلْنا في سُنَّتِهِ وتَوَفَّنَا على مِلَّتِهِ، وعَرِّفْنا وجهَهُ، واجعلنا في زُمْرَتِهِ وحِزْبِهِ، اللهمَّ اجمعْ بيننا وبينَهُ كما آمَنَّا بِهِ ولم نَرَهُ، ولا تُفَرِّقْ بيننا وبينَهُ حتى تُدْخِلَنَا مَدْخَلَهُ، وتُورِدَنا حوضَهُ، وتجعلنا مِنْ رُفَقائِهِ، مَعَ المُنْعَمِ عليهم مِنَ النَّبِيِّينَ والصِّدِّيقِينَ والشُّهَداءِ والصَّالِحِينَ، وحَسُنَ أولئكَ رفيقاً، والحمدُ للهِ رَبِّ العالَمِينَ. اللهمَّ صلِّ على سيدنا محمدٍ نُورِ الهُدَى والقائِدِ إلى الخيرِ والداعِي إلى الرُّشْدِ، نَبِيِّ الرحمةِ وإمامِ المُتَّقِينَ ورسولِ رَبِّ العالَمِينَ لا نَبِيَّ بعدَهُ كما بَلَّغَ رِسالَتَكَ ونَصَحَ لِعِبادِكَ، وتلا آياتِكَ وأقامَ حُدُودَكَ، ووَفَّى بِعهدِكَ وأنْفَذَ حُكْمَكَ، وأمرَ بِطاعَتِكَ ونهى عَنْ معصِيَتِكَ، ووالى وَلِيَّكَ الذي تُحِبُّ أن توالِيَهُ، وعادى عَدُوَّكَ الذي تُحِبُّ أن تُعادِيَهُ.", "من دلائل الخيرات للجزولي (حزب الخميس — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],

["الصلاة على النبي ﷺ|دلائل الخيرات|حزب السبت", "حزب السبت (٨) — عدد ما دامت الدنيا والآخرة", "وصلِّ على سيدنا محمدٍ عددَ ما دامَتِ الدُّنْيَا والآخِرَةِ، وصلِّ على سيدنا محمدٍ عددَ ما دامَتِ الخَلائِقُ في الجَنَّةِ، وصلِّ على سيدنا محمدٍ عددَ ما دامَتِ الخَلائِقُ في النَّارِ، وصلِّ على سيدنا محمدٍ على قَدْرِ ما تُحِبُّهُ وتَرْضَاهُ، وصلِّ على سيدنا محمدٍ على قَدْرِ ما يُحِبُّكَ ويَرْضَاكَ، وصلِّ على سيدنا محمدٍ أَبَدَ الآبِدِينَ، وأنْزِلْهُ المُنْزَلَ المُقَرَّبَ عِنْدَكَ، وأعْطِهِ الوَسِيلَةَ والفَضِيلَةَ، والشَّفَاعَةَ والدَّرَجَةَ الرَّفِيعَةَ، والمَقامَ المحمودَ الذي وَعَدْتَهُ، إنِّكَ لا تُخْلِفُ المِيعَادَ.", "من دلائل الخيرات للجزولي (حزب السبت — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],

["الصلاة على النبي ﷺ|دلائل الخيرات|حزب السبت", "حزب السبت (١١) — يا الله يا الله يا الله", "فأسألكَ يا اللهُ، يا اللهُ، يا اللهُ، يا حيُّ يا قيومُ، يا ذا الجلالِ والإكرامِ، لا إلهَ إلا أنتَ سبحانكَ إني كنتُ منَ الظالمينَ، أسألكَ بما حملَ كرسيكَ منْ عظمتِكَ وجلالِكَ، وبهائِكَ وقدرتِكَ وسلطانِكَ، وبحقِّ أسمائِكَ المخزونَةِ المكنونَةِ المطهرَةِ التي لم يطلعْ عليها أحدٌ منْ خلقِكَ، وبحقِّ الإسمِ الذي وضعتَهُ على الليلِ فأظلمَ وعلى النهارِ فاستنارَ، وعلى السماواتِ فاستقلتْ وعلى الأرضِ فاستقرتْ، وعلى البحارِ فانفجرتْ وعلى العيونِ فنبعتْ وعلى السحابِ فأمطرتْ.", "من دلائل الخيرات للجزولي (حزب السبت — نسخة نصية) — صيغة اجتهادية من الكتاب؛ وفي بعض عبارات التوسل خلاف بين العلماء", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب السبت", "حزب السبت (١٢) — سؤال الله بالأسماء المكتوبة", "وأسألكَ بالأسماءِ المكتوبةِ في جبهةِ سيدنا جبريلَ عليهِ السلامُ، وبالأسماءِ المكتوبةِ في جبهةِ سيدنا إسرافيلَ عليهِ السلامُ وعلى جميعِ الملائكةِ، وأسألكَ بالأسماءِ المكتوبةِ حولَ العرشِ، وبالأسماءِ المكتوبةِ حولَ الكرسيِّ، وأسألكَ باسمكَ العظيمِ الأعظمِ الذي سميتَ بهِ نفسكَ، وأسألكَ بحقِّ أسمائكَ كلها ما علمتُ منها وما لم أعلمْ، وأسألكَ بالأسماءِ التي دعاكَ بها سيدنا آدمُ عليهِ السلامُ، وبالأسماءِ التي دعاكَ بها سيدنا نوحٌ عليهِ السلامُ، وبالأسماءِ التي دعاكَ بها سيدنا صالحٌ عليهِ السلامُ.", "من دلائل الخيرات للجزولي (حزب السبت — نسخة نصية) — صيغة اجتهادية من الكتاب؛ وفي بعض عبارات التوسل خلاف بين العلماء", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب السبت", "حزب السبت (١٣) — سؤال الله بما دعاه به الأنبياء", "وبالأسماءِ التي دعاكَ بها سيدنا يونسُ عليهِ السلامُ، وبالأسماءِ التي دعاكَ بها سيدنا موسى عليهِ السلامُ، وبالأسماءِ التي دعاكَ بها سيدنا هارونُ عليهِ السلامُ، وبالأسماءِ التي دعاكَ بها سيدنا شعيبٌ عليهِ السلامُ، وبالأسماءِ التي دعاكَ بها سيدنا إبراهيمُ عليهِ السلامُ، وبالأسماءِ التي دعاكَ بها سيدنا إسماعيلُ عليهِ السلامُ، وبالأسماءِ التي دعاكَ بها سيدنا داودُ عليهِ السلامُ، وبالأسماءِ التي دعاكَ بها سيدنا سليمانُ عليهِ السلامُ، وبالأسماءِ التي دعاكَ بها سيدنا زكرياءُ عليهِ السلامُ.", "من دلائل الخيرات للجزولي (حزب السبت — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب السبت", "حزب السبت (١٤) — سؤال الله بما دعاه به الأنبياء", "وبالأسماءِ التي دعاكَ بها سيدنا يحيى عليهِ السلامُ، وبالأسماءِ التي دعاكَ بها سيدنا يوشعُ عليهِ السلامُ، وبالأسماءِ التي دعاكَ بها سيدنا الخَضْرُ عليهِ السلامُ، وبالأسماءِ التي دعاكَ بها سيدنا إلياسُ عليهِ السلامُ، وبالأسماءِ التي دعاكَ بها سيدنا اليسعُ عليهِ السلامُ، وبالأسماءِ التي دعاكَ بها سيدنا ذو الكفلِ عليهِ السلامُ، وبالأسماءِ التي دعاكَ بها سيدنا عيسى عليهِ السلامُ.", "من دلائل الخيرات للجزولي (حزب السبت — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب السبت", "حزب السبت (١٥) — سؤال الله بما دعاه به الأنبياء", "وبالأسماءِ التي دعاكَ بها سيدنا محمدٌ صلى الله عليه وسلم نبيكَ ورسولكَ، وحبيبكَ وصَفِيُّكَ، يا منْ قالَ وقولهُ الحقُّ، (واللهُ خَلَقَكُمْ وَمَا تَعْمَلُونَ)، ولا يصدرُ عنْ أحدٍ منْ عبيدهِ قولٌ ولا فعلٌ ولا حركةٌ ولا سكونٌ، إلا وقدْ سبقَ في علمهِ وقضائهِ وقدرهِ كيفَ يكونُ، كما ألهمتني وقضيتَ لي بجمعِ هذا الكتابِ، ويَسَّرْتَ عَلَيَّ فيه الطريقَ والأسبابَ، ونفيتَ عنْ قلبي في هذا النبيِّ الكريمِ الشكَّ والارتيابَ، وغَلَّبْتَ حبهُ عندي على حبِّ جميعِ الأقرباءِ والأحباءِ، أسألكَ يا اللهُ، يا اللهُ، يا اللهُ، أنْ ترزقني وكلَّ منْ أحبهُ واتَّبعهُ شفاعتهُ ومرافقتهُ يومَ الحسابِ، منْ غيرِ مناقشةٍ ولا عذابٍ ولا توبيخٍ ولا عتابٍ، وأنْ تغفرَ لي ذنوبي وتسترَ عيوبي يا وهاب يا غفار، وأنْ تنعمني بالنظرِ إلى وجهكَ الكريمِ في جملةِ الأحبابِ يومَ المزيدِ والثوابِ، وأنْ تتقبلَ مني عملي، وأنْ تعفو عما أحاطَ علمكَ بهِ منْ خطيئتي ونسياني وزَلَلِي، وأنْ تبلغني منْ زيارةِ قبرهِ والتسليمِ عليهِ وعلى صاحبيهِ غايةَ أملي، بمنكَ وفضلكَ وجودكَ وكرمكَ، يا رؤوفُ، يا رحيمُ، يا وليُّ، وأنْ تجازيهُ عني وعنْ كلِّ منْ آمنَ بهِ واتبعهُ منْ المسلمينَ والمسلماتِ، الأحياءِ منهمْ والأمواتِ، أفضلَ وأتمَّ وأعمَّ ما جازيتَ بهِ أحداً منْ خلقكَ، يا قويُّ، يا عزيزُ، يا عَلِيُّ.", "من دلائل الخيرات للجزولي (حزب السبت — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب السبت", "حزب السبت (١٦) — بحق ما أقسمت به عليك", "وأسألكَ اللهمَّ بحقِّ ما أقسمتُ بهِ عليكَ، أنْ تُصَلِّيَ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ عَدَدَ ما خلقتَ منْ قبلِ أنْ تكونَ السماءُ مبنيةً والأرضُ مدحيةً، والجبالُ علويةً والعيونُ مُنفجرةً، والبحارُ مُسخرةً والأنهارُ مُنهمرةً، والشمسُ مُضحيةً والقمرُ مُضيئاً والنجمُ مُنيراً ولا يعلمُ أحدٌ حيثُ تكونُ إلا أنتَ، وأنْ تُصَلِّيَ عليهِ وعلى آلهِ عَدَدَ كلامكَ، وأنْ تُصَلِّيَ عليهِ وعلى آلهِ عَدَدَ آياتِ القرآنِ وحروفهِ وأنْ تُصَلِّيَ عليهِ وعلى آلهِ عَدَدَ منْ يُصَلِّي عليهِ.", "من دلائل الخيرات للجزولي (حزب السبت — نسخة نصية) — صيغة اجتهادية من الكتاب؛ وفي بعض عبارات التوسل خلاف بين العلماء", "g"],

["الصلاة على النبي ﷺ|دلائل الخيرات|حزب السبت", "حزب السبت (٢٢) — في الليل إذا يغشى والنهار إذا", "وأنْ تُصَلِّي عليهِ وعلى آلهِ في الليلِ إذا يغشى والنهارِ إذا تجلى، وأنْ تُصَلِّي عليهِ وعلى آلهِ في الآخرةِ والأولى، وأنْ تُصَلِّي عليهِ وعلى آلهِ منذُ كانَ في المهدِ صبياً، إلى أنْ صارَ كهلاً مهدياً، فقبضتهُ إليكَ عدلاً مرضياً لتبعثهُ شفيعاً حَفِيّاً، وأنْ تُصَلِّي عليهِ وعلى آلهِ عَدَدَ خلقكَ ورضاءَ نفسكَ، وزنةَ عرشكَ ومدادَ كلماتكَ، وأنْ تُعْطِيَهُ الوسيلةَ والفضيلةَ، والدرجةَ الرفيعةَ والحوضَ المورودَ، والمقامَ المحمودَ والعزَّ الممدودَ، وأنْ تُعَظِّمَ برهانهُ وأنْ تُشَرِّفَ بنيانهُ وأنْ تَرْفَعَ مكانهُ، وأنْ تستعملنا يا مولانا بسنتهِ وأنْ تميتنا على ملتهِ، وأنْ تحشرنا في زمرتهِ وتحتَ لوائهِ، وأنْ تجعلنا منْ رفقائهِ وأنْ تُورِدَنا حوضهُ، وأنْ تَسْقِيَنا بكأسهِ وأنْ تَنْفَعَنا بمحبتهِ، وأنْ تَتُوبَ علينا وأنْ تُعافِيَنا منْ جميعِ البلاءِ والبلواءِ والفتنِ، ما ظهرَ منها وما بطنَ، وأنْ ترحمنا، وأنْ تَعْفُوَ عنا، وتَغْفِرَ لنا ولجميعِ المؤمنينَ والمؤمناتِ، والمسلمينَ والمسلماتِ، الأحياءِ منهمْ والأمواتِ، والحمدُ للهِ ربِّ العالمينَ، وهو حسبي ونعمَ الوكيلُ، ولا حولَ ولا قوةَ إلا باللهِ العليِّ العظيمِ .", "من دلائل الخيرات للجزولي (حزب السبت — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد (١) — ما سجعت الحمائم وحمت الحوائم وسرحت", "اللهمَّ صلِّ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ ما سجعتِ الحمائمُ وحمتِ الحوائمُ، وسرحتِ البهائمُ ونفعتِ التمائمُ، وشُدَّتِ العمائمُ ونَمَتِ النوائمُ، اللهمَّ صلِّ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ ما أبلجَ الإصباحُ وهَبَّتِ الرياحُ، ودَبَّتِ الأشباحُ وتعاقبَ الغدوُّ والرواحُ، وتُقُلِّدَتِ الصفاحُ واعْتُقِلَتِ الرماحُ، وصَحَّتِ الأجسادُ والأرواحُ، اللهمَّ صلِّ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ ما دارتِ الأفلاكُ ودَجَتِ الأحلاكُ وسَبَّحَتِ الأملاكُ.", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد (٢) — كما صليت على سيدنا إبراهيم وبارك", "اللهمَّ صلِّ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ كما صليتَ على سيدنا إبراهيمَ، وباركْ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ كما باركتَ على سيدنا إبراهيمَ في العالمينَ إنكَ حميدٌ مجيدٌ، اللهمَّ صلِّ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ ما طَلَعَتِ الشمسُ وما صُلِّيَتِ الخمسُ، وما تَأَلَّقَ بَرْقٌ و تَدَفَّقَ وَدْقٌ وما سَبَّحَ رَعْدٌ، اللهمَّ صلِّ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ ملءَ السماواتِ والأرضِ وملءَ ما بينهُما وملءَ ما شِئْتَ منْ شيءٍ بعدُ.", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد (٣) — كما قام بأعباء الرسالة واستنقذ الخلق", "اللهمَّ كما قامَ بأعباءِ الرسالةِ، واستنقذَ الخلقَ منَ الجهالةِ، وجاهدَ أهلَ الكفرِ والضلالةِ، ودعا إلى توحيدِكَ، وقاسى الشدائدَ في إرشادِ عبيدكَ، فأعطهِ اللهمَّ سؤلهُ وبَلِّغْهُ مأمولهُ، وآتهِ الوسيلةَ والفضيلةَ والدرجةَ الرفيعةَ، وابعثهُ المقامَ المحمودَ الذي وعدتهَ، إنكَ لا تخلفُ الميعادَ، اللهمَّ واجعلنا منَ المتبعينَ لشريعتهِ، المتصفينَ بمحبتهِ، المهتدينَ بهديهِ وسيرتهِ، وتوفنا على سنتهِ ولا تحرمنا فضلَ شفاعتهِ، واحشرنا في أتباعهِ الغرِّ المحجلينَ، وأشياعهِ السابقينَ، وأصحابِ اليمينَ، يا أرحمَ الراحمينَ.", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد (٤) — ملائكتك والمقربين وعلى أنبيائك والمرسلين", "اللهمَّ صلِّ على ملائكتكَ والمقربينَ، وعلى أنبيائكَ والمرسلينَ، وعلى أهلِ طاعتكَ أجمعينَ، واجعلنا بالصلاةِ عليهمْ منَ المرحومينَ، اللهمَّ صلِّ على سيدنا محمدٍ المبعوثِ منْ تِهَامَةَ، والآمرِ بالمعروفِ والاستقامةِ، والشفيعِ لأهلِ الذنوبِ في عرصاتِ القيامةِ، اللهمَّ أَبْلِغْ عنَّا نَبِيَّنا وشَفِيعَنا وحَبِيبَنا أفضلَ الصلاةِ والتسليمِ، وابعثهُ المقامَ المحمودَ الكريمَ، وآتهِ الفضيلةَ و الوسيلةَ والدرجةَ الرفيعةَ التي وعدتهُ في الموقفِ العظيمِ، وصلِّ اللهمَّ عليهِ صلاةً دائمةً متصلةً تتوالى وتدومُ.", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد (٥) — ما لاح بارق وذر شارق ووقب", "اللهمَّ صلِّ عليهِ وعلى آلهِ ما لاحَ بارقٌ وذَرَّ شارقٌ، ووقبَ غاسقٌ وانهمرَ وادقٌ، وصلِّ عليهِ وعلى آلهِ ملءَ اللوحِ والفضاءِ، ومثلَ نجومِ السماءِ، وعَدَدَ القطرِ و الحصى، وصلِّ عليهِ وعلى آلهِ صلاةً لا تُعَدُّ ولا تُحْصَى، اللهمَّ صلِّ عليهِ زنةَ عرشكَ، ومبلغَ رضاكَ، ومدادَ كلماتكَ، ومنتهى رحمتكَ، اللهمَّ صلِّ عليهِ وعلى آلهِ وأزواجهِ وذريتهِ، وباركْ عليهِ وعلى آلهِ وأزواجهِ وذريتهِ، كما صليتَ وباركتَ على سيدنا إبراهيمَ وعلى آلِ سيدنا إبراهيمَ إنكَ حميدٌ مجيدٌ، وجازهِ عنا أفضلَ ما جازيتَ نبياً عنْ أمتهِ، واجعلنا منَ المهتدينَ بمنهاجِ شريعتهِ، واهدنا بهديهِ، وتوفنا على ملتهِ، واحشرنا يومَ الفزعِ الأكبرِ منَ الآمنينَ في زمرتهِ، وأمتنا على حبهِ وحبِّ آلهِ وأصحابهِ وذريتهِ.", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد (٦) — أفضل أنبيائك وأكرم أصفيائك وإمام أوليائك", "اللهمَّ صلِّ على سيدنا محمدٍ أفضلِ أنبيائِكَ، وأكرمِ أصفيائِكَ، وإمامِ أوليائِكَ، وخاتمِ أنبيائِكَ، وحبيبِ ربِّ العالمينَ، وشهيدِ المرسلينَ، وشفيعِ المذنبينَ، وسيدِ وَلدِ آدمَ أجمعينَ، المرفوعِ الذكرِ في الملائكةِ المقربينَ، البشيرِ النذيرِ، السراجِ المنيرِ، الصادقِ الأمينِ، الحقِّ المبينِ، الرؤوفِ الرحيمِ، الهادي إلى الصراطِ المستقيمِ، الذي آتيتهُ سبعاً منَ المثاني والقرآنِ العظيمِ، نبيِّ الرحمةِ وهادي الأمةِ، أولِ منْ تنشقُّ عنهُ الأرضُ ويدخلُ الجنةَ، والمؤيدِ بسيدِنا جبريلَ وسيدِنا ميكائيلَ، المبشرِ بهِ في التوراةِ والإنجيلِ، المُصطفى المُجتبى المنتخبِ أبي القاسمِ، سيدِنا محمدٍ بنِ عبدِ اللهِ بنِ عبدِ المطلبِ بنِ هاشمٍ.", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد (٧) — ملائكتك والمقربين الذين يسبحون الليل والنهار", "اللهمَّ صلِّ على ملائكتكَ والمقربينَ الذين يسبحونَ الليلَ والنهارَ لا يفترونَ، ولا يعصونَ اللهَ ما أمرهمْ ويفعلونَ ما يؤمرونَ، اللهمَّ وكما اصطفيتهمْ سُفَرَاءَ إلى رُسُلِكَ وأُمَنَاءَ على وَحْيِكَ وَشُهَدَاءَ على خلقكَ، وخرقتَ لهمْ كُنُفَ حُجُبِكَ وأطْلَعْتَهُمْ على مكنونِ غيبكَ، واخترتَ منهمْ خزنةً لجنتِكَ وحملةً لعرشِكَ، وجعلتهُمْ منْ أكثرِ جنودكَ، وفَضَّلْتَهُمْ على الورى، وأَسْكَنْتَهُمْ السماواتِ العُلَى، ونَزَّهْتَهُمْ عنِ المعاصي والدَّناءاتِ، وقَدَّسْتَهُمْ عنِ النقائصِ والآفاتِ، فصلِّ عليهمْ صلاةً دائمةً تَزِيدُهُمْ بها فضلاً، وتجعلُنا لاستغفارِهِمْ بها أهلاً.", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد (٨) — جميع أنبيائك ورسلك الذين شرحت صدورهم", "اللهمَّ وصلِّ على جميعِ أنبيائِكَ ورسلِكَ، الذينَ شرحتَ صدورَهُمْ وأودعتَهُمْ حكمتَكَ وطوقتَهُمْ نبوتَكَ وأنزلتَ عليهمْ كُتُبَكَ، وهديتَ بهمْ خلقَكَ ودَعَوْا إلى توحيدِكَ، وشَوَّقُوا إلى وعدِكَ وخَوَّفُوا منْ وعيدِكَ، وأرشدوا إلى سبيلِكَ وقاموا بحجتِكَ ودليلِكَ، وسَلِّمِ اللهمَّ عليهمْ تسليماً، وهبْ لنا بالصلاةِ عليهِمْ أجراً عظيماً.", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد (٩) — صلاة دائمة مقبولة تؤدي بها عنا", "اللهمَّ صلِّ على سيدِنا محمدٍ وعلى آلِ سيدِنا محمدٍ صلاةً دائمةً مقبولةً تُؤَدِّي بها عنَّا حقهُ العظيمَ. اللهمَّ صلِّ على سيدنا محمدٍ صاحبِ الحُسْنِ والجمالِ والبهجةِ والكمالِ، والبهاءِ والنورِ والوِلْدَانِ والحورِ، والغرفِ والقصورِ واللسانِ الشَّكُورِ والقلبِ المشكورِ، والعِلْمِ المشهورِ والجيشِ المنصورِ، والبنينَ والبناتِ، والأزواجِ الطاهراتِ، والعُلُوِّ على الدرجاتِ، والزمزمِ والمقامِ والمشعرِ الحرامِ، واجتنابِ الآثامِ وتربيةِ الأيتامِ، والحجِّ وتلاوةِ القرآنِ، وتسبيحِ الرحمنِ وصيامِ رمضانَ، واللواءِ المعقودِ، والكرمِ والجودِ، والوفاءِ بالعهودِ، صاحبِ الرغبةِ والترغيبِ، والبَغْلَةِ والنجيبِ، والحوضِ والقضيبِ، النبيِّ الأوابِ، الناطقِ بالصوابِ، المنعوتِ في الكتابِ، النبيِّ عبدِ اللهِ، النبيِّ كنزِ اللهِ، النبيِّ حُجَّةِ اللهِ، النبيِّ منْ أطاعهُ فقدْ أطاعَ اللهَ، ومنْ عصاهُ فقدْ عصى اللهَ، النبيِّ العربيِّ، القرشيِّ الزمزميِّ، المكيِّ التهاميِّ، صاحبِ الوجهِ الجميلِ، والطرفِ الكحيلِ، والخدِّ الأسيلِ، والكوثرِ والسلسبيلِ، قاهرِ المضادينَ مبيدِ الكافرينَ، وقاتلِ المشركينَ، قائدِ الغُرِّ المحجلينَ إلى جناتِ النعيمِ وجوارِ الكريمِ، صاحبِ سيدنا جبريلَ عليهِ السلامُ، ورسولِ ربِّ العالمينَ، وشفيعِ المذنبين، وغايةِ الغمامِ، ومصباحِ الظلامِ، وقمرِ التمامِ.", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد (١٠) — صلى الله عليه وعلى آله المصطفين", "صلى اللهُ عليهِ وعلى آلهِ المصطفينَ منْ أطهرِ جِبِلَّةٍ، صلاةً دائمةً على الأبدِ غيرَ مُضْمَحِلَّةً، صلى اللهُ عليهِ وعلى آلهِ صلاةً يتجددُ بها حبُورُهُ، ويَشْرَّفُ بها في الميعادِ بعثُهُ ونُشُورُهُ، فصلى اللهُ عليهِ وعلى آلهِ الأنجُمِ الطوالِعِ، صلاةً تجودُ عليهِمْ أَجْوَدَ الغُيُوثِ الهَوَامِعِ، أَرْسَلَهُ منْ أَرْجَحِ العربِ ميزاناً وأوضَحِها بياناً، وأفصَحِها لساناً وأشمَخِها إيماناً وأعلاها مقاماً وأحلاها كلاماً، وأوفاها ذِمَامَاً وأَصْفَاها رَغَامَاً، فَأَوْضَحَ الطريقةَ، ونصحَ الخليقةَ، وشَهَرَ الإسلامَ وكَسَّرَ الأصنامَ، وأَظْهَرَ الأحكامَ وحَظَرَ الحرامَ وعمَّ بالإنعامِ.", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد (١١) — صلى الله عليه وعلى آله", "صلى اللهُ عليهِ وعلى آلهِ في كلِّ مَحْفَلٍ ومَقَامٍ، أفضلَ الصلاةِ والسلامِ، صلى اللهُ عليهِ وعلى آلهِ عَوْداً وبَدْءاً صلاةً تكونُ ذَخِيرَةً وَوِرْداً، صلى اللهُ عليهِ وعلى آلهِ صلاةً تامةً زاكيةً، وصلى اللهُ عليهِ وعلى آلهِ صلاةً يتبعها رَوْحٌ ورَيْحَانٌ، ويَعْقُبُها مَغْفِرَةٌ ورِضْوَانٌ، وصلى اللهُ على أفضلِ منْ طابَ منهُ النِّجَارُ، وسَمَا بِهِ الفَخَارُ، واستنارَتْ بنورِ جبينهِ الأقمارُ، وتضاءلَتْ عندَ جودِ يمينهِ الغمائمُ والبحارُ، سيدِنا ونبيِّنا محمدٍ الذي بباهرِ آياتهِ أضاءتْ الأنجادُ والأغوارُ، وبمعجزاتِ آياتهِ نطقَ الكتابُ وتواترتِ الأخبارُ.", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد (١٢) — صلى الله عليه وعلى آله وأصحابه", "صلى اللهُ عليهِ وعلى آلهِ وأصحابهِ الذينَ هاجروا لنصرتهِ، ونَصروهُ في هِجرتهِ، فنعمَ المهاجرونَ ونعمَ الأنصارُ، صلاةً ناميةً دائمةً ما سجعتْ في أيكِها الأطيارُ، وهمعتْ بوبلِها الدِّيَمَةُ المِدْرَارُ، ضاعفَ اللهُ عليهِ دائمَ صلواتهِ، اللهمَّ صلِّ على سيدنا محمدٍ وعلى آلهِ الطيبينَ الكرامِ، صلاةً موصولةً دائمةَ الاتصالِ بدوامِ ذي الجلالِ والإكرامِ، اللهمَّ صلِّ على سيدنا محمدٍ الذي هو قطبُ الجلالةِ، وشمسُ النبوةِ والرسالةِ، والهادِي منَ الضلالةِ، والمنقِذُ منَ الجهالةِ.", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد (١٣) — صلى الله عليه وسلم صلاة دائمة", "صلى الله عليه وسلم صلاةً دائمةَ الاتصالِ والتوالي، متعاقبةً بتعاقبُ الأيامِ والليالي. اللهمَّ صلِّ على سيدنا محمدٍ النبيِّ الزاهدِ، رسولِ المَلِكِ الصمدِ الواحدِ، صلى الله عليه وسلم صلاةً دائمةً إلى مُنتهى الأبدِ بِلا انقطاعٍ ولا نفادٍ، صلاةً تنجينا بها منْ حرِّ جهنمَ وبئسَ المهادِ، اللهمَّ صلِّ على سيدنا محمدٍ النبيِّ الأميِّ وعلى آلهِ وسَلِّمْ، صلاةً لا يُحْصَى لها عَدَدٌ، ولا يُعَدُّ لها مددٌ، اللهمَّ صلِّ على سيدنا محمدٍ صلاةً تكرمُ بها مثواهُ، وتبلغُ بها يومَ القيامةِ منَ الشفاعةِ رِضاهُ.", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد (١٤) — النبي الأصيل السيد النبيل الذي جاء", "اللهمَّ صلِّ على سيدنا محمدٍ النبيِّ الأصيلِ السيدِ النبيلِ، الذي جاءَ بالوحيِ والتنزيلِ وأوضحَ بيانَ التأويلِ، وجاءهُ الأمينُ سيدنا جبريلُ عليهِ السلامُ بالكرامةِ والتفضيلِ، وأسرى بهِ المَلِكُ الجليلُ في الليلِ البهيمِ الطويلِ، فكشفَ لهُ عنْ أعلى الملكوتِ وأراهُ سناءَالجبروتِ، ونظرَ إلى قُدرةِ الحيِّ الدائمِ الباقي الذي لا يموتُ، صلى الله عليه وسلم صلاةً مقرونةً بالجمالِ، والحُسْنِ والكمالِ والخيرِ والإفضالِ، اللهمَّ صلِّ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ عَدَدَ الأقطارِ.", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد (١٥) — عدد ورق الأشجار", "وصلِّ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ عَدَدَ ورقِ الأشجارِ، وصلِّ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ عَدَدَ زبدِ البحارِ، وصلِّ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ عَدَدَ الأنهارِ، وصلِّ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ عَدَدَ رملِ الصحارى والقفارِ، وصلِّ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ عَدَدَ ثقلِ الجبالِ والأحجارِ، وصلِّ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ عَدَدَ أهلِ الجنةِ وأهلِ النارِ، وصلِّ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ عَدَدَ الأبرارِ والفجارِ.", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد (١٦) — عدد ما يختلف به الليل", "وصلِّ على سيدنا محمدٍ وعلى آلِ سيدنا محمدٍ عَدَدَ ما يختلفُ بهِ الليلُ والنهارُ، واجعلِ اللهمَّ صلاتنا عليهِ حجاباً منْ عذابِ النارِ، وسبباً لإباحةِ دارِ القرارِ، إنكَ أنتَ العزيزُ الغفارُ، وصلى الله على سيدنا محمدٍ وعلى آلهِِ الطيبينَ وذريتهِ المباركينَ، وصحابتهِ الأكرمينَ وأزواجهِ أمهاتِ المؤمنينَ، صلاةً موصولةً تترددُ إلى يومِ الدينِ .", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|حزب الأحد", "حزب الأحد — سيد الأبرار وزين المرسلين الأخيار", "اللهمَّ صلِّ على سيدِ الأبرارِ، وزَيْنِ المرسلينَ الأخيارِ، وأكرمِ منْ أظلمَ عليهِ الليلُ وأشرقَ عليهِ النهارُ.", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g", 3],
["دلائل الخيرات|حزب الأحد|هداية وثبات|فك الكرب والهم|الظلم والأعداء", "حزب الأحد — دعاء يا ذا المن", "اللهمَّ يا ذا المنِّ الذي لا يكافى امتنانهُ، والطولِ الذي لا يُجازى إنعامُهُ وإحسانُهُ، نسألُكَ بكَ ولا نسألُكَ بأحدٍ غيرِكَ، أنْ تطلقَ ألسنتنا عندَ السؤالِ، وتوفقنا لصالحِ الأعمالِ، وتجعلنا منَ الآمنينَ يومَ الرَّجفِ والزلزالِ، يا ذا العِزةِ والجلالِ، أسألكَ يا نورَ النورِ، قبلَ الأزمنةِ والدهورِ، أنتَ الباقي بلا زوالٍ، الغنيُّ بلا مثالٍ، القدوسُ الطاهرُ، العليُّ القاهرُ، الذي لا يحيطُ بهِ مكانٌ، ولا يشتملُ عليهِ زمانٌ، أسألكَ بأسمائكَ الحسنى كلها، وبأعظمِ أسمائكَ إليكَ وأشرفها عندكَ منزِلةً وأجزلِها عندكَ ثواباً وأسرَعِها مِنكَ إجابةً، وباسمِكَ المخزونِ المكنونِ، الجليلِ الأجلِّ، الكبيرِ الأكبرِ، العظيمِ الأعظمِ، الذي تحبُّهُ وترضى عمنْ دعاكَ بهِ وتستجيبُ لهُ دعاءهُ، أسألُكَ اللهمَّ بلا إلهَ إلا أنتَ الحنانُ المنانُ، بديعُ السماواتِ والأرضِ، ذو الجلالِ والإكرامِ، عالمُ الغيبِ والشهادةِ، الكبيرُ المتعالُ، وأسألكَ باسمكَ العظيمِ الأعظمِ، الذي إذا دعيتَ بهِ أجبتَ، وإذا سئلتَ بهِ أعطيتَ، وأسألكَ باسمكَ الذي يذِلُّ لعظمتهِ العظماءُ والملوكُ والسباعُ والهوامُّ، وكلُّ شيءٍ خلقتهُ يا اللهُ، يا ربِّ استجبْ دعوتي، يا منْ لهُ العزةُ والجبروتُ، يا ذا المُلْكِ والملكوتِ، يا منْ هو حيٌّ لا يموتُ، سبحانكَ ربي ما أعظمَ شأنَكَ، وأرفَعَ مكانَكَ، أنتَ ربي، يا مُتَقَدِّساً في جبروتهِ، إليكَ أرغبُ، وإياكَ أرهبُ، يا عظيمُ يا كبيرُ، يا جبارُ يا قادرُ يا قويُّ، تباركتَ يا عظيمُ، تعاليتَ يا عليمُ، سبحانكَ يا عظيمُ، سبحانكَ يا جليلُ، أسألكَ باسمِكَ العظيمِ التامِ الكبيرِ، أنْ لا تُسَلِّطَ علينا جباراً عنيداً، ولا شيطاناً مريداً، ولا إنساناً حسوداً، ولا ضعيفاً منْ خلقِكَ ولا شديداً، ولا بارّاً ولا فاجراً ولا عبيداً ولا عنيداً، اللهمَّ إني أسألُكَ فإني أشهدُ أنكَ أنتَ اللهُ الذي لا إلهَ إلا أنتَ الواحدُ الأحدُ الصمدُ، الذي لم يلدْ ولم يولدْ، ولم يكنْ لهُ كفواً أحدٌ، يا هو يا منْ لا هوَ إلا هوَ، يا منْ لا إلهَ إلا هوَ، يا أزليُّ يا أبديُّ، يا دهريُّ يا ديموميُّ، يا منْ هو الحيُّ الذي لا يموتُ، يا إلهنا وإلهَ كلِّ شيءٍ إلهاً واحداً، لا إلهَ إلا أنتَ، اللهمَّ فاطرَ السماواتِ والأرضَ، عالمَ الغيبِ والشهادةِ، الرحمنَ الرحيمَ، الحيَّ القيومَ الديانَ، الحنانَ المنانَ، الباعِثَ الوارِثَ، ذا الجلالِ والإكرامِ، قلوبُ الخلائقِ بيدكَ، نواصيهِمْ إليكَ، فأنتَ تزرعُ الخيرَ في قلوبهِمْ، وتمحو الشرَّ إذا شئتَ مِنْهُمْ، فأسألكَ اللهمَّ أنْ تمحوَ منْ قلبي كلَّ شيءٍ تكرَهُهُ، وأنْ تحشوَ قلبي منْ خشيتِكَ، ومعرفتِكَ ورهبتِكَ، والرغبةِ فيما عندكَ، والأمنِ والعافيةِ، واعطفْ علينا بالرحمةِ والبركةِ منكَ، وألهمنا الصوابَ والحكمةَ، فنسألُكَ اللهمَّ علمَ الخائفينَ، وإنابةَ المخبتينَ، وإخلاصَ الموقنينَ، وشكرَ الصابرينَ، وتوبةَ الصديقينَ، ونسألُكَ اللهمَّ بنورِ وجهِكَ الذي ملأَ أركانَ عرشِكَ، أنْ تزرعَ في قلبي معرفتَكَ حتى أَعْرِفَكَ حقَّ معرفتِكَ، كما ينبغي أنْ تُعْرَفَ بهِ .", "من دلائل الخيرات للجزولي (حزب الأحد — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|دعاء بعد الختم|هداية وثبات", "دعاء بعد الختم (١) — اشرح بالصلاة عليه صدورنا ويسر", "اللهمَّ اشرحْ بالصلاةِ عليهِ صُدُورَنا، ويَسِّرْ بها أُمُورَنا، وفَرِّجْ بها هُمُومَنا، واكشفْ بها غُمُومَنا، واغفِرْ بها ذُنُوبَنا، واقضِ بها دُيُونَنا، وأصلحْ بها أحوالَنا، وبَلِّغْ بها آمالَنا، وتقبلْ بها توبَتَنا، واغسلْ بها حوبَتَنا، وانصرْ بها حُجَّتَنا، وطَهِّرْ بها ألسِنَتَنا، وآنِسْ بها وحشَتَنا، وارْحَمْ بها غُرْبَتَنا، واجعلها نوراً بينَ أيدينا ومنْ خَلْفِنا، وعنْ أيمانِنا وعنْ شمائِلِنا، ومنْ فوقِنا ومنْ تحتِنا، وفي حياتِنا وموتِنا، وفي قُبُورِنا وحَشْرِنا ونَشْرِنا، وظِلاًَ يومَ القيامةِ على رُؤُوسِنا، وثَقِّلْ بها يا ربِّ موازِينَ حسناتِنا، وأَدِمْ بركاتِها علينا حتى نلقى نَبِيَّنا وسيدَنا محمداً صلى الله عليه وسلم ونحنُ آمِنُونَ مُطْمَئِنُّونَ، فَرِحُونَ مُسْتَبْشِرُونَ، ولا تُفَرِّقْ بينَنا وبينَهُ حتى تُدْخِلَنَا مَدْخَلَهُ، وتُأْوِينا إلى جِوارِهِ الكريمِ، معَ الذينَ أنعمتَ عليهمْ منَ النبيينَ والصديقينَ والشهداءِ والصالحينَ، وحَسُنَ أولئكَ رفيقاً.", "من دلائل الخيرات للجزولي (دعاء بعد ختم دلائل الخيرات — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|دعاء بعد الختم|هداية وثبات", "دعاء بعد الختم (٢) — إنا آمنا به صلى الله", "اللهمَّ إنا آمنا بهِ صلى الله عليه وسلم ولم نرهُ، فمتعنا اللهمَّ في الدارينِ برؤيتهِ، وثَبِّتْ قلوبنا على محبتهِ، واستعملنا على سنتهِ، وتوفنا على ملتهِ، واحشرنا في زمرتهِ الناجيةِ وحزبهِ المفلحينَ، وانفعنا بما انطوتْ عليهِ قُلُوبُنا منْ محبتهِ صلى الله عليه وسلم يومَ لا جَدَّ ولا مالَ ولا بنينَ، وأَوْرِدْنا حوضَهُ الأصفى، واسقنا بكأسِهِ الأوفى، ويَسِّرْ علينا زيارَةَ حرمِكَ وحرمِهِ منْ قبلِ أنْ تُمِيتَنا، وأَدِمْ علينا الإقامَةَ بحرمِكَ وحرمِهِ صلى الله عليه وسلم إلى أنْ نُتَوَّفَى.", "من دلائل الخيرات للجزولي (دعاء بعد ختم دلائل الخيرات — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|دعاء بعد الختم|هداية وثبات", "دعاء بعد الختم (٣) — إنا نستشفع به إليك إذ هو", "اللهمَّ إنا نَسْتَشْفِعُ بِهِ إليكَ، إذْ هو أَوْجَهُ الشُّفَعاءِ إليكَ، ونُقْسِمُ بِهِ عليكَ إذْ هو أَعْظَمُ منْ أُقْسِمَ بحقهِ عليكَ، ونَتَوَسَّلُ بِهِ إليكَ، إذْ هو أَقْرَبُ الوسائلِ إليكَ، نَشْكُو إليكَ يا ربِّ قَسْوَةَ قُلُوبِنا وكَثْرَةَ ذُنُوبِنا، وطُولَ آمالِنا، وفَسَادَ أعمالِنا، وتَكاسُلَنا عنِ الطاعاتِ، وهُجُومَنا على المُخالَفاتِ، فَنِعْمَ المُشْتَكى إليهِ أنتَ يا ربِّ بِكَ نَسْتَنْصِرُ على أعدائِنا وأنفسِنا فانصرْنا، وعلى فضلِكَ نتوكَّلُ في صلاحِنا فلا تَكِلْنا إلى غيرِكَ يا ربَّنا، وإلى جَنابِ رسولِكَ صلى الله عليه وسلم نَنْتَسِبُ فلا تُبْعِدْنا، وبِبَابِكَ نَقِفُ فلا تَطْرُدْنا وإِيَّاكَ نسألُ فلا تُخَيِّبْنا.", "من دلائل الخيرات للجزولي (دعاء بعد ختم دلائل الخيرات — نسخة نصية) — صيغة اجتهادية من الكتاب؛ وفي بعض عبارات التوسل خلاف بين العلماء", "g"],
["الصلاة على النبي ﷺ|دلائل الخيرات|دعاء بعد الختم|هداية وثبات", "دعاء بعد الختم (٤) — ارحم تضرعنا وآمن خوفنا وتقبل أعمالنا", "اللهمَّ ارحمْ تَضَرُّعَنا، وآمِنْ خوفَنا، وتَقَبَّلْ أعمالَنا، وأصلحْ أحوالَنا، واجعلْ بطاعتِكَ اشتغالَنا، وإلى الخيرِ مآلَنا، وحَقِّقْ بالزيادةِ آمالَنا، واختمْ بالسعادةِ آجالَنا، هذا ذُلُّنا ظاهِرٌ بينَ يديكَ، وحالُنا لا يخفى عليكَ، أمرتَنا فتركنا، ونهيتَنا فارتكبنا، ولا يسعُنا إلا عَفْوُكَ فاعفُ عنا، يا خيرَ مَأمُولٍ، وأكرمَ مَسؤُولٍ، إنكَ عفوٌ كريمٌ، رؤوفٌ رحيمٌ، يا أرحمَ الراحمينَ، وصلَّى اللهُ على سيدِنا محمدٍ وعلى آلِهِ وصحبِهِ وسَلَّمْ تسليماً، والحمدُ للهِ ربِّ العالمينَ .", "من دلائل الخيرات للجزولي (دعاء بعد ختم دلائل الخيرات — نسخة نصية) — صيغة اجتهادية من الكتاب", "g"],

["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٢) — اللهم يا مؤنس كل وحيد، ويا صاحب", "اللهم يا مؤنس كل وحيد، ويا صاحب كل فريد، ويا قريبًا غير بعيد، ويا شاهدًا غير غائب، ويا غالبًا غير مغلوب، يا حي يا قيوم يا ذا الجلال والإكرام. يا بديع السماوات والأرض يا ذا الجلال والإكرام، ويا ذا الطول والإنعام، لا إله إلا أنت، ظهر اللاجئين وجار المستجيرين وأنيس الخائفين. أبوء بنعمتك علي وهذا ما جنيت على نفسي، يا عظيم يا عظيم اغفر لي، فإنه لا يغفر الذنوب العظيمة إلا الرب العظيم.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٣) — اللهم احرسني بعينك التي لا تنام، واكنفني", "اللهم احرسني بعينك التي لا تنام، واكنفني بركنك الذي لا يرام، وارحمني بقدرتك علي فلا أهلك وأنت رجائي. فكم من نعمة أنعمت بها علي قل لك عندها شكري، وكم من بلية ابتليتني بها قل لك عندها صبري، فيا من قل عند نعمته شكري فلم يحرمني، ويا من قل عند بليته صبري فلم يخذلني، ويا من رآني على الخطايا فلم يفضحني. يا ذا المعروف الذي لا ينقضي أبدًا، ويا ذا النعماء التي لا تحصى عددًا، أسألك أن تصلي على سيدنا محمد وعلى آل سيدنا محمد كما صليت وباركت ورحمت على سيدنا إبراهيم إنك حميد مجيد، وبك أدرأ في نحور الأعداء الجبارين.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٤) — يا من يكفي عن كل أحد ولا", "يا من يكفي عن كل أحد ولا يكفي عنه أحد، يا أحد من لا أحد له، يا سند من لا سند له، انقطع الرجاء إلا منك، فنجني مما أنا فيه، وأعني على ما أنا عليه مما قد نزل بي، بجاه وجهك الكريم وبحق سيدنا محمد صلى الله عليه وسلم، آمين آمين.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية؛ وفي التوسل «بجاهه» خلاف بين العلماء", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٥) — اللهم اهدني لصالح الأعمال والأخلاق، فإنه لا", "اللهم اهدني لصالح الأعمال والأخلاق، فإنه لا يهدي لصالحها ولا يصرف عني سيئها إلا أنت. اللهم مغفرتك أوسع من ذنوبي، ورحمتك أرجى عندي من عملي. اللهم بلاغًا يبلغ خيرًا، ومغفرة منك ورضوانًا، بيدك الخير إنك على كل شيء قدير.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٦) — هو الله الواحد الفرد الصمد، الذي لم", "هو الله الواحد الفرد الصمد، الذي لم يتخذ صاحبة ولا ولدًا، ولم يلد ولم يولد، ولم يكن له كفوًا أحد، له الأسماء الحسنى والصفات العليا، وله المثل الأعلى، وله ما في السماوات وما في الأرض وهو العزيز الحكيم، ليس كمثله شيء وهو السميع البصير، لا تدركه الأبصار وهو يدرك الأبصار وهو اللطيف الخبير، هو الأول والآخر والظاهر والباطن وهو بكل شيء عليم. ربنا آمنا بك وبأسمائك وصفاتك، وما أنت به موصوف في علو ذاتك، كما ينبغي لجلال وجهك، وما أنت له أهل في عظيم ربوبيتك، وكما هو اللائق بك في كمال ألوهيتك، آمنا بك وبكتبك ورسلك وبمحمد صلى الله عليه وسلم عبدك ورسولك، وبما جاء به من عندك، وعلى مرادك ومراد رسولك، وكما تحب وترضى، وعلى ما هو في علمك الأعلى.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٧) — يا عالم السر وأخفى، يا قيوم الأرض", "يا عالم السر وأخفى، يا قيوم الأرض والسماء، يا من هو الأول قبل كل شيء، والآخر بعد كل شيء، والظاهر فوق كل شيء، والباطن دون كل شيء، والقاهر فوق كل شيء. يا نور الأنوار، يا عالم الأسرار، يا مدبر الليل والنهار، يا ملك يا عزيز يا قهار، يا رحيم يا ودود يا غفار، يا علام الغيوب، يا مقلب القلوب، يا ستار العيوب، يا غفار الذنوب، يا رب الأرباب، يا منزل الكتاب، يا سريع الحساب، يا من إذا دعي أجاب، يا رحيم يا رحمن يا قريب يا مجيب يا حنان يا منان يا ذا الجلال والإكرام، يا حي يا قيوم. لك الحمد وأنت المستعان وعليك التكلان، ولا حول ولا قوة إلا بك. يا علي يا عظيم يا حليم يا عليم يا سميع يا بصير يا مؤيد يا قدير يا حي يا قيوم يا رحمن يا رحيم، تبارك اسم ربك ذي الجلال والإكرام.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٨) — اللهم اهدنا بنورك إليك، وأقمنا بصدق العبودية", "اللهم اهدنا بنورك إليك، وأقمنا بصدق العبودية بين يديك. اللهم اجعل ألسنتنا رطبة بذكرك، ونفوسنا مطيعة لأمرك، وقلوبنا ممتلئة بمعرفتك، وأرواحنا مكرمة بمشاهدتك، وأسرارنا منعمة بقربك. وارزقنا زهدًا في دنياك ومزيدًا لديك، إنك على كل شيء قدير.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٩) — يا من لا يسكن قلب إلا بقربه", "يا من لا يسكن قلب إلا بقربه وقراره، ولا يحيا عبد إلا بلطفه وإبراره، ولا يبقى وجود إلا بإمداده وإظهاره. يا من آنس عباده الأبرار وأولياءه المقربين الأخيار بمناجاته وأسراره، يا من أمات وأحيا، وأقصى وأدنى، وأسعد وأشقى، وأضل وهدى، وأفقر وأغنى، وابتلى وعافى، وقدر وقضى، كل بعظيم لطف تدبيره وسابق تقديره.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (١٠) — رب أي باب أقصد غير بابك، وأي", "رب أي باب أقصد غير بابك، وأي جناب أتوجه إليه غير جنابك؟ أنت العلي العظيم ولا حول ولا قوة لنا إلا بك. رب إلى من أقصد وأنت الرب المقصود، وإلى من أتوجه وأنت الحق المعبود، ومن ذا الذي يعطيني وأنت صاحب الكرم والجود؟ رب حقيق علي ألا أشتكي إلا إليك، ولازم علي ألا أتوكل إلا عليك. يا من عليه يتوكل المتوكلون، يا من إليه يلجأ الخائفون، يا من بكرمه وجميل عوائده يتعلق الراجون، يا من بسلطان قهره وعظيم رحمته وبره يستغيث المضطرون، يا من بوسع عطائه وجميل فضله ونعمائه تبسط الأيدي ويسأله السائلون.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (١١) — إلهي بابك مفتوح للسائل، وفضلك مبذول للنائل", "إلهي بابك مفتوح للسائل، وفضلك مبذول للنائل، وإليك منتهى الشكوى وغاية المسائل. يا من إليه رفع الشكوى، يا عالم السر والنجوى، يا من يسمع ويرى، ويا من هو بالمنظر الأعلى، يا رب الأرض والسماء، يا من له الأسماء الحسنى، يا من له الدوام والبقاء، يا من إذا دعي أجاب، يا سريع الحساب، يا رب الأرباب، يا عظيم الجناب، يا كريم يا وهاب، يا من غمر العباد فضله وعطاؤه، ووسع البرية جوده ونعماؤه، يا عظيم يا منان، يا كريم يا رحمن، يا صاحب الجود والإحسان والرحمة والغفران، يا الله يا رب، يا الله يا رب، يا الله يا رب.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (١٢) — رب هل في الوجود رب سواك فيدعى", "رب هل في الوجود رب سواك فيدعى، أم هل في المملكة إله غيرك فيرجى، أم هل كريم غيرك فيطلب منه العطاء، أم هل ثم جواد سواك فيسأل منه الفضل والنعمى، أم هل حاكم غيرك فترفع إليه الشكوى، أم إلى من يحال العبد الفقير عليه، أم هل ثم من تبسط الأكف وترفع الحاجات إليه؟ فليس إلا كرمك وجودك، يا من لا ملجأ منه إلا إليه، يا من يجير ولا يجار عليه. رب إلى من أشكو حالتي وأنت العليم القادر، أم بمن أستنصر وأنت الولي الناصر، أم بمن أستغيث وأنت القوي الناظر، أم إلى من ألتجئ وأنت الكريم الساتر، أم من ذا الذي يجبر كسري وأنت للقلوب جابر، أم من ذا الذي يغفر عظيم ذنبي وأنت الرحيم الغافر، يا عالمًا بما في السرائر، يا من هو المطلع على مكنون الضمائر، يا من هو فوق عباده قاهر، يا من هو الأول قبل كل شيء والآخر.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (١٣) — أسألك يا رب كل شيء بقدرتك على", "أسألك يا رب كل شيء بقدرتك على كل شيء أن تغفر لي كل شيء حتى لا تسألني عن شيء. يا من بيده ملكوت كل شيء، يا من لا يضره شيء ولا ينفعه شيء ولا يغلبه شيء ولا يعزب عنه شيء ولا يؤوده شيء ولا يستعين بشيء ولا يشغله شيء عن شيء ولا يشبهه شيء ولا يعجزه شيء، يا من هو آخذ بناصية كل شيء وبيده مقاليد كل شيء، اصرف عني ضر كل شيء وسهل لي كل شيء. ويا من هو فوق كل شيء ومحصي كل شيء ومبدئ كل شيء ومعيد كل شيء وعليم بكل شيء ومحيط بكل شيء وبصير بكل شيء وشهيد على كل شيء ورقيب على كل شيء ولطيف بكل شيء وخبير بكل شيء ووارث كل شيء وقائم على كل شيء. اللهم إنك آمن من كل شيء وكل شيء خائف منك، فبأمنك من كل شيء وخوف كل شيء منك اغفر لي كل شيء، يا من بيده ملكوت كل شيء إنك على كل شيء قدير.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (١٤) — سبحان الله تسبيحًا يليق بجلال من له", "سبحان الله تسبيحًا يليق بجلال من له السبحات، والحمد لله حمدًا كثيرًا يوافي نعمه ويكافئ مزيده على جميع الحالات، ولا إله إلا الله توحيدًا محققًا مخلصًا قلبه بحق اليقين من الشكوك والظنون والأوهام والشبهات، والله أكبر من أن يحاط ويدرك بل هو مدرك محيط بكل الجهات، ولا حول ولا قوة إلا بالله العلي العظيم رفيع الدرجات.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (١٥) — إلهنا تعاظمت على الكبراء والعظماء فأنت الله", "إلهنا تعاظمت على الكبراء والعظماء فأنت الله الكبير العظيم، وتكرمت على الفقراء والأغنياء فأنت الله الغني الكريم، ومننت على العصاة والطائعين بسعة رحمتك فأنت الله الرحمن الرحيم، تعلم سرنا وجهرنا وأنت أعلم بنا منا فأنت العليم. ولا تدبير للعبد مع تدبيرك، ولا إرادة له مع مشيئتك وتقديرك. لولا وجودك لما كانت المخلوقات، ولولا حكمة صنعك لما عرفت المصنوعات.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (١٦) — إلهنا أي كيد للشيطان وهو ضعيف مع", "إلهنا أي كيد للشيطان وهو ضعيف مع قوتك واقتدارك؟ وأي ران على القلوب مع ظهور أنوارك؟ إلهنا إذا عمرت قلبًا اضمحل عنه كل شيطان، وإذا عنيت بعبد لم يكن لأحد عليه سلطان.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (١٧) — إلهنا إن الخير كله بيدك وأنت واهبه", "إلهنا إن الخير كله بيدك وأنت واهبه ومعطيه، وعلمه مغيب عن العبد لا يدري من أين يأتيه، وطريقه عليه مجهول لولا أنت دليله إليه وقائده وهاديه. إلهنا خذ بنواصينا إلى أحسنه وأتمه، وخصصنا بما هو أوسعه وأعمه، فإن الأكف لا تبسط إلا للغني الكريم، ولا تطلب الرحمة إلا من الغفور الرحيم، وأنت المقصد الذي لا يتعداه مراد، والكنز الذي لا حد له ولا نفاد.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (١٨) — إلهنا أعطنا فوق ما نؤمل ولا يخطر", "إلهنا أعطنا فوق ما نؤمل ولا يخطر ببال، يا من هو واهب كريم النوال مجيب السؤال، فإنه لا مانع لما أعطيت، ولا معطي لما منعت، ولا راد لما قضيت، ولا مبدل لما حكمت، ولا هادي لمن أضللت، ولا مضل لمن هديت، ولا مقعد لمن أقمت، ولا معذب لمن رحمت، فإنك تقضي ولا يقضى عليك، ولا ينفع ذا الجد منك الجد. وقد أمرت ونهيت، ولا قوة لنا على الطاعة ولا حول لنا عن المعصية إلا بك، فبقوتك يا الله على الطاعة قونا، وبحولك وقدرتك عن المعصية جنبنا، لنكون بآداب عبوديتك قائمين ولجلال ربوبيتك طائعين، واجعل ألسنتنا لاهجة بذكرك، وجوارحنا قائمة بشكرك، ونفوسنا سامعة مطيعة لأمرك.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (١٩) — إلهنا ما حيلة العبد وأنت تقعده، وما", "إلهنا ما حيلة العبد وأنت تقعده، وما وصوله وأنت تبعده؟ هل الحركات والسكنات إلا بإذنك، ومتقلب العبد ومثواه إلا بعلمك؟ إلهنا اجعل حركاتنا بك وسكوننا لك، واقطع جميع توجهاتنا بالتوجه إليك، واجعل اعتمادنا في كل الأمور عليك، فمبدأ الأمر منك وهو راجع إليك. إلهنا أمرت بالطاعة ونهيت عن المعصية وقد سبق تقديرهما، والعبد في قبضة تصريفك زمامه في يدك، تقوده إلى أيهما شئت، وقلبه بين إصبعين من أصابعك تقلبه كيف شئت. إلهنا فثبت قلوبنا على ما أمرت وجنبنا عما عنه نهيت، فإنه لا حول ولا قوة إلا بك.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٢٠) — سبحانك لا إله إلا أنت، خلقت الخلق", "سبحانك لا إله إلا أنت، خلقت الخلق قسمين وفرقتهم فريقين، فريق في الجنة وفريق في السعير، هذا حكمك بما قد سبق به علمك، فهنيئًا لمن سبقت له منك العناية وفاز بالقرب والرعاية. فحكمك عدل وسرك غامض في هذا الخلق وما ندري ما يفعل بنا، فافعل بنا ما أنت أهله ولا تفعل بنا ما نحن أهله، فإنك أهل التقوى وأهل المغفرة.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٢١) — إلهنا نسألك بجلال كمال وجهك الكريم، وبضياء", "إلهنا نسألك بجلال كمال وجهك الكريم، وبضياء سناء نورك العظيم، وبتدقيق تحقيق علمك يا عليم، أن تنزل على قلوبنا من نور الذكر والحكمة ما نجد بالحس والمشاهدة برده، حتى لا ننساك ولا نعصيك أبدًا، وكن لنا سمعًا وبصرًا وقلبًا ويدًا ومؤيدًا. يا مغيث يا مجيب يا سميع يا بصير يا خبير. اللهم إنا نسألك بجوامع أسرار أسمائك ولطائف مظاهر صفاتك وقدم وجودك، أن تنور قلوبنا بنور هدايتك، وأن تلهمنا حب معرفتك، وأن تستر علينا بستر حمايتك، وأن تجعل أنسنا بك وشوقنا إليك وخوفنا منك حتى لا نرجو أحدًا غيرك ولا نخشى أحدًا سواك.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٢٢) — اللهم ارزقنا الاعتماد عليك والانقياد إليك والحب", "اللهم ارزقنا الاعتماد عليك والانقياد إليك والحب فيك والقرب منك والأدب معك. أنت نور السماوات والأرض، عز جارك وجل ثناؤك وتقدست أسماؤك وعظم شأنك ولا إله غيرك. إن رجائي لا ينقطع عنك وإن عصيتك، كما أن خوفي لا يزايلني منك وإن أطعتك. إلهي لا أستطيع حولًا عن معصيتك إلا بعصمتك، ولا قوة لي على الطاعة إلا بتوفيقك. من هو في قبضة قهرك كيف لا يخاف؟ ومن هو في دائرة حكمك أين يذهب؟ يا إلهي أشكو إليك ضعف قوتي وقلة حيلتي وهواني على الناس، وأنت أرحم الراحمين.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٢٣) — يا الله يا رحمن يا رحيم، يا", "يا الله يا رحمن يا رحيم، يا ذا الفضل والإحسان، يا الله يا ذا الرحمة والغفران، يا الله يا ذا العظمة والسلطان، يا الله يا ذا العز والبرهان، يا الله يا ذا الجلال والإكرام. وسعت كل شيء رحمة وعلمًا، فجد بفضلك وإحسانك علينا منًّا وحلمًا، يا محسن يا مجمل يا منعم يا متفضل، يا ذا النوال والنعم، يا ذا الجود والكرم، يا عظيم، يا ذا العرش العظيم.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٢٤) — نسألك اللهم باسمك العظيم الأعظم، الكبير الأكبر", "نسألك اللهم باسمك العظيم الأعظم، الكبير الأكبر، الذي من أسعدته ورحمته ألهمته أن يدعوك به، أن تقسم لنا من الرحمة والمغفرة ما تصلح به شأننا كله، وأن تحيينا حياة طيبة. يا جامع، يا من لا يمنعه من العطاء مانع، يا معطي النوال قبل السؤال. اللهم إني عبدك وابن عبديك، جميع الخلق مقهورون بقهر قدرتك، ونواصيهم في يدك، وقلوبهم في قبضتك، ومفاتحهم عندك، لا تتحرك ذرة إلا بعلمك وإذنك، ليس معك مدبر في الخلق ولا شريك لك في الملك. يا إله الأولين والآخرين، يا من له الخلق والأمر، يا من بيده العسر واليسر، يا من إليه تصير الأمور، يا من هو الغفور الشكور، يا من أمره بين الكاف والنون، يا من بيده الحركات والسكون، يا حي يا قيوم، يا بديع السماوات والأرض، يا ذا الجلال والإكرام.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٢٥) — الحمد لله رب العالمين. اللهم لك الحمد", "الحمد لله رب العالمين. اللهم لك الحمد بديع السماوات والأرض ذا الجلال والإكرام، رب الأرباب وإله كل مألوه، وخالق كل مخلوق، ووارث كل شيء، ليس كمثله شيء، ولا يعزب عنه علم شيء، وهو بكل شيء محيط، وهو على كل شيء رقيب. أنت الله لا إله إلا أنت الأحد المتوحد، الفرد المتفرد. وأنت الله لا إله إلا أنت الكريم المتكرم، العظيم المتعظم، الكبير المتكبر. وأنت الله لا إله إلا أنت العلي المتعال، الشديد المحال. وأنت الله لا إله إلا أنت الرحمن الرحيم العليم الحكيم. وأنت الله لا إله إلا أنت السميع البصير القدير الخبير. وأنت الله لا إله إلا أنت الكريم الأكرم الدائم الأدوم. وأنت الله لا إله إلا أنت الأول قبل كل أحد، والآخر بعد كل عدد. وأنت الله لا إله إلا أنت الداني في علوه، والعالي في دنوه. وأنت الله لا إله إلا أنت ذو البهاء والمجد، والكبرياء والحمد.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٢٦) — وأنت الله لا إله إلا أنت الذي", "وأنت الله لا إله إلا أنت الذي أنشأت الأشياء من غير شبه، وصورت ما صورت من غير مثال، وابتدعت المبتدعات بلا اقتداء. أنت الذي قدرت كل شيء تقديرًا، ويسرت كل شيء تيسيرًا، ودبرت كل ما دونك تدبيرًا. أنت الذي لم يعنك على خلقك معين، ولم يوازرك في أمرك وزير، ولم يكن لك مشابه ولا نظير. أنت الذي أردت فكان حتمًا ما أردت، وقضيت فكان عدلًا ما قضيت، وحكمت فكان نصفًا ما حكمت. أنت الله الذي لا يحويك مكان، ولم يقم لشأنك سلطان، ولم يعيك برهان ولا بيان. أنت الذي أحصيت كل شيء عددًا، ووسعت كل شيء علمًا. أنت الذي قصرت الأفهام عن ذاتيتك، وعجزت الأوهام عن كيفيتك. أنت الله الذي لا تحد فتكون محدودًا، ولا تمثل فتكون مشهودًا، ولم تلد فتكون مولودًا. أنت الله الذي لا ضد معك فيعاندك، ولا عدل لك فيكاثرك، ولا ند لك فيعارضك. أنت الذي ابتدأ واخترع واستحدث وابتدع، وأحسن صنع ما صنع.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٢٧) — سبحانك ما أجل شأنك، وأصدع بالحق برهانك.", "سبحانك ما أجل شأنك، وأصدع بالحق برهانك. سبحانك من لطيف ما ألطفك، ورءوف ما أرأفك، وحكيم ما أتقنك. سبحانك من مليك ما أمنعك، وجواد ما أوسعك، ورفيع ما أرفعك، ذو البهاء والمجد والكبرياء والحمد. سبحانك بسطت بالخيرات يدك، وعرفت الهداية من عندك، فمن التمسك لدين أو دنيا وجدك. سبحانك خضع لك من جرى في علمك، وخشع لعظمتك ما دون عرشك، وانقاد للتسليم لك كل خلقك. سبحانك لا تحس ولا تجس ولا تمس، ولا تكاد ولا تماطل، ولا تنازع ولا تجادل، ولا تمارى ولا تخادع ولا تماكر. سبحانك سبيلك جدد وأمرك رشد، وأنت حي صمد. سبحانك قولك حكم وقضاؤك حتم وإرادتك عزم. سبحانك لا راد لمشيئتك ولا مبدل لكلماتك. سبحانك باهر الآيات، فاطر السماوات، بارئ النسمات. لك الحمد حمدًا يدوم بدوامك، ولك الحمد حمدًا خالدًا بنعمتك، ولك الحمد حمدًا يوازي صنعك، ولك الحمد حمدًا يزيد على رضاك، مع حمد كل حامد وشكر كل شاكر.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٢٨) — اللهم يا خير مقصود وأكرم مسؤول، يا", "اللهم يا خير مقصود وأكرم مسؤول، يا رفيع الدرجات ومنزل البركات وفاطر الأرضين والسماوات، ضجت إليك الأصوات بصنوف اللغات، يسألونك الحاجات، وحاجتي إليك ألا تنساني في دار البلى إذا نسيني أهل الدنيا. اللهم إنك تسمع كلامي، وترى مكاني، وتعلم سري وعلانيتي، ولا يخفى عليك شيء من أمري. أنا البائس الفقير، المستغيث المستجير، الوجل المشفق المعترف بذنبه، أسألك مسألة المسكين، وأبتهل إليك ابتهال المذنب الذليل، وأدعوك دعاء الخائف الضرير، دعاء من خضعت لك رقبته، وفاضت لك عبرته، وذل لك جسمه، ورغم لك أنفه. اللهم لا تجعلني بدعائك رب شقيًا، وكن بي رءوفًا رحيمًا، يا خير المسؤولين وأكرم المعطين.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٢٩) — إلهي من مدح لك نفسه فإني لائم", "إلهي من مدح لك نفسه فإني لائم نفسي. إلهي أخرست المعاصي لساني، فما لي وسيلة من عمل ولا شفيع سوى الأمل. إلهي إني أعلم أن ذنوبي لم تبق لي عندك جاهًا ولا للاعتذار وجهًا، ولكنك أكرم الأكرمين. إلهي إن لم أكن أهلًا أن أبلغ رحمتك فإن رحمتك أهل أن تبلغني، ورحمتك وسعت كل شيء وأنا شيء. إلهي إن ذنوبي وإن كانت عظامًا فهي صغار في جنب عفوك، فاغفرها لي يا كريم. إلهي أنت أنت وأنا أنا، أنا العواد إلى الذنوب وأنت العواد إلى المغفرة. إلهي إن كنت لا ترحم إلا أهل طاعتك فإلى من يفزع المذنبون؟", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٣٠) — إلهي تجنبت عن طاعتك عمدًا، وتوجهت إلى", "إلهي تجنبت عن طاعتك عمدًا، وتوجهت إلى معصيتك قصدًا، فسبحانك ما أعظم حجتك علي وأكرم عفوك عني! فبوجوب حجتك علي وانقطاع حجتي عنك وفقري إليك وغناك عني إلا غفرت لي، يا خير من دعاه داع وأفضل من رجاه راج، بحرمة الإسلام وبذمة محمد عليه الصلاة والسلام أتوسل إليك، فاغفر لي جميع ذنوبي. إلهي دعوتك بالدعاء الذي علمتنيه، فلا تحرمني الرجاء الذي عرفتنيه.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية؛ وفي بعض عبارات التوسل خلاف بين العلماء", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٣١) — إلهي ما أنت صانع بعبد مقر لك", "إلهي ما أنت صانع بعبد مقر لك بذنبه، خاشع لك بذله، مستكين لك بجرمه، متضرع إليك من عمله، تائب إليك من اقترافه، مستغفر لك من ظلمه، مبتهل إليك لتعفو عنه، طالب إليك نجاح حوائجه مع كثرة ذنوبه، يا ملجأ كل حي ووليّ كل مؤمن. اللهم إياك أملنا وما عندك طلبنا، ولإحسانك تعرضنا، ورحمتك رجونا، ومن عذابك أشفقنا، وإليك بأثقال الذنوب هربنا. يا من يملك حوائج السائلين ويعلم ضمائر الصامتين، يا من ليس معه رب يدعى، ويا من ليس فوقه خالق يخشى، ويا من ليس له وزير يؤتى ولا حاجب يرشى، يا من لا يزداد على كثرة السؤال إلا جودًا وكرمًا، وعلى كثرة الحوائج إلا تفضلًا وإحسانًا.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٣٢) — إلهنا تابعت النعم حتى اطمأنت الأنفس بتتابع", "إلهنا تابعت النعم حتى اطمأنت الأنفس بتتابع نعمك، وأظهرت العبر حتى نطقت الصوامت بحجتك، وظاهرت المنن حتى اعترف أولياؤك بالتقصير عن حقك، وأظهرت الآيات حتى أفصحت السماوات والأرضون بأدلتك، وقهرت بقدرتك حتى خضع كل شيء لعزتك، وعنت الوجوه لعظمتك. إذا أساء عبادك حلمت وأمهلت، وإن أحسنوا تفضلت وقبلت، وإن عصوا سترت، وإن أذنبوا عفوت وغفرت، وإذا دعونا أجبت، وإذا نادينا سمعت، وإذا أقبلنا إليك قربت، وإذا وليّنا عنك دعوت.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٣٣) — إلهنا إنك قلت في كتابك المبين لمحمد", "إلهنا إنك قلت في كتابك المبين لمحمد خاتم النبيين: ﴿قُل لِّلَّذِينَ كَفَرُوا إِن يَنتَهُوا يُغْفَرْ لَهُم مَّا قَدْ سَلَفَ﴾ [الأنفال: ٣٨]، فأرضاك عنهم الإقرار بكلمة التوحيد بعد الجحود، وإنا نشهد لك بالتوحيد مخبتين ولمحمد صلى الله عليه وسلم بالرسالة مخلصين، فاغفر لنا بهذه الشهادة سوالف الإجرام، ولا تجعل حظنا فيه أنقص من حظ من دخل في الإسلام. إلهنا إنك أحببت التقرب إليك بعتق ما ملكت أيماننا ونحن عبيدك وأنت أولى بالتفضل فأعتقنا، وإنك أمرتنا أن نتصدق على فقرائنا ونحن فقراؤك وأنت أحق بالتطول فتصدق علينا، ورغبتنا بالعفو عمن ظلمنا وقد ظلمنا أنفسنا وأنت أحق بالكرم منا فاعف عنا.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٣٤) — ربنا اغفر لنا وارحمنا أنت مولانا، ربنا", "ربنا اغفر لنا وارحمنا أنت مولانا، ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار. يا من لا يشغله شأن عن شأن، ولا سمع عن سمع، ولا تشتبه عليه الأصوات، يا من لا تغلطه المسائل ولا تختلف عليه اللغات، يا من لا يبرمه إلحاح الملحين ولا تضجره مسألة السائلين، أذقنا برد عفوك وحلاوة مناجاتك.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٣٥) — الحمد لله الذي أحاط بكل شيء علمًا", "الحمد لله الذي أحاط بكل شيء علمًا، ووسع كل شيء حفظًا، والحمد لله الذي أحاط بكل شيء سلطانه، ووسعت كل شيء رحمته. اللهم لك الحمد على حلمك بعد علمك، ولك الحمد على عفوك بعد قدرتك. اللهم لك الحمد على ما تأخذ وتعطي، ولك الحمد على ما تميت وتحيي، حمدًا يفضل حمد من مضى وحمد من بقي، حمدًا لا يحجب عنك ولا ينتهي دونك ولا يقصر عن محامدك. اللهم لك الحمد كله وإليك يرجع الأمر كله علانيته وسره أوله وآخره. اللهم إني أحمدك بمحامدك كلها ما علمت منها وما لم أعلم، اللهم إني أحمدك بالذي أنت أهله، وأذكر آلاءك وأشكر نعماءك، وعدلك في قضائك وقدرتك في سلطانك وبسطك بالجود يديك. تعاليت علوًا كبيرًا وتقدست أسماؤك ولا إله غيرك ولا رب سواك.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٣٦) — أنت الأول قبل خلقك وأنت الآخر بعدهم", "أنت الأول قبل خلقك وأنت الآخر بعدهم، والمحيط بهم والوكيل عليهم، ومالك أمرهم وخالقهم وباسط أرزاقهم وقابض أرواحهم، ومنتهى رغبتهم وسامع شكواهم والناظر إليهم، وبيدك نواصيهم وفي قبضتك قلوبهم، تعلم مثواهم ومتقلبهم وسرهم ونجواهم، وإليك مردهم ومصيرهم. اللهم أنت الخالق وأنا المخلوق، وأنت الرازق وأنا المرزوق، وأنت المالك الرب وأنا العبد، وأنت العزيز وأنا الذليل، وأنت الغني وأنا الفقير، وأنت القوي وأنا الضعيف، وأنت المعطي وأنا السائل، وأنت الغفور وأنا الخاطئ، وأنا عبد أموت وأنت الحي الذي لا يموت. سبحانك اللهم وبحمدك، وتقدس اسمك، تباركت وتعاليت.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٣٧) — ما أعظم شأنك وأعز سلطانك وأقربك من", "ما أعظم شأنك وأعز سلطانك وأقربك من خلقك وألطفك بعبادك وأرأفك ببريتك وأمنعك في عزك! أنت أكبر وأظهر وأعز وأعظم وأجل وأعلى وأشرف وأكمل وأقدر من أن يبلغ العباد مبلغ قدرتك. لا إله إلا أنت، الأول بلا بداية، والآخر بلا نهاية، الباقي بغير غاية، المتعالي بقدرته، خالق كل شيء ووارثه، الدائم الذي لا يفنى، ممسك السماء أن تقع على الأرض إلا بإذنه، منزل الغيث، مسير السحاب، مكور الليل على النهار، لا إله إلا هو العزيز الغفار.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٣٨) — اللهم أنت الملك الذي لا يزول ملكه", "اللهم أنت الملك الذي لا يزول ملكه، ولا يصغر شأنه، ولا يوهن أمره، ولا يؤوده شيء من خلقه، ولم تتخذ على شيء مما خلقت عونًا. ولا يغيب عنك شيء، ولا يعزب عنك شيء، ولا يفوتك شيء، ولا يمتنع منك أحد، ولم تتخذ شريكًا في ملكك ولا صاحبة ولا ولدًا، لم تزل ولا تزال فيما مضى وفيما بقي، لا تصف الألسن كنه جلالك، ولا تبلغ العقول قدرتك، ولا تهتدي لعظمتك، ولا تبلغ الألسن إحصاء شكرك، ولا الأعضاء أداء عبادتك. أحطت بكل شيء علمًا وأحصيت كل شيء عددًا، أحاط بنا علمك ونفذ فينا أمرك، سرنا عندك علانية، نحن جميعًا في قبضتك، نتقلب إلى ما شئت من أمرك وننتهي إليه، ما حكمت به فينا كان عدلًا وما قضيت به علينا كان حقًا.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٣٩) — أنت آخذ بناصية كل دابة، تعلم مستقرها", "أنت آخذ بناصية كل دابة، تعلم مستقرها ومستودعها، كل في كتاب مبين، بيدك الخير وإليك المصير وأنت على كل شيء قدير، تباركت وتعاليت رب العالمين. ما شئت أن يكون كان وما لم تشأ لم يكن، وما قلت من حق فكما قلت، وما أثنيت به على نفسك فكما أثنيت، جل ثناؤك ولا تحصى نعماؤك، سبحانك لا أحصي ثناء عليك أنت كما أثنيت على نفسك.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٤٠) — يا من نهاني عن المعصية فخالفته فلم", "يا من نهاني عن المعصية فخالفته فلم يسلبني عافيته، يا من أسبغ علي نعمه فعصيته فلم يزل عني نعمته، يا من ستر عيوبي وأظهر محاسني حتى كأني لم أزل أعمل بطاعته. أسألك بكرمك وحلمك وفضلك وإحسانك وعظمتك وقدرتك وكبريائك إلا ما رحمتني فيمن ترحم، ودفعت عني شر كل ذي شر، وشر ما ينزل من السماء إلى الأرض وما يعرج فيها، وشر كل دابة أنت آخذ بناصيتها، إن ربي على صراط مستقيم.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٤١) — يا فعالًا لما يريد، يا ذا البطش", "يا فعالًا لما يريد، يا ذا البطش الشديد، يا ذا العز المنيع، يا ذا الجاه الرفيع، يا خير الغافرين، يا خير الرازقين، يا خير الفاصلين، يا خير المنعمين، يا خير الناصرين، يا أحكم الحاكمين، يا أسرع الحاسبين، يا أرحم الراحمين، يا وارث الأرض ومن عليها وأنت خير الوارثين. دعوناك كما أمرتنا فاستجب لنا كما وعدتنا، يا خير من سئل وأكرم من أعطى، يا جميل الصفح يا حسن التجاوز. وصل وسلم وبارك على سيدنا محمد وعلى آله وصحبه أجمعين، والحمد لله رب العالمين.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٤٢) — تتمة: يا من هو هو هو، يا هو", "يا رحمن يا رحيم، يا من هو هو هو، يا هو، يا أول، يا آخر، يا ظاهر، يا باطن، تبارك اسم ربك ذو الجلال والإكرام.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٤٣) — تتمة: خلقت الآدمي وبلوته", "خلقت الآدمي وبلوته بالحسنات والسيئات. وأبرزته في هذه الدار لمعرفتك وحجبته عن باطن الأمر بظاهر المرئيات. وكشفت لمن شئت عن سر التوحيد فبهذا شهد الكون والتكوين والكائنات. وأشهدته حضرات قدسك ولطائف معاني سرك الباطن والظاهر بأنواع التجليات.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الأول (٤٤) — تتمة: اتصفت بالأحدية فأنت الله الموجود", "اتصفت بالأحدية فأنت الله الموجود. ونعت نفسك بجلال الربوبية فأنت الله المعبود. وخلصت أرواح من اختصصت من ضيق الأشباح إلى فضاء الشهود. أنت الأول قبل كل شيء والآخر بعد كل شيء وكل شيء حادث مالك مفقود لا موجود إلا بوجودك، ولا حياة للأرواح إلا بشهودك، أشرت إلى الأرواح فأجابت وكشفت عن القلوب فطابت. فهنيئا لهياكل أرواحها لك مجيبة، ولقوالب قلوبها فاهمة عنك منيبة إلهنا طهر قلوبنا من الدنس لتكون محلا لتنزلات جودك، وخلصنا من لوث الأغيار بخالص توحيدك حتى لا نشهد غير أفعالك وصفاتك، وتجلي عظيم ذاتك. فإنك أنت الله الواهب المائح الهادى القادر الفائح.", "جامع الثناء على الله تعالى للنبهاني — الورد الأول (الإثنين)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (١) — اللهم إنك رب عظيم لا يسعك", "اللهم إنك رب عظيم لا يسعك شيء مما خلقت وأنت ترى ولا ترى. وإنك بالمنظر الأعلى. وإن لك الآخرة والأولى. ولك الممات والمحيا وإن إليك المنتهى والرجعى نعوذ بك أن نذل ونخزى خلقت ربنا فسويت وقدرت ربنا فقضيت وعلى عرشك استويت وأمت وأحببت وأطعمت واسقيت وحملت في برك وبحرك على فلكك وعلى دوابك وعلى أنعامك فاجعل لي عندك وليجة واجعل لي عندك القى وحسن مآب اللهم لك أسلمت وبك آمنت وعليك توكلت وإليك أنبت وبك خاصمت اللهم إني أعوذ بعزتك لا إله إلا أنت أن تضلني أنت الحي القيوم الذي لا يموت والجن والإنس يموتون اللهم ما قلت من قول أو خلقت من حلف أو نذرت من نذر فمشيئتك بين يدي ذلك كله ما شئت كان وما لم تشأ لا يكون ولا حول ولا قوة إلا بك إنك على كل شيء قدير.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٢) — اللهم يا من هو المحيط الجامع", "اللهم يا من هو المحيط الجامع، ويا من لا يمنعه من العطاء مانع يا من له الغنى المطلق ولعبده الفقر المحقق يا غنيا عن كل شيء وكل شيء مفتقر إليه يا من بيده كل شيء وأمر كل شيء راجع إليه. يا من له الوجود المطلق فلا يعلم ما هو إلا هو ولا يستدل عليه إلا به يا جوادا فوق الأمال يا معطي النوال قبل السؤال يا من وقف دونه قدم عقل كل طالب. يا من هو على أمره قادر وغالب يا من هو لكل شيء واهب، وإذا شاء سالب أهم بالسؤال. فأجدني عبدا لك على كل حال. فتولني مولاي فأنت أولى بي مني كيف أقصدك وأنت وراء القصد. أم كيف أطلبك والطلب عين البعد. أيطلب من هو قريب حاضر. أو يقصد من القصد فيه تائه وحائر. الطلب لا يوصل إلا إليك. والقصد لا يصدق إلا عليك. أيعلم الموجود كنه من أوجده. ام يبلغ العبد حقيقة من استعبده. كيف أعرفك وأنت الباطن الذي لا تعرف أم كيف لا اعرفك وأنت الظاهر الذي في كل شيء تتعرف كيف أوحدك ولا وجود لي في عين الأحدية. أم كيف لا أوحدك والتوحيد سر العبودية، سبحانك لا إله إلا أنت ما وحدك من أحد إذ أنت كما كنت في سابق الأزل ولاحق الأبد.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٣) — فعلى التحقيق ما وحدك سواك. وفى", "فعلى التحقيق ما وحدك سواك. وفى الجملة ما عرفك إلا إياك يا مقصودي يا معبودي ما فاتني شيء إذا أنا وجدتك. ولا جهلت شيئا إذا أنا علمتك ولا فقدت شيئا إذا أنا شهدتك. فنائي فيك وبقائي بك ومشهودي أنت لا إله إلا أنت اللهم إني أسألك النور والهدى والأدب في الاقتدا. وأعوذ بك من شر نفسي ومن شر كل ذي سر ومن شر كل قاطع يقطعني عنك لا إله إلا أنت يا عليم علمني من علمك. يا حكيم أيدني بحكمتك يا سميع أسمعني منك يا بصير بصرني في آلائك.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٤) — يا خبير فهمني عنك. يا حي", "يا خبير فهمني عنك. يا حي أحيني بذكرك يا مريد خلص إرادتي بمشيئتك وقدرتك وعظمتك إنك على كل شيء قدير يا من قدر على كل شيء بإحاطته وعظمه يا من أبرز نور كل موجود من ظلمة عدمه. يا من صور أشخاص الأفلاك بما أودع من علمه في قلبه، يا من صرف أحكامه بأسرار حكمه. أناديك استغاثة بعيد بقريب. وأطلبك طلب محب لحبيب. وأسألك سؤال مضطر لمجيب.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٥) — سبحانك لا يعلم من أنت سواك", "سبحانك لا يعلم من أنت سواك. سبحانك ما أقربك مع ترفع علاك سبحانك لا إله إلا انت تنزهت عن المثيل. لا إله إلا أنت تعاليت عن النظير. لا إله إلا أنت استغنيت عن الوزير والمشير. لا إله إلا أنت يا أحد يا صمد. لا إله إلا أنت بك الوجود ولك السجود وأنت الرب المعبود. إلهي كيف أصد عن بابك بخيبة منك. وقد وردته على ثقة بك. وكيف تؤيسني من عطائك. وقد أمرتني بدعائك. وها أنا مقبل عليك ملتجئ إليك يا عزيز باعد بيني وبين اعدائي كما باعدت بين المشرق والمغرب واخطف أبصارهم وزلزل أقدامهم وادفع عني شرهم وضرهم بنور قدسك وجلال مجدك إنك أنت الله لا إله إلا أنت وحدك لا شريك لك يا حي يا قيوم يا كاشف أسرار المعارف والعلوم. إنك المحب المحبوب والطالب المطلوب يا مقلب القلوب ويا كاشف الكروب.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٦) — وأنت علام الغيوب، وغفار الذنوب وستار", "وأنت علام الغيوب، وغفار الذنوب وستار العيوب. يا من لم يزل غفارا يا من لم يزل ستارا. انت ربي ورب كل شيء يا غفار يا ستار يا حفيظ يا واق يا دافع يا محسن يا عطوف يا رئوف يا لطيف يا عزيز يا سلام إلهي أنت القائم بذاتك والمحيط بصفاتك، والمتجلي بأسمائك، والظاهر بأفعالك، والباطن بما لا يعلمه إلا أنت توحدت بالكبرياء في جلالك فانت الواحد الأوحد، وتفردت بالبقاء في الأزل والأبد. أنت أنت الله المنفد بالوحدانية في إياك لا معك غيرك ولا فيك سواك.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٧) — إلهي أنت لا يشغلك شان عن", "إلهي أنت لا يشغلك شان عن شان إلهي أنت لا يحصرك الوجوب ولا يحدك الإمكان إلهي أنت لا يحجبك الإبهام ولا يوضحك البيان إلهي أنت لا يربك الدليل ولا يحققك البرهان إلهي أنت الأول والأبد في حقك سيان، يا من عنت له الوجوه وخضعت له الرقاب يا رب الأرباب يا نور الأنوار يا مفيض الكل من فيضه المدرار يا قدوس يا صمد إلهي يا حفيظ يا لطيف يا رب العالمين. ومن يعتصم بالله فقد هدى إلى صراط مستقيم.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["الظلم والأعداء|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٨) — أنت المحيط بغيب كل شاهد والمستولى", "أنت المحيط بغيب كل شاهد والمستولى على باطن كل ظاهر. أسألك بوجهك الذي عنت له الوجوه وبنورك الذي شخصت إليه الأبصار أن تهديني إلى صراطك الخاص هداية تصرف بها وجهي عمن سواك يا من هو السيد المطلق وأنا العبد المقيد يا من لا إله إلا هو إلهي شأنك قهر الأعداء وقمع الجبابرة أسألك مددا من عزتك يمنعني من كل من أرادني بسوء إلهي أنت القائم على كل نفس والقيوم على كل معنى وحس قدرت فقهرت وعلمت فقدرت، فلك القدرة والقهر. وبيدك الخلق والأمر.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (٩) — إلهي وسع علمك كل معلوم. وأحاطت", "إلهي وسع علمك كل معلوم. وأحاطت خبرتك بباطن كل مفهوم. وتقدست في علاء عن كل مذموم. تسامت إليك الهمم. وصعد إليك الكلم أنت المتعالي في سموك. ودمت بعد كل أول وآخر. سبحانك لا إله إلا أنت سجدت لعظمتك الجباه. وتنعمت بذكرك الشفاه أنت رب كل شيء ومربيه رحمت الذوات ورفعت الدرجات قربك روح الأرواح وريحان الأفراح. وعنوان الفلاح. وراحة كل مرتاح تباركت رب الأرباب ومعتق الرقاب. وكاشف العذاب. وسعت كل شيء رحمة وعلما، وغفرت الذنوب حنانا وحلما.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["الظلم والأعداء|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (١٠) — وأنت الغفور الرحيم الحليم العليم العلي", "وأنت الغفور الرحيم الحليم العليم العلي العظيم. إلهي أنت الشديد البطش. العظيم القهر. الأليم الأخذ المتعالي عن الأصداد والأنداد المنزه عن الصاحبة والأولاد. شأنك قهر الأعداء وقمع الجبارين. تمكر بمن تشاء وأنت خير الماكرين. إلهي اسمك سيد الأسماء. وبيدك ملكوت الأرض والسماء إنك القائم بكل شيء وعلى كل شيء ثبت لك الغنى وافتقر إلى فيضك الأقدس كل من سواك يا من بيده ملكوت كل شيء إنك أنت أنت أنت قل الله ثم ذرهم في خوضهم يلعبون. الم الله لا إله إلا هو الحي القيوم. سيدى سلام عليك أنت سندي وعالم أمري سواء عندك سري وجهرى تسمع ندائي وتجيب دعائي محوت بنورك ظلمتي وأحببت بروحك ميتني. فانت ربي وبيدك سمعي وبصري وقلبي ملكت جميعي، وشرفت وضيعي. واعليت قدرى. ورفعت ذكري تباركت نور الأنوار. وكاشف الأسرار. وواهب الأعمار. ومسبل الأستار. تنزهت في سمو جلالك عن سمات المحدثات. وعلت رتبة كمالك عن تطرق الميل إليها بالشهوات والنقائص والآفات، ونارت بشهود ذاتك الأرضون والسموات. لك المجد الأرفع والجناب الأوسع والعز الأمنع سبوح قدوس رب الملائكة والروح.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (١١) — مليكي أناديك وأنا جيك مناجاة عبد", "مليكي أناديك وأنا جيك مناجاة عبد كبير يعلم أنك تسمع ويطمع أنك تجيب واقف ببابك وقوف مضطر لا يجد من دونك وكيلا. أسألك اللهم باسمك الذي أفضت به الخيرات وأنزلت به البركات. ومنحت به أهل الشكر الزيادات واخرجت به الظلمات. أن تفيض على من ملابس أنوارك ما ترد به عني أبصار الأعادى حاسرة، وابديهم قاصرة. واجعل حظى منك إسرافا يجلو لي كل أمر حفى ويكشف لي عن كل سر علي يا نور النور. يا كاشف كل مستور إليك ترجع الأمور. وبك تدفع الشرور.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (١٢) — يا رب يا رحيم يا غفور", "يا رب يا رحيم يا غفور إلهي أنت مسبب الأسباب ومرتبها. ومصرف القلوب ومقلبها. وأنت مبدع كل شيء وبارته لك الحمد يا بادى على كل بداية. ولك الشكر يا باقي على كل نهاية أنت الباعث على كل خير باسط الرزق للعالمين بديع السموات والأرض إلهي أنت الثابت قبل كل شيء والباقي بعد كل ناطق وصامت لا إله إلا أنت ولا موجود سواك لك الكبرياء والجبروت. والعظمة والملكوت تشهر الجبارين. وتبيد الظالمين. وتبدد شمل الملعدين. وتذل رقاب المتكبرين.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (١٣) — أسألك يا غالب كل غالب. ويا", "أسألك يا غالب كل غالب. ويا مدرك كل هارب برداء كبرياتك وإرار عظمتك، وسرادقات هيبتك وبما وراء ذلك كله مما لا يعلم علمه إلا أنت أن تكسوني هيبة من هيبتك توجل لها القلوب. وتخشع لها الأبصار. وملكني ناصية كل جبار عنيد. وشيطان مريد. وأبق على ذل العبودية في ذلك كله واعصمني من الخطا والزكل. وأيدني في القول والعمل، أنت مثبت القلوب. وكاشف الكروب. لا إله إلا أنت أنت وجهي وجاهي وإليك المرجع والتناهى. تجبر الكسير وتكسر الجبارين، وتجبر الخائفين. وتخيف الظالمين لك المجد الأرفع والتجلى الأجمع والحجاب الأمنع.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (١٤) — سبحانك لا إله إلا أنت أنت", "سبحانك لا إله إلا أنت أنت حسبي ونعم الوكيل اللهم يا خالق المخلوقات. ومحيى الأموات. وجامع الشتات ومفيض الأنوار على الذوات لك الملك الأوسع والجناب الأرفع الأرباب عبيدك والملوك خدمك والأغنياه فقراؤك وأنت الغني بذاتك سيدي دام بقاؤك، ونفد في الخلق قضاؤك. وتقدست في علاك وتعاليت في قدسك لا يئودك حفظ كون. ولا يخفى عنك كشف عين تدعو من تشاء إليك. وتدل بك عليك. فلك الحمد الدائم والدوام الأسجد قدرت المنازل للسير، ورتبت المراتب للنفع والضير. وابنت مناهج اللخير. فنحن في ذلك كله بك وانت بلا نحن فأنت الخير المحض والجود الصرف والكمال والمطلق أسألك باسمك الذي أفضت به النور على القلوب والقوابل ومحوت به ظلم العواسق أن تملا وجودي نورا من نورك الذي هو مادة كل نور وغاية كل مطلوب اللهم إني أعوذ بك من قول يوجب حيرة أو يعقب فتنة أو يوهم شبهة. منك تتلقى الكلم وعنك تؤخد الحكم.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (١٥) — أنت ممسك السماء. ومعلم الأسماء. لا", "أنت ممسك السماء. ومعلم الأسماء. لا إله إلا أنت الواحد الأحد القرد الصمد الذي لم يلد ولم يولد ولم يكن له كفوا أحد الحمد لله الذي أحلني حمى لطف الله. الحمد لله الذي أنزلني جنة رحمة الله الحمد لله الذي اجلسى في مقام محبة الله الحمد لله الذي أذاقني من موائد مدد الله، الحمد لله الذي وهبني لطافة الإضافة لاصطفاء الله. الحمد لله الذي كساني حلل صدق عبودية الله كل ذلك على ما فرطت في جنب الله. وضيعت من حقوق الله. فذلك الفضل من الله ومن يغفر الذنوب إلا الله إلهي أنعمت على بالإيجاد من غير جهاد ولا اجتهاد. وجرت مطامعى من كرمك على بلوغ المراد من غير استحقاق لي ولا استعداد. فاسألك بواحد الأحاد، وشهود الأشهاد. سلامة منحة الوداد من محنة البعاد ومحو ظلمة العناد بنور شمس الرشاد. وفتح أبواب السداد. بأيدي مدد إن الله لطيف بالعباد. وصلى الله على سيدنا ونبينا محمد وعلى آله وأولاده وازواجه وذرياته واتباعه وأصحابه أجمعين. سبحان ربك رب العزة عما يصفون وسلام على المرسلين والحمد لله رب العالمين.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (١٦) — تفضلت فعم إفضالك وأنعمت فتم نوالك", "تفضلت فعم إفضالك وأنعمت فتم نوالك. وسترت فتواصل غفرانك. وغفرت فتكامل إحسانك جل جلالك فتعالى وانهل نوالك فتوالى تعاليت في دنوك وتقربت في علوك فلا يدركك وهم. ولا يحيط بك فهم أنت الأول والآخر الباطن الظاهر. تنزهت في أحديتك عن بداية. وتعاظمت في أبديتك عن نهاية. أنت الواحد لا من عدد الباقي بعد الأبد. لك خضع من ركع وذل من سجد. وإذا تجمعت عظائم الجرائم كانت في جنب عفوك قليلة. سبقت السبق فأنت الأول. وخلقت الخلق فعليك المعول، وعدت إذا جدت يا خير من تطول عجبا للقلوب كيف استأنست بسواك. وللأرواح كيف استقرت والأسرار بنور البصائر تراك، وللألسن كيف شكرت من لا يقدر على شيء لولاك. وللأقدام كيف سعت إلى غير رضاك إلهي كيف يناجيك في الصلوات. من يعصيك في الخلوات. لولا حلمك. أم كيف يدعوك عند الحاجات. من ينساك عند الشهوات. لولا فضلك. أم كيف تنام العيون وفي كل ليلة تقول هل من تائب هل من مستغفر هل من سائل.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
["مغفرة واستغفار|رزق وبركة|ثناء وتمجيد|مجموعة جامع الثناء للنبهاني", "الورد الثاني (١٧) — أم كيف كفت الأكف عن سؤالك", "أم كيف كفت الأكف عن سؤالك وسيل الجود سائل أم كيف ينقطع عنك من لم تقطع عنه الوسائل. اللهم ارزقنا حسن الإقبال عليك. والإصغاء إليك. وارزقنا الفهم عنك والبصيرة في امرك والنفاذ في طاعتك والمواظبة على إرادتك والمبادرة إلى خدمتك وحسن الأدب في معاملتك والتسليم إليك والرضا بقضائك. اللهم يا حبيب كل غريب. ويا أنيس كل كثيب. أي منقطع إليك لم تكفه بنعمتك. أم أي. تلقه برحمتك. أم أي هاجر هجر فيك الخلق فلم تصله. أم أي محب خلا بذكرك فلم تؤنسه أم أي داع دعاك فلم تجبه. ويروى عنك سبحانك أنك قلت وما غضبت على أحد كغضبى على مذنب أذنب ذنبا فاستعظمه في جنب عفوى.", "جامع الثناء على الله تعالى للنبهاني — الورد الثاني (الثلاثاء)؛ النص من نسخة ممسوحة ضوئيًا ويحتاج مقابلة نهائية", "u"],
